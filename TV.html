<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PRO IPTV Player</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/mpegts.js@latest"></script>

<style>
body {
  margin:0;
  background:#000;
  font-family:Arial;
}
video {
  width:100%;
  height:100vh;
}
#panel {
  position:absolute;
  top:10px;
  left:10px;
  color:#0f0;
  background:rgba(0,0,0,0.7);
  padding:10px;
  font-size:12px;
  border-radius:8px;
}
</style>
</head>

<body>

<div id="panel">Initializing...</div>
<video id="video" controls autoplay muted></video>

<script>
const video = document.getElementById('video');
const panel = document.getElementById('panel');

const url = "http://starhub.pro:80/live/Suborna5535/Suborna6654/702561.ts";

let retries = 0;
let player = null;

function log(msg){
  console.log(msg);
  panel.innerHTML = msg;
}

// HLS START
function startHLS(){
  log("⚡ Trying HLS...");
  
  const hls = new Hls({
    maxBufferLength: 4,
    liveSyncDurationCount: 1,
    liveMaxLatencyDurationCount: 2,
    lowLatencyMode: true,
    backBufferLength: 0
  });

  hls.loadSource(url);
  hls.attachMedia(video);

  hls.on(Hls.Events.MANIFEST_PARSED, () => {
    log("✅ Playing (HLS)");
    video.play();
  });

  hls.on(Hls.Events.ERROR, () => {
    log("❌ HLS Failed → Switching...");
    startMPEGTS();
  });
}

// MPEGTS START
function startMPEGTS(){
  log("⚡ Trying MPEGTS...");

  if (mpegts.getFeatureList().mseLivePlayback) {

    player = mpegts.createPlayer({
      type: 'mpegts',
      url: url,
      isLive: true,
      enableStashBuffer: false
    });

    player.attachMediaElement(video);
    player.load();
    player.play();

    log("✅ Playing (MPEGTS)");

    // monitor freeze
    setInterval(() => {
      if(video.readyState < 2){
        log("⚠️ Buffering / Reconnecting...");
        retry();
      }
    }, 5000);

  } else {
    log("❌ Not Supported");
  }
}

// RETRY SYSTEM
function retry(){
  if(retries < 5){
    retries++;
    log("🔁 Retry " + retries);
    
    if(player){
      player.destroy();
    }

    setTimeout(() => {
      startHLS();
    }, 2000);

  } else {
    log("❌ Stream Dead / Blocked");
  }
}

// START PLAYER
if(Hls.isSupported()){
  startHLS();
} else {
  startMPEGTS();
}
</script>

</body>
</html>
