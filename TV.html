<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>
<style>
* { box-sizing: border-box; }
body { font-family: Arial; background: #0a0a0a; color: white; padding: 20px; margin: 0; }
.container { max-width: 1300px; margin: auto; }
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
h2 { color: #00aaff; margin: 0; }
.add-btn { background: #00aaff; border: none; width: 50px; height: 50px; border-radius: 50%; font-size: 30px; cursor: pointer; }
.add-btn:hover { background: #0088cc; }

.modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); justify-content: center; align-items: center; z-index: 1000; }
.modal-content { background: #1e1e1e; padding: 30px; border-radius: 15px; width: 90%; max-width: 500px; }
.modal-content h3 { margin: 0 0 20px 0; color: #00aaff; }
.modal-content input { width: 100%; padding: 12px; margin: 10px 0; background: #2a2a2a; border: 1px solid #444; color: white; border-radius: 5px; }
.modal-buttons { display: flex; gap: 10px; margin-top: 20px; }
.modal-buttons button { flex: 1; padding: 12px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
.btn-add { background: #00aaff; color: white; }
.btn-save { background: #ffaa00; color: black; }
.btn-cancel { background: #ff4444; color: white; }

.progress-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); justify-content: center; align-items: center; z-index: 2000; }
.progress-card { background: #1a1a1a; padding: 35px; border-radius: 20px; text-align: center; border: 2px solid #00aaff; min-width: 320px; }
.progress-title { font-size: 20px; font-weight: bold; margin-bottom: 20px; color: #00aaff; }
.progress-bar { width: 100%; height: 40px; background: #333; border-radius: 20px; overflow: hidden; margin: 20px 0; }
.progress-fill { width: 0%; height: 100%; background: #00aaff; transition: width 0.3s; line-height: 40px; font-size: 14px; font-weight: bold; }
.progress-status { font-size: 14px; color: #aaa; }

.toast { position: fixed; bottom: 30px; right: 30px; padding: 12px 25px; border-radius: 8px; display: none; z-index: 1001; font-weight: bold; }
.toast.success { background: #00aa33; }
.toast.error { background: #ff4444; }

.table-wrapper { overflow-x: auto; margin-top: 20px; }
table { width: 100%; border-collapse: collapse; }
th, td { border: 1px solid #333; padding: 12px; text-align: left; vertical-align: middle; }
th { background: #1a1a1a; color: #00aaff; }
td { background: #121212; }
img { width: 55px; height: 55px; object-fit: cover; border-radius: 8px; }
.edit-btn { background: #ffaa00; color: black; padding: 6px 14px; border: none; border-radius: 5px; cursor: pointer; margin: 2px; font-weight: bold; }
.delete-btn { background: #ff4444; color: white; padding: 6px 14px; border: none; border-radius: 5px; cursor: pointer; margin: 2px; font-weight: bold; }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h2>📁 Admin Dashboard</h2>
    <button class="add-btn" onclick="openAddModal()">+</button>
  </div>
  
  <div class="table-wrapper">
    <table id="dataTable">
      <thead><tr><th>Name</th><th>Category</th><th>URL</th><th>Thumbnail</th><th>Actions</th></tr></thead>
      <tbody id="tableBody"><tr><td colspan="5" style="text-align:center;">Loading...</td></tr></tbody>
    
  </div>
</div>

<div id="dataModal" class="modal">
  <div class="modal-content">
    <h3 id="modalTitle">➕ Add Data</h3>
    <input type="text" id="modalName" placeholder="Name">
    <input type="text" id="modalCategory" placeholder="Category">
    <input type="text" id="modalUrl" placeholder="URL">
    <input type="file" id="modalThumb" accept="image/*">
    <div class="modal-buttons">
      <button id="modalActionBtn" class="btn-add" onclick="submitData()">Add</button>
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<div id="progressOverlay" class="progress-overlay">
  <div class="progress-card">
    <div class="progress-title" id="progressTitle">Processing...</div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill">0%</div></div>
    <div class="progress-status" id="progressStatus">Please wait...</div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const API = "https://script.google.com/macros/s/AKfycbylg5tN7DQQwioDrhWtHHEzPh1oqpzqkvBxY_dzwPBCoToAwXwperoy0IWblfWiPFtU2A/exec";

let currentEditRow = null;
let isEditMode = false;

function showToast(msg, type) {
  let toast = document.getElementById("toast");
  toast.className = "toast " + type;
  toast.innerText = msg;
  toast.style.display = "block";
  setTimeout(() => { toast.style.display = "none"; }, 3000);
}

function showProgress(show, title, percent, status) {
  let overlay = document.getElementById("progressOverlay");
  if (show) {
    document.getElementById("progressTitle").innerText = title;
    document.getElementById("progressFill").style.width = percent + "%";
    document.getElementById("progressFill").innerText = percent + "%";
    document.getElementById("progressStatus").innerText = status;
    overlay.style.display = "flex";
  } else {
    overlay.style.display = "none";
  }
}

function updateProgress(percent, status) {
  document.getElementById("progressFill").style.width = percent + "%";
  document.getElementById("progressFill").innerText = percent + "%";
  document.getElementById("progressStatus").innerText = status;
}

function openAddModal() {
  isEditMode = false;
  currentEditRow = null;
  document.getElementById("modalTitle").innerHTML = "➕ Add New Data";
  document.getElementById("modalActionBtn").innerHTML = "Add";
  document.getElementById("modalActionBtn").className = "btn-add";
  document.getElementById("modalName").value = "";
  document.getElementById("modalCategory").value = "";
  document.getElementById("modalUrl").value = "";
  document.getElementById("modalThumb").value = "";
  document.getElementById("dataModal").style.display = "flex";
}

function openEditModal(rowNum, name, category, url) {
  isEditMode = true;
  currentEditRow = rowNum;
  document.getElementById("modalTitle").innerHTML = "✏️ Edit Data";
  document.getElementById("modalActionBtn").innerHTML = "Update";
  document.getElementById("modalActionBtn").className = "btn-save";
  document.getElementById("modalName").value = name;
  document.getElementById("modalCategory").value = category;
  document.getElementById("modalUrl").value = url;
  document.getElementById("modalThumb").value = "";
  document.getElementById("dataModal").style.display = "flex";
}

function closeModal() {
  document.getElementById("dataModal").style.display = "none";
}

async function submitData() {
  let name = document.getElementById("modalName").value.trim();
  let category = document.getElementById("modalCategory").value.trim();
  let url = document.getElementById("modalUrl").value.trim();
  let file = document.getElementById("modalThumb").files[0];
  
  if (!name || !category || !url) {
    showToast("Please fill all fields", "error");
    return;
  }
  
  if (!isEditMode && !file) {
    showToast("Please select an image", "error");
    return;
  }
  
  closeModal();
  
  if (isEditMode) {
    // EDIT
    showProgress(true, "Updating...", 0, "Starting...");
    
    let processEdit = async (imageBase64) => {
      let payload = { action: "EDIT", rowNumber: currentEditRow, name, category, url };
      if (imageBase64) payload.thumbnail = imageBase64;
      
      updateProgress(60, "Saving...");
      let res = await fetch(API, { method: "POST", body: JSON.stringify(payload) });
      let result = await res.json();
      
      if (result.status === "UPDATED") {
        updateProgress(100, "Done!");
        setTimeout(() => {
          showProgress(false, "", 0, "");
          showToast("Updated!", "success");
          loadData();
        }, 500);
      } else {
        showProgress(false, "", 0, "");
        showToast("Update failed", "error");
      }
    };
    
    if (file) {
      updateProgress(20, "Reading image...");
      let reader = new FileReader();
      reader.onload = (e) => { updateProgress(40, "Uploading..."); processEdit(e.target.result); };
      reader.readAsDataURL(file);
    } else {
      processEdit(null);
    }
  } else {
    // ADD
    showProgress(true, "Adding...", 0, "Reading image...");
    
    let reader = new FileReader();
    reader.onload = async () => {
      updateProgress(50, "Saving...");
      let payload = { name, category, url, thumbnail: reader.result };
      let res = await fetch(API, { method: "POST", body: JSON.stringify(payload) });
      let result = await res.json();
      
      if (result.status === "OK") {
        updateProgress(100, "Done!");
        setTimeout(() => {
          showProgress(false, "", 0, "");
          showToast("Added!", "success");
          loadData();
        }, 500);
      } else {
        showProgress(false, "", 0, "");
        showToast("Add failed: " + (result.message || "Unknown"), "error");
      }
    };
    reader.readAsDataURL(file);
  }
}

async function deleteData(rowNumber, name) {
  if (!confirm(`Delete "${name}"?`)) return;
  
  showProgress(true, "Deleting...", 0, "Processing...");
  updateProgress(50, "Sending...");
  
  let res = await fetch(API, { method: "POST", body: JSON.stringify({ action: "DELETE", rowNumber }) });
  let result = await res.json();
  
  if (result.status === "DELETED") {
    updateProgress(100, "Done!");
    setTimeout(() => {
      showProgress(false, "", 0, "");
      showToast("Deleted!", "success");
      loadData();
    }, 500);
  } else {
    showProgress(false, "", 0, "");
    showToast("Delete failed", "error");
  }
}

async function loadData() {
  try {
    let res = await fetch(API);
    let data = await res.json();
    let html = "";
    
    if (!data || data.length === 0) {
      document.getElementById("tableBody").innerHTML = '<tr><td colspan="5" style="text-align:center;">No data found</td></tr>';
      return;
    }
    
    for (let item of data) {
      let name = (item.Name || "").replace(/'/g, "\\'");
      let category = (item.Category || "").replace(/'/g, "\\'");
      let url = item.URL || "#";
      let thumb = item.Thumbnail ? `<img src="${item.Thumbnail}" onerror="this.src='https://via.placeholder.com/55'">` : "No image";
      
      html += `<tr>
        <td>${name}</td>
        <td>${category}</td>
        <td><a href="${url}" target="_blank" style="color:#00aaff;">🔗 Link</a></td>
        <td>${thumb}</td>
        <td>
          <button class="edit-btn" onclick='openEditModal(${item.rowNumber}, "${name}", "${category}", "${url.replace(/'/g, "\\'")}")'>✏️ Edit</button>
          <button class="delete-btn" onclick='deleteData(${item.rowNumber}, "${name}")'>🗑️ Delete</button>
        </td>
      </tr>`;
    }
    document.getElementById("tableBody").innerHTML = html;
  } catch(e) {
    document.getElementById("tableBody").innerHTML = '<tr><td colspan="5" style="text-align:center;">Error loading data: ' + e.message + '</td></tr>';
  }
}

loadData();
</script>
</body>
</html>
