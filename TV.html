    <style>
        :root { 
            --main-color: #00bcd4; 
            --dark-bg: #0b0b0b; 
            --card-bg: #1a1a1a; 
            --header-bg: #121212;
            --splash-bg: radial-gradient(circle, #1a1a1a 0%, #0b0b0b 100%);
            --max-width: 1200px;
            --main-font: 'Poppins', sans-serif;
            --primary: #007aff; 
            --panel: rgba(15, 15, 15, 0.85);
        }
        
        body { 
            background: var(--dark-bg); color: white; 
            font-family: var(--main-font); 
            margin: 0; padding-bottom: 80px; overflow-x: hidden;
            user-select: none; -webkit-tap-highlight-color: transparent;
            transition: background 0.3s ease;
        }
        .container { max-width: var(--max-width); margin: 0 auto; width: 100%; }
        
        .exo-container { 
            position: relative; 
            width: 100%; 
            background: #000; 
            overflow: hidden; 
            aspect-ratio: 16/9;
        }
        .exo-container video { 
            width: 100%; 
            height: 100%; 
            transition: object-fit 0.3s ease, filter 0.1s ease; 
            display: block;
        }
        .fit-contain { object-fit: contain; }
        .fit-cover { object-fit: cover; }
        .fit-fill { object-fit: fill; }
        .exo-loader { 
            position: absolute; 
            inset: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            z-index: 20; 
            background: rgba(0,0,0,0.5); 
        }
        .spinner { 
            width: 40px; 
            height: 40px; 
            border: 3px solid rgba(255,255,255,0.1); 
            border-top-color: var(--primary); 
            border-radius: 50%; 
            animation: spin 0.8s linear infinite; 
        }
        .exo-overlay { 
            position: absolute; 
            inset: 0; 
            background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, transparent 50%, rgba(0,0,0,0.6) 100%); 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            padding: 15px; 
            opacity: 0; 
            transition: opacity 0.3s ease; 
            z-index: 10; 
            pointer-events: none;
        }
        .exo-overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }
        .top-bar { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            width: 100%;
        }
        .live-tag { 
            background: #ff3b30; 
            color: white; 
            padding: 4px 12px; 
            border-radius: 30px; 
            font-size: 11px; 
            font-weight: bold; 
            letter-spacing: 1px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        .menu-bar { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            background: var(--panel); 
            padding: 8px 15px; 
            border-radius: 12px; 
            backdrop-filter: blur(10px); 
            border: 1px solid rgba(255,255,255,0.1); 
        }
        .icon-btn { 
            background: none; 
            border: none; 
            color: white; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            transition: 0.2s; 
            padding: 8px;
            border-radius: 40px;
        }
        .icon-btn:active { transform: scale(0.95); background: rgba(255,255,255,0.1);}
        .material-icons-round { font-size: 26px; }
        .spacer { flex-grow: 1; }
        .fit-mode-badge {
            background: rgba(0,0,0,0.6);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.5px;
            color: #ddd;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        #splash-screen {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: var(--splash-bg); z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.5s ease-out;
        }
        .splash-logo { width: 100px; height: 100px; border-radius: 20px; margin-bottom: 5px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); animation: pulse 2s infinite; object-fit: cover; }
        #splash-screen h2 { margin: 0; padding: 0; color: var(--main-color); font-weight: 800; text-transform: uppercase; letter-spacing: 2px; font-size: 24px; }
        .splash-loader { margin-top: 10px !important; color: #444; font-size: 20px; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        
        header { background: var(--header-bg); padding: 12px 15px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid #222; height: 60px; box-sizing: border-box; }
        .menu-icon-btn { font-size: 24px; cursor: pointer; color: var(--main-color); width: 36px; text-align: center; transition: transform 0.2s ease; }
        .menu-icon-btn:active { transform: scale(0.9); }
        .app-name { font-weight: 800; font-size: 18px; color: var(--main-color); letter-spacing: 0.5px; text-transform: uppercase; margin-left: 8px; }
        
        .category-section { margin-bottom: 25px; padding: 0 10px; }
        .category-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 5px; }
        .category-title { display: flex; align-items: center; gap: 8px; font-weight: 600; color: #fff; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px; }
        .category-title i { color: var(--main-color); font-size: 16px; width: 20px; text-align: center; }
        .read-more-btn { background: rgba(0, 188, 212, 0.15); color: var(--main-color); border: 1px solid rgba(0, 188, 212, 0.3); padding: 4px 12px; border-radius: 20px; font-size: 11px; cursor: pointer; font-weight: 600; text-transform: uppercase; transition: 0.2s; }
        .read-more-btn:active { transform: scale(0.95); background: var(--main-color); color: #000; }
        
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 5px 0; }
        .card { background: var(--card-bg); border-radius: 10px; overflow: hidden; border: 1px solid #282828; cursor: pointer; transition: 0.3s; position: relative; }
        .card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; display: block; background: var(--card-bg); transition: filter 0.4s ease-out, opacity 0.3s ease; }
        .card-title { font-size: 11px; padding: 6px 3px; text-align: center; color: #efefef; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: rgba(0,0,0,0.3); }
        .card.playing { background: var(--main-color) !important; border-color: #fff; transform: scale(0.95); }
        .card.playing .card-title { color: #000 !important; font-weight: 800; }
        
        .fav-badge { position: absolute; top: 5px; right: 5px; background: rgba(0,0,0,0.6); color: #fff; width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 5; font-size: 12px; cursor: pointer; transition: 0.2s; border: 1px solid rgba(255,255,255,0.1); }
        .fav-badge.active { color: #ff3b30; background: rgba(255,255,255,0.9); }
        
        .empty-state { text-align: center; padding: 60px 20px; color: #666; }
        .empty-state i { font-size: 64px; margin-bottom: 20px; opacity: 0.5; }
        .empty-state h3 { font-size: 18px; margin-bottom: 10px; color: #888; }
        
        .sidenav { 
            height: 100%; width: 60%; max-width: 320px; position: fixed; z-index: 2005; top: 0; left: 0;
            background: #111; overflow-x: hidden; transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
            transform: translateX(-100%); padding-top: 0; box-shadow: 10px 0 30px rgba(0,0,0,0.5);
        }
        .sidenav.open { transform: translateX(0); }
        .nav-header { width: 100%; height: 160px; background: #000; position: relative; overflow: hidden; border-bottom: 2px solid var(--main-color); }
        .nav-header img { width: 100%; height: 100%; object-fit: cover; }
        .sidenav a { padding: 15px 25px; text-decoration: none; font-size: 15px; font-weight: 400; color: #bbb; display: flex; align-items: center; gap: 15px; border-bottom: 1px solid #1a1a1a; transition: 0.2s; }
        .sidenav a:active { background: #222; color: var(--main-color); }
        #menu-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 2004; opacity: 0; transition: opacity 0.4s ease; }
        #menu-overlay.visible { display: block; opacity: 1; }
        
        .ptr-container {
            position: fixed; top: 0; left: 0; right: 0; z-index: 9998; height: 70px;
            transform: translateY(-70px); transition: transform 0.3s ease; background: #00bcd4;
            display: flex; align-items: center; justify-content: center; gap: 12px;
        }
        .ptr-container span { color: white; font-weight: 700; font-size: 13px; letter-spacing: 1px; text-transform: uppercase; }
        .ptr-container i { color: white; font-size: 20px; }
        @keyframes ptrSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .ptr-spinner {
            display: inline-block !important; width: 26px !important; height: 26px !important;
            border: 3px solid rgba(255,255,255,0.35) !important; border-top: 3px solid #ffffff !important;
            border-radius: 50% !important; animation: ptrSpin 0.7s linear infinite !important;
            box-sizing: border-box !important; flex-shrink: 0 !important;
        }
        
        .header-content { display: flex; width: 100%; max-width: var(--max-width); margin: 0 auto; align-items: center; justify-content: space-between; }
        .header-left, .header-right { display: flex; align-items: center; gap: 12px; font-size: 18px; cursor: pointer; }
        
        #search-container { display: none; flex: 1; align-items: center; gap: 10px; margin: 0 20px; width: 100%; min-width: 0; }
        #searchBar { 
            flex: 1; min-width: 0; background: #222; border: 1px solid #333; color: white; 
            padding: 8px 15px; border-radius: 20px; outline: none; font-size: 14px; 
            font-family: var(--main-font); height: 38px; box-sizing: border-box; width: 100%;
        }
        
        .search-close {
            display: flex; align-items: center; justify-content: center; width: 38px; height: 38px;
            background: rgba(255,255,255,0.1); border-radius: 50%; cursor: pointer; transition: 0.2s;
            flex-shrink: 0; line-height: 1;
        }
        .search-close i { font-size: 18px; color: var(--main-color); }
        
        #videoBox { display: none; width: 100%; background: #000; position: sticky; top: 60px; z-index: 1001; }
        .slider { width: 100%; height: 200px; overflow: hidden; position: relative; background: #000; margin-bottom: 5px; }
        .slides-track { display: flex; transition: 0.7s cubic-bezier(0.25, 1, 0.5, 1); height: 100%; }
        .slide-item { min-width: 100%; height: 100%; }
        .slide-item img { width: 100%; height: 100%; object-fit: cover; background: #000; transition: filter 0.4s ease-out; }
        
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: rgba(18,18,18,0.95); display: flex; justify-content: space-around; padding: 10px 0; backdrop-filter: blur(10px); border-top: 1px solid #222; z-index: 1000; }
        .nav-btn { text-align: center; font-size: 10px; color: #888; flex: 1; cursor: pointer; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; }
        .nav-btn i { font-size: 18px; margin-bottom: 2px; display: block; }
        .nav-btn.active { color: var(--main-color); }
        
        .profile-container { padding: 20px; max-width: 600px; margin: 0 auto; }
        .profile-card { background: var(--card-bg); border-radius: 15px; border: 1px solid #282828; padding: 20px; margin-bottom: 20px; text-align: center; }
        .profile-pic { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 2px solid var(--main-color); margin-bottom: 10px; }
        .profile-form input { width: 100%; background: #222; border: 1px solid #333; color: white; padding: 10px 15px; border-radius: 10px; outline: none; margin-bottom: 10px; font-family: var(--main-font); box-sizing: border-box; }
        .profile-btn { background: var(--main-color); color: black; border: none; padding: 10px 20px; border-radius: 20px; font-weight: 600; cursor: pointer; width: 100%; margin-top: 5px; transition: 0.2s; }
        
        .theme-selector { display: flex; justify-content: center; gap: 15px; margin: 15px 0; }
        .theme-dot { width: 35px; height: 35px; border-radius: 50%; cursor: pointer; border: 2px solid white; transition: 0.2s; }
        
        #update-overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.9); z-index: 10000; flex-direction: column; align-items: center; justify-content: center; }
        .update-box { background: var(--card-bg); padding: 30px; border-radius: 15px; border: 1px solid var(--main-color); text-align: center; width: 80%; max-width: 400px; }
        .skeleton-card { background: linear-gradient(90deg, #1a1a1a 25%, #2a2a2a 50%, #1a1a1a 75%); background-size: 200% 100%; animation: loading 1.5s infinite; border-radius: 10px; aspect-ratio: 1/1; }
        @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        .data-save-badge { position: fixed; bottom: 70px; right: 10px; background: rgba(0,188,212,0.9); color: white; padding: 5px 10px; border-radius: 20px; font-size: 10px; font-weight: 600; z-index: 999; opacity: 0; transition: opacity 0.3s ease; pointer-events: none; }
        .data-save-badge.show { opacity: 1; }
        .no-update-badge { position: fixed; bottom: 70px; left: 10px; background: rgba(76, 175, 80, 0.9); color: white; padding: 5px 10px; border-radius: 20px; font-size: 10px; font-weight: 600; z-index: 999; opacity: 0; transition: opacity 0.3s ease; pointer-events: none; }
        .no-update-badge.show { opacity: 1; }
        .img-loading { filter: blur(8px); transform: scale(1.02); transition: filter 0.5s ease-out, transform 0.3s ease; }
        .img-loaded { filter: blur(0); transform: scale(1); }
        
        .internet-checker { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(145deg, #0a0a0a 0%, #161616 100%); z-index: 30000; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .internet-checker .icon-wrapper { width: 120px; height: 120px; background: rgba(0,188,212,0.1); border-radius: 60px; display: flex; align-items: center; justify-content: center; margin-bottom: 25px; animation: pulseGlow 2s infinite; }
        @keyframes pulseGlow { 0% { box-shadow: 0 0 0 0 rgba(0,188,212,0.4); } 70% { box-shadow: 0 0 0 15px rgba(0,188,212,0); } 100% { box-shadow: 0 0 0 0 rgba(0,188,212,0); } }
        .internet-checker i { font-size: 65px; color: var(--main-color); }
        .internet-checker h2 { font-size: 28px; font-weight: 800; margin: 15px 0 10px; color: #ffffff; }
        .internet-checker .retry-btn { margin-top: 40px; background: linear-gradient(135deg, var(--main-color) 0%, #008c9e 100%); color: #ffffff; padding: 14px 42px; border: none; border-radius: 50px; font-weight: 700; font-size: 16px; cursor: pointer; display: flex; align-items: center; gap: 12px; box-shadow: 0 8px 20px rgba(0,188,212,0.25); }
    </style>
</head>

<div class="bottom-nav" id="bottomNav">
    <div class="nav-btn active" id="home-nav-btn" onclick="filterData('All', this)"><i class="fa fa-house"></i>HOME</div>
    <div class="nav-btn" id="live-nav-btn" style="display:none;" onclick="filterData('Live', this)"><i class="fa fa-circle-play"></i>LIVE</div>
    <div class="nav-btn" id="fav-nav-btn" onclick="showFavorites(this)"><i class="fa fa-heart"></i>FAVOURITE</div>
    <div class="nav-btn" id="more-nav-btn" onclick="showMoreSection(this)"><i class="fa fa-ellipsis"></i>MORE</div>
</div>

<div id="update-overlay"><div class="update-box"><h2>Update Available!</h2><button id="update-btn">UPDATE NOW</button></div></div>
<div id="data-save-badge" class="data-save-badge"><i class="fa fa-database"></i> Using cached data</div>
<div id="no-update-badge" class="no-update-badge"><i class="fa fa-check-circle"></i> Data is up to date</div>

<script>
    const MASTER_LOGO = 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTf7ax2YDbvMh3IxQPzSyY1YIewn8Q_1bDgR04kRJT5-A&s=10';
    const NAV_HEADER_IMAGE = 'https://drive.google.com/thumbnail?id=1DXQpAofda-bZPS20Q-bqo6neUDznYqW9&sz=w1000';
    const STORAGE_KEY_DATA = 'nikamma_cached_data';
    const STORAGE_KEY_HASH = 'nikamma_data_hash';
    const SPLASH_SEEN_KEY = 'nikamma_splash_seen';
    const FAV_KEY_STORAGE = 'nikamma_fav_list';
    
    let isFullscreen = false;
    let rawData = [];
    let currentCategory = 'All';
    let availableCategories = [];
    let favorites = JSON.parse(localStorage.getItem(FAV_KEY_STORAGE) || '[]');
    let currentDataHash = '';
    let settingsData = { version: "3.9", updateUrl: "#", ratingUrl: "#", privacyUrl: "#" };
    let isRefreshing = false;
    
    let currentMpegtsPlayer = null;
    let currentHlsPlayer = null;
    let currentSourceUrl = null;
    let bufferingTimeout = null;
    let controlsTimeout = null;
    
    const advVideo = document.getElementById('advancedVideo');
    const exoOverlay = document.getElementById('exoOverlay');
    const exoPlayBtn = document.getElementById('exoPlayBtn');
    const exoMuteBtn = document.getElementById('exoMuteBtn');
    const exoFullBtn = document.getElementById('exoFullBtn');
    const exoScreenSetBtn = document.getElementById('exoScreenSetBtn');
    const exoLoader = document.getElementById('exoLoader');

    const categoryIconsMap = {
        'futbol': 'fa-futbol',
        'sports': 'fa-futbol',
        'movies': 'fa-film',
        'music': 'fa-music',
        'news': 'fa-newspaper',
        'live': 'fa-circle-play',
        'life': 'fa-circle-play',
        'favorites': 'fa-heart'
    };

    function getIconClass(catName, defaultIcon) {
        if(!catName) return defaultIcon || 'fa-folder';
        let lower = catName.trim().toLowerCase();
        if(lower.startsWith('fa-')) return 'fa ' + lower;
        if(categoryIconsMap[lower]) return 'fa ' + categoryIconsMap[lower];
        return defaultIcon || 'fa fa-folder';
    }

    function setVideoFitMode(mode) {
        const modes = ['contain', 'cover', 'fill'];
        let currentMode = 'fill';
        modes.forEach(m => { if(advVideo.classList.contains('fit-' + m)) currentMode = m; });
        let next = mode || modes[(modes.indexOf(currentMode) + 1) % modes.length];
        modes.forEach(m => advVideo.classList.remove('fit-' + m));
        advVideo.classList.add('fit-' + next);
        document.getElementById('mode-text').innerText = next.toUpperCase();
    }
    
    function showControls() {
        if (exoOverlay && !exoOverlay.classList.contains('visible')) {
            exoOverlay.classList.add('visible');
            if (controlsTimeout) clearTimeout(controlsTimeout);
            if (!advVideo.paused) {
                controlsTimeout = setTimeout(() => {
                    if (exoOverlay && !advVideo.paused) exoOverlay.classList.remove('visible');
                }, 5000);
            }
        }
    }
    
    function hideControls() {
        if (exoOverlay && exoOverlay.classList.contains('visible')) {
            exoOverlay.classList.remove('visible');
            clearTimeout(controlsTimeout);
        }
    }
    
    function toggleControls() {
        if (exoOverlay.classList.contains('visible')) hideControls();
        else showControls();
    }
    
    function attachToggleControls() {
        const container = document.getElementById('advancedPlayerContainer');
        if (!container) return;
        container.addEventListener('click', (e) => {
            if (e.target.closest('.icon-btn') || e.target.closest('.menu-bar') || e.target.closest('.top-bar')) return;
            toggleControls();
        });
        advVideo.addEventListener('click', (e) => { e.stopPropagation(); toggleControls(); });
        advVideo.addEventListener('pause', () => showControls());
    }
    
    function clearBufferingTimeout() { if (bufferingTimeout) { clearTimeout(bufferingTimeout); bufferingTimeout = null; } }
    
    function destroyAdvancedPlayer() {
        if (currentMpegtsPlayer) { try { currentMpegtsPlayer.unload(); currentMpegtsPlayer.destroy(); } catch(e){} currentMpegtsPlayer = null; }
        if (currentHlsPlayer) { try { currentHlsPlayer.destroy(); } catch(e){} currentHlsPlayer = null; }
        advVideo.pause();
        advVideo.removeAttribute('src');
        advVideo.load();
        clearBufferingTimeout();
    }
    
    function loadIntoAdvancedPlayer(url, title, cardElement, autoPlay = true) {
        destroyAdvancedPlayer();
        currentSourceUrl = url;
        exoLoader.style.display = 'flex';
        const isTs = url.includes('.ts') || url.includes('type=m3u8') || url.includes('output=ts');
        const isM3u8 = url.includes('.m3u8');
        
        const fallbackNative = (srcUrl, playMode) => {
            advVideo.src = srcUrl;
            if (playMode) advVideo.play().catch(e => console.warn(e));
        };
        
        if (isTs && typeof mpegts !== 'undefined') {
            try {
                currentMpegtsPlayer = mpegts.createPlayer({ type: 'mse', isLive: true, url: url, enableStashBuffer: false });
                currentMpegtsPlayer.attachMediaElement(advVideo);
                currentMpegtsPlayer.load();
                if (autoPlay) currentMpegtsPlayer.play().catch(e => console.warn(e));
            } catch(e) { fallbackNative(url, autoPlay); }
        } else if (isM3u8 && window.Hls && Hls.isSupported()) {
            try {
                currentHlsPlayer = new Hls({ lowLatencyMode: true });
                currentHlsPlayer.loadSource(url);
                currentHlsPlayer.attachMedia(advVideo);
                currentHlsPlayer.on(Hls.Events.MANIFEST_PARSED, () => { if (autoPlay) advVideo.play().catch(e=>console.warn(e)); });
            } catch(e) { fallbackNative(url, autoPlay); }
        } else {
            fallbackNative(url, autoPlay);
        }
        
        advVideo.onplaying = () => { exoLoader.style.display = 'none'; showControls(); };
        advVideo.onerror = () => { exoLoader.style.display = 'none'; };
        setTimeout(() => { if(advVideo.readyState > 0) exoLoader.style.display = 'none'; }, 1500);
    }
    
    function toggleFullscreen() {
        const container = document.getElementById('advancedPlayerContainer');
        const isCurrentlyFull = !!(document.fullscreenElement || document.webkitFullscreenElement);
        if (!isCurrentlyFull) {
            const requestMethod = container.requestFullscreen || container.webkitRequestFullscreen;
            if (requestMethod) requestMethod.call(container).catch(err => console.warn(err));
        } else {
            const exitMethod = document.exitFullscreen || document.webkitExitFullscreen;
            if (exitMethod) exitMethod.call(document).catch(err => console.warn(err));
        }
    }
    
    function updateFullscreenIcon() {
        const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
        isFullscreen = isFs;
        exoFullBtn.innerHTML = `<span class="material-icons-round">${isFs ? 'fullscreen_exit' : 'fullscreen'}</span>`;
        if (!isFs) setVideoFitMode();
    }
    
    document.addEventListener('fullscreenchange', updateFullscreenIcon);
    document.addEventListener('webkitfullscreenchange', updateFullscreenIcon);
    
    function attachPlayerControls() {
        document.getElementById('exoTopCloseBtn').onclick = (e) => { e.stopPropagation(); stopVideo(); };
        exoPlayBtn.onclick = (e) => {
            e.stopPropagation();
            if (advVideo.paused) { advVideo.play(); exoPlayBtn.innerHTML = '<span class="material-icons-round">pause</span>'; }
            else { advVideo.pause(); exoPlayBtn.innerHTML = '<span class="material-icons-round">play_arrow</span>'; }
            showControls();
        };
        exoMuteBtn.onclick = (e) => {
            e.stopPropagation();
            advVideo.muted = !advVideo.muted;
            exoMuteBtn.innerHTML = `<span class="material-icons-round">${advVideo.muted ? 'volume_off' : 'volume_up'}</span>`;
            showControls();
        };
        exoScreenSetBtn.onclick = (e) => { e.stopPropagation(); setVideoFitMode(); showControls(); };
        exoFullBtn.onclick = (e) => { e.stopPropagation(); toggleFullscreen(); showControls(); };
        attachToggleControls();
    }
    
    window.play = function(url, title, cardElement) {
        if(!url || url === '#') return;
        document.querySelectorAll('.card').forEach(c => c.classList.remove('playing'));
        if(cardElement) cardElement.classList.add('playing');
        document.getElementById('videoBox').style.display = 'block';
        document.getElementById('mainSlider').style.display = 'none';
        document.getElementById('videoTitle').innerText = title;
        window.scrollTo({top: 0, behavior: 'smooth'});
        if (url.includes('executeandship.com') || url.includes('dailymotion.com') || url.includes('streamtp.com') || url.includes('embed')) {
            destroyAdvancedPlayer();
            currentSourceUrl = url;
            document.getElementById('advancedPlayerContainer').style.display = 'none';
            var iframeBox = document.getElementById('iframePlayerBox');
            var iframe = document.getElementById('iframePlayer');
            iframeBox.style.display = 'block';
            iframe.src = url;
        } else {
            document.getElementById('iframePlayerBox').style.display = 'none';
            document.getElementById('iframePlayer').src = 'about:blank';
            document.getElementById('advancedPlayerContainer').style.display = '';
            loadIntoAdvancedPlayer(url, title, cardElement, true);
        }
    };
    
    window.stopVideo = function() {
        destroyAdvancedPlayer();
        currentSourceUrl = null;
        var iframe = document.getElementById('iframePlayer');
        if (iframe) iframe.src = 'about:blank';
        document.getElementById('iframePlayerBox').style.display = 'none';
        document.getElementById('advancedPlayerContainer').style.display = '';
        document.getElementById('videoBox').style.display = 'none';
        document.querySelectorAll('.card').forEach(c => c.classList.remove('playing'));
        const sliders = rawData.filter(d => (d.Category || d.category || "").toLowerCase() === 'slider');
        if(currentCategory === 'All' && sliders.length > 0) document.getElementById('mainSlider').style.display = 'block';
        hideControls();
    };
    
    async function checkInternetBeforeStart() {
        const checker = document.getElementById('internetChecker');
        if (!navigator.onLine) { checker.style.display = 'flex'; return false; }
        checker.style.display = 'none'; return true;
    }
    
    window.checkInternetAgain = async function() {
        const btn = document.querySelector('#internetChecker .retry-btn');
        btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Retrying...';
        setTimeout(async () => {
            const hasInternet = await checkInternetBeforeStart();
            if(hasInternet) fetchData();
            else btn.innerHTML = '<i class="fa fa-arrow-rotate-right"></i> Check Again';
        }, 1000);
    };
    
    function loadDataFromCache() {
        try {
            const cached = localStorage.getItem(STORAGE_KEY_DATA);
            if(cached) {
                const cacheData = JSON.parse(cached);
                if(cacheData.rawData && cacheData.rawData.length) {
                    rawData = cacheData.rawData;
                    currentDataHash = cacheData.dataHash || '';
                    if(cacheData.settingsData) settingsData = cacheData.settingsData;
                    applySettings();
                    return true;
                }
            }
        } catch(e) {}
        return false;
    }
    
    function showCachedDataBadge() {
        const badge = document.getElementById('data-save-badge');
        badge.classList.add('show');
        setTimeout(() => badge.classList.remove('show'), 2000);
    }
    
    function showNoUpdateBadge() {
        const badge = document.getElementById('no-update-badge');
        badge.classList.add('show');
        setTimeout(() => badge.classList.remove('show'), 2000);
    }
    
    function updateUIAfterDataLoad() {
        updateSlider();
        buildDynamicCategoryMenu();
        filterData('All', document.getElementById('home-nav-btn'), false);
        const splash = document.getElementById('splash-screen');
        if(splash && splash.style.display !== 'none') {
            splash.style.opacity = '0';
            setTimeout(() => splash.style.display = 'none', 500);
        }
    }
    
    function applySettings() {
        if(settingsData.ratingUrl) document.getElementById('rating-link').href = settingsData.ratingUrl;
        if(settingsData.privacyUrl) document.getElementById('privacy-link').href = settingsData.privacyUrl;
    }
    
    async function fetchFreshData() {
        return new Promise((resolve) => {
            Papa.parse('https://docs.google.com/spreadsheets/d/e/2PACX-1vQJM1FvOsBuKL_Al7PpwYerGDVFhs5tLF4PaVs3_TOLX-TFLW-iF3B6qLLLeuuBmjfZFGe3CFxJA-TR/pub?output=csv', {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    let newRawData = results.data.filter(item => item && (item.Name || item.name || item.URL || item.url)).map(item => {
                        let cat = (item.Category || item.category || 'Default').trim();
                        return {
                            FileID: item.FileID || item.FileId || item.file_id || '',
                            Name: item.Name || item.name || 'Untitled',
                            Category: cat,
                            URL: item.URL || item.url || '#',
                            Thumbnail: item.Thumbnail || item.thumbnail || MASTER_LOGO,
                            Timestamp: item.Timestamp || item.timestamp || ''
                        };
                    });
                    
                    if(newRawData.length > 0) {
                        rawData = newRawData;
                        let cats = [...new Set(rawData.map(d => d.Category))].filter(c => c && c.toLowerCase() !== 'slider');
                        availableCategories = cats.map(c => {
                            return { name: c, icon: getIconClass(c, 'fa-folder') };
                        });
                        
                        let hash = btoa(unescape(encodeURIComponent(JSON.stringify(rawData)))).substring(0, 16);
                        if(hash !== currentDataHash) {
                            currentDataHash = hash;
                            localStorage.setItem(STORAGE_KEY_DATA, JSON.stringify({ rawData, dataHash: currentDataHash, settingsData }));
                            updateUIAfterDataLoad();
                            resolve(true);
                        } else {
                            updateUIAfterDataLoad();
                            resolve(false);
                        }
                    } else {
                        updateUIAfterDataLoad();
                        resolve(false);
                    }
                },
                error: function() {
                    updateUIAfterDataLoad();
                    resolve(false);
                }
            });
        });
    }
    
    function buildDynamicCategoryMenu() {
        const liveBtn = document.getElementById('live-nav-btn');
        const sideNavDynamicLinks = document.getElementById('sideNavDynamicLinks');
        
        let hasLiveCategory = rawData.some(d => {
            let c = (d.Category || '').trim().toLowerCase();
            return c === 'live' || c === 'life';
        });
        if (hasLiveCategory) liveBtn.style.display = 'block';
        else liveBtn.style.display = 'none';
        
        sideNavDynamicLinks.innerHTML = `<a href="#" onclick="filterData('All', null, true)"><i class="fa fa-home"></i> Home</a>`;
        if (availableCategories.length > 0) {
            availableCategories.forEach(catObj => {
                let lowerCat = catObj.name.toLowerCase();
                if (lowerCat === 'live' || lowerCat === 'life' || lowerCat === 'slider') return;
                let cleanIcon = catObj.icon;
                sideNavDynamicLinks.innerHTML += `<a href="#" onclick="filterData('${catObj.name}', null, true)"><i class="${cleanIcon}"></i> ${catObj.name}</a>`;
            });
        }
    }
    
    window.filterData = function(cat, btn, shouldClose = true) {
        currentCategory = cat;
        if(shouldClose) closeNav();
        const sliderDiv = document.getElementById('mainSlider');
        const videoBox = document.getElementById('videoBox');
        const sliders = rawData.filter(d => (d.Category || '').toLowerCase() === 'slider');
        
        sliderDiv.style.display = (cat === 'All' && videoBox.style.display !== 'block' && sliders.length) ? 'block' : 'none';
        
        document.querySelectorAll('.nav-btn').forEach(b => {
            if(b === btn) b.classList.add('active');
            else if(!btn && (cat === 'All' && b.id === 'home-nav-btn')) b.classList.add('active');
            else b.classList.remove('active');
        });
        
        const homeCategoriesContainer = document.getElementById('homeCategoriesContainer');
        const mainCategoryView = document.getElementById('mainCategoryView');
        const moreSectionView = document.getElementById('moreSectionView');
        const specificGrid = document.getElementById('specificGrid');
        const specificCategoryTitle = document.getElementById('specificCategoryTitle');
        
        moreSectionView.style.display = 'none';
        
        if (cat === 'All') {
            mainCategoryView.style.display = 'none';
            homeCategoriesContainer.style.display = 'block';
            let finalHtml = '';
            
            availableCategories.forEach(catObj => {
                let lower = catObj.name.toLowerCase();
                if(lower === 'slider' || lower === 'life') return;
                
                let items = rawData.filter(d => (d.Category || '').toLowerCase() === lower).slice().reverse().slice(0, 6);
                if(!items.length) return;
                
                let cleanIcon = catObj.icon;
                finalHtml += `
                <div class="category-section">
                    <div class="category-header">
                        <div class="category-title"><i class="${cleanIcon}"></i> ${catObj.name.toUpperCase()}</div>
                        <div class="read-more-btn" onclick="filterData('${catObj.name}', null, true)">View All</div>
                    </div>
                    <div class="grid">
                        ${items.map(item => {
                            let thumb = item.Thumbnail || MASTER_LOGO, itemName = item.Name || "Untitled", url = item.URL || "#";
                            let isFav = favorites.includes(url);
                            return `
                            <div class="card" data-url="${escapeHtml(url)}" data-title="${escapeHtml(itemName)}">
                                <div class="fav-badge ${isFav ? 'active' : ''}" onclick="toggleFav(event, '${escapeHtml(url)}')"><i class="fa fa-heart"></i></div>
                                <div style="width:100%; height:100%;" onclick="play('${escapeHtml(url)}', '${escapeHtml(itemName)}', this.parentElement)">
                                    <img src="${thumb}" loading="lazy" onerror="handleImageError(this)" onload="handleImageLoad(this)" class="img-loading">
                                    <div class="card-title">${itemName}</div>
                                </div>
                            </div>`;
                        }).join('')}
                    </div>
                </div>`;
            });
            
            if(!finalHtml) {
                homeCategoriesContainer.innerHTML = `<div class="empty-state"><i class="fa fa-folder-open"></i><h3>No Content Available</h3></div>`;
            } else {
                homeCategoriesContainer.innerHTML = finalHtml;
            }
        } else {
            homeCategoriesContainer.style.display = 'none';
            mainCategoryView.style.display = 'block';
            
            let matchedCategory = availableCategories.find(c => c.name.toLowerCase() === cat.toLowerCase());
            let currentIconClass = matchedCategory ? matchedCategory.icon : "fa fa-folder";
            specificCategoryTitle.innerHTML = `<i class="${currentIconClass}"></i> ${cat.toUpperCase()}`;
            
            let filtered = rawData.filter(d => {
                let c = (d.Category || "").trim().toLowerCase();
                if (cat.toLowerCase() === 'live') return c === 'live' || c === 'life';
                return c === cat.toLowerCase();
            });
            filtered = filtered.slice().reverse();
            
            if(!filtered.length) {
                specificGrid.innerHTML = `<div style="grid-column:1/-1" class="empty-state"><i class="fa fa-folder-open"></i><h3>No content found</h3></div>`;
            } else {
                specificGrid.innerHTML = filtered.map(item => {
                    let thumb = item.Thumbnail || MASTER_LOGO, itemName = item.Name || "Untitled", url = item.URL || "#";
                    let isFav = favorites.includes(url);
                    return `
                    <div class="card" data-url="${escapeHtml(url)}" data-title="${escapeHtml(itemName)}">
                        <div class="fav-badge ${isFav ? 'active' : ''}" onclick="toggleFav(event, '${escapeHtml(url)}')"><i class="fa fa-heart"></i></div>
                        <div style="width:100%; height:100%;" onclick="play('${escapeHtml(url)}', '${escapeHtml(itemName)}', this.parentElement)">
                            <img src="${thumb}" loading="lazy" onerror="handleImageError(this)" onload="handleImageLoad(this)" class="img-loading">
                            <div class="card-title">${itemName}</div>
                        </div>
                    </div>`;
                }).join('');
            }
        }
    };
    
    window.toggleFav = function(e, url) {
        e.stopPropagation();
        if(favorites.includes(url)) favorites = favorites.filter(u => u !== url);
        else favorites.push(url);
        localStorage.setItem(FAV_KEY_STORAGE, JSON.stringify(favorites));
        
        document.querySelectorAll(`.card[data-url="${url}"] .fav-badge`).forEach(b => {
            if(favorites.includes(url)) b.classList.add('active');
            else b.classList.remove('active');
        });
        if(currentCategory === 'Favorites') showFavorites();
    };
    
    window.showFavorites = function(btn) {
        closeNav();
        currentCategory = 'Favorites';
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        if(btn) btn.classList.add('active');
        else document.getElementById('fav-nav-btn').classList.add('active');
        
        document.getElementById('mainSlider').style.display = 'none';
        document.getElementById('homeCategoriesContainer').style.display = 'none';
        document.getElementById('mainCategoryView').style.display = 'block';
        
        const specificGrid = document.getElementById('specificGrid');
        const specificCategoryTitle = document.getElementById('specificCategoryTitle');
        specificCategoryTitle.innerHTML = `<i class="fa fa-heart" style="color:#ff3b30;"></i> FAVORITES`;
        
        let filtered = rawData.filter(d => favorites.includes(d.URL));
        filtered = filtered.slice().reverse();
        
        if(!filtered.length) {
            specificGrid.innerHTML = `<div style="grid-column:1/-1" class="empty-state"><i class="fa fa-heart-broken"></i><h3>No favorites added yet</h3></div>`;
        } else {
            specificGrid.innerHTML = filtered.map(item => {
                let thumb = item.Thumbnail || MASTER_LOGO, itemName = item.Name || "Untitled", url = item.URL || "#";
                return `
                <div class="card" data-url="${escapeHtml(url)}" data-title="${escapeHtml(itemName)}">
                    <div class="fav-badge active" onclick="toggleFav(event, '${escapeHtml(url)}')"><i class="fa fa-heart"></i></div>
                    <div style="width:100%; height:100%;" onclick="play('${escapeHtml(url)}', '${escapeHtml(itemName)}', this.parentElement)">
                        <img src="${thumb}" loading="lazy" onerror="handleImageError(this)" onload="handleImageLoad(this)" class="img-loading">
                        <div class="card-title">${itemName}</div>
                    </div>
                </div>`;
            }).join('');
        }
    };
    
    window.showMoreSection = function(btn) {
        closeNav();
        currentCategory = 'more_section';
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        if(btn) btn.classList.add('active');
        document.getElementById('mainSlider').style.display = 'none';
        document.getElementById('homeCategoriesContainer').style.display = 'none';
        document.getElementById('mainCategoryView').style.display = 'none';
        document.getElementById('moreSectionView').style.display = 'block';
        
        let user = localStorage.getItem('nikamma_user');
        if(user) {
            document.getElementById('loggedOutView').style.display = 'none';
            document.getElementById('loggedInView').style.display = 'block';
            document.getElementById('welcomeUser').innerText = `Hi, ${user}!`;
        } else {
            document.getElementById('loggedOutView').style.display = 'block';
            document.getElementById('loggedInView').style.display = 'none';
        }
    };
    
    window.userLogin = function() {
        let u = document.getElementById('loginUsername').value.trim();
        if(u) { localStorage.setItem('nikamma_user', u); showMoreSection(document.getElementById('more-nav-btn')); }
    };
    
    window.userLogout = function() {
        localStorage.removeItem('nikamma_user');
        showMoreSection(document.getElementById('more-nav-btn'));
    };
    
    window.changeTheme = function(color) {
        document.documentElement.style.setProperty('--main-color', color);
        localStorage.setItem('nikamma_theme_color', color);
    };
    
    function escapeHtml(str) {
        if(!str) return '';
        return String(str).replace(/[&<>]/g, function(m) {
            if(m === '&') return '&amp;';
            if(m === '<') return '&lt;';
            if(m === '>') return '&gt;';
            return m;
        });
    }
    
    function handleImageError(img) { img.src = MASTER_LOGO; }
    function handleImageLoad(img) { img.classList.add('img-loaded'); }
    
    window.search = function() {
        const term = document.getElementById('searchBar').value.trim().toLowerCase();
        if(!term) { filterData(currentCategory, null, false); return; }
        document.getElementById('mainSlider').style.display = 'none';
        document.getElementById('homeCategoriesContainer').style.display = 'none';
        document.getElementById('moreSectionView').style.display = 'none';
        const mainCategoryView = document.getElementById('mainCategoryView');
        const specificGrid = document.getElementById('specificGrid');
        const specificCategoryTitle = document.getElementById('specificCategoryTitle');
        
        mainCategoryView.style.display = 'block';
        specificCategoryTitle.innerHTML = `<i class="fa fa-search"></i> SEARCH RESULTS`;
        
        let filtered = rawData.filter(d => (d.Name || "").toLowerCase().includes(term) && (d.Category || "").toLowerCase() !== 'slider').slice().reverse();
        if(!filtered.length) {
            specificGrid.innerHTML = `<div style="grid-column:1/-1" class="empty-state"><i class="fa fa-search"></i><h3>No results for "${term}"</h3></div>`;
            return;
        }
        
        specificGrid.innerHTML = filtered.map(item => `
        <div class="card" onclick="play('${escapeHtml(item.URL || "#")}', '${escapeHtml(item.Name)}', this)">
            <img src="${item.Thumbnail || MASTER_LOGO}" loading="lazy" onerror="handleImageError(this)" onload="handleImageLoad(this)" class="img-loading">
            <div class="card-title">${item.Name}</div>
        </div>`).join('');
    };
    
    window.forceRefreshData = async function() {
        if(isRefreshing) return;
        isRefreshing = true;
        updatePTR('release');
        const updated = await fetchFreshData();
        updatePTR('complete');
        if(updated) showCachedDataBadge();
        else showNoUpdateBadge();
        setTimeout(() => isRefreshing = false, 500);
        closeNav();
    };
    
    let ptrStartY = 0, ptrActive = false, ptrHeight = 0, isTouching = false;
    function updatePTR(status, pullDistance = 0) {
        var pc = document.getElementById('ptr-container');
        var pt = document.getElementById('ptr-text');
        var pi = document.getElementById('ptr-icon');
        
        if (status === 'pulling') {
            pc.style.transform = `translateY(${-70 + pullDistance}px)`;
            pc.style.transition = 'none';
            pt.innerText = 'Pull to refresh';
            pi.className = 'fa fa-arrow-down';
            pi.style.transform = `rotate(${Math.min(180, (pullDistance / 70) * 180)}deg)`;
        } else if (status === 'release') {
            pc.style.transform = `translateY(0px)`;
            pc.style.transition = 'transform 0.3s ease';
            pt.innerText = 'Refreshing...';
            pi.className = 'ptr-spinner';
            pi.style.transform = 'none';
        } else if (status === 'complete') {
            pc.style.transform = `translateY(-70px)`;
            pc.style.transition = 'transform 0.3s ease';
        }
    }
    
    document.addEventListener('touchstart', function(e) {
        if (window.scrollY === 0 && !ptrActive && e.touches.length === 1) {
            ptrStartY = e.touches[0].clientY;
            ptrActive = true;
            isTouching = true;
        }
    }, { passive: true });
    
    document.addEventListener('touchmove', function(e) {
        if (!ptrActive || !isTouching) return;
        const currentY = e.touches[0].clientY;
        const pullDistance = currentY - ptrStartY;
        if (pullDistance > 0) {
            ptrHeight = Math.min(70, pullDistance * 0.4);
            updatePTR('pulling', ptrHeight);
            if (ptrHeight >= 10) e.preventDefault();
        } else {
            ptrActive = false;
            updatePTR('complete');
        }
    }, { passive: false });
    
    document.addEventListener('touchend', async function() {
        if (!ptrActive || !isTouching) return;
        isTouching = false;
        if (ptrHeight >= 50) {
            updatePTR('release');
            const updated = await fetchFreshData();
            updatePTR('complete');
            if(updated) showCachedDataBadge();
            else showNoUpdateBadge();
        } else {
            updatePTR('complete');
        }
        ptrActive = false;
    }, { passive: true });
    
    window.openNav = function() {
        document.getElementById("mySidenav").classList.add('open');
        document.getElementById("menu-overlay").classList.add('visible');
    };
    
    window.closeNav = function() {
        document.getElementById("mySidenav").classList.remove('open');
        document.getElementById("menu-overlay").classList.remove('visible');
    };
    
    window.toggleSearch = function(show) {
        const title = document.getElementById('header-main');
        const icons = document.getElementById('header-icons');
        const bar = document.getElementById('search-container');
        if(show) {
            title.style.display = 'none'; icons.style.display = 'none';
            bar.style.display = 'flex'; document.getElementById('searchBar').focus();
        } else {
            title.style.display = 'flex'; icons.style.display = 'flex';
            bar.style.display = 'none'; document.getElementById('searchBar').value = ''; search();
        }
    };
    
    window.shareApp = function(e) {
        e.preventDefault();
        if(navigator.share) {
            navigator.share({ title: 'Nikamma 4k', text: 'Checkout this great streaming app!', url: window.location.href });
        } else {
            alert("App URL: " + window.location.href);
        }
    };
    
    let sliderInterval = null;
    let slideIndex = 0;
    
    function updateSlider() {
        const track = document.getElementById('sliderTrack');
        if(!track) return;
        const sliders = rawData.filter(d => (d.Category || "").toLowerCase() === 'slider');
        if(sliders.length === 0) { document.getElementById('mainSlider').style.display = 'none'; return; }
        
        track.innerHTML = sliders.map(s => `
        <div class="slide-item" onclick="play('${escapeHtml(s.URL || "#")}', '${escapeHtml(s.Name || "Untitled")}')">
            <img src="${s.Thumbnail || MASTER_LOGO}" onerror="handleImageError(this)">
        </div>`).join('');
        
        const sliderDiv = document.getElementById('mainSlider');
        const videoBox = document.getElementById('videoBox');
        if(currentCategory === 'All' && videoBox.style.display !== 'block') {
            sliderDiv.style.display = 'block';
            startSlider();
        } else {
            sliderDiv.style.display = 'none';
        }
    }
    
    function startSlider() {
        const track = document.getElementById('sliderTrack');
        if(!track || !track.children.length) return;
        if(sliderInterval) clearInterval(sliderInterval);
        sliderInterval = setInterval(() => {
            if(track.children.length) {
                slideIndex = (slideIndex + 1) % track.children.length;
                track.style.transform = `translateX(-${slideIndex * 100}%)`;
            }
        }, 3000);
    }
    
    async function init() { 
        let cachedColor = localStorage.getItem('nikamma_theme_color');
        if(cachedColor) document.documentElement.style.setProperty('--main-color', cachedColor);
        attachPlayerControls(); 
        const hasInternet = await checkInternetBeforeStart(); 
        if(hasInternet) fetchData(); 
    }
    
    async function fetchData() { 
        const hasCache = loadDataFromCache(); 
        if(!hasCache || rawData.length === 0) { 
            document.getElementById('splash-screen').style.display = 'flex'; 
            localStorage.setItem(SPLASH_SEEN_KEY, 'true'); 
            await fetchFreshData(); 
        } else { 
            document.getElementById('splash-screen').style.display = 'none'; 
            updateSlider(); 
            buildDynamicCategoryMenu();
            filterData('All', document.getElementById('home-nav-btn'), false); 
            showCachedDataBadge(); 
            fetchFreshData().then(updated => { if(updated) console.log("Data auto-updated in background."); }); 
        } 
    }
    
    document.getElementById('nav-header-static-img').src = NAV_HEADER_IMAGE;
    document.getElementById('splash-logo-img').src = MASTER_LOGO;
    init();
</script>
</body>
</html>
