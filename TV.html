<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NIKAMMA 4K ULTRA | Premium Stream Hub</title>
    <meta name="theme-color" content="#0a0a0a">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,500;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <!-- Video Streaming Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: radial-gradient(circle at 10% 20%, #0a0a0a, #000000);
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            padding-bottom: 80px;
        }
        /* ===== SPLASH SCREEN ===== */
        #splash {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center, #001f2c 0%, #000000 100%);
            z-index: 10000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.7s cubic-bezier(0.2, 0.9, 0.4, 1);
        }
        .splash-logo {
            width: 130px;
            height: 130px;
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            border-radius: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: floatAnim 2s infinite ease;
            box-shadow: 0 25px 35px -12px #00bcd4aa;
        }
        .splash-logo i {
            font-size: 70px;
            color: white;
            filter: drop-shadow(0 6px 8px rgba(0,0,0,0.4));
        }
        @keyframes floatAnim {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }
        .splash-text {
            font-size: 32px;
            font-weight: 800;
            margin-top: 20px;
            background: linear-gradient(120deg, #ffffff, #00e0ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 1px;
        }
        .splash-loader {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(0,188,212,0.2);
            border-top: 4px solid #00bcd4;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-top: 25px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* ===== PULL TO REFRESH (swipe down needed) ===== */
        .ptr-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1050;
            background: linear-gradient(90deg, #00bcd4, #0097a7);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            height: 75px;
            transform: translateY(-75px);
            transition: transform 0.28s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .ptr-container span {
            font-weight: 700;
            color: white;
            font-size: 14px;
            letter-spacing: 0.5px;
        }
        .ptr-spinner {
            width: 26px;
            height: 26px;
            border: 2.5px solid rgba(255,255,255,0.4);
            border-top: 2.5px solid white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        
        /* ===== HEADER ===== */
        header {
            background: rgba(10,10,10,0.95);
            backdrop-filter: blur(20px);
            padding: 14px 18px;
            position: sticky;
            top: 0;
            z-index: 1100;
            border-bottom: 1px solid #2a2a2a;
        }
        .header-flex {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
        }
        .menu-icon {
            font-size: 28px;
            cursor: pointer;
            color: #0ff;
            transition: 0.2s;
        }
        .menu-icon:active { transform: scale(0.92); }
        .app-title {
            font-weight: 800;
            font-size: 20px;
            background: linear-gradient(135deg, #ffffff, #00e0ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .search-wrapper {
            background: #1e1e1e;
            border-radius: 40px;
            padding: 8px 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            max-width: 320px;
            border: 1px solid #333;
        }
        .search-wrapper input {
            background: transparent;
            border: none;
            color: white;
            font-size: 14px;
            width: 100%;
            outline: none;
            font-family: 'Inter', sans-serif;
        }
        .search-wrapper i { color: #0ff; }
        
        /* ===== SIDENAV (60% width, smooth) ===== */
        .sidenav {
            height: 100%;
            width: 70%;
            max-width: 320px;
            position: fixed;
            top: 0;
            left: 0;
            background: rgba(8,8,8,0.98);
            backdrop-filter: blur(18px);
            z-index: 2000;
            transform: translateX(-100%);
            transition: transform 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.2);
            box-shadow: 8px 0 40px rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            border-right: 1px solid #2c2c2c;
        }
        .sidenav.open { transform: translateX(0); }
        .nav-header {
            background: linear-gradient(145deg, #001f2c, #010101);
            padding: 32px 24px;
            text-align: center;
            border-bottom: 2px solid #00bcd4;
        }
        .nav-header i { font-size: 52px; color: #00bcd4; }
        .nav-header h3 { margin-top: 10px; font-weight: 700; font-size: 18px; }
        .sidenav a {
            padding: 16px 22px;
            display: flex;
            align-items: center;
            gap: 18px;
            color: #dddddd;
            text-decoration: none;
            font-weight: 500;
            border-bottom: 0.5px solid #282828;
            transition: 0.2s;
        }
        .sidenav a:active { background: #1f1f1f; color: #0ff; }
        /* Local Stream Toggle */
        .local-stream-wrapper {
            margin: 16px;
            background: #121212;
            border-radius: 24px;
            overflow: hidden;
        }
        .local-stream-trigger {
            padding: 16px 22px;
            display: flex;
            align-items: center;
            gap: 18px;
            cursor: pointer;
            background: #0a0a0a;
            font-weight: 500;
        }
        .local-stream-trigger i:first-child { color: #0ff; font-size: 20px; }
        .local-stream-panel {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, opacity 0.3s;
            background: #0f0f0f;
            padding: 0 12px;
        }
        .local-stream-panel.show {
            max-height: 140px;
            opacity: 1;
            padding: 12px;
        }
        .local-input {
            width: 100%;
            padding: 12px;
            border-radius: 40px;
            border: 1px solid #333;
            background: #1a1a1a;
            color: white;
            margin-bottom: 10px;
            outline: none;
        }
        .local-play-btn {
            background: #00bcd4;
            border: none;
            padding: 10px;
            border-radius: 60px;
            font-weight: bold;
            width: 100%;
            color: black;
            cursor: pointer;
            transition: 0.2s;
        }
        #menuOverlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 1999;
            display: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        /* ===== SLIDER ===== */
        .slider-area {
            width: 100%;
            height: 210px;
            overflow: hidden;
            margin-bottom: 12px;
            position: relative;
        }
        .slider-track {
            display: flex;
            transition: 0.7s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            height: 100%;
        }
        .slide {
            min-width: 100%;
            height: 100%;
        }
        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .section-title {
            padding: 16px 18px 8px;
            font-weight: 800;
            font-size: 20px;
            letter-spacing: -0.3px;
            color: #0ff;
        }
        
        /* ===== GRID (3 columns, professional) ===== */
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            padding: 10px 16px 20px;
        }
        .card {
            background: #141414;
            border-radius: 20px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.25s ease;
            border: 1px solid #2c2c2c;
        }
        .card:active { transform: scale(0.96); }
        .card img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            display: block;
            transition: filter 0.25s;
        }
        .card-title {
            padding: 10px 6px;
            font-size: 12px;
            font-weight: 600;
            text-align: center;
            background: #0e0e0e;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .playing-highlight {
            border: 2px solid #0ff;
            box-shadow: 0 0 14px #0ff6;
            transform: scale(0.98);
        }
        .skeleton-card {
            background: linear-gradient(90deg, #1a1a1a 25%, #2c2c2c 50%, #1a1a1a 75%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite;
            border-radius: 20px;
            aspect-ratio: 1/1;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        
        /* ===== PROFESSIONAL VIDEO PLAYER ===== */
        .player-module {
            display: none;
            background: #000;
            width: 100%;
            position: sticky;
            top: 65px;
            z-index: 1020;
        }
        .video-box {
            position: relative;
            background: #000;
            aspect-ratio: 16 / 9;
        }
        #mainVideo {
            width: 100%;
            height: 100%;
            object-fit: fill;
            background: black;
        }
        .player-controls {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 40%);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            opacity: 0;
            transition: opacity 0.25s;
            pointer-events: none;
        }
        .player-controls.visible {
            opacity: 1;
            pointer-events: auto;
        }
        .ctrl-top {
            display: flex;
            justify-content: space-between;
            padding: 16px;
        }
        .ctrl-bottom {
            display: flex;
            justify-content: space-evenly;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(16px);
            margin: 16px;
            border-radius: 80px;
            padding: 8px;
        }
        .ctrl-btn {
            background: none;
            border: none;
            color: white;
            font-size: 22px;
            width: 48px;
            cursor: pointer;
            border-radius: 50px;
            transition: 0.1s;
        }
        .ctrl-btn:active { transform: scale(0.92); background: #ffffff20; }
        .live-tag {
            background: #ff3b30;
            padding: 5px 16px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 800;
        }
        .fit-badge {
            background: #2c2c2c;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
        }
        .player-footer {
            display: flex;
            justify-content: space-between;
            background: #0f0f0f;
            padding: 10px 18px;
            align-items: center;
        }
        .close-video {
            background: #e53935;
            border: none;
            color: white;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: bold;
        }
        
        /* ===== BOTTOM NAV ===== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: rgba(8,8,8,0.96);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            padding: 8px 0 18px;
            border-top: 1px solid #2a2a2a;
            z-index: 1100;
        }
        .nav-btn {
            text-align: center;
            font-size: 11px;
            font-weight: 600;
            color: #aaa;
            cursor: pointer;
            transition: 0.1s;
        }
        .nav-btn i {
            font-size: 22px;
            display: block;
            margin-bottom: 5px;
        }
        .nav-btn.active {
            color: #0ff;
            text-shadow: 0 0 6px #0ff;
        }
        
        /* Toast & Gesture */
        .toast-msg {
            position: fixed;
            bottom: 85px;
            left: 20px;
            background: #00bcd4dd;
            backdrop-filter: blur(12px);
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 500;
            z-index: 1300;
            opacity: 0;
            transition: 0.2s;
        }
        .gesture-panel {
            position: fixed;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(20px);
            padding: 16px 32px;
            border-radius: 70px;
            display: flex;
            gap: 18px;
            z-index: 1400;
            opacity: 0;
            transition: 0.15s;
            pointer-events: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div id="splash">
    <div class="splash-logo"><i class="fas fa-play-circle"></i></div>
    <div class="splash-text">NIKAMMA 4K</div>
    <div class="splash-loader"></div>
</div>

<div id="ptrContainer" class="ptr-container"><div id="ptrSpinner" class="ptr-spinner" style="display:none;"></div><i id="ptrArrow" class="fas fa-arrow-down"></i><span id="ptrText">Pull down to refresh</span></div>
<div id="menuOverlay" onclick="closeNav()"></div>

<!-- SIDENAV -->
<div id="sideNav" class="sidenav">
    <div class="nav-header"><i class="fas fa-crown"></i><h3>NIKAMMA ULTRA</h3></div>
    <a href="#" onclick="filterContent('All', this)"><i class="fas fa-fire"></i> Home</a>
    <a href="#" onclick="filterContent('Live', this)"><i class="fas fa-satellite-dish"></i> Live TV</a>
    <a href="#" onclick="filterContent('Sports', this)"><i class="fas fa-futbol"></i> Sports</a>
    <a href="#" onclick="filterContent('Movies', this)"><i class="fas fa-film"></i> Movies HD</a>
    <a href="#" onclick="filterContent('TV Shows', this)"><i class="fas fa-tv"></i> TV Shows</a>
    <!-- LOCAL STREAM section -->
    <div class="local-stream-wrapper" id="localStreamWrap">
        <div class="local-stream-trigger" id="localTrigger">
            <i class="fas fa-link"></i> <span>Local Stream</span> <i class="fas fa-chevron-down" style="margin-left:auto;"></i>
        </div>
        <div class="local-stream-panel" id="localPanel">
            <input type="text" id="localUrlInput" class="local-input" placeholder="M3U8 / MP4 / TS link ...">
            <button id="localPlayBtn" class="local-play-btn"><i class="fas fa-play"></i> Play Now</button>
        </div>
    </div>
    <a href="#" id="shareSideBtn"><i class="fas fa-share-alt"></i> Share App</a>
    <a href="#" onclick="forceRefreshData()"><i class="fas fa-sync-alt"></i> Force Refresh</a>
</div>

<header>
    <div class="header-flex">
        <div class="menu-icon" onclick="openNav()"><i class="fas fa-bars"></i></div>
        <div class="app-title">NIKAMMA 4K</div>
        <div class="search-wrapper"><i class="fas fa-search"></i><input type="text" id="searchInput" placeholder="Search movies, live..." onkeyup="searchContent()"></div>
    </div>
</header>

<!-- PLAYER MODULE -->
<div id="playerModule" class="player-module">
    <div class="video-box" id="videoBox">
        <video id="mainVideo" playsinline autoplay muted></video>
        <div id="controlsOverlay" class="player-controls">
            <div class="ctrl-top"><button class="ctrl-btn" id="closePlayerBtn"><i class="fas fa-times"></i></button><div class="live-tag">LIVE</div></div>
            <div class="ctrl-bottom">
                <button class="ctrl-btn" id="playPauseBtn"><i class="fas fa-pause"></i></button>
                <button class="ctrl-btn" id="muteBtn"><i class="fas fa-volume-up"></i></button>
                <span id="fitModeLabel" class="fit-badge">FILL</span>
                <button class="ctrl-btn" id="aspectBtn"><i class="fas fa-expand-alt"></i></button>
                <button class="ctrl-btn" id="fullscreenBtn"><i class="fas fa-expand"></i></button>
            </div>
        </div>
    </div>
    <div class="player-footer"><span id="videoTitle" style="font-weight:700; color:#0ff;">Stream Player</span><button class="close-video" id="stopVideoBtn">CLOSE</button></div>
</div>

<div class="slider-area" id="heroSlider" style="display:none;"><div class="slider-track" id="sliderTrack"></div></div>
<div class="section-title" id="sectionLabel">🔥 LATEST RELEASES</div>
<div class="grid" id="mainGrid"><div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div></div>

<div class="bottom-nav">
    <div class="nav-btn" data-cat="All" onclick="filterContent('All', this)"><i class="fas fa-fire"></i><span>Home</span></div>
    <div class="nav-btn" data-cat="Live" onclick="filterContent('Live', this)"><i class="fas fa-broadcast-tower"></i><span>Live</span></div>
    <div class="nav-btn" data-cat="Movies" onclick="filterContent('Movies', this)"><i class="fas fa-film"></i><span>Movies</span></div>
    <div class="nav-btn" data-cat="Sports" onclick="filterContent('Sports', this)"><i class="fas fa-futbol"></i><span>Sports</span></div>
</div>
<div id="toastMsg" class="toast-msg"></div>
<div id="gestureIndicator" class="gesture-panel"><i id="gestIcon" class="fas fa-volume-up"></i><span id="gestValue">50%</span></div>

<script>
    // ==================== GLOBAL VARIABLES ====================
    let appData = [];
    let currentCategory = "All";
    let videoElem = document.getElementById('mainVideo');
    let hlsPlayer = null, mpegtsPlayer = null;
    let fitIndex = 2;
    const fitModes = ['contain', 'cover', 'fill'];
    let controlsTimer = null;
    
    const CSV_MAIN_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQJM1FvOsBuKL_Al7PpwYerGDVFhs5tLF4PaVs3_TOLX-TFLW-iF3B6qLLLeuuBmjfZFGe3CFxJA-TR/pub?output=csv';
    const DEFAULT_IMG = 'https://i.imgur.com/ZBQm7nM.png';
    
    // Toast helper
    function showMessage(msg) {
        let toast = document.getElementById('toastMsg');
        toast.innerText = msg;
        toast.style.opacity = '1';
        setTimeout(() => toast.style.opacity = '0', 2000);
    }
    
    // Fetch CSV Data
    async function loadData() {
        return new Promise((resolve) => {
            Papa.parse(CSV_MAIN_URL, { download: true, header: true, skipEmptyLines: true, complete: (results) => {
                appData = results.data.filter(row => (row.name || row.Name || row.URL || row.url)).map(r => ({
                    name: r.name || r.Name || 'Untitled',
                    url: r.URL || r.url || '#',
                    category: (r.Category || r.category || 'General').trim(),
                    thumb: r.Thumbnail || r.thumbnail || DEFAULT_IMG
                }));
                resolve(true);
            }, error: () => resolve(false) });
        });
    }
    
    // Render Grid (reverse order - newest first)
    function renderContent(category) {
        let filtered = appData.filter(i => i.category.toLowerCase() !== 'slider');
        if (category !== 'All') filtered = filtered.filter(i => i.category.toLowerCase() === category.toLowerCase());
        filtered = filtered.reverse(); // Newest on top
        const grid = document.getElementById('mainGrid');
        if (filtered.length === 0) {
            grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:70px;"><i class="fas fa-folder-open" style="font-size:48px; opacity:0.6;"></i><p style="margin-top:12px;">No content found</p></div>`;
            return;
        }
        grid.innerHTML = filtered.map(item => `
            <div class="card" data-url="${escapeHtml(item.url)}" data-name="${escapeHtml(item.name)}" onclick="playStream('${escapeHtml(item.url)}','${escapeHtml(item.name)}', this)">
                <img src="${item.thumb}" loading="lazy" onerror="this.src='${DEFAULT_IMG}'">
                <div class="card-title">${item.name}</div>
            </div>
        `).join('');
    }
    
    // Slider for banners
    function buildSlider() {
        let sliderItems = appData.filter(i => i.category.toLowerCase() === 'slider');
        let container = document.getElementById('heroSlider');
        let track = document.getElementById('sliderTrack');
        if (sliderItems.length && currentCategory === 'All') {
            container.style.display = 'block';
            track.innerHTML = sliderItems.map(s => `<div class="slide"><img src="${s.thumb}" loading="lazy"></div>`).join('');
            let idx = 0;
            setInterval(() => {
                if (container.style.display === 'block') {
                    idx = (idx + 1) % sliderItems.length;
                    track.style.transform = `translateX(-${idx * 100}%)`;
                }
            }, 4500);
        } else {
            container.style.display = 'none';
        }
    }
    
    // Filter global
    window.filterContent = function(cat, el) {
        currentCategory = cat;
        document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
        if (el) el.classList.add('active');
        renderContent(cat);
        buildSlider();
        closeNav();
        document.getElementById('sectionLabel').innerHTML = cat === 'All' ? '⚡ LATEST & TRENDING' : cat.toUpperCase();
    };
    
    // ========== PROFESSIONAL VIDEO PLAYER ENGINE ==========
    function destroyPlayers() {
        if (hlsPlayer) { hlsPlayer.destroy(); hlsPlayer = null; }
        if (mpegtsPlayer) { mpegtsPlayer.destroy(); mpegtsPlayer = null; }
        videoElem.pause();
        videoElem.removeAttribute('src');
        videoElem.load();
    }
    
    window.playStream = function(url, title, cardElement) {
        if (!url || url === '#') return showMessage("Invalid stream link");
        destroyPlayers();
        document.querySelectorAll('.card').forEach(c => c.classList.remove('playing-highlight'));
        if (cardElement) cardElement.classList.add('playing-highlight');
        document.getElementById('playerModule').style.display = 'block';
        document.getElementById('videoTitle').innerText = title;
        const ctrlDiv = document.getElementById('controlsOverlay');
        ctrlDiv.classList.add('visible');
        if (controlsTimer) clearTimeout(controlsTimer);
        controlsTimer = setTimeout(() => ctrlDiv.classList.remove('visible'), 4500);
        
        const isM3u8 = url.includes('.m3u8') || url.includes('m3u8?');
        const isTs = url.includes('.ts');
        if (isM3u8 && window.Hls && Hls.isSupported()) {
            hlsPlayer = new Hls({ enableWorker: true, lowLatencyMode: true });
            hlsPlayer.loadSource(url);
            hlsPlayer.attachMedia(videoElem);
            hlsPlayer.on(Hls.Events.MANIFEST_PARSED, () => videoElem.play().catch(e=>console.warn));
        } else if (isTs && window.mpegts) {
            mpegtsPlayer = mpegts.createPlayer({ type: 'mse', url, isLive: true, enableStashBuffer: false });
            mpegtsPlayer.attachMediaElement(videoElem);
            mpegtsPlayer.load();
            mpegtsPlayer.play().catch(e=>console.warn);
        } else {
            videoElem.src = url;
            videoElem.play().catch(e=>console.warn);
        }
        videoElem.onplaying = () => { if(controlsTimer) clearTimeout(controlsTimer); controlsTimer = setTimeout(() => ctrlDiv.classList.remove('visible'), 4500); };
        videoElem.onwaiting = () => ctrlDiv.classList.add('visible');
    };
    
    function closeVideo() {
        destroyPlayers();
        document.getElementById('playerModule').style.display = 'none';
        document.querySelectorAll('.card').forEach(c => c.classList.remove('playing-highlight'));
        if (currentCategory === 'All') document.getElementById('heroSlider').style.display = 'block';
    }
    
    // Player UI Controls
    document.getElementById('playPauseBtn').onclick = () => { if (videoElem.paused) videoElem.play(); else videoElem.pause(); };
    document.getElementById('muteBtn').onclick = () => { videoElem.muted = !videoElem.muted; };
    document.getElementById('aspectBtn').onclick = () => { fitIndex = (fitIndex+1)%3; videoElem.style.objectFit = fitModes[fitIndex]; document.getElementById('fitModeLabel').innerText = fitModes[fitIndex].toUpperCase(); };
    document.getElementById('fullscreenBtn').onclick = () => { let cont = document.getElementById('videoBox'); if (!document.fullscreenElement) cont.requestFullscreen(); else document.exitFullscreen(); };
    document.getElementById('closePlayerBtn').onclick = closeVideo;
    document.getElementById('stopVideoBtn').onclick = closeVideo;
    videoElem.onplay = () => document.getElementById('playPauseBtn').innerHTML = '<i class="fas fa-pause"></i>';
    videoElem.onpause = () => document.getElementById('playPauseBtn').innerHTML = '<i class="fas fa-play"></i>';
    videoElem.onvolumechange = () => document.getElementById('muteBtn').innerHTML = videoElem.muted ? '<i class="fas fa-volume-mute"></i>' : '<i class="fas fa-volume-up"></i>';
    
    // Gesture Volume/Brightness (only in fullscreen)
    let gestureActive = false, gestureStartYVal = 0, gestureSideType = null, gestureStartBase = 0;
    videoElem.addEventListener('touchstart', (e) => {
        if (document.fullscreenElement) {
            let t = e.touches[0];
            gestureStartYVal = t.clientY;
            gestureSideType = t.clientX < window.innerWidth/2 ? 'bright' : 'vol';
            gestureStartBase = gestureSideType === 'vol' ? videoElem.volume : 1.0;
            gestureActive = true;
        }
    });
    videoElem.addEventListener('touchmove', (e) => {
        if (!gestureActive || !document.fullscreenElement) return;
        let diff = gestureStartYVal - e.touches[0].clientY;
        if (Math.abs(diff) > 15) {
            e.preventDefault();
            let newVal = Math.min(1, Math.max(0, gestureStartBase + (diff / 180)));
            if (gestureSideType === 'vol') {
                videoElem.volume = newVal;
                videoElem.muted = (newVal === 0);
                document.getElementById('gestIcon').className = 'fas fa-volume-up';
                document.getElementById('gestValue').innerText = Math.round(newVal*100)+'%';
            } else {
                let bright = Math.min(2, Math.max(0.4, 1 + (diff/150)));
                videoElem.style.filter = `brightness(${bright})`;
                document.getElementById('gestIcon').className = 'fas fa-sun';
                let percent = Math.round(((bright-0.4)/1.6)*100);
                document.getElementById('gestValue').innerText = percent+'%';
            }
            let gp = document.getElementById('gestureIndicator');
            gp.style.opacity = '1';
            clearTimeout(window.gestTimer);
            window.gestTimer = setTimeout(() => gp.style.opacity = '0', 700);
        }
    });
    videoElem.addEventListener('touchend', () => { gestureActive = false; });
    
    // ========== SIDE MENU & LOCAL STREAM ==========
    function openNav() { document.getElementById('sideNav').classList.add('open'); document.getElementById('menuOverlay').style.display = 'block'; setTimeout(() => document.getElementById('menuOverlay').style.opacity = '1', 10); }
    function closeNav() { document.getElementById('sideNav').classList.remove('open'); let ov = document.getElementById('menuOverlay'); ov.style.opacity = '0'; setTimeout(() => ov.style.display = 'none', 350); }
    document.getElementById('localTrigger').addEventListener('click', () => { document.getElementById('localPanel').classList.toggle('show'); });
    document.getElementById('localPlayBtn').addEventListener('click', () => {
        let customUrl = document.getElementById('localUrlInput').value.trim();
        if (!customUrl) { showMessage("Please enter a valid stream URL"); return; }
        closeNav();
        playStream(customUrl, "📡 Custom Stream", null);
    });
    document.getElementById('shareSideBtn').onclick = (e) => { e.preventDefault(); if (navigator.share) navigator.share({ title: 'Nikamma 4k', url: window.location.href }); else showMessage("Share link copied"); };
    
    // Search feature
    window.searchContent = function() {
        let query = document.getElementById('searchInput').value.toLowerCase().trim();
        if (!query) { renderContent(currentCategory); return; }
        let results = appData.filter(i => i.name.toLowerCase().includes(query) && i.category !== 'slider').reverse();
        let gridDiv = document.getElementById('mainGrid');
        if (!results.length) { gridDiv.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:60px;">🔍 No results for "${query}"</div>`; return; }
        gridDiv.innerHTML = results.map(i => `<div class="card" onclick="playStream('${escapeHtml(i.url)}','${escapeHtml(i.name)}', this)"><img src="${i.thumb}" onerror="this.src='${DEFAULT_IMG}'"><div class="card-title">${i.name}</div></div>`).join('');
    };
    
    function escapeHtml(str) { return String(str).replace(/[&<>]/g, function(m){ if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }
    
    // Force refresh data
    window.forceRefreshData = async function() {
        showMessage("Refreshing data...");
        await loadData();
        renderContent(currentCategory);
        buildSlider();
        showMessage("Updated successfully!");
        closeNav();
    };
    
    // ========== PULL TO REFRESH (needs decent swipe down) ==========
    let ptrStartPos = 0, ptrDragging = false, ptrLoading = false;
    const ptrElem = document.getElementById('ptrContainer');
    window.addEventListener('touchstart', (e) => { if (window.scrollY === 0 && !ptrLoading) { ptrStartPos = e.touches[0].clientY; ptrDragging = true; } });
    window.addEventListener('touchmove', (e) => {
        if (ptrDragging && window.scrollY === 0 && !ptrLoading) {
            let diff = e.touches[0].clientY - ptrStartPos;
            if (diff > 25) {
                e.preventDefault();
                let translateY = Math.min(75, diff);
                ptrElem.style.transform = `translateY(${translateY - 75}px)`;
                document.getElementById('ptrText').innerText = diff > 50 ? "Release to refresh" : "Pull to refresh";
            }
        }
    });
    window.addEventListener('touchend', async () => {
        if (ptrDragging && !ptrLoading && window.scrollY === 0) {
            let transformVal = ptrElem.style.transform;
            let offset = parseInt(transformVal.split(',')[0].slice(0,-3)) || -75;
            if (offset > -35) {
                ptrLoading = true;
                document.getElementById('ptrArrow').style.display = 'none';
                document.getElementById('ptrSpinner').style.display = 'inline-block';
                document.getElementById('ptrText').innerText = 'Refreshing...';
                ptrElem.style.transform = 'translateY(0px)';
                await loadData();
                renderContent(currentCategory);
                buildSlider();
                showMessage("Content refreshed!");
                setTimeout(() => {
                    ptrElem.style.transform = 'translateY(-75px)';
                    document.getElementById('ptrArrow').style.display = 'inline-block';
                    document.getElementById('ptrSpinner').style.display = 'none';
                    ptrLoading = false;
                }, 700);
            } else {
                ptrElem.style.transform = 'translateY(-75px)';
            }
        }
        ptrDragging = false;
    });
    
    // ========== INIT APP ==========
    (async () => {
        await loadData();
        renderContent('All');
        buildSlider();
        setTimeout(() => { let splash = document.getElementById('splash'); splash.style.opacity = '0'; setTimeout(() => splash.style.display = 'none', 500); }, 1300);
    })();
</script>
</body>
</html>
