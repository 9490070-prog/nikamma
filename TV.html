<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#00bcd4">
    <title>Nikamma 4k | Reverse Order + Working PTR</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background: #0a0a0a;
            color: white;
            font-family: 'Poppins', sans-serif;
            padding-bottom: 70px;
        }
        
        /* PTR Container */
        .ptr-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 9999;
            height: 0;
            overflow: hidden;
            transition: height 0.25s ease-out;
            background: linear-gradient(135deg, #00bcd4, #0097a7);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .ptr-content {
            display: flex;
            align-items: center;
            gap: 12px;
            color: white;
            font-weight: 600;
            font-size: 14px;
        }
        .ptr-loader {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top: 3px solid white;
            border-right: 3px solid white;
            border-radius: 50%;
            animation: ptrSpin 0.6s linear infinite;
        }
        @keyframes ptrSpin {
            to { transform: rotate(360deg); }
        }
        
        /* Header */
        header {
            background: #121212;
            padding: 12px 16px;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid #222;
        }
        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .menu-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: #00bcd4;
            cursor: pointer;
        }
        .app-name {
            font-size: 18px;
            font-weight: 800;
            color: #00bcd4;
        }
        .search-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: white;
            cursor: pointer;
        }
        
        /* Search */
        #search-container {
            display: none;
            flex: 1;
            align-items: center;
            gap: 10px;
            margin: 0 10px;
        }
        #searchBar {
            flex: 1;
            background: #222;
            border: 1px solid #333;
            color: white;
            padding: 10px 16px;
            border-radius: 25px;
            outline: none;
            font-size: 14px;
        }
        .search-close {
            width: 40px;
            height: 40px;
            background: #222;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        
        /* Side Menu - 70% width */
        .sidenav {
            height: 100%;
            width: 70%;
            max-width: 300px;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 2005;
            background: #111;
            transform: translateX(-100%);
            transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            border-right: 1px solid #222;
        }
        .sidenav.open {
            transform: translateX(0);
        }
        .nav-header {
            height: 160px;
            background: linear-gradient(135deg, #00bcd4, #0097a7);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 20px;
        }
        .nav-header img {
            width: 70px;
            height: 70px;
            border-radius: 20px;
            border: 2px solid white;
            object-fit: cover;
        }
        .nav-header span {
            margin-top: 8px;
            font-weight: 600;
        }
        .sidenav a {
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            color: #bbb;
            text-decoration: none;
            border-bottom: 1px solid #1a1a1a;
            font-size: 14px;
            transition: 0.2s;
        }
        .sidenav a:active {
            background: #1a1a1a;
            color: #00bcd4;
        }
        .sidenav a i {
            width: 24px;
        }
        
        #menu-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 2004;
            opacity: 0;
            transition: opacity 0.3s;
        }
        #menu-overlay.visible {
            display: block;
            opacity: 1;
        }
        
        /* Slider */
        .slider {
            width: 100%;
            height: 200px;
            overflow: hidden;
            background: #000;
        }
        .slides-track {
            display: flex;
            transition: 0.5s ease;
            height: 100%;
        }
        .slide-item {
            min-width: 100%;
            height: 100%;
        }
        .slide-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        /* Section */
        .section-label {
            padding: 15px 15px 5px 15px;
            font-size: 12px;
            font-weight: 600;
            color: #00bcd4;
            text-transform: uppercase;
        }
        
        /* Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding: 10px 15px;
        }
        .card {
            background: #1a1a1a;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #2a2a2a;
            cursor: pointer;
            transition: 0.2s;
        }
        .card:active {
            transform: scale(0.96);
            border-color: #00bcd4;
        }
        .card img {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
        }
        .card-title {
            padding: 8px 5px;
            font-size: 11px;
            text-align: center;
            color: #ccc;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card.playing {
            border-color: #00bcd4;
            background: #00bcd4;
        }
        .card.playing .card-title {
            color: #000;
            font-weight: 700;
        }
        
        /* Video Player */
        #videoBox {
            display: none;
            position: sticky;
            top: 64px;
            z-index: 1001;
            background: #000;
        }
        .player-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
        }
        .player-container video {
            width: 100%;
            height: 100%;
        }
        .fit-contain { object-fit: contain; }
        .fit-cover { object-fit: cover; }
        .fit-fill { object-fit: fill; }
        
        .player-loader {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        .loader-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.2);
            border-top-color: #00bcd4;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .player-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent 40%);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 12px;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
        }
        .player-overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
        }
        .live-badge {
            background: #ff3b30;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: bold;
        }
        .control-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0,0,0,0.7);
            padding: 8px 16px;
            border-radius: 40px;
            width: fit-content;
        }
        .ctrl-btn {
            background: none;
            border: none;
            color: white;
            padding: 6px;
            cursor: pointer;
        }
        .fit-badge {
            background: #333;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 10px;
        }
        .video-info-bar {
            padding: 10px 15px;
            background: #121212;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #videoTitle {
            font-size: 13px;
            font-weight: 600;
            color: #00bcd4;
        }
        .close-video {
            background: #f44336;
            border: none;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 11px;
            cursor: pointer;
        }
        
        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: #111;
            display: flex;
            justify-content: space-around;
            padding: 8px 0 15px;
            border-top: 1px solid #222;
            z-index: 1000;
        }
        .nav-item {
            text-align: center;
            font-size: 10px;
            color: #888;
            flex: 1;
            cursor: pointer;
        }
        .nav-item i {
            font-size: 20px;
            display: block;
            margin-bottom: 3px;
        }
        .nav-item.active {
            color: #00bcd4;
        }
        
        /* Badges */
        .data-badge, .update-badge {
            position: fixed;
            bottom: 75px;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 600;
            z-index: 999;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .data-badge { right: 10px; background: #00bcd4; }
        .update-badge { left: 10px; background: #4caf50; }
        .data-badge.show, .update-badge.show { opacity: 1; }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
            grid-column: 1/-1;
        }
        
        .skeleton {
            background: linear-gradient(90deg, #1a1a1a 25%, #2a2a2a 50%, #1a1a1a 75%);
            background-size: 200% 100%;
            animation: skeletonLoad 1.5s infinite;
            border-radius: 12px;
            aspect-ratio: 1/1;
        }
        @keyframes skeletonLoad {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        
        .internet-checker {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0a;
            z-index: 30000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .internet-checker button {
            margin-top: 30px;
            background: #00bcd4;
            color: white;
            padding: 10px 25px;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
        }
        
        .gesture-indicator {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            border-radius: 40px;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 10001;
            opacity: 0;
            transition: opacity 0.1s;
            pointer-events: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div id="internetChecker" class="internet-checker">
    <i class="fas fa-wifi" style="font-size: 50px; color: #00bcd4;"></i>
    <h2>انٹرنیٹ کنیکٹ نہیں</h2>
    <button onclick="location.reload()">دوبارہ چیک کریں</button>
</div>

<div id="splash-screen" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#0a0a0a;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;">
    <div style="width:100px;height:100px;background:#00bcd4;border-radius:25px;display:flex;align-items:center;justify-content:center;font-size:45px;font-weight:800;margin-bottom:20px;">N4K</div>
    <h2 style="color:#00bcd4;">Nikamma 4k</h2>
    <div style="margin-top:20px;"><i class="fas fa-circle-notch fa-spin"></i> Loading...</div>
</div>

<div id="ptrContainer" class="ptr-container">
    <div class="ptr-content">
        <div id="ptrIcon"><i class="fas fa-arrow-down"></i></div>
        <span id="ptrText">Pull to refresh</span>
    </div>
</div>

<div id="menuOverlay" onclick="closeNav()"></div>

<div id="sideNav" class="sidenav">
    <div class="nav-header">
        <img id="navLogo" src="">
        <span>Nikamma 4k</span>
    </div>
    <a href="#" onclick="filterData('All', null, true)"><i class="fas fa-home"></i> Home</a>
    <a href="#" onclick="filterData('Sports', null, true)"><i class="fas fa-futbol"></i> Sports</a>
    <a href="#" onclick="filterData('Movies', null, true)"><i class="fas fa-film"></i> Movies</a>
    <a href="#" onclick="filterData('TV Shows', null, true)"><i class="fas fa-tv"></i> TV Shows</a>
    <a href="#" onclick="shareApp()"><i class="fas fa-share-alt"></i> Share App</a>
    <a href="#" onclick="forceRefresh()"><i class="fas fa-sync-alt"></i> Refresh</a>
</div>

<header>
    <div class="header-content">
        <div class="menu-btn" onclick="openNav()"><i class="fas fa-bars"></i></div>
        <div class="app-name">Nikamma 4k</div>
        <div class="search-btn" onclick="toggleSearch(true)"><i class="fas fa-search"></i></div>
    </div>
    <div id="searchContainer" style="display:none; margin-top:10px;">
        <input type="text" id="searchBar" placeholder="Search..." onkeyup="searchItems()">
        <div class="search-close" onclick="toggleSearch(false)"><i class="fas fa-times"></i></div>
    </div>
</header>

<div id="videoBox">
    <div class="player-container" id="playerContainer">
        <div class="player-loader" id="playerLoader"><div class="loader-spinner"></div></div>
        <video id="advVideo" class="fit-fill" muted autoplay playsinline></video>
        <div class="player-overlay" id="playerOverlay">
            <div class="top-bar">
                <button class="ctrl-btn" id="closePlayer"><i class="material-icons-round">close</i></button>
                <div class="live-badge">LIVE</div>
            </div>
            <div class="control-bar">
                <button class="ctrl-btn" id="playPause"><i class="material-icons-round">pause</i></button>
                <button class="ctrl-btn" id="muteBtn"><i class="material-icons-round">volume_off</i></button>
                <div style="flex:1"></div>
                <span id="fitText" class="fit-badge">FILL</span>
                <button class="ctrl-btn" id="fitToggle"><i class="material-icons-round">aspect_ratio</i></button>
                <button class="ctrl-btn" id="fullscreenToggle"><i class="material-icons-round">fullscreen</i></button>
            </div>
        </div>
    </div>
    <div class="video-info-bar">
        <span id="videoTitle"></span>
        <button class="close-video" onclick="stopVideo()">CLOSE</button>
    </div>
</div>

<div class="slider" id="mainSlider" style="display:none;"><div class="slides-track" id="sliderTrack"></div></div>
<div class="section-label" id="sectionName">⬇️ LATEST FIRST ⬇️</div>
<div class="grid" id="mainGrid"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>

<div class="bottom-nav">
    <div class="nav-item active" data-cat="All" onclick="filterData('All', this)"><i class="fas fa-home"></i>HOME</div>
    <div class="nav-item" data-cat="Sports" onclick="filterData('Sports', this)"><i class="fas fa-trophy"></i>SPORTS</div>
    <div class="nav-item" data-cat="Movies" onclick="filterData('Movies', this)"><i class="fas fa-film"></i>MOVIES</div>
    <div class="nav-item" data-cat="TV Shows" onclick="filterData('TV Shows', this)"><i class="fas fa-tv"></i>SHOWS</div>
</div>

<div id="dataBadge" class="data-badge"><i class="fas fa-database"></i> Using cached data</div>
<div id="updateBadge" class="update-badge"><i class="fas fa-check-circle"></i> Up to date</div>
<div id="gestureIndicator" class="gesture-indicator"><i id="gestureIcon"></i><span id="gestureVal">50%</span></div>

<script>
    const STORAGE_KEY = 'nikamma_reverse_data';
    const DEFAULT_IMG = 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTf7ax2YDbvMh3IxQPzSyY1YIewn8Q_1bDgR04kRJT5-A&s=10';
    let allData = [], settings = {}, currentCat = 'All';
    let isRefreshing = false;
    
    // ========== REVERSE ORDER (NEWEST ITEM FIRST) ==========
    function getSliderItems() {
        let sliders = allData.filter(d => (d.Category || d.category || "").toLowerCase() === 'slider');
        return [...sliders].reverse();
    }
    function getCategoryItems(cat) {
        let filtered = (cat === 'All') ? 
            allData.filter(d => (d.Category || d.category || "").toLowerCase() !== 'slider') : 
            allData.filter(d => (d.Category || d.category || "").trim().toLowerCase() === cat.toLowerCase());
        return [...filtered].reverse();
    }
    
    // ========== PLAYER ==========
    let hlsPlayer = null;
    const video = document.getElementById('advVideo');
    const playerLoader = document.getElementById('playerLoader');
    const playerOverlay = document.getElementById('playerOverlay');
    let overlayTimer = null;
    
    function showOverlay() {
        if(!playerOverlay.classList.contains('visible')) {
            playerOverlay.classList.add('visible');
            clearTimeout(overlayTimer);
            if(!video.paused) overlayTimer = setTimeout(() => playerOverlay.classList.remove('visible'), 4000);
        }
    }
    
    function destroyPlayer() {
        if(hlsPlayer) { try { hlsPlayer.destroy(); } catch(e){} hlsPlayer = null; }
        video.pause();
        video.removeAttribute('src');
        video.load();
    }
    
    function loadVideo(url, autoPlay) {
        destroyPlayer();
        playerLoader.style.display = 'flex';
        video.muted = true;
        if(url.includes('.m3u8') && Hls.isSupported()) {
            hlsPlayer = new Hls();
            hlsPlayer.loadSource(url);
            hlsPlayer.attachMedia(video);
            hlsPlayer.on(Hls.Events.MANIFEST_PARSED, () => { if(autoPlay) video.play(); });
        } else {
            video.src = url;
            if(autoPlay) video.play();
        }
        video.onplaying = () => { playerLoader.style.display = 'none'; showOverlay(); };
        video.onwaiting = () => { playerLoader.style.display = 'flex'; };
    }
    
    window.play = function(url, title, card) {
        document.querySelectorAll('.card').forEach(c => c.classList.remove('playing'));
        if(card) card.classList.add('playing');
        document.getElementById('videoBox').style.display = 'block';
        document.getElementById('mainSlider').style.display = 'none';
        document.getElementById('videoTitle').innerText = title;
        loadVideo(url, true);
    };
    
    window.stopVideo = function() {
        destroyPlayer();
        document.getElementById('videoBox').style.display = 'none';
        document.querySelectorAll('.card').forEach(c => c.classList.remove('playing'));
        if(getSliderItems().length && currentCat === 'All') document.getElementById('mainSlider').style.display = 'block';
    };
    
    // Player controls
    document.getElementById('closePlayer').onclick = () => stopVideo();
    document.getElementById('playPause').onclick = () => { if(video.paused) video.play(); else video.pause(); };
    document.getElementById('muteBtn').onclick = () => { video.muted = !video.muted; };
    let fitIndex = 2;
    const fitModes = ['contain', 'cover', 'fill'];
    document.getElementById('fitToggle').onclick = () => {
        fitIndex = (fitIndex + 1) % 3;
        video.classList.remove('fit-contain', 'fit-cover', 'fit-fill');
        video.classList.add('fit-' + fitModes[fitIndex]);
        document.getElementById('fitText').innerText = fitModes[fitIndex].toUpperCase();
    };
    document.getElementById('fullscreenToggle').onclick = () => {
        const c = document.getElementById('playerContainer');
        if(!document.fullscreenElement) c.requestFullscreen?.();
        else document.exitFullscreen?.();
    };
    video.onplay = () => document.getElementById('playPause').innerHTML = '<i class="material-icons-round">pause</i>';
    video.onpause = () => document.getElementById('playPause').innerHTML = '<i class="material-icons-round">play_arrow</i>';
    document.getElementById('playerContainer').addEventListener('click', (e) => {
        if(!e.target.closest('.ctrl-btn')) showOverlay();
    });
    
    // Gesture controls for fullscreen
    let isFullscreen = false;
    let currentBrightness = 1;
    let gestureActive = false, gestureStartY = 0, gestureSide = null, gestureStartVal = 0;
    document.addEventListener('fullscreenchange', () => {
        isFullscreen = !!document.fullscreenElement;
    });
    
    document.getElementById('playerContainer').addEventListener('touchstart', (e) => {
        if(!isFullscreen) return;
        if(e.target.closest('.ctrl-btn')) return;
        gestureStartY = e.touches[0].clientY;
        gestureSide = e.touches[0].clientX < window.innerWidth/2 ? 'left' : 'right';
        gestureStartVal = gestureSide === 'right' ? video.volume : currentBrightness;
        gestureActive = true;
    });
    
    document.getElementById('playerContainer').addEventListener('touchmove', (e) => {
        if(!gestureActive || !isFullscreen) return;
        let diff = gestureStartY - e.touches[0].clientY;
        let newVal = gestureStartVal + (diff / 200);
        if(gestureSide === 'right') {
            newVal = Math.min(1, Math.max(0, newVal));
            video.volume = newVal;
            if(newVal === 0) video.muted = true;
            else if(video.muted) video.muted = false;
            document.getElementById('gestureIcon').className = 'fas fa-volume-up';
            document.getElementById('gestureVal').innerText = Math.round(newVal * 100) + '%';
        } else {
            newVal = Math.min(1.8, Math.max(0.2, newVal));
            currentBrightness = newVal;
            video.style.filter = `brightness(${currentBrightness})`;
            document.getElementById('gestureIcon').className = 'fas fa-sun';
            document.getElementById('gestureVal').innerText = Math.round(((newVal - 0.2) / 1.6) * 100) + '%';
        }
        const indicator = document.getElementById('gestureIndicator');
        indicator.style.opacity = '1';
        clearTimeout(window.gestureTimeout);
        window.gestureTimeout = setTimeout(() => indicator.style.opacity = '0', 500);
        e.preventDefault();
    });
    
    document.getElementById('playerContainer').addEventListener('touchend', () => {
        gestureActive = false;
    });
    
    // ========== UI UPDATE ==========
    function updateSliderUI() {
        const items = getSliderItems();
        const track = document.getElementById('sliderTrack');
        if(items.length && track) {
            track.innerHTML = items.map(s => `<div class="slide-item"><img src="${s.Thumbnail || s.thumbnail || s.URL || s.url || DEFAULT_IMG}" loading="lazy"></div>`).join('');
            document.getElementById('mainSlider').style.display = (currentCat === 'All' && document.getElementById('videoBox').style.display !== 'block') ? 'block' : 'none';
            startSlider();
        } else {
            document.getElementById('mainSlider').style.display = 'none';
        }
    }
    
    window.filterData = function(cat, btn, closeNavFlag = true) {
        currentCat = cat;
        if(closeNavFlag) closeNav();
        const items = getCategoryItems(cat);
        const grid = document.getElementById('mainGrid');
        document.querySelectorAll('.nav-item').forEach(b => {
            if(b.getAttribute('data-cat') === cat) b.classList.add('active');
            else b.classList.remove('active');
        });
        document.getElementById('sectionName').innerHTML = cat === 'All' ? '⬇️ LATEST FIRST ⬇️' : cat + ' (NEW FIRST)';
        
        if(!items.length) {
            grid.innerHTML = `<div class="empty-state"><i class="fas fa-folder-open"></i><h3>No content</h3><p>Pull to refresh</p></div>`;
            return;
        }
        grid.innerHTML = items.map(item => {
            let thumb = item.Thumbnail || item.thumbnail || DEFAULT_IMG;
            let name = item.name || item.Name || 'Untitled';
            let url = item.URL || item.url || '#';
            return `<div class="card" onclick="play('${escapeHtml(url)}', '${escapeHtml(name)}', this)"><img src="${thumb}" loading="lazy"><div class="card-title">${escapeHtml(name)}</div></div>`;
        }).join('');
        updateSliderUI();
    };
    
    function escapeHtml(str) {
        if(!str) return '';
        return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
    }
    
    // ========== DATA ==========
    function saveCache() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ allData, settings, ts: Date.now() })); } catch(e) {}
    }
    function loadCache() {
        try {
            let c = localStorage.getItem(STORAGE_KEY);
            if(c) {
                let d = JSON.parse(c);
                if(d.allData && d.allData.length) {
                    allData = d.allData;
                    settings = d.settings || {};
                    return true;
                }
            }
        } catch(e) {}
        return false;
    }
    
    async function fetchRemoteData() {
        return new Promise((resolve) => {
            Papa.parse('https://docs.google.com/spreadsheets/d/e/2PACX-1vQJM1FvOsBuKL_Al7PpwYerGDVFhs5tLF4PaVs3_TOLX-TFLW-iF3B6qLLLeuuBmjfZFGe3CFxJA-TR/pub?output=csv', {
                download: true, header: true, complete: function(r) {
                    let newData = r.data.filter(i => i && (i.name || i.Name || i.URL || i.url));
                    Papa.parse('https://docs.google.com/spreadsheets/d/e/2PACX-1vQD2lHL-u6zHPZKdYIVD4eXp98XipkVP4jKfxLDoNje9DeZ1726o0zFZf-gAR2kZj0ls7VhceXbbKih/pub?gid=1123743396&single=true&output=csv', {
                        download: true, header: true, complete: function(s) {
                            if(newData.length) {
                                allData = newData;
                                settings = s.data[0] || {};
                                saveCache();
                                updateSliderUI();
                                filterData(currentCat, null, false);
                                resolve(true);
                            } else resolve(false);
                        }
                    });
                }, error: () => resolve(false)
            });
        });
    }
    
    // ========== PULL TO REFRESH ==========
    function updatePTR(status, dist = 0) {
        const c = document.getElementById('ptrContainer');
        const t = document.getElementById('ptrText');
        const ic = document.getElementById('ptrIcon');
        if(status === 'pull') {
            let h = Math.min(dist, 70);
            c.style.height = h + 'px';
            if(dist > 55) {
                t.innerText = 'Release to refresh';
                ic.innerHTML = '<i class="fas fa-sync-alt"></i>';
            } else {
                t.innerText = 'Pull to refresh';
                ic.innerHTML = '<i class="fas fa-arrow-down"></i>';
            }
        } else if(status === 'release') {
            c.style.height = '70px';
            t.innerText = 'Refreshing...';
            ic.innerHTML = '<div class="ptr-loader"></div>';
        } else if(status === 'complete') {
            c.style.height = '0px';
            setTimeout(() => {
                t.innerText = 'Pull to refresh';
                ic.innerHTML = '<i class="fas fa-arrow-down"></i>';
            }, 300);
        }
    }
    
    window.forceRefresh = async function() {
        if(isRefreshing) return;
        isRefreshing = true;
        updatePTR('release');
        let updated = await fetchRemoteData();
        updatePTR('complete');
        let badge = document.getElementById(updated ? 'dataBadge' : 'updateBadge');
        badge.classList.add('show');
        setTimeout(() => badge.classList.remove('show'), 2000);
        isRefreshing = false;
        closeNav();
    };
    
    let ptrStart = 0, ptrActiveFlag = false, isTouching = false;
    document.addEventListener('touchstart', (e) => {
        if(window.scrollY === 0 && !isRefreshing) {
            ptrStart = e.touches[0].pageY;
            isTouching = true;
            ptrActiveFlag = false;
        }
    });
    document.addEventListener('touchmove', (e) => {
        if(!isTouching || isRefreshing) return;
        let diff = e.touches[0].pageY - ptrStart;
        if(window.scrollY === 0 && diff > 5) {
            e.preventDefault();
            ptrActiveFlag = true;
            updatePTR('pull', diff);
        }
    });
    document.addEventListener('touchend', () => {
        if(ptrActiveFlag && !isRefreshing) {
            let h = document.getElementById('ptrContainer').style.height;
            if(parseInt(h) >= 60) forceRefresh();
            else updatePTR('complete');
        }
        isTouching = false;
        ptrActiveFlag = false;
    });
    
    // ========== SIDE MENU SWIPE (left edge swipe - 80% screen) ==========
    let swipeStartX = 0, swipeActive = false;
    document.addEventListener('touchstart', (e) => {
        if(e.touches[0].clientX < 50 && !document.getElementById('sideNav').classList.contains('open')) {
            swipeStartX = e.touches[0].clientX;
            swipeActive = true;
        }
    });
    document.addEventListener('touchmove', (e) => {
        if(swipeActive) {
            let diffX = e.touches[0].clientX - swipeStartX;
            if(diffX > 25) {
                e.preventDefault();
                openNav();
                swipeActive = false;
            }
        }
    });
    document.addEventListener('touchend', () => { swipeActive = false; });
    
    // ========== SEARCH ==========
    window.searchItems = function() {
        let term = document.getElementById('searchBar').value.toLowerCase();
        if(!term) { filterData(currentCat, null, false); return; }
        let filtered = allData.filter(d => (d.name || d.Name || "").toLowerCase().includes(term) && (d.Category || d.category || "").toLowerCase() !== 'slider').reverse();
        let grid = document.getElementById('mainGrid');
        if(!filtered.length) {
            grid.innerHTML = `<div class="empty-state"><i class="fas fa-search"></i><h3>No results</h3></div>`;
            return;
        }
        grid.innerHTML = filtered.map(item => `<div class="card" onclick="play('${escapeHtml(item.URL || item.url)}','${escapeHtml(item.name || item.Name)}',this)"><img src="${item.Thumbnail || item.thumbnail || DEFAULT_IMG}"><div class="card-title">${escapeHtml(item.name || item.Name)}</div></div>`).join('');
    };
    
    function toggleSearch(show) {
        let container = document.getElementById('searchContainer');
        if(show) {
            container.style.display = 'flex';
            document.getElementById('searchBar').focus();
        } else {
            container.style.display = 'none';
            filterData(currentCat, null, false);
        }
    }
    
    function openNav() {
        document.getElementById('sideNav').classList.add('open');
        document.getElementById('menuOverlay').style.display = 'block';
        setTimeout(() => document.getElementById('menuOverlay').classList.add('visible'), 10);
    }
    function closeNav() {
        document.getElementById('sideNav').classList.remove('open');
        document.getElementById('menuOverlay').classList.remove('visible');
        setTimeout(() => document.getElementById('menuOverlay').style.display = 'none', 400);
    }
    function shareApp() {
        if(navigator.share) navigator.share({title: 'Nikamma 4k', url: location.href});
        else alert('Share: ' + location.href);
    }
    
    let slideIndex = 0, slideInterval;
    function startSlider() {
        if(slideInterval) clearInterval(slideInterval);
        slideInterval = setInterval(() => {
            let track = document.getElementById('sliderTrack');
            if(track && track.children.length) {
                slideIndex = (slideIndex + 1) % track.children.length;
                track.style.transform = `translateX(-${slideIndex * 100}%)`;
            }
        }, 4000);
    }
    
    async function init() {
        if(!navigator.onLine) {
            document.getElementById('internetChecker').style.display = 'flex';
            return;
        }
        document.getElementById('internetChecker').style.display = 'none';
        document.getElementById('navLogo').src = DEFAULT_IMG;
        
        let hasCache = loadCache();
        if(!hasCache) {
            await fetchRemoteData();
            document.getElementById('splash-screen').style.display = 'none';
        } else {
            document.getElementById('splash-screen').style.display = 'none';
            filterData('All', null, false);
            fetchRemoteData().then(updated => {
                if(updated) console.log('Updated');
            });
        }
        startSlider();
    }
    
    init();
</script>
</body>
</html>
