<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Ultimate Image Panel</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { 
            background-color: #f0f2f5; 
            padding: 15px; 
            transition: background-color 0.3s ease; 
        }
        
        #listContainer { 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
        }
        
        /* 🟢 Card Default Settings */
        .card {
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08); 
            border: 1px solid #e2e8f0; 
            cursor: pointer;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        
        .card:active {
            transform: scale(0.98);
        }
        
        .card img {
            width: 100%;
            height: auto; 
            max-height: 350px; 
            object-fit: cover; /* Looks better for most images */
            display: block;
            border-bottom: 1px solid #f1f5f9;
        }
        
        /* 🟢 Default Padding */
        .card-content { 
            padding: 16px; 
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .card h3 { 
            font-size: 18px; 
            color: #1e293b;
            font-weight: 700;
            word-wrap: break-word;
        }
        
        .card p { 
            font-size: 14px; 
            line-height: 1.5; 
            color: #475569;
            word-wrap: break-word;
        }

        /* 🟢 Fullscreen Modal */
        #fullscreenModal {
            display: none; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); 
            z-index: 9999; 
            justify-content: center;
            align-items: center; 
            flex-direction: column;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        #fullscreenModal.show {
            display: flex;
            opacity: 1;
        }
        
        #fullscreenModal img { 
            max-width: 95%; 
            max-height: 95%; 
            object-fit: contain; 
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        } 
        
        .close-btn {
            position: absolute; 
            top: 20px; 
            right: 25px; 
            color: white; 
            font-size: 40px;
            font-weight: bold; 
            cursor: pointer; 
            background: rgba(0,0,0,0.5); 
            border: none; 
            z-index: 10000;
            width: 50px;
            height: 50px;
            border-radius: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            line-height: 0;
        }
    </style>
</head>
<body>

    <div id="listContainer"></div>

    <div id="fullscreenModal" onclick="closeModal()">
        <span class="close-btn" onclick="closeModal()">×</span>
        <img id="modalImage" src="" alt="Full Screen" style="display:none;">
        <iframe id="modalIframe" src="" style="display:none; width: 95%; height: 95%; border: none; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); background: white;"></iframe>
    </div>

    <script>
        let loadCheckTimeout = null;

        function sendLoadedMessage() {
            if (window.AppInventor) {
                // Kodular event block ko trigger karega jab sab kuch load ho jaye
                window.AppInventor.setWebViewString("SuccessfullyLoaded");
            } else {
                console.log("SuccessfullyLoaded");
            }
        }

        function checkImagesAndNotify() {
            const elements = Array.from(document.querySelectorAll('.card img, .card iframe.card-iframe'));
            let pendingElements = elements.filter(el => {
                if (el.tagName.toLowerCase() === 'img') return !el.complete;
                if (el.tagName.toLowerCase() === 'iframe') return el.dataset.loaded !== "true";
                return false;
            });
            
            if (pendingElements.length === 0) {
                sendLoadedMessage();
                return;
            }

            let loadedCount = 0;
            const totalPending = pendingElements.length;
            
            function onElementLoad() {
                loadedCount++;
                if (loadedCount === totalPending) {
                    sendLoadedMessage();
                }
            }

            pendingElements.forEach(el => {
                el.addEventListener('load', () => {
                    el.dataset.loaded = "true";
                    onElementLoad();
                });
                el.addEventListener('error', () => {
                    el.dataset.loaded = "true";
                    onElementLoad();
                }); // Error ko bhi handle karein taake atkay nahi
            });
        }

        function setPageBackground(bgColor) {
            if (bgColor && String(bgColor).trim() !== "") {
                document.body.style.backgroundColor = bgColor;
            }
        }

        // Google Drive link fixer
        function fixGoogleDriveUrl(url) {
            if (!url) return url;
            if (url.includes("drive.google.com") || url.includes("drive.usercontent.google.com")) {
                let idMatch = url.match(/[?&]id=([a-zA-Z0-9_-]+)/) || url.match(/\/d\/([a-zA-Z0-9_-]+)/);
                if (idMatch && idMatch[1]) {
                    // Use thumbnail endpoint to completely bypass Google Drive virus scan warnings for images
                    return "https://drive.google.com/thumbnail?id=" + idMatch[1];
                }
            }
            return url;
        }

        let itemCount = 0; 
        const loadedUrls = new Set(); // To prevent duplicate loads and make app faster

        // 12 parameters to match your Kodular blocks perfectly!
        function addToList(title, description, imageUrl, titleColor, titleSize, descColor, descSize, cardColor, elevation, cornerRadius, contentPadding, extraMargin) {
            
            // Advance cache/duplicate prevention: If URL already exists, don't load it again
            if (imageUrl && String(imageUrl).trim() !== "") {
                let checkUrl = fixGoogleDriveUrl(imageUrl);
                if (loadedUrls.has(checkUrl)) {
                    console.log("URL already loaded, skipping to save time: " + checkUrl);
                    return; 
                }
                loadedUrls.add(checkUrl);
            }
            
            itemCount++; 
            const currentIndex = itemCount; 

            const listDiv = document.getElementById('listContainer');
            const card = document.createElement('div');
            card.className = 'card';
            
            // Apply Card Color
            if (cardColor && String(cardColor).trim() !== "") {
                card.style.backgroundColor = cardColor;
            }
            
            // Apply Elevation (Shadow)
            if (elevation && String(elevation).trim() !== "") {
                let e = parseFloat(elevation);
                if (!isNaN(e)) {
                    card.style.boxShadow = `0 ${e}px ${e*2.5}px rgba(0,0,0,0.12)`;
                }
            }
            
            // Apply Corner Radius
            if (cornerRadius && String(cornerRadius).trim() !== "") {
                card.style.borderRadius = isNaN(cornerRadius) ? cornerRadius : cornerRadius + "px";
            }

            // Apply Extra Margin if provided (the 12th argument)
            if (extraMargin && String(extraMargin).trim() !== "") {
                card.style.marginBottom = isNaN(extraMargin) ? extraMargin : extraMargin + "px";
            }
            
            // 🟢 Handle Image or Webpage
            if (imageUrl && String(imageUrl).trim() !== "" && String(imageUrl).trim().toLowerCase().startsWith("http")) {
                imageUrl = fixGoogleDriveUrl(imageUrl);
                
                const mediaContainer = document.createElement('div');
                mediaContainer.style.position = 'relative';
                mediaContainer.style.width = '100%';
                
                let mediaElement;
                if (imageUrl.includes('.html') || imageUrl.includes('action=view_page')) {
                    mediaElement = document.createElement('iframe');
                    mediaElement.src = imageUrl;
                    mediaElement.className = 'card-iframe';
                    mediaElement.dataset.loaded = "false";
                    mediaElement.style.width = '100%';
                    mediaElement.style.height = '350px';
                    mediaElement.style.border = 'none';
                    mediaElement.style.display = 'block';
                    mediaElement.style.borderBottom = '1px solid #f1f5f9';
                    mediaElement.onload = function() { this.dataset.loaded = "true"; };
                    mediaElement.onerror = function() { this.dataset.loaded = "true"; };
                } else {
                    mediaElement = document.createElement('img');
                    mediaElement.src = imageUrl;
                    mediaElement.alt = "Image";
                }
                
                mediaContainer.appendChild(mediaElement);
                
                const overlay = document.createElement('div');
                overlay.style.position = 'absolute';
                overlay.style.top = '0';
                overlay.style.left = '0';
                overlay.style.width = '100%';
                overlay.style.height = '100%';
                overlay.style.zIndex = '10';
                overlay.style.cursor = 'pointer';
                
                // 🟢 Single vs Double Click Logic
                let clickTimer = null;
                overlay.onclick = function(e) {
                    e.stopPropagation(); // Card click event ko roko
                    
                    if (clickTimer === null) {
                        clickTimer = setTimeout(function() {
                            clickTimer = null;
                            // Single Click -> Return index to Kodular
                            if (window.AppInventor) {
                                window.AppInventor.setWebViewString(currentIndex.toString());
                            } else {
                                console.log("Card Clicked! Index: " + currentIndex);
                            }
                        }, 300); 
                    } else {
                        // Double Click -> Open Fullscreen
                        clearTimeout(clickTimer); 
                        clickTimer = null;
                        openFullscreen(imageUrl); 
                    }
                };
                
                mediaContainer.appendChild(overlay);
                card.appendChild(mediaContainer);
            }

            // 🟢 Handle Text Content
            if ((title && String(title).trim() !== "") || (description && String(description).trim() !== "")) {
                const contentDiv = document.createElement('div');
                contentDiv.className = 'card-content';
                
                if (contentPadding && String(contentPadding).trim() !== "") {
                    contentDiv.style.padding = isNaN(contentPadding) ? contentPadding : contentPadding + "px";
                }
                
                if (title && String(title).trim() !== "") {
                    const h3 = document.createElement('h3');
                    h3.innerText = title;
                    if (titleColor && String(titleColor).trim() !== "") h3.style.color = titleColor;
                    if (titleSize && String(titleSize).trim() !== "") h3.style.fontSize = isNaN(titleSize) ? titleSize : titleSize + "px";
                    contentDiv.appendChild(h3);
                }
                
                if (description && String(description).trim() !== "") {
                    const p = document.createElement('p');
                    p.innerText = description;
                    if (descColor && String(descColor).trim() !== "") p.style.color = descColor;
                    if (descSize && String(descSize).trim() !== "") p.style.fontSize = isNaN(descSize) ? descSize : descSize + "px";
                    contentDiv.appendChild(p);
                }
                
                card.appendChild(contentDiv);
            }
            
            // 🟢 Card Click Event (For areas other than image)
            card.onclick = function() {
                if (window.AppInventor) {
                    window.AppInventor.setWebViewString(currentIndex.toString());
                } else {
                    console.log("Card Clicked! Index: " + currentIndex);
                }
            };
            
            if (card.hasChildNodes()) {
                listDiv.appendChild(card);
            }
            
            // 🟢 Wait for Kodular loop to finish, then check images
            if (loadCheckTimeout) clearTimeout(loadCheckTimeout);
            loadCheckTimeout = setTimeout(checkImagesAndNotify, 300);
        }

        // Handle Fullscreen UI
        function openFullscreen(url) {
            const modal = document.getElementById('fullscreenModal');
            const img = document.getElementById('modalImage');
            const iframe = document.getElementById('modalIframe');
            
            if (url.includes('.html') || url.includes('action=view_page')) {
                img.style.display = 'none';
                img.src = '';
                iframe.style.display = 'block';
                iframe.src = url;
            } else {
                iframe.style.display = 'none';
                iframe.src = '';
                img.style.display = 'block';
                img.src = url;
            }
            modal.classList.add('show');
        }

        function closeModal() {
            const modal = document.getElementById('fullscreenModal');
            modal.classList.remove('show');
            setTimeout(() => {
                document.getElementById('modalImage').src = '';
                document.getElementById('modalIframe').src = '';
            }, 300); // Wait for transition
        }
    </script>
</body>
</html>
