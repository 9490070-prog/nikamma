<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium AIX Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-image: radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.15), transparent 25%),
                              radial-gradient(circle at 85% 30%, rgba(147, 51, 234, 0.15), transparent 25%);
        }

        header {
            width: 100%;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--card-border);
            position: sticky;
            top: 0; z-index: 100;
        }

        .header-title {
            text-align: left;
        }

        h1 {
            font-size: 2rem; font-weight: 800;
            background: linear-gradient(to right, #60a5fa, #c084fc);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .auth-section { display: flex; align-items: center; gap: 15px; }
        
        .login-btn, .logout-btn {
            background: rgba(255, 255, 255, 0.1); color: white;
            border: 1px solid var(--card-border); padding: 8px 20px;
            border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.3s;
        }
        .login-btn:hover { background: var(--primary); border-color: var(--primary); }
        .logout-btn:hover { background: #ef4444; border-color: #ef4444; }

        main {
            width: 100%; max-width: 1200px; padding: 50px 20px;
            display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 30px;
        }

        .extension-card {
            background: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: 20px; padding: 25px; backdrop-filter: blur(10px);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex; flex-direction: column; position: relative; overflow: hidden;
        }

        .extension-card:hover {
            transform: translateY(-5px); box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .extension-icon {
            width: 60px; height: 60px; background: linear-gradient(135deg, #3b82f6, #9333ea);
            border-radius: 15px; display: flex; align-items: center; justify-content: center;
            font-size: 24px; margin-bottom: 20px; box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
        }

        .extension-title { font-size: 1.5rem; margin-bottom: 10px; color: #ffffff; }

        .extension-desc-container { margin-bottom: 20px; flex-grow: 1; }
        .extension-desc {
            color: var(--text-muted); font-size: 0.95rem; line-height: 1.5;
            display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
            overflow: hidden; transition: all 0.3s ease;
        }
        .extension-desc.expanded { -webkit-line-clamp: unset; }

        .read-more-btn {
            background: none; border: none; color: var(--primary);
            font-size: 0.85rem; font-weight: 600; cursor: pointer; padding: 0; margin-top: 5px;
        }

        .extension-price { font-size: 1.8rem; font-weight: 800; color: #10b981; margin-bottom: 15px; }
        .extension-price.free { color: #3b82f6; }

        .buy-btn, .download-btn {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white; border: none; padding: 12px 20px; border-radius: 12px;
            font-size: 1rem; font-weight: 600; cursor: pointer; text-align: center; width: 100%; transition: 0.2s;
        }
        .buy-btn:hover { background: linear-gradient(135deg, #2563eb, #1d4ed8); transform: scale(1.02); }
        .download-btn { background: linear-gradient(135deg, #10b981, #059669); }
        .download-btn:hover { background: linear-gradient(135deg, #059669, #047857); transform: scale(1.02); }
        
        .pending-btn {
            background: #f59e0b; color: white; border: none; padding: 12px 20px; border-radius: 12px;
            font-size: 1rem; font-weight: 600; width: 100%; cursor: not-allowed; opacity: 0.8;
        }

        .free-download-box {
            background: rgba(0,0,0,0.2); padding: 15px; border-radius: 12px; margin-top: 10px; border: 1px solid var(--card-border);
        }
        .free-download-box input {
            width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 8px; border: 1px solid var(--card-border);
            background: rgba(0,0,0,0.4); color: white;
        }

        /* Modals */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(5px);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000; opacity: 0; pointer-events: none; transition: 0.3s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-content {
            background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 20px;
            padding: 30px; width: 90%; max-width: 450px; position: relative;
        }
        .modal-close {
            position: absolute; top: 15px; right: 15px; background: none; border: none;
            color: white; font-size: 1.5rem; cursor: pointer;
        }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: var(--text-muted); font-size: 0.9rem; }
        .form-group input {
            width: 100%; padding: 12px; background: rgba(0,0,0,0.3); border: 1px solid var(--card-border);
            border-radius: 8px; color: white; font-family: inherit;
        }
        
        /* Auth Tabs */
        .auth-tabs { display: flex; margin-bottom: 20px; border-bottom: 1px solid var(--card-border); }
        .auth-tab { flex: 1; text-align: center; padding: 10px; cursor: pointer; color: var(--text-muted); font-weight: 600; transition: 0.3s; }
        .auth-tab.active { color: white; border-bottom: 2px solid var(--primary); }

        .skeleton {
            background: linear-gradient(90deg, var(--card-bg) 25%, rgba(255,255,255,0.05) 50%, var(--card-bg) 75%);
            background-size: 200% 100%; animation: loading 1.5s infinite; border-radius: 10px;
        }
        @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <h1>Premium AIX Store</h1>
            <p style="color: var(--text-muted); font-size: 0.9rem;">Advanced App Inventor Extensions</p>
        </div>
        <div class="auth-section" id="auth-section">
            <!-- Auth buttons injected via JS -->
        </div>
    </header>

    <main id="store-container"></main>

    <!-- Auth Modal -->
    <div class="modal-overlay" id="auth-modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal('auth-modal')">×</button>
            <div class="auth-tabs">
                <div class="auth-tab active" id="tab-login" onclick="switchAuthTab('login')">Login</div>
                <div class="auth-tab" id="tab-signup" onclick="switchAuthTab('signup')">Signup</div>
            </div>
            
            <form id="auth-form" onsubmit="handleAuth(event)" autocomplete="off">
                <!-- Hidden inputs to stop aggressive browser autofill -->
                <input type="email" style="display:none" name="fakeusernameremembered">
                <input type="password" style="display:none" name="fakepasswordremembered">
                
                <input type="hidden" id="auth-mode" value="login">
                
                <div class="form-group" id="name-group" style="display: none;">
                    <label>Full Name</label>
                    <input type="text" id="auth-name" placeholder="John Doe" autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="auth-email" required placeholder="you@example.com" autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="auth-password" required placeholder="••••••••" autocomplete="new-password">
                </div>
                <button type="submit" class="buy-btn" id="auth-btn">Login</button>
            </form>
        </div>
    </div>

    <!-- Payment Modal -->
    <div class="modal-overlay" id="payment-modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal('payment-modal')">×</button>
            <h2 id="modal-title" style="margin-bottom: 5px;">Purchase Extension</h2>
            <p id="modal-price" style="color: #10b981; font-weight: bold; font-size: 1.2rem; margin-bottom: 15px;">$0.00</p>
            
            <div style="background: rgba(0,0,0,0.2); padding: 15px; border-radius: 12px; margin-bottom: 20px;">
                <h4 style="color: #60a5fa; margin-bottom: 10px;">Send Payment To:</h4>
                <p style="font-size:0.9rem;">Easypaisa: <b style="color:#10b981;">03449490070</b> (Name)</p>
                <p style="font-size:0.9rem;">JazzCash: <b style="color:#10b981;">03449490070</b> (Name)</p>
                <p style="font-size:0.9rem;">UBL Bank: <b style="color:#10b981;">PK00 UBL...</b></p>
                
                <hr style="border: none; height: 1px; background: rgba(255,255,255,0.1); margin: 15px 0;">
                
                <div style="text-align: center;">
                    <p style="font-size: 0.9rem; margin-bottom: 10px; color: var(--text-muted);">Alternatively, buy directly from our App</p>
                    <a href="#" id="apk-link" target="_blank" style="background: rgba(255,255,255,0.1); color: white; border: 1px solid var(--card-border); padding: 8px 15px; border-radius: 8px; text-decoration: none; font-size: 0.9rem; font-weight: bold; display: inline-block; transition: 0.3s;">
                        📱 Get AIX Hub Store APK
                    </a>
                </div>
            </div>

            <form id="payment-form" onsubmit="submitPayment(event)">
                <input type="hidden" id="ext-id">
                <input type="hidden" id="ext-name">
                <input type="hidden" id="ext-price">
                <input type="hidden" id="ext-download">
                
                <div class="form-group">
                    <label>Transaction ID (TID / Ref No)</label>
                    <input type="text" id="user-tid" required placeholder="Enter TID after sending payment">
                </div>
                <button type="submit" class="buy-btn" id="submit-btn" style="background: linear-gradient(135deg, #10b981, #059669);">Verify & Submit Order</button>
            </form>
        </div>
    </div>

    <script>
        // 🚀 API CONFIGURATION
        const CLOUDFLARE_URL = 'https://aixhub.nikamma4k.workers.dev';
        const API_TOKEN = 'MeraSecretPassword123xyz';
        const GOOGLE_SHEET_URL = 'https://script.google.com/macros/s/YOUR_SCRIPT_ID_HERE/exec';

        // State
        let currentUser = null; // Email
        let allExtensions = [];
        let purchasedItems = []; // Array of objects { ExtName, PaymentStatus }

        // Initialize App
        async function initApp() {
            const savedEmail = localStorage.getItem('userEmail');
            if (savedEmail) {
                currentUser = savedEmail;
                await fetchUserPurchases(savedEmail);
            }
            updateAuthUI();
            await fetchExtensions();
        }

        // --- AUTH LOGIC ---
        function updateAuthUI() {
            const authSec = document.getElementById('auth-section');
            if (currentUser) {
                authSec.innerHTML = `<span style="font-size:0.9rem; color:#94a3b8;">${currentUser}</span> <button class="logout-btn" onclick="logout()">Logout</button>`;
            } else {
                authSec.innerHTML = `<button class="login-btn" onclick="openModal('auth-modal')">Login / Signup</button>`;
            }
        }

        function logout() {
            localStorage.removeItem('userEmail');
            currentUser = null;
            purchasedItems = [];
            updateAuthUI();
            renderExtensions();
        }

        function switchAuthTab(mode) {
            document.getElementById('auth-mode').value = mode;
            if (mode === 'signup') {
                document.getElementById('tab-signup').classList.add('active');
                document.getElementById('tab-login').classList.remove('active');
                document.getElementById('name-group').style.display = 'block';
                document.getElementById('auth-name').required = true;
                document.getElementById('auth-btn').textContent = 'Create Account';
            } else {
                document.getElementById('tab-login').classList.add('active');
                document.getElementById('tab-signup').classList.remove('active');
                document.getElementById('name-group').style.display = 'none';
                document.getElementById('auth-name').required = false;
                document.getElementById('auth-btn').textContent = 'Login';
            }
        }

        async function handleAuth(e) {
            e.preventDefault();
            const mode = document.getElementById('auth-mode').value;
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-password').value;
            const name = document.getElementById('auth-name').value;
            const btn = document.getElementById('auth-btn');
            
            btn.textContent = "Please wait...";
            btn.disabled = true;

            try {
                let bodyPayload = mode === 'signup' 
                    ? { action: "signup", email: email, password: pass, name: name }
                    : { action: "login", email: email, password: pass };

                let res = await fetch(CLOUDFLARE_URL, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(bodyPayload)
                });
                let data = await res.json();

                if (data.status === "success") {
                    localStorage.setItem('userEmail', email);
                    currentUser = email;
                    await fetchUserPurchases(email);
                    updateAuthUI();
                    closeModal('auth-modal');
                    renderExtensions();
                } else {
                    alert(data.error || "Authentication failed.");
                }
            } catch (err) { 
                alert("Network error: Could not reach authentication server."); 
            }
            finally { 
                btn.textContent = mode === 'signup' ? "Create Account" : "Login"; 
                btn.disabled = false;
            }
        }

        // --- FETCH DATA ---
        async function fetchUserPurchases(email) {
            try {
                const url = `${CLOUDFLARE_URL}/?table=Purchased_data&col=UserEmail&val=${email}&token=${API_TOKEN}&format=object`;
                const res = await fetch(url);
                const data = await res.json();
                purchasedItems = Array.isArray(data) ? data : (data.results || []);
            } catch (err) { console.log("Error fetching purchases", err); }
        }

        async function fetchExtensions() {
            const container = document.getElementById('store-container');
            container.innerHTML = '<div class="skeleton" style="height:300px;"></div><div class="skeleton" style="height:300px;"></div>';
            try {
                const url = `${CLOUDFLARE_URL}/?table=extensions_data&token=${API_TOKEN}&format=object`;
                const res = await fetch(url);
                const data = await res.json();
                allExtensions = Array.isArray(data) ? data : (data.results || []);
                renderExtensions();
            } catch (err) {
                console.error("Fetch Extensions Error:", err);
                container.innerHTML = `<div style="color:red; text-align:center; padding: 20px;">
                    <h3>Error Loading Extensions</h3>
                    <p>${err.message}</p>
                    <p style="font-size:12px; color:gray;">If it says "Failed to fetch" or "Unexpected token", your internet/browser is blocking Cloudflare, or Cloudflare is returning a Captcha.</p>
                </div>`;
            }
        }

        // --- RENDER CARDS ---
        function renderExtensions() {
            const container = document.getElementById('store-container');
            container.innerHTML = '';

            const aixExtensions = allExtensions.filter(ext => {
                const cat = String(ext.category || ext.Category || ext.Type || ext.type || '');
                return cat.trim().toUpperCase() === 'AIX';
            });

            if (aixExtensions.length === 0) {
                container.innerHTML = `<p style="text-align:center; width:100%;">No extensions found.</p>`;
                return;
            }

            aixExtensions.forEach(ext => {
                let title = ext.title || ext.Title || ext.Name || ext.name || 'Extension';
                if (!title) return;
                title = String(title);
                
                const desc = ext.description || ext.Description || ext.Details || 'No details available.';
                const priceVal = String(ext.price || ext.Price || '0');
                const isFree = (priceVal === '0' || priceVal.toLowerCase() === 'free' || priceVal === '$0.00');
                const downloadLink = ext.DownloadLink || ext.downloadLink || ext.Url || ext.paymentLink || '#';
                const extId = String(ext.id || ext.ID || title);

                const card = document.createElement('div');
                card.className = 'extension-card';

                let actionHtml = '';

                if (isFree) {
                    actionHtml = `
                        <div class="extension-price free">FREE</div>
                        <button class="download-btn" onclick="downloadAix('${title.replace(/'/g,"\\'")}', this)">Download Extension</button>
                        <div style="display: flex; gap: 10px; margin-top: 15px;">
                            <input type="email" id="save-email-${extId}" placeholder="Enter email to save" style="flex:1; padding: 8px; border-radius: 5px; border: 1px solid var(--card-border); background: rgba(255,255,255,0.05); color: white;">
                            <button onclick="saveEmailToSheet('${extId}', '${title.replace(/'/g,"\\'")}')" style="background: var(--primary); color: white; border: none; border-radius: 5px; padding: 8px 15px; cursor: pointer; font-weight: bold; transition: 0.3s;">Save</button>
                        </div>
                    `;
                } else {
                    // Check Purchase Status
                    const purchaseRecord = purchasedItems.find(p => (p.ExtName === title || p.ExtensionName === title));
                    const priceDisplay = priceVal.includes('$') ? priceVal : '$' + priceVal;
                    
                    actionHtml = `<div class="extension-price">${priceDisplay}</div>`;
                    
                    if (currentUser && purchaseRecord) {
                        if (purchaseRecord.PaymentStatus === 'Approved') {
                            actionHtml += `<button class="download-btn" onclick="downloadAix('${title.replace(/'/g,"\\'")}', this)">Download Extension</button>`;
                        } else {
                            actionHtml += `<button class="pending-btn" disabled>Pending Approval...</button>`;
                        }
                    } else {
                        actionHtml += `<button class="buy-btn" onclick="handleBuyClick('${extId}', '${title.replace(/'/g,"\\'")}', '${priceDisplay}', '${downloadLink}')">Buy Now</button>`;
                    }
                }

                card.innerHTML = `
                    <div class="extension-icon">${ext.icon || ext.Icon || '🚀'}</div>
                    <h2 class="extension-title">${title}</h2>
                    <div class="extension-desc-container">
                        <div class="extension-desc">${desc}</div>
                        <button class="read-more-btn" onclick="toggleDesc(this)">Read More</button>
                    </div>
                    ${actionHtml}
                `;
                container.appendChild(card);
            });
        }

        function toggleDesc(btn) {
            const descElement = btn.previousElementSibling;
            if (descElement.classList.contains('expanded')) {
                descElement.classList.remove('expanded'); btn.textContent = 'Read More';
            } else {
                descElement.classList.add('expanded'); btn.textContent = 'Read Less';
            }
        }

        // --- ACTIONS ---
        function handleBuyClick(id, title, price, downloadLink) {
            if (!currentUser) {
                alert("Please login first to purchase extensions.");
                openModal('auth-modal');
                return;
            }
            document.getElementById('ext-id').value = id;
            document.getElementById('ext-name').value = title;
            document.getElementById('ext-price').value = price;
            document.getElementById('modal-title').textContent = 'Purchase ' + title;
            document.getElementById('modal-price').textContent = price;
            openModal('payment-modal');
        }

        // --- DOWNLOAD & SAVE EMAIL LOGIC ---
        async function downloadAix(title, btnElement) {
            if (!currentUser) {
                alert("Please login first to download extensions.");
                openModal('auth-modal');
                return;
            }
            const originalText = btnElement.textContent;
            btnElement.textContent = "Generating Link...";
            btnElement.disabled = true;
            try {
                const fileName = title.replace(/ /g, "_") + ".aix";
                const tempLinkApiUrl = `${CLOUDFLARE_URL}/?action=generate_temp_link&token=${API_TOKEN}&file=${encodeURIComponent(fileName)}`;
                const res = await fetch(tempLinkApiUrl);
                const data = await res.json();
                if (data.status === 'success' && data.tempLink) {
                    window.open(data.tempLink, '_blank');
                } else {
                    alert("Error generating download link: " + (data.error || "Unknown error"));
                }
            } catch (err) {
                alert("Failed to connect to secure download server.");
            }
            btnElement.textContent = originalText;
            btnElement.disabled = false;
        }

        async function saveEmailToSheet(extId, title) {
            const emailBox = document.getElementById(`save-email-${extId}`);
            const email = emailBox.value.trim();
            if (!email || !email.includes('@')) return alert("Please enter a valid email address.");
            
            const btn = emailBox.nextElementSibling;
            btn.textContent = "Saving...";
            btn.disabled = true;
            emailBox.disabled = true;
            
            try {
                await fetch(GOOGLE_SHEET_URL, {
                    method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, tid: "Email Saved", extId: extId, extName: title, type: "saved_email", date: new Date().toISOString() })
                });
                alert("Email saved successfully!");
                emailBox.value = "";
            } catch(e) {
                alert("Failed to save email.");
            }
            
            btn.textContent = "Save";
            btn.disabled = false;
            emailBox.disabled = false;
        }

        async function submitPayment(e) {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.textContent = 'Submitting...'; btn.disabled = true;

            const tid = document.getElementById('user-tid').value;
            const extName = document.getElementById('ext-name').value;
            const extId = document.getElementById('ext-id').value;

            try {
                // 1. Save to Cloudflare DB (Purchased_data table)
                const cfUrl = `${CLOUDFLARE_URL}/?table=Purchased_data&token=${API_TOKEN}`;
                const dbPayload = {
                    OrderID: tid,
                    UserEmail: currentUser,
                    ExtName: extName,
                    PaymentStatus: "Pending"
                };
                
                await fetch(cfUrl, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dbPayload)
                });

                // 2. Send to Google Sheet (To trigger Email to Admin)
                await fetch(GOOGLE_SHEET_URL, {
                    method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: currentUser, tid: tid, extId: extId, extName: extName,
                        type: "paid", date: new Date().toISOString()
                    })
                });

                alert('Payment submitted! An email has been sent to the Admin. Once approved, you can download it from here.');
                closeModal('payment-modal');
                
                // Refresh purchases
                await fetchUserPurchases(currentUser);
                renderExtensions();
                
            } catch (error) {
                alert('Error submitting details.');
            } finally {
                btn.textContent = 'Verify & Submit Order'; btn.disabled = false;
            }
        }

        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }

        // Start
        initApp();
    </script>
</body>
</html>
