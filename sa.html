<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LiveCam - Simple Working</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial,sans-serif}
#hostView{display:flex;flex-direction:column;height:100vh}
#hostVideo{width:100%;height:70vh;object-fit:cover;background:#111}
.controls{display:flex;justify-content:center;gap:15px;padding:15px;flex-wrap:wrap}
button{padding:12px 25px;font-size:16px;border:none;border-radius:30px;cursor:pointer}
.btn-red{background:#ff2d2d;color:#fff}
.btn-dark{background:#333;color:#fff}
.btn-gray{background:#555;color:#fff}
#viewerPage{display:none;position:fixed;inset:0;background:#000}
#viewerVideo{width:100%;height:100%;object-fit:cover}
.card{background:#1e1e1e;padding:20px;border-radius:15px;margin:20px;text-align:center}
input{padding:12px;width:90%;margin:10px 0;border-radius:10px;border:none;font-size:16px}
.link-box{background:#333;padding:10px;border-radius:10px;margin:10px;word-break:break-all;font-size:12px}
#status{position:fixed;bottom:10px;left:10px;background:#000;padding:5px 12px;border-radius:20px;font-size:11px;z-index:100}
</style>
</head>
<body>

<!-- HOST PAGE -->
<div id="hostPage">
  <div id="homeScreen" style="text-align:center;padding:40px 20px">
    <h1 style="color:#ff2d2d">LIVECAM</h1>
    <p style="margin:20px 0;color:#aaa">Simple Live Streaming</p>
    <div class="card">
      <input type="text" id="roomIdInput" placeholder="Stream ID" value="mystream123">
      <button class="btn-red" onclick="startHost('back')" style="margin:5px">📸 Back Camera</button>
      <button class="btn-dark" onclick="startHost('front')" style="margin:5px">🤳 Front Camera</button>
    </div>
  </div>

  <div id="liveHost" style="display:none">
    <video id="hostVideo" autoplay playsinline muted></video>
    <div class="controls">
      <button class="btn-gray" onclick="flipCamera()">🔄 Flip</button>
      <button class="btn-gray" onclick="toggleMic()">🎤 Mic</button>
      <button class="btn-red" onclick="stopHost()">⏹ Stop</button>
      <button class="btn-dark" onclick="copyLink()">🔗 Copy Link</button>
    </div>
    <div style="position:absolute;top:10px;left:10px;background:#ff2d2d;padding:5px 12px;border-radius:20px;font-size:12px">🔴 LIVE</div>
    <div style="position:absolute;top:10px;right:10px;background:#333;padding:5px 12px;border-radius:20px;font-size:12px" id="viewerCountDisplay">👁 0</div>
  </div>
</div>

<!-- VIEWER PAGE -->
<div id="viewerPage">
  <video id="viewerVideo" autoplay playsinline></video>
  <div id="status">⏳ Connecting...</div>
  <button onclick="window.location.reload()" style="position:absolute;bottom:20px;left:50%;transform:translateX(-50%);padding:10px 20px;background:#ff2d2d;border:none;border-radius:25px;color:#fff">🔄 Retry</button>
</div>

<script type="importmap">
{
  "imports": {
    "firebase/app": "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js",
    "firebase/database": "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js"
  }
}
</script>

<script type="module">
import { initializeApp } from 'firebase/app';
import { getDatabase, ref, set, onValue, push, remove } from 'firebase/database';

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCXY_layR4HtlrJTweBB5ER_uc5jkMG0sc",
  authDomain: "nikamma-4k.firebaseapp.com",
  databaseURL: "https://nikamma-4k-default-rtdb.firebaseio.com",
  projectId: "nikamma-4k",
  storageBucket: "nikamma-4k.firebasestorage.app",
  messagingSenderId: "534849542892",
  appId: "1:534849542892:web:d96322fd4811b46738e3c9"
};

// TURN servers - SIM network ke liye
const TURN_SERVERS = {
  iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun.cloudflare.com:3478' },
    { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
    { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
    { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' }
  ],
  iceCandidatePoolSize: 10
};

let db, roomId, localStream, peerConnections = {};
let isLive = false;
let facing = 'environment';
let audioEnabled = true;

function showToast(msg) {
  const status = document.getElementById('status');
  if (status) status.innerText = msg;
  console.log(msg);
}

// ==================== HOST FUNCTIONS ====================
window.startHost = async (type) => {
  roomId = document.getElementById('roomIdInput').value.trim();
  if (!roomId) { alert('Enter Stream ID'); return; }
  
  facing = type === 'front' ? 'user' : 'environment';
  
  try {
    // Get camera
    localStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: facing, width: 720, height: 1280 },
      audio: true
    });
    
    // Show video
    document.getElementById('hostVideo').srcObject = localStream;
    document.getElementById('homeScreen').style.display = 'none';
    document.getElementById('liveHost').style.display = 'block';
    
    // Init Firebase
    const app = initializeApp(FIREBASE_CONFIG, 'host');
    db = getDatabase(app);
    
    // Clear old data
    await remove(ref(db, `live/${roomId}`));
    
    // Mark stream active
    await set(ref(db, `live/${roomId}/active`), true);
    await set(ref(db, `live/${roomId}/startTime`), Date.now());
    
    isLive = true;
    
    // Listen for viewers
    onValue(ref(db, `live/${roomId}/viewers`), (snap) => {
      if (snap.exists()) {
        const count = Object.keys(snap.val()).length;
        document.getElementById('viewerCountDisplay').innerHTML = `👁 ${count}`;
      } else {
        document.getElementById('viewerCountDisplay').innerHTML = '👁 0';
      }
    });
    
    // Listen for offer requests from viewers
    onValue(ref(db, `live/${roomId}/offers`), (snap) => {
      if (!snap.exists() || !isLive) return;
      
      snap.forEach(async (childSnap) => {
        const viewerId = childSnap.key;
        const offer = childSnap.val();
        
        if (peerConnections[viewerId]) return;
        
        // Create peer connection
        const pc = new RTCPeerConnection(TURN_SERVERS);
        peerConnections[viewerId] = pc;
        
        // Add local tracks
        localStream.getTracks().forEach(track => {
          pc.addTrack(track, localStream);
        });
        
        // Send answer
        await pc.setRemoteDescription(new RTCSessionDescription(offer));
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        
        await set(ref(db, `live/${roomId}/answers/${viewerId}`), {
          sdp: answer.sdp,
          type: answer.type
        });
        
        // Handle ICE candidates
        pc.onicecandidate = (event) => {
          if (event.candidate) {
            push(ref(db, `live/${roomId}/hostIce/${viewerId}`), event.candidate.toJSON());
          }
        };
        
        // Cleanup on disconnect
        pc.oniceconnectionstatechange = () => {
          if (pc.iceConnectionState === 'disconnected' || pc.iceConnectionState === 'failed') {
            delete peerConnections[viewerId];
            remove(ref(db, `live/${roomId}/offers/${viewerId}`));
            remove(ref(db, `live/${roomId}/answers/${viewerId}`));
          }
        };
      });
    });
    
    showToast('✅ LIVE! Share the link');
    
  } catch(err) {
    alert('Camera error: ' + err.message);
    console.error(err);
  }
};

window.flipCamera = async () => {
  facing = facing === 'environment' ? 'user' : 'environment';
  if (localStream) {
    localStream.getTracks().forEach(t => t.stop());
  }
  try {
    localStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: facing },
      audio: true
    });
    document.getElementById('hostVideo').srcObject = localStream;
    
    // Update tracks for all peers
    const videoTrack = localStream.getVideoTracks()[0];
    Object.values(peerConnections).forEach(pc => {
      const sender = pc.getSenders().find(s => s.track?.kind === 'video');
      if (sender) sender.replaceTrack(videoTrack);
    });
    showToast('Camera flipped');
  } catch(e) {
    showToast('Flip failed');
  }
};

window.toggleMic = () => {
  if (!localStream) return;
  const audioTrack = localStream.getAudioTracks()[0];
  if (audioTrack) {
    audioEnabled = !audioEnabled;
    audioTrack.enabled = audioEnabled;
    showToast(audioEnabled ? 'Mic on' : 'Mic off');
  }
};

window.copyLink = () => {
  const link = `${window.location.href.split('?')[0]}?watch=${roomId}`;
  navigator.clipboard.writeText(link);
  showToast('Link copied!');
};

window.stopHost = () => {
  isLive = false;
  if (localStream) localStream.getTracks().forEach(t => t.stop());
  Object.values(peerConnections).forEach(pc => pc.close());
  if (db && roomId) {
    remove(ref(db, `live/${roomId}`));
  }
  location.reload();
};

// ==================== VIEWER FUNCTIONS ====================
async function initViewer(streamId) {
  const video = document.getElementById('viewerVideo');
  const status = document.getElementById('status');
  
  status.innerText = '⏳ Connecting...';
  
  try {
    const app = initializeApp(FIREBASE_CONFIG, 'viewer');
    const dbViewer = getDatabase(app);
    
    // Check if stream exists
    const activeRef = ref(dbViewer, `live/${streamId}/active`);
    onValue(activeRef, (snap) => {
      if (!snap.val()) {
        status.innerText = '❌ Stream not active';
      }
    });
    
    // Create peer connection
    const pc = new RTCPeerConnection(TURN_SERVERS);
    
    pc.ontrack = (event) => {
      if (event.streams && event.streams[0]) {
        video.srcObject = event.streams[0];
        status.innerText = '✅ Connected!';
      }
    };
    
    pc.oniceconnectionstatechange = () => {
      if (pc.iceConnectionState === 'connected') {
        status.innerText = '✅ Live!';
      } else if (pc.iceConnectionState === 'failed') {
        status.innerText = '❌ Connection failed';
      }
    };
    
    // Create offer
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    
    // Send offer to host
    const viewerId = 'v_' + Date.now();
    await set(ref(dbViewer, `live/${streamId}/offers/${viewerId}`), {
      sdp: offer.sdp,
      type: offer.type
    });
    
    // Listen for answer
    onValue(ref(dbViewer, `live/${streamId}/answers/${viewerId}`), async (snap) => {
      if (snap.exists() && pc.signalingState === 'have-local-offer') {
        const answer = snap.val();
        await pc.setRemoteDescription(new RTCSessionDescription(answer));
      }
    });
    
    // Listen for host ICE candidates
    onValue(ref(dbViewer, `live/${streamId}/hostIce/${viewerId}`), (snap) => {
      snap.forEach(child => {
        if (pc.remoteDescription) {
          pc.addIceCandidate(new RTCIceCandidate(child.val())).catch(() => {});
        }
      });
    });
    
    // Send viewer ICE candidates
    pc.onicecandidate = (event) => {
      if (event.candidate) {
        push(ref(dbViewer, `live/${streamId}/viewerIce/${viewerId}`), event.candidate.toJSON());
      }
    };
    
    // Register viewer
    await set(ref(dbViewer, `live/${streamId}/viewers/${viewerId}`), true);
    
    window.addEventListener('beforeunload', () => {
      remove(ref(dbViewer, `live/${streamId}/viewers/${viewerId}`));
      pc.close();
    });
    
    // Timeout
    setTimeout(() => {
      if (!video.srcObject) {
        status.innerText = '❌ No stream found';
      }
    }, 15000);
    
  } catch(err) {
    console.error(err);
    status.innerText = '❌ Error: ' + err.message;
  }
}

// ==================== CHECK IF VIEWER ====================
const urlParams = new URLSearchParams(window.location.search);
const watchId = urlParams.get('watch');

if (watchId) {
  document.getElementById('hostPage').style.display = 'none';
  document.getElementById('viewerPage').style.display = 'block';
  initViewer(watchId);
} else {
  document.getElementById('hostPage').style.display = 'block';
  document.getElementById('viewerPage').style.display = 'none';
}
</script>
</body>
</html>
