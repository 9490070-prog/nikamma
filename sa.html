<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>LiveCam Pro | Stable WebRTC</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#ff2d2d;--red-dark:#c0000a;--surface:#141414;--surface2:#1e1e1e;--surface3:#252525;--border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);--text:#f0f0f0;--muted:#777;--accent:#4fc3f7}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:var(--text);font-family:'DM Sans',sans-serif}

/* VIEWER CSS */
#viewerPage{display:none;position:fixed;inset:0;background:#000;z-index:1}
#viewVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;z-index:1}
.vOverlayImg{position:absolute;object-fit:contain;display:none;filter:drop-shadow(0 2px 12px rgba(0,0,0,0.9));border-radius:6px;pointer-events:none;z-index:10}
#vTextOverlay{position:absolute;display:none;pointer-events:none;z-index:11;white-space:pre-wrap;word-break:break-word;line-height:1.4;padding:8px 18px;border-radius:8px}
#vTickerWrap{position:absolute;left:0;right:0;overflow:hidden;pointer-events:none;display:none;z-index:11;padding:9px 0}
.tick-i{white-space:nowrap;display:inline-block;font-weight:600;color:#fff;padding-left:100%}
.tick-ltr{animation:ticker-ltr 18s linear infinite}
.tick-rtl{animation:ticker-rtl 18s linear infinite}
@keyframes ticker-ltr{from{transform:translateX(-100%)}to{transform:translateX(100vw)}}
@keyframes ticker-rtl{from{transform:translateX(0)}to{transform:translateX(-100%)}}
#vTapArea{position:absolute;inset:0;z-index:20;cursor:pointer}
#vPlayIcon{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:25;pointer-events:none;width:88px;height:88px;border-radius:50%;background:rgba(0,0,0,0.55);backdrop-filter:blur(10px);border:2px solid rgba(255,255,255,0.25);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 0.3s ease}
#vPlayIcon.show{opacity:1}
#vPlayIcon svg{width:42px;height:42px;fill:#fff}
#vLoader{position:absolute;inset:0;background:#0a0a0a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:30}
.vl-logo{font-family:'Bebas Neue',sans-serif;font-size:2.2rem;letter-spacing:3px;color:#fff}
.vl-logo span{color:var(--red)}
.spinner{width:46px;height:46px;border:3px solid rgba(255,255,255,0.08);border-top-color:var(--red);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.vl-txt{color:var(--muted);font-size:0.85rem;text-align:center;padding:0 30px;line-height:1.6}
.retry-btn{padding:10px 24px;background:var(--red);border:none;border-radius:10px;color:#fff;font-size:0.88rem;cursor:pointer;display:none;margin-top:4px}
.conn-status{position:fixed;bottom:10px;left:10px;z-index:100;background:rgba(0,0,0,0.7);padding:5px 12px;border-radius:20px;font-size:11px;font-family:monospace;pointer-events:none}

/* ADMIN HOME */
#adminPage{display:none;position:fixed;inset:0;z-index:1;overflow-y:auto}
#homeScreen{min-height:100%;background:radial-gradient(ellipse at 30% 20%,#1a0000 0%,#0a0a0a 60%);display:flex;flex-direction:column;align-items:center;padding:50px 20px 40px}
.logo-t{font-family:'Bebas Neue',sans-serif;font-size:3rem;letter-spacing:4px;text-align:center;line-height:1}
.logo-t span{color:var(--red)}
.tagline{color:var(--muted);font-size:0.72rem;letter-spacing:2px;text-transform:uppercase;text-align:center;margin-top:4px;margin-bottom:28px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;width:100%;max-width:400px;margin-bottom:12px}
.clbl{font-size:0.65rem;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-bottom:12px}
.bbtn{width:100%;padding:15px;border:none;border-radius:12px;font-family:'DM Sans',sans-serif;font-size:0.93rem;font-weight:600;cursor:pointer;transition:all 0.15s;display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:9px}
.bbtn.red{background:var(--red);color:#fff}
.bbtn.dark{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.bbtn:active{transform:scale(0.97)}
.inp{width:100%;padding:13px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:0.88rem;outline:none;margin-bottom:8px}
.inp:focus{border-color:rgba(255,45,45,0.5)}
.hint{font-size:0.72rem;color:var(--muted);margin-bottom:14px}

/* STREAM SCREEN */
#streamScreen{display:none;position:fixed;inset:0;background:#000}
#mainVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
#ovCanvas{position:absolute;inset:0;pointer-events:none;z-index:10;overflow:hidden}
.imgOverlay{position:absolute;object-fit:contain;display:none;filter:drop-shadow(0 2px 12px rgba(0,0,0,0.9));cursor:move;z-index:12;border-radius:6px;touch-action:none;pointer-events:all}
#textOverlay{position:absolute;display:none;pointer-events:none;z-index:11;white-space:pre-wrap;word-break:break-word;line-height:1.4;border-radius:8px;padding:8px 18px}
#tickerOverlay{position:absolute;left:0;right:0;overflow:hidden;pointer-events:none;display:none;z-index:13;padding:9px 0}
.tick-admin{white-space:nowrap;display:inline-block;font-weight:600;color:#fff}

/* TOP & BOTTOM BAR */
#adminTop{position:absolute;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:linear-gradient(to bottom,rgba(0,0,0,0.85) 0%,transparent 100%)}
.lpill{display:flex;align-items:center;gap:7px;background:var(--red);padding:5px 13px;border-radius:20px;font-size:0.75rem;font-weight:700}
.pulse{width:8px;height:8px;border-radius:50%;background:#fff;animation:p 1.2s ease-in-out infinite;display:inline-block}
@keyframes p{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.3;transform:scale(0.7)}}
.spill{background:rgba(0,0,0,0.65);border:1px solid rgba(255,255,255,0.12);padding:5px 11px;border-radius:20px;font-size:0.76rem;display:flex;align-items:center;gap:5px}

#adminBot{position:absolute;bottom:0;left:0;right:0;z-index:20;padding:10px 16px 26px;background:linear-gradient(to top,rgba(0,0,0,0.92) 0%,transparent 100%)}
.crow{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cbtn{width:50px;height:50px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.2rem;background:rgba(255,255,255,0.13);backdrop-filter:blur(6px);transition:all 0.15s;flex-shrink:0}
.cbtn:active{transform:scale(0.88)}
.cbtn.on{background:var(--red)}
.stopc{width:64px;height:64px;border-radius:50%;border:3px solid rgba(255,255,255,0.22);background:var(--red);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.45rem;flex-shrink:0}
.stopc:active{transform:scale(0.92)}
.zrow{display:flex;align-items:center;gap:10px;padding:0 4px}
.zlbl{font-size:0.68rem;color:var(--muted);min-width:24px}
input[type=range]{flex:1;height:3px;-webkit-appearance:none;background:rgba(255,255,255,0.18);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;cursor:pointer}
.zval{font-size:0.75rem;color:#fff;font-weight:600;min-width:34px}

/* DRAWER */
#drawer{position:absolute;bottom:0;left:0;right:0;z-index:30;background:var(--surface);border-radius:20px 20px 0 0;border-top:1px solid var(--border2);padding:0 0 40px;transform:translateY(100%);transition:transform 0.32s cubic-bezier(0.4,0,0.2,1);max-height:88vh;overflow-y:auto}
#drawer.open{transform:translateY(0)}
.drawer-header{padding:14px 16px 0;position:sticky;top:0;background:var(--surface);z-index:2;border-bottom:1px solid var(--border)}
.dh{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 12px}
.tab-bar{display:flex;gap:4px;padding:0 0 12px}
.tab{flex:1;padding:8px 4px;border:none;border-radius:10px;background:transparent;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:0.72rem;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:all 0.15s}
.tab span{font-size:1.1rem}
.tab.active{background:var(--surface3);color:#fff;border:1px solid var(--border2)}
.tab-content{display:none;padding:14px 16px 0}
.tab-content.active{display:block}

/* FORM ELEMENTS */
.sec{font-size:0.62rem;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-bottom:8px;margin-top:16px}
.minp{flex:1;padding:11px 13px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:0.86rem;outline:none}
.sendb{padding:11px 14px;background:var(--red);border:none;border-radius:10px;color:#fff;font-weight:700;cursor:pointer;font-size:0.82rem}
.crow2{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
input[type=color]{width:36px;height:36px;border:none;border-radius:8px;background:none;cursor:pointer;padding:2px}
.frow{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.frow select,.frow input[type=number]{padding:8px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:0.82rem;outline:none}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.fi{display:flex;flex-direction:column;gap:3px}
.fi label{font-size:0.68rem;color:var(--muted)}
.pi{padding:9px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:0.85rem;width:100%;outline:none}
.qtags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.qtag{padding:6px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;font-size:0.76rem;cursor:pointer}
.srow{display:flex;gap:8px;margin-bottom:8px}
.sbtn{flex:1;padding:11px 8px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:0.78rem;font-weight:500;cursor:pointer;text-align:center}
.sbtn.danger{border-color:rgba(255,45,45,0.4);color:#ff8888}

/* TOGGLE & OPACITY */
.toggle-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding:10px 12px;background:var(--surface2);border-radius:10px;border:1px solid var(--border)}
.toggle{position:relative;width:42px;height:24px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;cursor:pointer;inset:0;background:#333;border-radius:24px;transition:0.2s}
.toggle-slider:before{position:absolute;content:'';height:18px;width:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:0.2s}
.toggle input:checked + .toggle-slider{background:var(--red)}
.toggle input:checked + .toggle-slider:before{transform:translateX(18px)}

.opacity-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.opacity-row label{font-size:0.74rem;color:var(--muted);white-space:nowrap;min-width:70px}
.opacity-val{font-size:0.74rem;color:#fff;min-width:30px;text-align:right}

.dir-group,.pos-group{display:flex;gap:6px;margin-bottom:10px}
.dir-btn,.pos-btn{flex:1;padding:9px 6px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--muted);font-size:0.76rem;font-weight:600;cursor:pointer;text-align:center}
.dir-btn.active,.pos-btn.active{background:var(--red);color:#fff;border-color:var(--red)}

/* IMAGE SLOTS */
.img-slot{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;position:relative}
.img-slot-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.img-slot-title{font-size:0.72rem;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:1px}
.img-slot-del{width:28px;height:28px;border-radius:50%;background:rgba(255,45,45,0.2);border:1px solid rgba(255,45,45,0.4);color:#ff8888;cursor:pointer;display:flex;align-items:center;justify-content:center}
.upa{border:1px dashed rgba(255,255,255,0.18);border-radius:10px;padding:12px;text-align:center;cursor:pointer;margin-bottom:8px}
.iprev{max-width:100%;max-height:70px;border-radius:6px;margin-top:6px;display:none}
.add-img-btn{width:100%;padding:12px;border:1px dashed rgba(79,195,247,0.4);border-radius:12px;background:rgba(79,195,247,0.06);color:var(--accent);font-size:0.85rem;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:8px}

.link-box{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:0.72rem;color:var(--accent);word-break:break-all;margin-bottom:8px}
#toast{position:fixed;top:68px;left:50%;transform:translateX(-50%) translateY(-16px);background:rgba(18,18,18,0.96);border:1px solid var(--border);padding:10px 20px;border-radius:20px;font-size:0.82rem;z-index:9999;opacity:0;transition:all 0.3s;pointer-events:none;backdrop-filter:blur(10px)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div id="viewerPage">
  <div id="vLoader">
    <div class="vl-logo">LIVE<span>CAM</span></div>
    <div class="spinner"></div>
    <div class="vl-txt" id="vLoaderTxt">Connecting to stream...</div>
    <button class="retry-btn" id="retryBtn" onclick="window.location.reload()">🔄 Retry</button>
  </div>
  <video id="viewVideo" autoplay playsinline></video>
  <div id="vImgContainer"></div>
  <div id="vTextOverlay"></div>
  <div id="vTickerWrap"><div class="tick-i" id="vTickerInner"></div></div>
  <div id="vTapArea"></div>
  <div id="vPlayIcon"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
  <button id="viewerMuteBtn" style="position:absolute;bottom:20px;right:20px;z-index:50;background:rgba(0,0,0,0.7);border:none;border-radius:50px;padding:12px 18px;color:#fff;font-size:14px;backdrop-filter:blur(10px);cursor:pointer">🔊 Unmute</button>
  <div class="conn-status" id="connStatus">⏳ Connecting...</div>
</div>

<div id="adminPage">
  <div id="homeScreen">
    <div class="logo-t">LIVE<span>CAM</span> <span style="font-size:1.1rem;color:var(--muted)">PRO</span></div>
    <div class="tagline">Stable P2P Live Streaming</div>
    <div class="card">
      <div class="clbl">🔴 Start Stream</div>
      <input class="inp" id="customId" type="text" placeholder="e.g. mystream123" maxlength="30" value="ab12345">
      <div class="hint">Unique ID dein, cross-network stream ke liye.</div>
      <button class="bbtn red" onclick="startStream('back')">📸 Back Camera Live</button>
      <button class="bbtn dark" onclick="startStream('front')">🤳 Front Camera Live</button>
    </div>
  </div>

  <div id="streamScreen">
    <video id="mainVideo" autoplay playsinline muted></video>
    <div id="ovCanvas">
      <div id="imgLayerContainer"></div>
      <div id="textOverlay"></div>
      <div id="tickerOverlay"><div class="tick-admin" id="tickerInner"></div></div>
    </div>

    <div id="adminTop">
      <div class="lpill"><div class="pulse"></div>LIVE</div>
      <div class="spill">⏱ <span id="timerDisp">00:00</span></div>
      <div class="spill">👁 <span id="viewCount">0</span></div>
    </div>

    <div id="adminBot">
      <div class="crow">
        <button class="cbtn" id="flashBtn" onclick="toggleFlash()">💡</button>
        <button class="cbtn" id="flipBtn" onclick="flipCamera()">🔄</button>
        <button class="cbtn" id="muteHostBtn" onclick="toggleHostMute()" style="background:rgba(255,45,45,0.8)">🎤</button>
        <button class="stopc" onclick="stopStream()">⏹</button>
        <button class="cbtn" id="panelBtn" onclick="toggleDrawer()">🎛️</button>
        <button class="cbtn" onclick="copyLink()">🔗</button>
      </div>
      <div class="zrow">
        <span class="zlbl">🔍</span>
        <input type="range" id="zoomSlider" min="1" max="8" step="0.1" value="1" oninput="applyZoom(this.value)">
        <span class="zval" id="zoomVal">1.0x</span>
      </div>
    </div>

    <div id="drawer">
      <div class="drawer-header"><div class="dh"></div>
        <div class="tab-bar">
          <button class="tab active" onclick="switchTab('link')"><span>🔗</span>Link</button>
          <button class="tab" onclick="switchTab('text')"><span>💬</span>Text</button>
          <button class="tab" onclick="switchTab('ticker')"><span>📢</span>Ticker</button>
          <button class="tab" onclick="switchTab('images')"><span>🖼️</span>Images</button>
        </div>
      </div>
      <div class="tab-content active" id="tab-link">
        <div class="sec">Viewer Link</div>
        <div class="link-box" id="linkDisp">-</div>
        <div class="srow">
          <button class="sbtn" onclick="copyLink()">📋 Copy</button>
          <button class="sbtn" onclick="waShare()">📤 WhatsApp</button>
        </div>
      </div>
      <div class="tab-content" id="tab-text">
        <div class="mrow">
          <input class="minp" id="textInp" type="text" placeholder="Type message..." maxlength="100" oninput="autoSendText(this.value)">
          <button class="sendb" onclick="hideText()">✕</button>
        </div>
        <div class="frow">
          <select id="fontFam" onchange="updateTextStyle()">
            <option value="'DM Sans',sans-serif">DM Sans</option>
            <option value="'Bebas Neue',sans-serif">Bebas Neue</option>
          </select>
          <input type="number" id="fontSz" value="22" oninput="updateTextStyle()">
        </div>
        <div class="toggle-row">
          <span>Transparent BG</span>
          <label class="toggle"><input type="checkbox" id="bgTransparent" onchange="updateTextStyle()"><span class="toggle-slider"></span></label>
        </div>
        <div class="opacity-row">
          <label>Opacity</label>
          <input type="range" id="bgOpacity" min="0" max="100" value="60" oninput="updateTextStyle()">
        </div>
      </div>
      <div class="tab-content" id="tab-ticker">
        <div class="mrow">
          <input class="minp" id="tickInp" type="text" placeholder="News ticker...">
          <button class="sendb" onclick="sendTicker()">GO</button>
        </div>
        <div class="pos-group">
          <button class="pos-btn" id="tickPosTop" onclick="setTickerPos('top')">Top</button>
          <button class="pos-btn active" id="tickPosBot" onclick="setTickerPos('bottom')">Bottom</button>
        </div>
      </div>
      <div class="tab-content" id="tab-images">
        <div id="imgSlotsList"></div>
        <button class="add-img-btn" onclick="addImageSlot()" id="addImgBtn">➕ Add Image</button>
      </div>
      <div style="padding:12px 16px"><button class="bbtn dark" onclick="toggleDrawer()">✕ Close</button></div>
    </div>
  </div>
</div>
<div id="toast"></div>

<script type="importmap">
  {
    "imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js",
      "firebase/database": "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js"
    }
  }
</script>

window.switchTab = (name) => {
  const tabs = ['link','text','ticker','images'];
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', tabs[i] === name));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.toggle('active', c.id === 'tab-'+name));
};

// --- VIEWER LOGIC ---
async function initViewer(roomId) {
  const txt = document.getElementById('vLoaderTxt');
  const loader = document.getElementById('vLoader');
  const connStatusSpan = document.getElementById('connStatus');
  
  const app = initializeApp(FB_CFG, 'v_'+Date.now());
  const db = getDatabase(app);
  const viewerId = 'v_' + Math.random().toString(36).substr(2, 9);

  onValue(ref(db, `rooms/${roomId}/overlays`), (s) => { if(s.exists()) applyOverlays(s.val()); });
  await set(ref(db, `rooms/${roomId}/viewers/${viewerId}`), true);
  window.addEventListener('beforeunload', () => remove(ref(db, `rooms/${roomId}/viewers/${viewerId}`)));

  let pc = null;
  let candidatesBuffer = [];

  function closePc() {
    if(pc) { pc.close(); pc = null; }
    candidatesBuffer = [];
  }

  async function connect() {
    closePc();
    pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });

    pc.onicecandidate = (e) => {
      if(e.candidate) push(ref(db, `rooms/${roomId}/viewerIce/${viewerId}`), e.candidate.toJSON());
    };

    pc.ontrack = (e) => {
      document.getElementById('viewVideo').srcObject = e.streams[0];
      loader.style.display = 'none';
      connStatusSpan.textContent = '✅ Connected';
      connStatusSpan.style.background = 'rgba(0,150,0,0.8)';
    };

    pc.oniceconnectionstatechange = () => {
      if(pc.iceConnectionState === 'failed') setTimeout(connect, 2000);
    };

    // Join Request
    await set(ref(db, `rooms/${roomId}/joinRequests/${viewerId}`), { ts: Date.now() });

    // Handle Offer
    onValue(ref(db, `rooms/${roomId}/offers/${viewerId}`), async (snap) => {
      if(!snap.exists() || !pc) return;
      await pc.setRemoteDescription(new RTCSessionDescription(snap.val()));
      const ans = await pc.createAnswer();
      await pc.setLocalDescription(ans);
      await set(ref(db, `rooms/${roomId}/answers/${viewerId}`), { sdp: ans.sdp, type: ans.type });
      
      // Process buffered candidates
      candidatesBuffer.forEach(c => pc.addIceCandidate(new RTCIceCandidate(c)));
      candidatesBuffer = [];
    });

    // Handle Host ICE
    onValue(ref(db, `rooms/${roomId}/hostIce/${viewerId}`), (snap) => {
      snap.forEach(c => {
        const cand = c.val();
        if(pc && pc.remoteDescription) pc.addIceCandidate(new RTCIceCandidate(cand));
        else candidatesBuffer.push(cand);
      });
    });
  }

  connect();
}

function applyOverlays(d) {
  const cont = document.getElementById('vImgContainer');
  cont.innerHTML = '';
  (d.images || []).forEach(img => {
    if(!img.show || !img.src) return;
    const el = document.createElement('img');
    el.src = img.src;
    el.style.cssText = `position:absolute;left:${img.x}px;top:${img.y}px;width:${img.w}px;height:${img.h}px;z-index:10;pointer-events:none`;
    cont.appendChild(el);
  });
  
  const vTxt = document.getElementById('vTextOverlay');
  const t = d.text || {};
  if(t.show) {
    vTxt.style.display = 'block';
    vTxt.textContent = t.msg;
    vTxt.style.cssText += `;left:${t.x}px;top:${t.y}px;color:${t.color};font-size:${t.size}px;background:${t.bgTransparent?'transparent':`rgba(${h2rgb(t.bgColor)},${t.bgOpacity/100})`}`;
  } else vTxt.style.display = 'none';

  const tick = d.ticker || {};
  const wrap = document.getElementById('vTickerWrap');
  if(tick.show) {
    wrap.style.display = 'block';
    document.getElementById('vTickerInner').textContent = tick.msg + " • " + tick.msg;
    wrap.style.bottom = tick.pos === 'bottom' ? '0' : 'auto';
    wrap.style.top = tick.pos === 'top' ? '0' : 'auto';
  } else wrap.style.display = 'none';
}

// --- ADMIN LOGIC ---
let db, roomId, localStream, videoTrack, audioTrack;
const peerMap = {};

window.startStream = async (type) => {
  roomId = document.getElementById('customId').value || 'ab12345';
  const facing = type === 'front' ? 'user' : 'environment';
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing }, audio: true });
    videoTrack = localStream.getVideoTracks()[0];
    document.getElementById('mainVideo').srcObject = localStream;
    document.getElementById('homeScreen').style.display = 'none';
    document.getElementById('streamScreen').style.display = 'block';
    
    const app = initializeApp(FB_CFG, 'h_'+Date.now());
    db = getDatabase(app);
    await remove(ref(db, `rooms/${roomId}`));

    onValue(ref(db, `rooms/${roomId}/joinRequests`), (snap) => {
      snap.forEach(child => {
        if(!peerMap[child.key]) createOffer(child.key);
      });
    });

    onValue(ref(db, `rooms/${roomId}/viewers`), s => document.getElementById('viewCount').textContent = s.exists() ? Object.keys(s.val()).length : 0);
    startTimer();
    toast('🔴 LIVE!');
  } catch(e) { toast('Error: ' + e.message); }
};

async function createOffer(vId) {
  const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
  peerMap[vId] = pc;
  localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

  pc.onicecandidate = (e) => {
    if(e.candidate) push(ref(db, `rooms/${roomId}/hostIce/${vId}`), e.candidate.toJSON());
  };

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  await set(ref(db, `rooms/${roomId}/offers/${vId}`), { sdp: offer.sdp, type: offer.type });

  onValue(ref(db, `rooms/${roomId}/answers/${vId}`), async (s) => {
    if(s.exists() && pc.signalingState === 'have-local-offer') {
      await pc.setRemoteDescription(new RTCSessionDescription(s.val()));
    }
  });

  onValue(ref(db, `rooms/${roomId}/viewerIce/${vId}`), (snap) => {
    snap.forEach(c => pc.addIceCandidate(new RTCIceCandidate(c.val())));
  });
}

// Admin Utils
window.toggleFlash = async () => { if(videoTrack) videoTrack.applyConstraints({ advanced: [{ torch: true }] }).catch(()=>toast('No Flash')); };
window.flipCamera = async () => { location.reload(); }; // Simplest reliable flip
window.copyLink = () => { const link = location.href.split('?')[0]+'?watch='+roomId; navigator.clipboard.writeText(link); toast('Copied!'); };
window.stopStream = () => location.reload();

function startTimer() {
  const start = Date.now();
  setInterval(() => {
    const s = Math.floor((Date.now()-start)/1000);
    document.getElementById('timerDisp').textContent = `${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`;
  }, 1000);
}

// Overlay Broadcast
let textVis = false, tickVis = false, imgSlots = [];
window.autoSendText = (v) => { textVis = !!v; document.getElementById('textOverlay').textContent = v; document.getElementById('textOverlay').style.display = v?'block':'none'; broadcast(); };
window.hideText = () => { textVis = false; document.getElementById('textInp').value=''; broadcast(); };
window.sendTicker = () => { tickVis = true; broadcast(); };
window.setTickerPos = (p) => { broadcast(); }; 

function broadcast() {
  if(!db || !roomId) return;
  set(ref(db, `rooms/${roomId}/overlays`), {
    text: { show: textVis, msg: document.getElementById('textInp').value, x: 20, y: 300, color: '#ffffff', size: 22 },
    ticker: { show: tickVis, msg: document.getElementById('tickInp').value, pos: 'bottom' },
    images: imgSlots.map(s => ({ show: s.vis, src: s.url, x: s.x, y: s.y, w: s.w, h: s.h }))
  });
}

// Tab handling
window.toggleDrawer = () => document.getElementById('drawer').classList.toggle('open');
</script>
