<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>LiveCam Pro | Full Version</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#ff2d2d;--red-dark:#c0000a;--surface:#141414;--surface2:#1e1e1e;--surface3:#252525;--border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);--text:#f0f0f0;--muted:#777;--accent:#4fc3f7}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:var(--text);font-family:'DM Sans',sans-serif}

/* VIEWER CSS */
#viewerPage{display:none;position:fixed;inset:0;background:#000;z-index:1}
#viewVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;z-index:1}
#vLoader{position:absolute;inset:0;background:#0a0a0a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:30}
.vl-logo{font-family:'Bebas Neue',sans-serif;font-size:2.2rem;letter-spacing:3px;color:#fff}
.vl-logo span{color:var(--red)}
.spinner{width:46px;height:46px;border:3px solid rgba(255,255,255,0.08);border-top-color:var(--red);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.conn-status{position:fixed;bottom:10px;left:10px;z-index:100;background:rgba(0,0,0,0.7);padding:5px 12px;border-radius:20px;font-size:11px;font-family:monospace}

/* ADMIN CSS */
#adminPage{display:none;position:fixed;inset:0;z-index:1;overflow-y:auto}
#homeScreen{min-height:100%;background:radial-gradient(ellipse at 30% 20%,#1a0000 0%,#0a0a0a 60%);display:flex;flex-direction:column;align-items:center;padding:50px 20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;width:100%;max-width:400px}
.bbtn{width:100%;padding:15px;border:none;border-radius:12px;font-weight:600;cursor:pointer;margin-bottom:9px;display:flex;align-items:center;justify-content:center;gap:10px}
.bbtn.red{background:var(--red);color:#fff}
.bbtn.dark{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.inp{width:100%;padding:13px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:#fff;margin-bottom:10px;outline:none}

/* STREAM SCREEN */
#streamScreen{display:none;position:fixed;inset:0;background:#000}
#mainVideo{width:100%;height:100%;object-fit:cover}
#adminTop{position:absolute;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;padding:12px;background:linear-gradient(to bottom,rgba(0,0,0,0.8),transparent)}
#adminBot{position:absolute;bottom:0;left:0;right:0;z-index:20;padding:15px;background:linear-gradient(to top,rgba(0,0,0,0.9),transparent)}
.crow{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}
.cbtn{width:50px;height:50px;border-radius:50%;border:none;background:rgba(255,255,255,0.1);color:#fff;font-size:1.2rem;cursor:pointer}
.stopc{width:60px;height:60px;border-radius:50%;background:var(--red);border:none;color:#fff;font-size:1.5rem}

/* OVERLAYS */
#textOverlay, #vTextOverlay{position:absolute;padding:10px 20px;border-radius:8px;display:none;z-index:15;font-weight:bold}
#tickerOverlay, #vTickerWrap{position:absolute;width:100%;background:rgba(0,0,0,0.6);padding:8px 0;overflow:hidden;display:none;z-index:15}
.tick-inner{white-space:nowrap;display:inline-block;animation:ticker 15s linear infinite}
@keyframes ticker{from{transform:translateX(100%)}to{transform:translateX(-100%)}}
</style>
</head>
<body>

<div id="viewerPage">
  <div id="vLoader">
    <div class="vl-logo">LIVE<span>CAM</span></div>
    <div class="spinner"></div>
    <div id="vLoaderTxt">Connecting...</div>
  </div>
  <video id="viewVideo" autoplay playsinline></video>
  <div id="vTextOverlay"></div>
  <div id="vTickerWrap"><div class="tick-inner" id="vTickerInner"></div></div>
  <div class="conn-status" id="connStatus">Initializing...</div>
  <button id="unmuteBtn" onclick="document.getElementById('viewVideo').muted=false;this.remove()" style="position:fixed;bottom:20px;right:20px;padding:10px 20px;z-index:100;background:var(--red);color:#fff;border:none;border-radius:20px">🔊 Unmute</button>
</div>

<div id="adminPage">
  <div id="homeScreen">
    <div class="vl-logo" style="margin-bottom:30px">LIVE<span>CAM</span> PRO</div>
    <div class="card">
      <input class="inp" id="customId" type="text" placeholder="Stream ID" value="ab12345">
      <button class="bbtn red" onclick="startStream('environment')">Back Camera Live</button>
      <button class="bbtn dark" onclick="startStream('user')">Front Camera Live</button>
    </div>
  </div>

  <div id="streamScreen">
    <video id="mainVideo" autoplay playsinline muted></video>
    <div id="adminTop">
        <div style="background:var(--red);padding:5px 15px;border-radius:20px;font-weight:bold">LIVE</div>
        <div id="timerDisp">00:00</div>
        <div>👁 <span id="viewCount">0</span></div>
    </div>
    <div id="adminBot">
        <div class="crow">
            <button class="cbtn" onclick="toggleFlash()">💡</button>
            <button class="cbtn" onclick="copyLink()">🔗</button>
            <button class="stopc" onclick="location.reload()">⏹</button>
            <button class="cbtn" onclick="waShare()">📱</button>
            <button class="cbtn" onclick="toggleMute()">🎤</button>
        </div>
        <input type="range" style="width:100%" min="1" max="5" step="0.1" oninput="applyZoom(this.value)">
    </div>
  </div>
</div>

<script type="importmap">
  {
    "imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js",
      "firebase/database": "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js"
    }
  }
</script>

<script type="module">
import { initializeApp } from 'firebase/app';
import { getDatabase, ref, set, onValue, push, remove, onChildAdded } from 'firebase/database';

const firebaseConfig = {
  apiKey: "AIzaSyCXY_layR4HtlrJTweBB5ER_uc5jkMG0sc",
  authDomain: "nikamma-4k.firebaseapp.com",
  databaseURL: "https://nikamma-4k-default-rtdb.firebaseio.com",
  projectId: "nikamma-4k",
  storageBucket: "nikamma-4k.firebasestorage.app",
  messagingSenderId: "534849542892",
  appId: "1:534849542892:web:d96322fd4811b46738e3c9"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const iceServers = [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
    { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' }
];

let localStream, roomId, videoTrack;
const peerMap = {};

// --- ADMIN LOGIC ---
window.startStream = async (facing) => {
    roomId = document.getElementById('customId').value;
    try {
        localStream = await navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: facing, width: 1280, height: 720 }, 
            audio: true 
        });
        videoTrack = localStream.getVideoTracks()[0];
        document.getElementById('mainVideo').srcObject = localStream;
        document.getElementById('adminPage').querySelector('#homeScreen').style.display = 'none';
        document.getElementById('streamScreen').style.display = 'block';

        await remove(ref(db, `rooms/${roomId}`));
        
        onValue(ref(db, `rooms/${roomId}/joinRequests`), (snap) => {
            snap.forEach(child => {
                if(!peerMap[child.key]) handleNewViewer(child.key);
            });
        });

        startTimer();
    } catch(e) { alert("Camera Error: " + e.message); }
};

async function handleNewViewer(vId) {
    const pc = new RTCPeerConnection({ iceServers });
    peerMap[vId] = pc;

    localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

    pc.onicecandidate = (e) => {
        if(e.candidate) push(ref(db, `rooms/${roomId}/hostIce/${vId}`), e.candidate.toJSON());
    };

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await set(ref(db, `rooms/${roomId}/offers/${vId}`), { sdp: offer.sdp, type: offer.type });

    onValue(ref(db, `rooms/${roomId}/answers/${vId}`), async (s) => {
        if(s.exists()) await pc.setRemoteDescription(new RTCSessionDescription(s.val()));
    });

    onChildAdded(ref(db, `rooms/${roomId}/viewerIce/${vId}`), (s) => {
        pc.addIceCandidate(new RTCIceCandidate(s.val()));
    });
}

// --- VIEWER LOGIC ---
async function initViewer(rId) {
    const vId = 'v' + Math.floor(Math.random()*10000);
    const pc = new RTCPeerConnection({ iceServers });
    
    pc.onicecandidate = (e) => {
        if(e.candidate) push(ref(db, `rooms/${rId}/viewerIce/${vId}`), e.candidate.toJSON());
    };

    pc.ontrack = (e) => {
        document.getElementById('viewVideo').srcObject = e.streams[0];
        document.getElementById('vLoader').style.display = 'none';
        document.getElementById('connStatus').textContent = 'Connected';
    };

    await set(ref(db, `rooms/${rId}/joinRequests/${vId}`), { join: true });

    onValue(ref(db, `rooms/${rId}/offers/${vId}`), async (s) => {
        if(!s.exists()) return;
        await pc.setRemoteDescription(new RTCSessionDescription(s.val()));
        const ans = await pc.createAnswer();
        await pc.setLocalDescription(ans);
        await set(ref(db, `rooms/${rId}/answers/${vId}`), { sdp: ans.sdp, type: ans.type });
    });

    onChildAdded(ref(db, `rooms/${rId}/hostIce/${vId}`), (s) => {
        pc.addIceCandidate(new RTCIceCandidate(s.val()));
    });
}

// --- UTILS ---
window.copyLink = () => {
    const link = window.location.href.split('?')[0] + '?watch=' + roomId;
    navigator.clipboard.writeText(link);
    alert("Link Copied!");
};

window.waShare = () => {
    const link = window.location.href.split('?')[0] + '?watch=' + roomId;
    window.open(`https://wa.me/?text=Live Stream Join Karein: ${link}`);
};

window.applyZoom = (val) => {
    if(videoTrack) videoTrack.applyConstraints({ advanced: [{ zoom: val }] });
};

function startTimer() {
    let s = 0;
    setInterval(() => {
        s++;
        let m = Math.floor(s/60);
        let sec = s%60;
        document.getElementById('timerDisp').textContent = `${m}:${sec<10?'0':''}${sec}`;
    }, 1000);
}

// Check URL for Viewer
const urlParams = new URLSearchParams(window.location.search);
if(urlParams.has('watch')) {
    document.getElementById('viewerPage').style.display = 'block';
    initViewer(urlParams.get('watch'));
} else {
    document.getElementById('adminPage').style.display = 'block';
}
</script>
</body>
</html>
