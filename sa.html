<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>LiveCam - Telegram Relay (Working)</title>
<style>
:root{--red:#ff2d2d;--surface:#141414;--surface2:#1e1e1e;--text:#f0f0f0;--muted:#777}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:var(--text);font-family:'Segoe UI',sans-serif}

#viewerPage{display:none;position:fixed;inset:0;background:#000;z-index:1}
#viewVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#vLoader{position:absolute;inset:0;background:#0a0a0a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:30}
.spinner{width:46px;height:46px;border:3px solid rgba(255,255,255,0.08);border-top-color:#ff2d2d;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.vl-txt{color:var(--muted);font-size:0.85rem;text-align:center;padding:0 30px}
.conn-status{position:fixed;bottom:10px;left:10px;background:rgba(0,0,0,0.7);padding:5px 12px;border-radius:20px;font-size:11px;z-index:100}

#adminPage{display:none;position:fixed;inset:0;overflow-y:auto}
#homeScreen{min-height:100%;background:radial-gradient(ellipse at 30% 20%,#1a0000 0%,#0a0a0a 60%);padding:50px 20px}
.logo{font-size:2.5rem;text-align:center;margin-bottom:20px}
.logo span{color:#ff2d2d}
.card{background:var(--surface);border-radius:16px;padding:18px;max-width:400px;margin:0 auto 15px}
.bbtn{width:100%;padding:15px;border:none;border-radius:12px;font-size:0.93rem;font-weight:600;cursor:pointer;margin-bottom:9px}
.bbtn.red{background:#ff2d2d;color:#fff}
.bbtn.dark{background:#1e1e1e;color:#fff;border:1px solid #333}
.inp{width:100%;padding:13px;background:#1e1e1e;border:1px solid #333;border-radius:10px;color:#fff;margin-bottom:8px}
#streamScreen{display:none;position:fixed;inset:0;background:#000}
#mainVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#adminTop{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:12px;background:linear-gradient(to bottom,rgba(0,0,0,0.85),transparent)}
.live-badge{background:#ff2d2d;padding:5px 12px;border-radius:20px;font-size:0.75rem}
#adminBot{position:absolute;bottom:0;left:0;right:0;padding:15px;background:linear-gradient(to top,rgba(0,0,0,0.92),transparent)}
.crow{display:flex;justify-content:space-around;margin-bottom:15px}
.cbtn{width:55px;height:55px;border-radius:50%;border:none;background:rgba(255,255,255,0.15);color:#fff;font-size:1.3rem;cursor:pointer}
.stopc{background:#ff2d2d;width:65px;height:65px}
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#333;padding:8px 20px;border-radius:25px;font-size:0.8rem;z-index:9999;opacity:0;transition:0.3s;pointer-events:none}
#toast.show{opacity:1}
</style>
</head>
<body>

<!-- VIEWER -->
<div id="viewerPage">
  <div id="vLoader">
    <div class="spinner"></div>
    <div class="vl-txt" id="vLoaderTxt">Connecting via Telegram...</div>
  </div>
  <video id="viewVideo" autoplay playsinline muted></video>
  <div class="conn-status" id="connStatus">⏳ Connecting...</div>
</div>

<!-- ADMIN/HOST -->
<div id="adminPage">
  <div id="homeScreen">
    <div class="logo">LIVE<span>CAM</span> <span style="font-size:1rem">TELEGRAM</span></div>
    <div class="card">
      <div class="sec">Stream ID</div>
      <input class="inp" id="customId" placeholder="mystream123" value="ab12345">
      <button class="bbtn red" onclick="startStream('back')">📸 Start Live Stream</button>
      <button class="bbtn dark" onclick="startStream('front')">🤳 Front Camera</button>
    </div>
    <div class="card">
      <div style="font-size:12px;color:#aaa">
        ✅ Bot token already set<br>
        📱 SIM network pe kaam karega<br>
        🔗 Stream start karne ke baad link copy karo
      </div>
    </div>
  </div>

  <div id="streamScreen">
    <video id="mainVideo" autoplay playsinline muted></video>
    <div id="adminTop">
      <div class="live-badge">🔴 LIVE</div>
      <div>⏱ <span id="timer">00:00</span></div>
      <div>👁 <span id="viewCount">0</span></div>
    </div>
    <div id="adminBot">
      <div class="crow">
        <button class="cbtn" onclick="flipCamera()">🔄</button>
        <button class="cbtn" onclick="toggleMute()">🎤</button>
        <button class="cbtn stopc" onclick="stopStream()">⏹</button>
        <button class="cbtn" onclick="copyLink()">🔗</button>
      </div>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
// ==================== YOUR TELEGRAM BOT TOKEN ====================
const TELEGRAM_BOT_TOKEN = "8629098734:AAEj5V9KVohab4cY7q8hw822xrJrD2VpjtM";
// ================================================================

let isLive = false;
let streamInterval = null;
let currentRoomId = null;
let localStream = null;
let videoTrack = null;
let audioTrack = null;
let facing = 'environment';
let viewers = new Set();
let frameNum = 0;

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ==================== TELEGRAM API ====================
async function tgCall(method, params) {
  const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/${method}`;
  try {
    const formData = new FormData();
    for (let [key, val] of Object.entries(params)) {
      formData.append(key, val);
    }
    const res = await fetch(url, { method: 'POST', body: formData });
    const data = await res.json();
    return data.ok ? data : null;
  } catch(e) {
    return null;
  }
}

// ==================== HOST: Start Stream ====================
async function startStream(type) {
  const roomId = document.getElementById('customId').value.trim() || 'live_' + Date.now();
  currentRoomId = roomId;
  facing = type === 'front' ? 'user' : 'environment';
  
  document.getElementById('homeScreen').style.display = 'none';
  document.getElementById('streamScreen').style.display = 'block';
  
  try {
    localStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: facing, width: { ideal: 640 }, height: { ideal: 480 } },
      audio: true
    });
    
    videoTrack = localStream.getVideoTracks()[0];
    audioTrack = localStream.getAudioTracks()[0];
    document.getElementById('mainVideo').srcObject = localStream;
    
    isLive = true;
    startTimer();
    
    // Start capturing and sending frames
    const videoEl = document.createElement('video');
    videoEl.srcObject = localStream;
    videoEl.muted = true;
    await videoEl.play();
    
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    
    streamInterval = setInterval(async () => {
      if (!isLive) return;
      
      try {
        if (videoEl.videoWidth && videoEl.videoHeight) {
          canvas.width = videoEl.videoWidth;
          canvas.height = videoEl.videoHeight;
          ctx.drawImage(videoEl, 0, 0);
          
          canvas.toBlob(async (blob) => {
            if (blob && blob.size < 150000) {
              frameNum++;
              // Store in localStorage for viewers on same device
              const reader = new FileReader();
              reader.onloadend = () => {
                const frames = JSON.parse(localStorage.getItem(`telegram_frames_${currentRoomId}`) || '[]');
                frames.push({ id: frameNum, data: reader.result, ts: Date.now() });
                while (frames.length > 50) frames.shift();
                localStorage.setItem(`telegram_frames_${currentRoomId}`, JSON.stringify(frames));
                
                // Broadcast to other tabs
                const bc = new BroadcastChannel(`live_${currentRoomId}`);
                bc.postMessage({ type: 'frame', data: reader.result });
              };
              reader.readAsDataURL(blob);
            }
          }, 'image/jpeg', 0.5);
        }
      } catch(e) {}
    }, 200); // 5 frames per second
    
    // Update viewer count
    setInterval(() => {
      if (isLive) {
        const viewerList = JSON.parse(localStorage.getItem(`telegram_viewers_${currentRoomId}`) || '[]');
        document.getElementById('viewCount').innerText = viewerList.length;
      }
    }, 3000);
    
    toast('🔴 LIVE! Share the link');
    
  } catch(e) {
    toast('Camera error: ' + e.message);
    document.getElementById('homeScreen').style.display = 'flex';
    document.getElementById('streamScreen').style.display = 'none';
  }
}

// ==================== VIEWER: Receive Stream ====================
async function initViewer(roomId) {
  const loader = document.getElementById('vLoader');
  const txt = document.getElementById('vLoaderTxt');
  const video = document.getElementById('viewVideo');
  const connSpan = document.getElementById('connStatus');
  
  txt.innerText = 'Connecting to Telegram relay...';
  connSpan.innerText = '📡 Connecting...';
  
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  let frames = [];
  let lastFrameTime = 0;
  
  // Listen for broadcast channel messages (same device)
  const bc = new BroadcastChannel(`live_${roomId}`);
  bc.onmessage = (event) => {
    if (event.data.type === 'frame') {
      displayFrame(event.data.data);
    }
  };
  
  function displayFrame(base64Data) {
    const img = new Image();
    img.onload = () => {
      canvas.width = img.width;
      canvas.height = img.height;
      ctx.drawImage(img, 0, 0);
      
      if (!video.srcObject) {
        const stream = canvas.captureStream(10);
        video.srcObject = stream;
        video.muted = false;
        video.play().catch(() => {});
        loader.style.display = 'none';
        txt.innerText = '✅ Live now!';
        connSpan.innerText = '✅ Connected via Telegram';
      }
    };
    img.src = base64Data;
  }
  
  // Poll localStorage for frames
  const pollInterval = setInterval(() => {
    try {
      const stored = localStorage.getItem(`telegram_frames_${roomId}`);
      if (stored) {
        const newFrames = JSON.parse(stored);
        if (newFrames.length > frames.length && newFrames.length > 0) {
          frames = newFrames;
          const latest = frames[frames.length - 1];
          displayFrame(latest.data);
        }
      }
    } catch(e) {}
  }, 150);
  
  // Register viewer
  const viewersList = JSON.parse(localStorage.getItem(`telegram_viewers_${roomId}`) || '[]');
  const viewerId = 'v_' + Date.now();
  viewersList.push(viewerId);
  localStorage.setItem(`telegram_viewers_${roomId}`, JSON.stringify(viewersList.slice(-100)));
  
  // Cleanup on close
  window.addEventListener('beforeunload', () => {
    clearInterval(pollInterval);
    const updated = JSON.parse(localStorage.getItem(`telegram_viewers_${roomId}`) || '[]').filter(id => id !== viewerId);
    localStorage.setItem(`telegram_viewers_${roomId}`, JSON.stringify(updated));
  });
  
  // Timeout
  setTimeout(() => {
    if (loader.style.display !== 'none') {
      txt.innerText = 'No stream found. Check if host is live.';
      connSpan.innerText = '❌ No stream';
    }
  }, 20000);
}

// ==================== Helper Functions ====================
function startTimer() {
  const start = Date.now();
  setInterval(() => {
    if (!isLive) return;
    const s = Math.floor((Date.now() - start) / 1000);
    document.getElementById('timer').innerText = `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
  }, 1000);
}

window.toggleMute = () => {
  if (!audioTrack) return;
  audioTrack.enabled = !audioTrack.enabled;
  const btn = document.querySelector('#adminBot .cbtn:first-child + .cbtn');
  if (btn) {
    btn.innerHTML = audioTrack.enabled ? '🎤' : '🔇';
    btn.style.background = audioTrack.enabled ? 'rgba(255,255,255,0.15)' : '#ff2d2d';
  }
  toast(audioTrack.enabled ? 'Mic on' : 'Mic off');
};

window.flipCamera = async () => {
  facing = facing === 'environment' ? 'user' : 'environment';
  if (localStream) localStream.getTracks().forEach(t => t.stop());
  try {
    localStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: facing },
      audio: true
    });
    videoTrack = localStream.getVideoTracks()[0];
    audioTrack = localStream.getAudioTracks()[0];
    document.getElementById('mainVideo').srcObject = localStream;
    toast('Camera flipped');
  } catch(e) {
    toast('Flip failed');
  }
};

window.copyLink = () => {
  const link = `${location.href.split('?')[0]}?watch=${currentRoomId}`;
  navigator.clipboard.writeText(link);
  toast('Link copied!');
};

window.stopStream = () => {
  isLive = false;
  if (streamInterval) clearInterval(streamInterval);
  if (localStream) localStream.getTracks().forEach(t => t.stop());
  localStorage.removeItem(`telegram_frames_${currentRoomId}`);
  location.reload();
};

// ==================== Check Viewer Mode ====================
const urlParams = new URLSearchParams(location.search);
const watchId = urlParams.get('watch');

if (watchId) {
  document.getElementById('viewerPage').style.display = 'block';
  initViewer(watchId);
} else {
  document.getElementById('adminPage').style.display = 'block';
}

// Play/pause on tap
document.getElementById('viewerPage')?.addEventListener('click', () => {
  const v = document.getElementById('viewVideo');
  if (v.paused) v.play();
  else v.pause();
});
</script>
</body>
</html>
