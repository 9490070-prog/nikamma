<title>LiveCam Pro</title>

<style>
/* AAPKA POORA 1200+ LINES KA ORIGINAL CSS */
:root{--red:#ff2d2d;--red-dark:#c0000a;--surface:#141414;--surface2:#1e1e1e;--surface3:#252525;--border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);--text:#f0f0f0;--muted:#777;--accent:#4fc3f7}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:var(--text);font-family:'DM Sans',sans-serif}

/* VIEWER STYLES */
#viewerPage{display:none;position:fixed;inset:0;background:#000;z-index:1}
#viewVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;z-index:1}
.vOverlayImg{position:absolute;object-fit:contain;display:none;filter:drop-shadow(0 2px 12px rgba(0,0,0,0.9));border-radius:6px;pointer-events:none;z-index:10}
#vTextOverlay{position:absolute;display:none;pointer-events:none;z-index:11;white-space:pre-wrap;word-break:break-word;line-height:1.4;padding:8px 18px;border-radius:8px}
#vTickerWrap{position:absolute;left:0;right:0;overflow:hidden;pointer-events:none;display:none;z-index:11;padding:9px 0}
.tick-i{white-space:nowrap;display:inline-block;font-weight:600;color:#fff;padding-left:100%}
.tick-ltr{animation:ticker-ltr 18s linear infinite}
.tick-rtl{animation:ticker-rtl 18s linear infinite}
@keyframes ticker-ltr{from{transform:translateX(-100%)}to{transform:translateX(100vw)}}
@keyframes ticker-rtl{from{transform:translateX(0)}to{transform:translateX(-100%)}}
#vPlayIcon{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:25;pointer-events:none;width:88px;height:88px;border-radius:50%;background:rgba(0,0,0,0.55);backdrop-filter:blur(10px);border:2px solid rgba(255,255,255,0.25);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 0.3s ease}
#vLoader{position:absolute;inset:0;background:#0a0a0a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:30}
.vl-logo{font-family:'Bebas Neue',sans-serif;font-size:2.2rem;letter-spacing:3px;color:#fff}
.vl-logo span{color:var(--red)}
.spinner{width:46px;height:46px;border:3px solid rgba(255,255,255,0.08);border-top-color:var(--red);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.retry-btn{padding:10px 24px;background:var(--red);border:none;border-radius:10px;color:#fff;font-size:0.88rem;cursor:pointer;display:none;margin-top:4px}
.conn-status{position:fixed;bottom:10px;left:10px;z-index:100;background:rgba(0,0,0,0.7);padding:5px 12px;border-radius:20px;font-size:11px;font-family:monospace;pointer-events:none}

/* ADMIN UI */
#adminPage{display:none;position:fixed;inset:0;z-index:1;overflow-y:auto}
#homeScreen{min-height:100%;background:radial-gradient(ellipse at 30% 20%,#1a0000 0%,#0a0a0a 60%);display:flex;flex-direction:column;align-items:center;padding:50px 20px 40px}
.logo-t{font-family:'Bebas Neue',sans-serif;font-size:3rem;letter-spacing:4px;text-align:center;line-height:1}
.logo-t span{color:var(--red)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;width:100%;max-width:400px;margin-bottom:12px}
.bbtn{width:100%;padding:15px;border:none;border-radius:12px;font-size:0.93rem;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:9px}
.bbtn.red{background:var(--red);color:#fff}
.bbtn.dark{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.inp{width:100%;padding:13px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text);outline:none;margin-bottom:8px}

/* ... Yahan se aapka baaqi poora 1200+ lines ka CSS continue hoga ... */
/* Drawer, Tabs, Image Slots, Text Style sab wahi hain jo aapki file mein thay */

// Fix: Improved WebRTC Signaling without changing your features
async function initPeerConnection(viewerId) {
    // Ye function sirf host side par viewer se connect karne ke liye hai
    const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
    peerMap[viewerId] = { pc: pc };

    localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

    pc.onicecandidate = (e) => {
        if(e.candidate) push(ref(db, `rooms/${roomId}/host_ice/${viewerId}`), e.candidate.toJSON());
    };

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await set(ref(db, `rooms/${roomId}/offers/${viewerId}`), { sdp: offer.sdp, type: offer.type });

    onValue(ref(db, `rooms/${roomId}/answers/${viewerId}`), async (snap) => {
        if(snap.exists() && pc.signalingState === "have-local-offer") {
            await pc.setRemoteDescription(new RTCSessionDescription(snap.val()));
        }
    });

    onChildAdded(ref(db, `rooms/${roomId}/viewer_ice/${viewerId}`), (snap) => {
        pc.addIceCandidate(new RTCIceCandidate(snap.val()));
    });
}
