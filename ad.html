<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎯 GIF Banner Pro · HD/4K Quality</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        :root {
            --bg-primary: #0a0a16;
            --bg-secondary: #12122a;
            --bg-card: #1a1a3a;
            --accent: #f5a623;
            --accent-glow: rgba(245, 166, 35, 0.4);
            --text-main: #f0f0ff;
            --text-muted: #8e8eb0;
            --success: #00e676;
            --danger: #ff4d6d;
            --border-subtle: rgba(255,255,255,0.06);
            --gradient-btn: linear-gradient(135deg, #f5a623, #f57c00);
        }
        body {
            background: var(--bg-primary);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            padding: 8px;
            color: var(--text-main);
        }
        .box {
            background: var(--bg-secondary);
            padding: 14px 16px;
            border-radius: 20px;
            max-width: 1200px;
            width: 100%;
            border: 1px solid rgba(255,255,255,0.03);
            box-shadow: 0 30px 60px rgba(0,0,0,0.7);
        }
        h2 {
            font-size: clamp(16px, 3vw, 24px);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 0 0 8px 0;
            letter-spacing: -0.5px;
            flex-wrap: wrap;
        }
        h2 span {
            background: linear-gradient(135deg, #fff 30%, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .top-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 5px;
            background: rgba(0,0,0,0.3);
            padding: 8px 10px;
            border-radius: 12px;
            margin-bottom: 8px;
            border: 1px solid var(--border-subtle);
        }
        .top-row .item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .top-row .item label {
            font-size: 7px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: var(--text-muted);
            font-weight: 600;
        }
        .top-row .item input[type="number"],
        .top-row .item input[type="text"] {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            padding: 3px 5px;
            border-radius: 5px;
            color: #fff;
            font-size: 10px;
            outline: none;
            width: 100%;
        }
        .top-row .item input:focus {
            border-color: var(--accent);
        }
        .top-row .item input[type="color"] {
            width: 28px;
            height: 24px;
            border: none;
            padding: 0;
            border-radius: 5px;
            background: transparent;
            cursor: pointer;
        }
        .top-row .item .color-wrapper {
            display: flex;
            gap: 3px;
            align-items: center;
        }
        .top-row .item .color-wrapper input[type="text"] {
            width: 40px;
            padding: 2px 3px;
            font-size: 8px;
        }
        .file-upload-btn {
            background: var(--bg-card);
            border: 1px dashed rgba(255,255,255,0.2);
            padding: 3px 6px;
            border-radius: 5px;
            text-align: center;
            font-size: 9px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            color: var(--text-muted);
        }
        .file-upload-btn:hover {
            background: rgba(255,255,255,0.05);
            border-color: var(--accent);
        }

        /* Image Custom Panel - Text Boxes Only */
        .image-custom-panel {
            background: rgba(0,0,0,0.35);
            border-radius: 12px;
            padding: 8px 10px;
            margin-bottom: 8px;
            border: 1px solid var(--border-subtle);
            display: none;
        }
        .image-custom-panel.active {
            display: block;
        }
        .image-custom-panel .panel-title {
            font-size: 10px;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 5px;
            flex-wrap: wrap;
        }
        .image-custom-panel .custom-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 4px;
        }
        .image-custom-panel .custom-grid .ctrl {
            display: flex;
            flex-direction: column;
            gap: 1px;
        }
        .image-custom-panel .custom-grid .ctrl label {
            font-size: 6.5px;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        .image-custom-panel .custom-grid .ctrl input[type="number"],
        .image-custom-panel .custom-grid .ctrl input[type="text"] {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            padding: 2px 4px;
            border-radius: 4px;
            color: #fff;
            font-size: 9px;
            outline: none;
            width: 100%;
        }
        .image-custom-panel .custom-grid .ctrl input:focus {
            border-color: var(--accent);
        }
        .image-custom-panel .custom-grid .ctrl select {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            padding: 2px 3px;
            border-radius: 4px;
            color: #fff;
            font-size: 7px;
            outline: none;
            cursor: pointer;
            width: 100%;
        }
        .image-custom-panel .custom-grid .ctrl .btn-small {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            color: #fff;
            padding: 1px 4px;
            border-radius: 3px;
            font-size: 7px;
            cursor: pointer;
            transition: 0.15s;
        }
        .image-custom-panel .custom-grid .ctrl .btn-small:hover {
            background: rgba(255,255,255,0.1);
            border-color: var(--accent);
        }
        .image-custom-panel .custom-grid .ctrl .btn-small.danger {
            border-color: var(--danger);
            color: var(--danger);
        }
        .image-custom-panel .custom-grid .ctrl .btn-small.danger:hover {
            background: var(--danger);
            color: #fff;
        }
        .image-custom-panel .custom-grid .ctrl .btn-group {
            display: flex;
            gap: 2px;
            flex-wrap: wrap;
        }

        .text-rows-container {
            background: rgba(0,0,0,0.2);
            padding: 5px;
            border-radius: 8px;
            max-height: 150px;
            overflow-y: auto;
            margin-bottom: 6px;
            border: 1px solid var(--border-subtle);
        }
        .text-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 2px;
            background: var(--bg-card);
            padding: 3px 5px;
            border-radius: 6px;
            margin-bottom: 3px;
            border: 1px solid rgba(255,255,255,0.02);
        }
        .text-row input.layer-text {
            flex: 2;
            min-width: 40px;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border-subtle);
            padding: 2px 4px;
            border-radius: 3px;
            color: #fff;
            font-size: 9px;
            outline: none;
        }
        .text-row input.layer-text:focus {
            border-color: var(--accent);
        }
        .text-row .input-group-custom {
            display: flex;
            align-items: center;
            background: rgba(0,0,0,0.25);
            border-radius: 3px;
            padding-left: 2px;
            border: 1px solid var(--border-subtle);
        }
        .text-row .input-group-custom span {
            font-size: 5px;
            color: var(--text-muted);
            font-weight: 700;
        }
        .text-row .input-group-custom input[type="number"] {
            width: 20px;
            padding: 1px 1px;
            border: none;
            background: transparent;
            color: #fff;
            font-size: 8px;
            text-align: center;
            outline: none;
        }
        .text-row select {
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border-subtle);
            padding: 1px 2px;
            border-radius: 3px;
            color: #fff;
            font-size: 7px;
            outline: none;
            cursor: pointer;
        }
        .text-row input[type="color"] {
            width: 16px;
            height: 16px;
            padding: 0;
            border: none;
            border-radius: 3px;
            background: transparent;
            cursor: pointer;
        }
        .btn-del {
            background: var(--danger);
            border: none;
            color: white;
            padding: 1px 4px;
            border-radius: 3px;
            font-weight: 700;
            cursor: pointer;
            font-size: 8px;
        }
        .btn-del:hover { background: #e03a5a; }
        .btn-add {
            background: rgba(255,255,255,0.03);
            border: 1px dashed rgba(255,255,255,0.15);
            color: var(--text-muted);
            padding: 4px;
            width: 100%;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 6px;
            font-size: 9px;
        }
        .btn-add:hover {
            background: rgba(255,255,255,0.06);
            color: #fff;
            border-color: var(--accent);
        }
        .actions-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            justify-content: center;
            margin-bottom: 6px;
        }
        .btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-subtle);
            color: #fff;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 9px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn:hover { transform: translateY(-1px); background: rgba(255,255,255,0.1); }
        .btn-primary {
            background: var(--gradient-btn);
            border: none;
            color: #000;
            font-weight: 700;
        }
        .btn-primary:hover { box-shadow: 0 3px 12px var(--accent-glow); }
        .btn-g { background: linear-gradient(135deg, #00d2ff, #0088ff); border: none; }

        .canvas-container {
            background: #000;
            padding: 3px;
            border-radius: 8px;
            margin: 4px 0 2px;
            border: 1px solid var(--border-subtle);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            width: 100%;
        }
        .canvas-container canvas {
            border-radius: 5px;
            display: block;
            cursor: grab;
            max-width: 100%;
            height: auto;
            image-rendering: auto;
        }
        .drag-hint {
            font-size: 7px;
            color: var(--accent);
            text-align: center;
            margin-top: 1px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }
        .status-box {
            background: rgba(0,0,0,0.3);
            border-radius: 6px;
            padding: 4px 6px;
            margin-top: 4px;
        }
        .status { font-weight: 600; font-size: 9px; }
        .progress { width: 100%; height: 2px; background: #1e1e3a; border-radius: 20px; margin: 2px 0 1px; display: none; overflow: hidden; }
        .progress .fill { height: 100%; width: 0%; background: linear-gradient(90deg, #00d2ff, var(--accent)); }
        .plabel { color: var(--text-muted); font-size: 8px; display: none; }
        ::-webkit-scrollbar { width: 2px; }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 8px; }

        @media (max-width: 600px) {
            .box { padding: 8px; }
            .top-row { grid-template-columns: repeat(2, 1fr); }
            .image-custom-panel .custom-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 400px) {
            .top-row { grid-template-columns: 1fr; }
            .image-custom-panel .custom-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>
<div class="box">
    <h2>🎯 <span>GIF Pro · HD/4K Quality</span></h2>

    <!-- TOP CONTROLS -->
    <div class="top-row">
        <div class="item">
            <label>Width (px)</label>
            <input type="number" id="bannerWidth" value="600" min="100" max="4000" oninput="updateCanvasSize()">
        </div>
        <div class="item">
            <label>Height (px)</label>
            <input type="number" id="bannerHeight" value="300" min="100" max="4000" oninput="updateCanvasSize()">
        </div>
        <div class="item">
            <label>GIF Quality</label>
            <select id="gifQuality" onchange="updateQuality()">
                <option value="low">Low (240p)</option>
                <option value="medium" selected>Medium (480p)</option>
                <option value="high">High (720p)</option>
                <option value="hd">HD (1080p)</option>
                <option value="4k">4K (2160p)</option>
            </select>
        </div>
        <div class="item">
            <label>Background</label>
            <div class="color-wrapper">
                <input type="color" id="bannerBg" value="#0b0b1a" oninput="updateBg()">
                <input type="text" id="bannerBgHex" value="#0b0b1a" readonly>
            </div>
        </div>
        <div class="item">
            <label>Upload Image</label>
            <label for="gifUpload" class="file-upload-btn">📂 Choose</label>
            <input type="file" id="gifUpload" accept="image/*" style="display:none;" onchange="handleImageUpload(event)">
        </div>
    </div>

    <!-- IMAGE CUSTOM PANEL - Text Boxes Only -->
    <div class="image-custom-panel" id="imageCustomPanel">
        <div class="panel-title">
            🎨 Image Customization
            <span style="font-size:7px;color:var(--text-muted);font-weight:400;margin-left:3px;">
                W: <span id="imgWidthDisplay">200</span> | H: <span id="imgHeightDisplay">200</span>
            </span>
        </div>
        <div class="custom-grid">
            <!-- Image Width & Height - Text Boxes -->
            <div class="ctrl">
                <label>Image Width</label>
                <input type="number" id="imgWidth" value="200" min="10" max="1000" oninput="updateImageSize()">
            </div>
            <div class="ctrl">
                <label>Image Height</label>
                <input type="number" id="imgHeight" value="200" min="10" max="1000" oninput="updateImageSize()">
            </div>
            <div class="ctrl">
                <label>Brightness</label>
                <input type="number" id="imgBrightness" value="0" min="-100" max="100" oninput="applyFilters()">
            </div>
            <div class="ctrl">
                <label>Contrast</label>
                <input type="number" id="imgContrast" value="0" min="-100" max="100" oninput="applyFilters()">
            </div>
            <div class="ctrl">
                <label>Saturation</label>
                <input type="number" id="imgSaturation" value="0" min="-100" max="100" oninput="applyFilters()">
            </div>
            <div class="ctrl">
                <label>Blur</label>
                <input type="number" id="imgBlur" value="0" min="0" max="20" oninput="applyFilters()">
            </div>
            <div class="ctrl">
                <label>Opacity %</label>
                <input type="number" id="imgOpacity" value="100" min="10" max="100" oninput="applyFilters()">
            </div>
            <div class="ctrl">
                <label>Corner Radius</label>
                <input type="number" id="imgRadius" value="0" min="0" max="50" oninput="applyFilters()">
            </div>
            <div class="ctrl">
                <label>Border Width</label>
                <input type="number" id="imgBorder" value="0" min="0" max="10" oninput="applyFilters()">
            </div>
            <div class="ctrl">
                <label>Border Color</label>
                <input type="color" id="imgBorderColor" value="#f5a623" oninput="applyFilters()" style="width:100%;height:20px;padding:0;border:none;background:transparent;cursor:pointer;">
            </div>
            <div class="ctrl">
                <label>Shadow Blur</label>
                <input type="number" id="imgShadow" value="0" min="0" max="30" oninput="applyFilters()">
            </div>
            <div class="ctrl">
                <label>Animation Time (sec)</label>
                <input type="number" id="animTime" value="8" min="1" max="30" oninput="applyFilters()">
            </div>
            <div class="ctrl">
                <label>Image Animation</label>
                <select id="imgAnimation" onchange="applyFilters()">
                    <optgroup label="⭐ Basic">
                        <option value="none">None</option>
                        <option value="zoom">Zoom</option>
                        <option value="rotate">Rotate</option>
                        <option value="bounce">Bounce</option>
                        <option value="fade">Fade</option>
                        <option value="slide">Slide</option>
                    </optgroup>
                    <optgroup label="🌀 Wave & Pulse">
                        <option value="wave">Wave</option>
                        <option value="pulse">Pulse</option>
                        <option value="heartbeat">Heartbeat</option>
                        <option value="ripple">Ripple</option>
                    </optgroup>
                    <optgroup label="🎯 Spin & Flip">
                        <option value="spin">Spin</option>
                        <option value="flip">Flip</option>
                        <option value="tilt">Tilt</option>
                        <option value="wobble">Wobble</option>
                    </optgroup>
                    <optgroup label="🌟 Glow & Shine">
                        <option value="glow">Glow</option>
                        <option value="shine">Shine</option>
                        <option value="neon">Neon</option>
                        <option value="sparkle">Sparkle</option>
                    </optgroup>
                    <optgroup label="🎨 Color Effects">
                        <option value="hueShift">Hue Shift</option>
                        <option value="colorPulse">Color Pulse</option>
                        <option value="rainbow">Rainbow</option>
                        <option value="chromatic">Chromatic</option>
                    </optgroup>
                    <optgroup label="🏃 Motion">
                        <option value="swing">Swing</option>
                        <option value="sway">Sway</option>
                        <option value="drift">Drift</option>
                        <option value="float">Float</option>
                        <option value="hover">Hover</option>
                    </optgroup>
                    <optgroup label="💥 Dynamic">
                        <option value="shake">Shake</option>
                        <option value="jitter">Jitter</option>
                        <option value="pop">Pop</option>
                        <option value="explode">Explode</option>
                        <option value="morph">Morph</option>
                    </optgroup>
                    <optgroup label="🌀 Complex">
                        <option value="spiral">Spiral</option>
                        <option value="sineWave">Sine Wave</option>
                        <option value="figure8">Figure 8</option>
                        <option value="butterfly">Butterfly</option>
                        <option value="zigzag">Zigzag</option>
                    </optgroup>
                    <optgroup label="✨ Special">
                        <option value="blink">Blink</option>
                        <option value="pulseGlow">Pulse Glow</option>
                        <option value="rainbowGlow">Rainbow Glow</option>
                        <option value="neonPulse">Neon Pulse</option>
                        <option value="fire">Fire</option>
                        <option value="water">Water</option>
                        <option value="wind">Wind</option>
                        <option value="earth">Earth</option>
                    </optgroup>
                </select>
            </div>
            <div class="ctrl">
                <label>Flip</label>
                <div class="btn-group">
                    <button class="btn-small" onclick="flipImage('horizontal')">↔H</button>
                    <button class="btn-small" onclick="flipImage('vertical')">↕V</button>
                </div>
            </div>
            <div class="ctrl">
                <label>Rotate</label>
                <div class="btn-group">
                    <button class="btn-small" onclick="rotateImage(90)">90°</button>
                    <button class="btn-small" onclick="rotateImage(180)">180°</button>
                    <button class="btn-small" onclick="rotateImage(270)">270°</button>
                    <button class="btn-small danger" onclick="resetFilters()">↺</button>
                </div>
            </div>
            <div class="ctrl">
                <label>GIF Frames</label>
                <input type="number" id="gifFrames" value="20" min="5" max="60" oninput="applyFilters()">
            </div>
        </div>
    </div>

    <div class="text-rows-container" id="rowsContainer"></div>
    <button class="btn-add" onclick="addNewRow()">➕ Add Text Layer</button>

    <div class="actions-bar">
        <button class="btn btn-primary" onclick="preview()">⚡ Preview</button>
        <button class="btn" onclick="downloadPNG()">📸 PNG</button>
        <button class="btn btn-g" onclick="downloadGIF()">⬇️ GIF</button>
    </div>

    <div class="canvas-container">
        <canvas id="c" width="600" height="300"></canvas>
    </div>
    <div class="drag-hint">👆 Drag image or text on canvas to reposition</div>

    <div class="status-box">
        <div class="progress" id="progress"><div class="fill" id="fill"></div></div>
        <div class="plabel" id="plabel">Processing...</div>
        <div class="status" id="status">✅ Upload image · Text boxes for precise control</div>
    </div>
</div>
<script>
    (function(){
        const c = document.getElementById('c');
        const ctx = c.getContext('2d');
        const statusEl = document.getElementById('status');
        const progress = document.getElementById('progress');
        const fill = document.getElementById('fill');
        const plabel = document.getElementById('plabel');
        const rowsContainer = document.getElementById('rowsContainer');
        const bannerWidthInput = document.getElementById('bannerWidth');
        const bannerHeightInput = document.getElementById('bannerHeight');
        const bannerBgInput = document.getElementById('bannerBg');
        const bannerBgHex = document.getElementById('bannerBgHex');
        const imageCustomPanel = document.getElementById('imageCustomPanel');
        const gifQualitySelect = document.getElementById('gifQuality');

        // Image filters state
        let imageFilters = {
            brightness: 0, contrast: 0, saturation: 0, blur: 0,
            opacity: 100, radius: 0, border: 0, borderColor: '#f5a623',
            shadow: 0, flipH: false, flipV: false, rotate: 0,
            animation: 'none', animTime: 8,
            imgWidth: 200, imgHeight: 200,
            gifFrames: 20
        };

        let uploadedImage = null;
        let imageConfig = { x: 0, y: 0, width: 200, height: 200 };
        let isDragging = false;
        let draggedElement = null;
        let dragOffset = { x: 0, y: 0 };
        const layerCoords = {};
        let canvasWidth = 600, canvasHeight = 300;
        let currentQuality = 'medium';

        const initialLayers = [
            { text: '✨ HD/4K Quality', color: '#f5a623', size: 36, font: 'Arial', anim: 'wave' },
            { text: '✦ Text Box Controls ✦', color: '#b0b0ff', size: 16, font: 'Arial', anim: 'pulse' }
        ];

        // ===== QUALITY CONTROL =====
        function updateQuality() {
            currentQuality = gifQualitySelect.value;
            const qualityMap = {
                low: { w: 320, h: 180, label: 'Low (240p)' },
                medium: { w: 640, h: 360, label: 'Medium (480p)' },
                high: { w: 960, h: 540, label: 'High (720p)' },
                hd: { w: 1280, h: 720, label: 'HD (1080p)' },
                '4k': { w: 1920, h: 1080, label: '4K (2160p)' }
            };
            const q = qualityMap[currentQuality] || qualityMap.medium;
            statusEl.textContent = `✅ Quality: ${q.label} (${q.w}×${q.h})`;
            preview();
        }

        // ===== 50+ ANIMATIONS ENGINE =====
        function getAnimationValue(t, animType, imgW, imgH, w, h) {
            let result = { dx: 0, dy: 0, dw: 0, dh: 0, rotation: 0, opacity: 1, scale: 1, glow: 0, hue: 0 };
            const speed = 1 / (imageFilters.animTime || 8);
            const phase = t * speed;
            
            switch(animType) {
                case 'none': break;
                case 'zoom': result.scale = 1 + 0.15 * Math.sin(phase); break;
                case 'rotate': result.rotation = phase * 0.5; break;
                case 'bounce': result.dy = -Math.abs(Math.sin(phase)) * 25; break;
                case 'fade': result.opacity = 0.4 + 0.6 * (0.5 + 0.5 * Math.sin(phase)); break;
                case 'slide': result.dx = Math.sin(phase) * w * 0.08; break;
                case 'wave': result.dy = Math.sin(phase) * h * 0.06; break;
                case 'pulse': result.glow = 10 + Math.sin(phase) * 15; break;
                case 'heartbeat': result.scale = 1 + 0.2 * Math.pow(Math.sin(phase * 2), 8); break;
                case 'ripple': result.scale = 1 + 0.1 * Math.sin(phase * 3); result.dy = Math.sin(phase * 3) * 5; break;
                case 'spin': result.rotation = phase * 2; break;
                case 'flip': result.scale = Math.sin(phase) > 0 ? 1 : -1; break;
                case 'tilt': result.rotation = Math.sin(phase * 0.7) * 0.3; break;
                case 'wobble': result.dx = Math.sin(phase * 1.5) * 10; result.dy = Math.cos(phase * 1.3) * 8; break;
                case 'glow': result.glow = 5 + Math.sin(phase) * 20; break;
                case 'shine': result.opacity = 0.5 + 0.5 * Math.pow(Math.sin(phase), 2); break;
                case 'neon': result.glow = 20 + Math.sin(phase * 1.5) * 15; break;
                case 'sparkle': result.opacity = 0.3 + 0.7 * Math.pow(Math.sin(phase * 2), 4); break;
                case 'hueShift': result.hue = phase * 360; break;
                case 'colorPulse': result.hue = Math.sin(phase) * 60; break;
                case 'rainbow': result.hue = phase * 720; break;
                case 'chromatic': result.hue = phase * 360; result.glow = 15; break;
                case 'swing': result.dx = Math.sin(phase * 0.8) * 20; result.rotation = Math.sin(phase * 0.8) * 0.2; break;
                case 'sway': result.dx = Math.sin(phase * 0.5) * 30; break;
                case 'drift': result.dx = Math.sin(phase * 0.3) * 40; result.dy = Math.cos(phase * 0.4) * 20; break;
                case 'float': result.dy = Math.sin(phase * 0.7) * 20; break;
                case 'hover': result.dy = Math.sin(phase * 0.5) * 15; result.glow = 5 + Math.sin(phase * 1.2) * 10; break;
                case 'shake': result.dx = Math.sin(phase * 20) * 3; result.dy = Math.cos(phase * 22) * 3; break;
                case 'jitter': result.dx = Math.sin(phase * 30) * 2; result.dy = Math.sin(phase * 28) * 2; break;
                case 'pop': result.scale = 1 + 0.3 * Math.sin(phase * 2) * Math.sin(phase * 2); break;
                case 'explode': result.scale = 1 + 0.4 * Math.pow(Math.sin(phase), 2); result.opacity = 0.3 + 0.7 * Math.pow(Math.cos(phase), 2); break;
                case 'morph': result.scale = 1 + 0.2 * Math.sin(phase); result.rotation = Math.sin(phase * 0.8) * 0.2; break;
                case 'spiral': result.dx = Math.sin(phase * 2) * 30; result.dy = Math.cos(phase * 2) * 20; result.rotation = phase * 0.5; break;
                case 'sineWave': result.dy = Math.sin(phase * 3) * 20; break;
                case 'figure8': result.dx = Math.sin(phase * 2) * 30; result.dy = Math.sin(phase * 4) * 15; break;
                case 'butterfly': result.dx = Math.sin(phase * 3) * 25; result.dy = Math.cos(phase * 2.5) * 18; result.rotation = Math.sin(phase * 2) * 0.2; break;
                case 'zigzag': result.dx = Math.sin(phase * 4) * 20; result.dy = Math.sin(phase * 8) * 10; break;
                case 'blink': result.opacity = Math.sin(phase * 3) > 0.5 ? 1 : 0.1; break;
                case 'pulseGlow': result.glow = 10 + Math.sin(phase * 1.5) * 20; result.scale = 1 + 0.05 * Math.sin(phase * 1.5); break;
                case 'rainbowGlow': result.glow = 15 + Math.sin(phase) * 15; result.hue = phase * 360; break;
                case 'neonPulse': result.glow = 20 + Math.sin(phase * 2) * 15; result.opacity = 0.5 + 0.5 * Math.sin(phase * 2); break;
                case 'fire': result.dy = -Math.sin(phase * 5) * 10; result.scale = 1 + 0.1 * Math.sin(phase * 7); break;
                case 'water': result.dy = Math.sin(phase * 2) * 8; result.dx = Math.sin(phase * 1.7) * 5; break;
                case 'wind': result.dx = Math.sin(phase * 0.8) * 35; result.dy = Math.sin(phase * 0.6) * 10; break;
                case 'earth': result.dy = Math.sin(phase * 0.5) * 12; result.rotation = Math.sin(phase * 0.3) * 0.05; break;
                default: break;
            }
            return result;
        }

        // ===== Canvas Size =====
        function updateCanvasSize() {
            let w = parseInt(bannerWidthInput.value) || 600;
            let h = parseInt(bannerHeightInput.value) || 300;
            w = Math.max(100, Math.min(4000, w));
            h = Math.max(100, Math.min(4000, h));
            canvasWidth = w;
            canvasHeight = h;
            c.width = w;
            c.height = h;
            
            const container = c.parentElement;
            const maxWidth = container.clientWidth - 6;
            if (w > maxWidth) {
                c.style.width = maxWidth + 'px';
                c.style.height = (h * (maxWidth / w)) + 'px';
            } else {
                c.style.width = w + 'px';
                c.style.height = h + 'px';
            }
            
            if (uploadedImage) {
                let maxW = w * 0.6, maxH = h * 0.6;
                let iw = Math.min(imageFilters.imgWidth || 200, maxW);
                let ih = Math.min(imageFilters.imgHeight || 200, maxH);
                imageConfig.width = iw;
                imageConfig.height = ih;
                imageConfig.x = (w - iw) / 2;
                imageConfig.y = (h - ih) / 2;
            }
            preview();
        }

        function updateBg() {
            bannerBgHex.value = bannerBgInput.value;
            preview();
        }

        // ===== Image Size Control - Text Box =====
        function updateImageSize() {
            let w = parseInt(document.getElementById('imgWidth').value) || 200;
            let h = parseInt(document.getElementById('imgHeight').value) || 200;
            w = Math.max(10, Math.min(1000, w));
            h = Math.max(10, Math.min(1000, h));
            imageFilters.imgWidth = w;
            imageFilters.imgHeight = h;
            document.getElementById('imgWidthDisplay').textContent = w;
            document.getElementById('imgHeightDisplay').textContent = h;
            
            if (uploadedImage) {
                let maxW = canvasWidth * 0.6, maxH = canvasHeight * 0.6;
                let iw = Math.min(w, maxW);
                let ih = Math.min(h, maxH);
                imageConfig.width = iw;
                imageConfig.height = ih;
                imageConfig.x = (canvasWidth - iw) / 2;
                imageConfig.y = (canvasHeight - ih) / 2;
            }
            preview();
        }

        // ===== Image Upload =====
        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    uploadedImage = img;
                    let w = canvasWidth, h = canvasHeight;
                    let maxW = w * 0.6, maxH = h * 0.6;
                    let iw = Math.min(img.width, maxW);
                    let ih = Math.min(img.height, maxH);
                    imageConfig.width = iw;
                    imageConfig.height = ih;
                    imageConfig.x = (w - iw) / 2;
                    imageConfig.y = (h - ih) / 2;
                    document.getElementById('imgWidth').value = iw;
                    document.getElementById('imgHeight').value = ih;
                    imageFilters.imgWidth = iw;
                    imageFilters.imgHeight = ih;
                    document.getElementById('imgWidthDisplay').textContent = iw;
                    document.getElementById('imgHeightDisplay').textContent = ih;
                    imageCustomPanel.classList.add('active');
                    statusEl.textContent = '✅ Image loaded! Use text boxes for precise control.';
                    resetFilters();
                    preview();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // ===== Filters - Text Boxes =====
        function applyFilters() {
            imageFilters.brightness = parseInt(document.getElementById('imgBrightness').value) || 0;
            imageFilters.contrast = parseInt(document.getElementById('imgContrast').value) || 0;
            imageFilters.saturation = parseInt(document.getElementById('imgSaturation').value) || 0;
            imageFilters.blur = parseInt(document.getElementById('imgBlur').value) || 0;
            imageFilters.opacity = parseInt(document.getElementById('imgOpacity').value) || 100;
            imageFilters.radius = parseInt(document.getElementById('imgRadius').value) || 0;
            imageFilters.border = parseInt(document.getElementById('imgBorder').value) || 0;
            imageFilters.borderColor = document.getElementById('imgBorderColor').value;
            imageFilters.shadow = parseInt(document.getElementById('imgShadow').value) || 0;
            imageFilters.animation = document.getElementById('imgAnimation').value;
            imageFilters.animTime = parseInt(document.getElementById('animTime').value) || 8;
            imageFilters.gifFrames = parseInt(document.getElementById('gifFrames').value) || 20;
            
            // Clamp values
            imageFilters.brightness = Math.max(-100, Math.min(100, imageFilters.brightness));
            imageFilters.contrast = Math.max(-100, Math.min(100, imageFilters.contrast));
            imageFilters.saturation = Math.max(-100, Math.min(100, imageFilters.saturation));
            imageFilters.blur = Math.max(0, Math.min(20, imageFilters.blur));
            imageFilters.opacity = Math.max(10, Math.min(100, imageFilters.opacity));
            imageFilters.radius = Math.max(0, Math.min(50, imageFilters.radius));
            imageFilters.border = Math.max(0, Math.min(10, imageFilters.border));
            imageFilters.shadow = Math.max(0, Math.min(30, imageFilters.shadow));
            imageFilters.animTime = Math.max(1, Math.min(30, imageFilters.animTime));
            imageFilters.gifFrames = Math.max(5, Math.min(60, imageFilters.gifFrames));
            
            preview();
        }

        function resetFilters() {
            document.getElementById('imgBrightness').value = 0;
            document.getElementById('imgContrast').value = 0;
            document.getElementById('imgSaturation').value = 0;
            document.getElementById('imgBlur').value = 0;
            document.getElementById('imgOpacity').value = 100;
            document.getElementById('imgRadius').value = 0;
            document.getElementById('imgBorder').value = 0;
            document.getElementById('imgShadow').value = 0;
            document.getElementById('imgAnimation').value = 'none';
            document.getElementById('animTime').value = 8;
            document.getElementById('gifFrames').value = 20;
            imageFilters.flipH = false;
            imageFilters.flipV = false;
            imageFilters.rotate = 0;
            applyFilters();
        }

        function flipImage(direction) {
            if (direction === 'horizontal') imageFilters.flipH = !imageFilters.flipH;
            if (direction === 'vertical') imageFilters.flipV = !imageFilters.flipV;
            preview();
        }

        function rotateImage(deg) {
            imageFilters.rotate = (imageFilters.rotate + deg) % 360;
            preview();
        }

        // ===== Text Layers =====
        function addNewRow(text = 'New Layer', color = '#ffffff', size = 20, font = 'Arial', anim = 'static') {
            const rowId = 'row_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
            const rowHtml = `
                <div class="text-row" id="${rowId}" data-id="${rowId}">
                    <input type="text" class="layer-text" value="${text}" placeholder="Text..." oninput="preview()">
                    <div class="input-group-custom">
                        <span>SZ</span>
                        <input type="number" class="layer-size" value="${size}" min="8" max="200" oninput="preview()">
                    </div>
                    <select class="layer-font" onchange="preview()">
                        <option value="Arial" ${font==='Arial'?'selected':''}>Arial</option>
                        <option value="Times New Roman" ${font==='Times New Roman'?'selected':''}>Times</option>
                        <option value="Courier New" ${font==='Courier New'?'selected':''}>Courier</option>
                        <option value="Impact" ${font==='Impact'?'selected':''}>Impact</option>
                        <option value="Comic Sans MS" ${font==='Comic Sans MS'?'selected':''}>Comic</option>
                    </select>
                    <select class="layer-anim" onchange="preview()">
                        <option value="static" ${anim==='static'?'selected':''}>Static</option>
                        <option value="wave" ${anim==='wave'?'selected':''}>Wave</option>
                        <option value="pulse" ${anim==='pulse'?'selected':''}>Pulse</option>
                        <option value="slide" ${anim==='slide'?'selected':''}>Slide</option>
                        <option value="flicker" ${anim==='flicker'?'selected':''}>Flicker</option>
                    </select>
                    <input type="color" class="layer-clr" value="${color}" oninput="preview()">
                    <button class="btn-del" onclick="removeRow('${rowId}')">✕</button>
                </div>
            `;
            rowsContainer.insertAdjacentHTML('beforeend', rowHtml);
            preview();
        }

        function removeRow(id) {
            const row = document.getElementById(id);
            if (row) { row.remove(); delete layerCoords[id]; preview(); }
        }

        function getActiveLayers() {
            const rows = rowsContainer.querySelectorAll('.text-row');
            const layers = [];
            const total = rows.length;
            const h = canvasHeight, w = canvasWidth;
            rows.forEach((row, idx) => {
                const id = row.getAttribute('data-id');
                let x = w/2, y = h/2;
                if (layerCoords[id] === undefined) {
                    if (total === 2) y = (idx === 0) ? h*0.32 : h*0.72;
                    else if (total > 2) y = h*0.18 + (idx * ((h*0.64)/(total-1)));
                    layerCoords[id] = { x: w/2, y: y };
                }
                const coords = layerCoords[id];
                layers.push({
                    id: id,
                    text: row.querySelector('.layer-text').value || '',
                    color: row.querySelector('.layer-clr').value,
                    size: parseInt(row.querySelector('.layer-size').value) || 20,
                    font: row.querySelector('.layer-font').value,
                    anim: row.querySelector('.layer-anim').value,
                    x: coords.x,
                    y: coords.y
                });
            });
            return layers;
        }

        // ===== DRAW =====
        function draw(layers, frameIndex = 0, totalFrames = 1) {
            const w = canvasWidth, h = canvasHeight;
            const baseBg = bannerBgInput.value;
            
            ctx.clearRect(0, 0, w, h);
            
            const grad = ctx.createRadialGradient(w*0.5, h*0.5, 10, w*0.5, h*0.5, w*0.7);
            grad.addColorStop(0, baseBg);
            grad.addColorStop(0.7, adjustColorBrightness(baseBg, -25));
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);

            // Draw Image with 50+ animations
            if (uploadedImage) {
                const t = totalFrames > 1 ? (frameIndex / totalFrames) * Math.PI * 2 : 0;
                const animType = imageFilters.animation;
                const animResult = getAnimationValue(t, animType, imageConfig.width, imageConfig.height, w, h);
                
                let dx = imageConfig.x + (animResult.dx || 0);
                let dy = imageConfig.y + (animResult.dy || 0);
                let dw = imageConfig.width * (animResult.scale || 1);
                let dh = imageConfig.height * (animResult.scale || 1);
                let rotation = (imageFilters.rotate || 0) * Math.PI / 180 + (animResult.rotation || 0);
                let opacity = (animResult.opacity || 1) * (imageFilters.opacity / 100);
                let glow = imageFilters.shadow + (animResult.glow || 0);
                let hue = animResult.hue || 0;

                dx = dx - (dw - imageConfig.width) / 2;
                dy = dy - (dh - imageConfig.height) / 2;

                let filterStr = '';
                if (imageFilters.brightness !== 0) filterStr += `brightness(${100 + imageFilters.brightness}%) `;
                if (imageFilters.contrast !== 0) filterStr += `contrast(${100 + imageFilters.contrast}%) `;
                if (imageFilters.saturation !== 0) filterStr += `saturate(${100 + imageFilters.saturation}%) `;
                if (imageFilters.blur > 0) filterStr += `blur(${imageFilters.blur}px) `;
                if (hue !== 0) filterStr += `hue-rotate(${hue}deg) `;

                let flipScaleX = imageFilters.flipH ? -1 : 1;
                let flipScaleY = imageFilters.flipV ? -1 : 1;

                ctx.save();
                ctx.globalAlpha = opacity;
                ctx.shadowColor = imageFilters.borderColor;
                ctx.shadowBlur = glow;

                let cx = dx + dw/2, cy = dy + dh/2;
                ctx.translate(cx, cy);
                ctx.rotate(rotation);
                ctx.scale(flipScaleX, flipScaleY);
                ctx.translate(-cx, -cy);

                if (imageFilters.radius > 0) {
                    ctx.beginPath();
                    roundRect(ctx, dx, dy, dw, dh, imageFilters.radius);
                    ctx.clip();
                }

                if (filterStr) ctx.filter = filterStr;
                ctx.drawImage(uploadedImage, dx, dy, dw, dh);
                ctx.filter = 'none';

                if (imageFilters.border > 0) {
                    ctx.shadowBlur = 0;
                    ctx.strokeStyle = imageFilters.borderColor;
                    ctx.lineWidth = imageFilters.border;
                    if (imageFilters.radius > 0) {
                        ctx.beginPath();
                        roundRect(ctx, dx, dy, dw, dh, imageFilters.radius);
                        ctx.stroke();
                    } else {
                        ctx.strokeRect(dx, dy, dw, dh);
                    }
                }
                ctx.restore();
            }

            // Draw Text
            const t = totalFrames > 1 ? (frameIndex / totalFrames) * Math.PI * 2 : 0;
            layers.forEach(layer => {
                ctx.save();
                let targetX = layer.x, targetY = layer.y;
                let glow = 12, opacity = 1;
                if (layer.anim === 'wave') targetY += Math.sin(t) * canvasHeight * 0.04;
                else if (layer.anim === 'pulse') glow = 12 + Math.sin(t)*10;
                else if (layer.anim === 'slide') targetX += Math.sin(t) * canvasWidth * 0.05;
                else if (layer.anim === 'flicker') opacity = Math.random() > 0.8 ? 0.3 : 1;

                ctx.globalAlpha = opacity;
                ctx.shadowColor = layer.color + '99';
                ctx.shadowBlur = glow;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = layer.color;
                ctx.font = `bold ${layer.size}px "${layer.font}"`;
                ctx.fillText(layer.text || '', targetX, targetY);
                ctx.restore();
            });
        }

        function roundRect(ctx, x, y, w, h, r) {
            if (r > w/2) r = w/2;
            if (r > h/2) r = h/2;
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            return ctx;
        }

        function adjustColorBrightness(hex, percent) {
            let r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
            r = Math.min(255, Math.max(0, r + percent));
            g = Math.min(255, Math.max(0, g + percent));
            b = Math.min(255, Math.max(0, b + percent));
            return '#' + [r,g,b].map(c => c.toString(16).padStart(2,'0')).join('');
        }

        function preview() {
            draw(getActiveLayers(), 0, 1);
            statusEl.textContent = '✅ Preview · ' + imageFilters.animation;
            statusEl.style.color = '#00e676';
        }

        function downloadPNG() {
            draw(getActiveLayers(), 0, 1);
            try {
                const link = document.createElement('a');
                link.download = 'custom-banner.png';
                link.href = c.toDataURL('image/png');
                link.click();
                statusEl.textContent = '✅ PNG saved!';
            } catch(e) {
                statusEl.textContent = '❌ Error: ' + e.message;
                statusEl.style.color = '#ff4d6d';
            }
        }

        // ===== DRAG =====
        function getEventCoords(e) {
            const rect = c.getBoundingClientRect();
            const scaleX = canvasWidth / rect.width;
            const scaleY = canvasHeight / rect.height;
            const cx = e.touches ? e.touches[0].clientX : e.clientX;
            const cy = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: (cx - rect.left) * scaleX,
                y: (cy - rect.top) * scaleY
            };
        }

        function dragStart(e) {
            const coords = getEventCoords(e);
            const layers = getActiveLayers();
            for (let i = layers.length-1; i>=0; i--) {
                const l = layers[i];
                ctx.font = `bold ${l.size}px "${l.font}"`;
                const tw = ctx.measureText(l.text || ' ').width;
                const th = l.size;
                if (coords.x >= l.x - tw/2 && coords.x <= l.x + tw/2 &&
                    coords.y >= l.y - th/2 && coords.y <= l.y + th/2) {
                    isDragging = true;
                    draggedElement = l.id;
                    dragOffset.x = coords.x - l.x;
                    dragOffset.y = coords.y - l.y;
                    return;
                }
            }
            if (uploadedImage && coords.x >= imageConfig.x && coords.x <= imageConfig.x+imageConfig.width &&
                coords.y >= imageConfig.y && coords.y <= imageConfig.y+imageConfig.height) {
                isDragging = true;
                draggedElement = 'image';
                dragOffset.x = coords.x - imageConfig.x;
                dragOffset.y = coords.y - imageConfig.y;
            }
        }

        function dragMove(e) {
            if (!isDragging) return;
            e.preventDefault();
            const coords = getEventCoords(e);
            if (draggedElement === 'image') {
                imageConfig.x = coords.x - dragOffset.x;
                imageConfig.y = coords.y - dragOffset.y;
            } else if (draggedElement) {
                layerCoords[draggedElement].x = coords.x - dragOffset.x;
                layerCoords[draggedElement].y = coords.y - dragOffset.y;
            }
            preview();
        }

        function dragEnd() { isDragging = false; draggedElement = null; }

        c.addEventListener('mousedown', dragStart);
        window.addEventListener('mousemove', dragMove);
        window.addEventListener('mouseup', dragEnd);
        c.addEventListener('touchstart', dragStart, { passive: false });
        window.addEventListener('touchmove', dragMove, { passive: false });
        window.addEventListener('touchend', dragEnd);

        // ===== GIF Download with Quality Control =====
        function downloadGIF() {
            const layers = getActiveLayers();
            
            // Get quality settings
            const qualityMap = {
                low: { scale: 0.5, label: 'Low (240p)' },
                medium: { scale: 1, label: 'Medium (480p)' },
                high: { scale: 1.5, label: 'High (720p)' },
                hd: { scale: 2, label: 'HD (1080p)' },
                '4k': { scale: 3.5, label: '4K (2160p)' }
            };
            const quality = qualityMap[currentQuality] || qualityMap.medium;
            
            // Calculate output size
            let outW = Math.round(canvasWidth * quality.scale);
            let outH = Math.round(canvasHeight * quality.scale);
            // Cap at 4K
            outW = Math.min(outW, 3840);
            outH = Math.min(outH, 2160);
            
            statusEl.textContent = `⏳ Generating ${quality.label} (${outW}×${outH})...`;
            statusEl.style.color = '#f5a623';
            progress.style.display = 'block';
            plabel.style.display = 'block';
            fill.style.width = '0%';
            
            const totalFrames = imageFilters.gifFrames || 20;
            const delay = Math.round(10 / quality.scale);
            const frames = [];
            let frameIndex = 0;

            // Create temp canvas for high quality rendering
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = outW;
            tempCanvas.height = outH;
            const tempCtx = tempCanvas.getContext('2d');

            function captureFrame() {
                const pct = Math.round((frameIndex/totalFrames)*100);
                fill.style.width = pct + '%';
                plabel.textContent = `Frame ${frameIndex+1}/${totalFrames} · ${quality.label}`;
                
                // Draw on main canvas
                draw(layers, frameIndex, totalFrames);
                
                // Render to temp canvas with quality scaling
                tempCtx.clearRect(0, 0, outW, outH);
                tempCtx.imageSmoothingEnabled = true;
                tempCtx.imageSmoothingQuality = 'high';
                tempCtx.drawImage(c, 0, 0, canvasWidth, canvasHeight, 0, 0, outW, outH);
                
                // Copy to frame
                const frameCanvas = document.createElement('canvas');
                frameCanvas.width = outW;
                frameCanvas.height = outH;
                const fCtx = frameCanvas.getContext('2d');
                fCtx.drawImage(tempCanvas, 0, 0);
                frames.push(frameCanvas);
                
                frameIndex++;
                
                if (frameIndex < totalFrames) {
                    setTimeout(captureFrame, 50);
                } else {
                    plabel.textContent = 'Encoding GIF...';
                    setTimeout(() => {
                        try {
                            const gifData = createGIF(frames, outW, outH, delay);
                            const blob = new Blob([gifData], { type: 'image/gif' });
                            const url = URL.createObjectURL(blob);
                            
                            const link = document.createElement('a');
                            link.download = `custom-banner-${outW}x${outH}-${currentQuality}.gif`;
                            link.href = url;
                            document.body.appendChild(link);
                            link.click();
                            document.body.removeChild(link);
                            
                            setTimeout(() => URL.revokeObjectURL(url), 1000);
                            
                            progress.style.display = 'none';
                            plabel.style.display = 'none';
                            statusEl.textContent = `✅ GIF downloaded! ${quality.label} (${outW}×${outH})`;
                            statusEl.style.color = '#00e676';
                            setTimeout(() => draw(layers, 0, 1), 200);
                        } catch(e) {
                            progress.style.display = 'none';
                            plabel.style.display = 'none';
                            statusEl.textContent = '❌ Error: ' + e.message;
                            statusEl.style.color = '#ff4d6d';
                            draw(layers, 0, 1);
                        }
                    }, 100);
                }
            }
            captureFrame();
        }

        // ===== GIF Encoder =====
        function createGIF(frames, w, h, delay) {
            let out = [];
            out.push(0x47,0x49,0x46,0x38,0x39,0x61);
            out.push(w & 0xFF, (w>>8)&0xFF);
            out.push(h & 0xFF, (h>>8)&0xFF);
            out.push(0xF7,0x00,0x00);
            
            let palette = [];
            let bg = bannerBgInput.value;
            let br = parseInt(bg.slice(1,3),16)||11, bg_ = parseInt(bg.slice(3,5),16)||11, bb = parseInt(bg.slice(5,7),16)||26;
            for (let i=0;i<32;i++) palette.push(br, bg_, Math.min(255, bb+i));
            for (let i=0;i<32;i++) palette.push(Math.min(255, br+i), bg_, Math.min(255, bb+20+i));
            let sample = getActiveLayers().length?getActiveLayers()[0].color:'#f5a623';
            let r=parseInt(sample.slice(1,3),16)||245, g=parseInt(sample.slice(3,5),16)||166, b=parseInt(sample.slice(5,7),16)||35;
            for (let i=0;i<128;i++) { let f=i/127; palette.push(Math.round(r*f), Math.round(g*f), Math.round(b*f)); }
            while(palette.length<768) palette.push(255,255,255);
            out.push(...palette);

            out.push(0x21,0xFF,0x0B,0x4E,0x45,0x54,0x53,0x43,0x41,0x50,0x45,0x32,0x2E,0x30,0x03,0x01,0x00,0x00,0x00);

            for (let f=0; f<frames.length; f++) {
                out.push(0x21,0xF9,0x04,0x04, delay & 0xFF, (delay>>8)&0xFF, 0x00, 0x00);
                out.push(0x2C,0x00,0x00,0x00,0x00, w & 0xFF,(w>>8)&0xFF, h & 0xFF,(h>>8)&0xFF,0x00);
                
                const imgData = frames[f].getContext('2d').getImageData(0,0,w,h).data;
                const indexes = [];
                for (let i=0; i<imgData.length; i+=4) {
                    let ir=imgData[i], ig=imgData[i+1], ib=imgData[i+2];
                    let minDst=Infinity, bestIdx=0;
                    for (let j=0; j<256; j++) {
                        let pr=palette[j*3], pg=palette[j*3+1], pb=palette[j*3+2];
                        let dst=(ir-pr)*(ir-pr)+(ig-pg)*(ig-pg)+(ib-pb)*(ib-pb);
                        if (dst<minDst) { minDst=dst; bestIdx=j; }
                    }
                    indexes.push(bestIdx);
                }
                
                out.push(0x08);
                let encoded = lzwEncode(indexes);
                for (let i=0; i<encoded.length; i+=255) {
                    let chunk = encoded.slice(i, i+255);
                    out.push(chunk.length);
                    out.push(...chunk);
                }
                out.push(0x00);
            }
            out.push(0x3B);
            return new Uint8Array(out);
        }

        function lzwEncode(pixels) {
            let out = [], bitBuffer = 0, bitCount = 0;
            const writeCode = (code, size) => {
                bitBuffer |= (code << bitCount);
                bitCount += size;
                while (bitCount >= 8) {
                    out.push(bitBuffer & 0xFF);
                    bitBuffer >>= 8;
                    bitCount -= 8;
                }
            };
            
            let dict = new Map();
            const resetDict = () => {
                dict.clear();
                for(let i=0;i<256;i++) dict.set(String.fromCharCode(i), i);
            };
            resetDict();
            
            let nextCode = 258, codeSize = 9;
            writeCode(256, codeSize);
            
            let current = String.fromCharCode(pixels[0]);
            for (let i=1; i<pixels.length; i++) {
                let p = String.fromCharCode(pixels[i]);
                let combo = current + p;
                if (dict.has(combo)) {
                    current = combo;
                } else {
                    writeCode(dict.get(current), codeSize);
                    if (nextCode < 4096) {
                        dict.set(combo, nextCode++);
                        if (nextCode-1 === (1<<codeSize)) codeSize++;
                    } else {
                        writeCode(256, codeSize);
                        resetDict();
                        nextCode = 258;
                        codeSize = 9;
                    }
                    current = p;
                }
            }
            writeCode(dict.get(current), codeSize);
            writeCode(257, codeSize);
            if (bitCount > 0) out.push(bitBuffer & 0xFF);
            return out;
        }

        function handleResize() {
            updateCanvasSize();
        }

        // ===== EXPOSE GLOBALS =====
        window.addNewRow = addNewRow;
        window.removeRow = removeRow;
        window.preview = preview;
        window.downloadPNG = downloadPNG;
        window.downloadGIF = downloadGIF;
        window.updateCanvasSize = updateCanvasSize;
        window.updateBg = updateBg;
        window.handleImageUpload = handleImageUpload;
        window.applyFilters = applyFilters;
        window.resetFilters = resetFilters;
        window.flipImage = flipImage;
        window.rotateImage = rotateImage;
        window.updateImageSize = updateImageSize;
        window.updateQuality = updateQuality;

        // ===== INIT =====
        initialLayers.forEach(l => addNewRow(l.text, l.color, l.size, l.font, l.anim));
        
        let w = parseInt(bannerWidthInput.value) || 600;
        let h = parseInt(bannerHeightInput.value) || 300;
        canvasWidth = w;
        canvasHeight = h;
        c.width = w;
        c.height = h;
        
        setTimeout(updateCanvasSize, 50);
        window.addEventListener('resize', handleResize);
        updateQuality();
        
        statusEl.textContent = '✅ Upload image · Text boxes for precise control · HD/4K ready!';
        statusEl.style.color = '#00e676';
    })();
</script>
