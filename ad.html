    let animOptionsHtml = '';
    animationList.forEach(item => {
        animOptionsHtml += `<option value="${item.value}" ${anim===item.value?'selected':''}>${item.label}</option>`;
    });

    // Populate Dynamic 50+ Google Fonts Select Menu Options
    let fontOptionsHtml = '';
    googleFontsList.forEach(item => {
        fontOptionsHtml += `<option value="${item.value}" ${font===item.value?'selected':''} style="font-family:'${item.value}', sans-serif;">${item.label}</option>`;
    });
    
    const rowHtml = `
        <div class="text-row" id="${rowId}" data-id="${rowId}">
            <input type="text" class="layer-text" value="${text}" placeholder="Text content..." oninput="preview()">
            
            <div class="input-group-custom">
                <span>SIZE</span>
                <input type="number" class="layer-size" value="${size}" min="10" max="200" oninput="preview()">
            </div>
            
            <div class="input-group-custom">
                <span>X</span>
                <input type="number" class="layer-x" value="${posX}" min="-500" max="3000" oninput="preview()">
            </div>

            <div class="input-group-custom">
                <span>Y</span>
                <input type="number" class="layer-y" value="${posY}" min="-500" max="3000" oninput="preview()">
            </div>

            <div class="input-group-custom">
                <span>SPEED</span>
                <input type="number" class="layer-dur" value="${duration}" min="0.1" max="10" step="0.1" oninput="preview()" title="Animation Speed Multiplier">
            </div>

            <select class="layer-font" onchange="preview()" title="Font Style" style="font-weight: 600;">
                ${fontOptionsHtml}
            </select>

            <select class="layer-anim" onchange="preview()" title="Select Animation">
                ${animOptionsHtml}
            </select>
            
            <input type="color" class="layer-clr" value="${color}" oninput="preview()">
            <button class="btn-del" onclick="removeRow('${rowId}')">✕</button>
        </div>
    `;
    rowsContainer.insertAdjacentHTML('beforeend', rowHtml);
    preview();
}

function removeRow(id) {
    const row = document.getElementById(id);
    if(row) {
        row.remove();
        preview();
    }
}

function getActiveLayers() {
    const rows = rowsContainer.querySelectorAll('.text-row');
    const layers = [];
    
    rows.forEach((row) => {
        const id = row.getAttribute('data-id');
        let inputX = parseInt(row.querySelector('.layer-x').value);
        let inputY = parseInt(row.querySelector('.layer-y').value);
        let dur = parseFloat(row.querySelector('.layer-dur').value);
        
        if (isNaN(inputX)) inputX = Math.round(c.width / 2);
        if (isNaN(inputY)) inputY = Math.round(c.height / 2);
        if (isNaN(dur) || dur <= 0) dur = 1;

        layers.push({
            id: id,
            text: row.querySelector('.layer-text').value,
            color: row.querySelector('.layer-clr').value,
            size: parseInt(row.querySelector('.layer-size').value) || 24,
            font: row.querySelector('.layer-font').value,
            anim: row.querySelector('.layer-anim').value,
            x: inputX,
            y: inputY,
            dur: dur
        });
    });
    return layers;
}

function draw(layers, frameIndex = 0, totalFrames = 1) {
    const w = c.width;
    const h = c.height;
    const baseBg = bannerBgInput.value;
    bannerBgHex.value = baseBg;
    
    ctx.clearRect(0, 0, w, h);
    
    const grad = ctx.createLinearGradient(0, 0, w, h);
    grad.addColorStop(0, baseBg);
    grad.addColorStop(0.5, adjustColorBrightness(baseBg, 20));
    grad.addColorStop(1, baseBg);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);
    
    layers.forEach(layer => {
        ctx.save();
        
        let targetX = layer.x;
        let targetY = layer.y;
        let currentGlow = 15;
        let opacity = 1;
        let scaleX = 1;
        let scaleY = 1;
        let rotationAngle = 0;
        let skewX = 0;
        let skewY = 0;
        let customTextColor = layer.color;
        
        // Compute base progress normalized (0 to 2*PI) and factor in the user's custom speed duration variable
        const baseProgress = totalFrames > 1 ? (frameIndex / totalFrames) * Math.PI * 2 : 0;
        const tProgress = baseProgress * layer.dur;
        
        // Execute Animation Mathematical Transformation Mapping
        switch (layer.anim) {
            case 'wave':
                targetY += Math.sin(tProgress) * (h * 0.08);
                break;
            case 'pulse':
                currentGlow = 15 + Math.sin(tProgress) * 14;
                scaleX = scaleY = 1 + Math.sin(tProgress) * 0.08;
                break;
            case 'slide':
                targetX += Math.sin(tProgress) * (w * 0.08);
                break;
            case 'flicker':
                opacity = Math.random() > 0.82 ? 0.25 : 1.0;
                currentGlow = opacity > 0.5 ? 20 : 2;
                break;
            case 'bounce':
                let bAbs = Math.abs(Math.sin(tProgress));
                targetY -= bAbs * (h * 0.2);
                scaleY = 1.0 + (1.0 - bAbs) * 0.15;
                scaleX = 1.0 - (1.0 - bAbs) * 0.1;
                break;
            case 'rotate':
                rotationAngle = tProgress;
                break;
            case 'swing':
                rotationAngle = Math.sin(tProgress) * 0.35;
                break;
            case 'fade':
                opacity = 0.5 + Math.sin(tProgress) * 0.5;
                break;
            case 'zoom':
                let zFactor = Math.sin(tProgress);
                scaleX = scaleY = 1.0 + zFactor * 0.25;
                break;
            case 'shake':
                targetX += Math.sin(tProgress * 4) * 8;
                break;
            case 'vshake':
                targetY += Math.cos(tProgress * 4) * 8;
                break;
            case 'heartbeat':
                let hBeat = (frameIndex % 9) / 9;
                let hScale = 1.0;
                if(hBeat < 0.15) hScale = 1.25;
                else if(hBeat < 0.3) hScale = 1.1;
                else if(hBeat < 0.45) hScale = 1.2;
                scaleX = scaleY = hScale;
                break;
            case 'spinx':
                scaleX = Math.cos(tProgress);
                break;
            case 'spiny':
                scaleY = Math.sin(tProgress);
                break;
            case 'wobble':
                targetX += Math.sin(tProgress) * 15;
                rotationAngle = Math.cos(tProgress) * 0.15;
                break;
            case 'glitch':
                if (Math.random() > 0.78) {
                    targetX += (Math.random() - 0.5) * 18;
                    targetY += (Math.random() - 0.5) * 6;
                    opacity = 0.8;
                }
                break;
            case 'spiral':
                targetX += Math.sin(tProgress) * 30;
                targetY += Math.cos(tProgress) * 30;
                break;
            case 'zigzag':
                targetX += Math.sin(tProgress) * 25;
                targetY += Math.sin(tProgress * 2) * 12;
                break;
            case 'shrink':
                scaleX = scaleY = 1.0 - Math.abs(Math.sin(tProgress)) * 0.4;
                break;
            case 'circular':
                targetX += Math.cos(tProgress) * 40;
                targetY += Math.sin(tProgress) * 40;
                break;
            case 'ellipse':
                targetX += Math.cos(tProgress) * 60;
                targetY += Math.sin(tProgress) * 25;
                break;
            case 'infinite':
                targetX += Math.sin(tProgress) * 45;
                targetY += Math.sin(tProgress * 2) * 20;
                break;
            case 'step':
                let stepFrame = Math.floor((frameIndex / totalFrames) * 6);
                targetX += (stepFrame - 3) * 15;
                break;
            case 'typewriter':
                let len = layer.text ? layer.text.length : 0;
                let visibleChars = Math.floor(((frameIndex % totalFrames) / totalFrames) * (len + 3));
                if(visibleChars > len) visibleChars = len;
                layer.text = (layer.text || '').substring(0, visibleChars);
                break;
            case 'marquee':
                let offset = ((frameIndex % totalFrames) / totalFrames) * w;
                targetX = (layer.x - offset) % (w + 200);
                if (targetX < -100) targetX += (w + 200);
                break;
            case 'drop':
                let dProg = (frameIndex % totalFrames) / totalFrames;
                targetY = layer.y - (h * 0.4) * (1 - dProg) + Math.abs(Math.sin(dProg * Math.PI * 3)) * 15;
                break;
            case 'popup':
                let pProg = Math.sin(((frameIndex % totalFrames) / totalFrames) * Math.PI);
                scaleX = scaleY = pProg * 1.2;
                break;
            case 'expand':
                break;
            case 'tilt':
                rotationAngle = Math.sin(tProgress) * 0.2;
                break;
            case 'diagonal':
                targetX += Math.sin(tProgress) * 35;
                targetY += Math.sin(tProgress) * 35;
                break;
            case 'shear':
                skewX = Math.sin(tProgress) * 0.3;
                break;
            case 'sine_x':
                targetX += Math.sin(tProgress) * 40;
                break;
            case 'sine_y':
                targetY += Math.sin(tProgress) * 40;
                break;
            case 'cosine_x':
                targetX += Math.cos(tProgress) * 40;
                break;
            case 'cosine_y':
                targetY += Math.cos(tProgress) * 40;
                break;
            case 'tangent_wave':
                targetY += Math.min(60, Math.max(-60, Math.tan(Math.sin(tProgress)) * 20));
                break;
            case 'sawtooth_x':
                targetX += ((frameIndex % totalFrames) / totalFrames) * 60 - 30;
                break;
            case 'triangle_y':
                let tri = (frameIndex % totalFrames) / totalFrames;
                targetY += (tri < 0.5 ? tri * 2 : (1 - tri) * 2) * 40 - 20;
                break;
            case 'chaos':
                targetX += (Math.random() - 0.5) * 6;
                targetY += (Math.random() - 0.5) * 6;
                break;
            case 'flash':
                opacity = (Math.floor(frameIndex / 2) % 2 === 0) ? 1.0 : 0.1;
                break;
            case 'blur_pulse':
                currentGlow = 2 + Math.abs(Math.sin(tProgress)) * 25;
                break;
            case 'rainbow_txt':
                let hue = Math.round((frameIndex / totalFrames) * 360);
                customTextColor = `hsl(${hue}, 100%, 65%)`;
                break;
            case 'hue_rotate':
                let hRot = Math.round((frameIndex / totalFrames) * 360);
                ctx.filter = `hue-rotate(${hRot}deg)`;
                break;
            case 'shadow_spin':
                let sX = Math.cos(tProgress) * 15;
                let sY = Math.sin(tProgress) * 15;
                ctx.shadowOffsetX = sX;
                ctx.shadowOffsetY = sY;
                break;
            case 'shadow_grow':
                currentGlow = 5 + Math.abs(Math.cos(tProgress)) * 25;
                break;
            case 'ghost':
                ctx.globalAlpha = 0.3;
                ctx.fillText(layer.text || '', targetX - 15, targetY);
                ctx.fillText(layer.text || '', targetX + 15, targetY);
                ctx.globalAlpha = opacity;
                break;
            case 'shatter':
                if(Math.random() > 0.85) {
                    skewX = (Math.random() - 0.5) * 0.5;
                    rotationAngle = (Math.random() - 0.5) * 0.2;
                }
                break;
            case 'float_random':
                targetX += Math.sin(tProgress) * 12;
                targetY += Math.cos(tProgress * 1.5) * 12;
                break;
            case 'reveal_l':
                let clipW = ((frameIndex / totalFrames)) * w;
                ctx.rect(0, 0, clipW, h);
                ctx.clip();
                break;
            case 'reveal_r':
                let clipWR = (1 - (frameIndex / totalFrames)) * w;
                ctx.rect(clipWR, 0, w, h);
                ctx.clip();
                break;
            case 'vortex':
                let vProg = (1 - (frameIndex / totalFrames));
                rotationAngle = tProgress * 2;
                scaleX = scaleY = vProg;
                break;
            case 'explosion':
                let eProg = ((frameIndex % totalFrames) / totalFrames);
                scaleX = scaleY = 1.0 + eProg * 1.5;
                opacity = 1.0 - eProg;
                break;
            case 'implosion':
                let iProg = (1.0 - ((frameIndex % totalFrames) / totalFrames));
                scaleX = scaleY = iProg * 2.0;
                opacity = Math.min(1, iProg * 1.5);
                break;
            case 'laser':
                currentGlow = 20;
                customTextColor = (frameIndex % 2 === 0) ? '#ff0055' : '#00ffcc';
                break;
            case 'earthquake':
                targetX += (frameIndex % 2 === 0) ? 5 : -5;
                targetY += (frameIndex % 3 === 0) ? -4 : 4;
                break;
            case 'liquid':
                skewX = Math.sin(tProgress) * 0.25;
                targetY += Math.cos(tProgress) * 6;
                break;
            case 'fountain':
                let fProg = (frameIndex % totalFrames) / totalFrames;
                targetY = layer.y + 50 - (fProg * 120);
                opacity = 1.0 - fProg;
                break;
            case 'u_turn':
                let uProg = Math.sin(tProgress);
                targetX += uProg * 40;
                if (uProg > 0.5) scaleX = -1;
                break;
            case 'spiral_out':
                let sRad = ((frameIndex / totalFrames)) * 40;
                targetX += Math.sin(tProgress * 2) * sRad;
                targetY += Math.cos(tProgress * 2) * sRad;
                break;
            case 'pendulum':
                rotationAngle = Math.sin(tProgress) * 0.5;
                targetY += Math.abs(Math.sin(tProgress)) * 10;
                break;
            case 'sonar':
                let sProg = (frameIndex % totalFrames) / totalFrames;
                ctx.save();
                ctx.globalAlpha = 0.25 * (1 - sProg);
                ctx.font = `bold ${layer.size * (1 + sProg * 0.8)}px "${layer.font}"`;
                ctx.fillText(layer.text || '', targetX, targetY);
                ctx.restore();
                break;
            case 'teleport':
                if (frameIndex % 6 === 0) opacity = 0;
                break;
            case 'slide_down':
                targetY += ((frameIndex % totalFrames) / totalFrames) * 50 - 25;
                break;
            case 'slide_up':
                targetY -= ((frameIndex % totalFrames) / totalFrames) * 50 - 25;
                break;
            case 'flip_flop':
                if (Math.floor(frameIndex / 3) % 2 === 0) scaleX = -1;
                break;
            case 'matrix':
                customTextColor = '#00ff41';
                opacity = Math.random() > 0.2 ? 1 : 0.4;
                break;
            case 'fire_glow':
                ctx.shadowColor = '#ff3700';
                currentGlow = 10 + Math.random() * 20;
                break;
            case 'ice_shiver':
                ctx.shadowColor = '#00d2ff';
                targetX += (Math.random() - 0.5) * 3;
                break;
            case 'wind_drift':
                targetX += ((frameIndex % totalFrames) / totalFrames) * 80 - 40;
                skewX = -0.2;
                break;
            case 'magnetic':
                let mDist = Math.sin(tProgress) * 20;
                targetX += mDist;
                scaleX = 1.0 + Math.abs(mDist) * 0.01;
                break;
            case 'snapping':
                let snap = (frameIndex % totalFrames) / totalFrames;
                targetX += (snap < 0.15 || snap > 0.85) ? 15 : 0;
                break;
            case 'elastic_stretch':
                scaleX = 1.0 + Math.sin(tProgress) * 0.3;
                scaleY = 1.0 - Math.sin(tProgress) * 0.15;
                break;
            case 'breathing':
                let bFactor = Math.sin(tProgress * 0.5);
                scaleX = scaleY = 1.0 + bFactor * 0.12;
                break;
            case 'faze':
                ctx.fillStyle = '#ff0000';
                ctx.fillText(layer.text || '', targetX - 4, targetY);
                ctx.fillStyle = '#00ffff';
                ctx.fillText(layer.text || '', targetX + 4, targetY);
                ctx.fillStyle = layer.color;
                break;
            case 'ripple':
                targetY += Math.sin(tProgress * 2) * 5;
                skewX = Math.cos(tProgress) * 0.15;
                break;
            case 'bubble':
                targetY -= (frameIndex % totalFrames) * 3;
                targetX += Math.sin(tProgress) * 6;
                break;
            case 'drunken':
                targetX += Math.sin(tProgress) * 15 + Math.cos(tProgress * 3) * 5;
                targetY += Math.cos(tProgress) * 10;
                break;
            case 'comet':
                targetX -= ((frameIndex % totalFrames) / totalFrames) * 40;
                opacity = 1 - ((frameIndex % totalFrames) / totalFrames) * 0.5;
                break;
            case 'lightning':
                if (Math.random() > 0.88) {
                    customTextColor = '#fffdf0';
                    currentGlow = 40;
                    opacity = 1;
                } else {
                    opacity = 0.8;
                }
                break;
            case 'orbit_3d':
                targetX += Math.cos(tProgress) * 50;
                targetY += Math.sin(tProgress) * 15;
                scaleX = 1 + Math.sin(tProgress) * 0.2;
                break;
            case 'heart_beat_fast':
                let hbf = (frameIndex % 5) / 5;
                scaleX = scaleY = hbf < 0.2 ? 1.3 : 1.0;
                break;
            case 'hyperspace':
                scaleX = scaleY = 1.0 + ((frameIndex % totalFrames) / totalFrames) * 0.5;
                break;
            case 'dissolve':
                opacity = 1.0 - ((frameIndex % totalFrames) / totalFrames);
                break;
            case 'unfurl':
                scaleX = ((frameIndex % totalFrames) / totalFrames);
                break;
            case 'snake':
                targetY += Math.sin(tProgress + (layer.x * 0.01)) * 20;
                break;
            case 'twinkle':
                opacity = 0.3 + Math.abs(Math.sin(tProgress * 2)) * 0.7;
                break;
            case 'blender':
                rotationAngle = tProgress * 3;
                targetX += Math.sin(tProgress) * 10;
                break;
            case 'bounce_heavy':
                let bh = (frameIndex % totalFrames) / totalFrames;
                let bhY = Math.pow(bh - 0.5, 2) * 4;
                targetY += (bhY * 40) - 10;
                break;
            case 'glitch_rgb':
                ctx.save();
                ctx.fillStyle = '#ff0000';
                ctx.fillText(layer.text || '', targetX - 6, targetY + 2);
                ctx.fillStyle = '#0000ff';
                ctx.fillText(layer.text || '', targetX + 6, targetY - 2);
                ctx.restore();
                break;
            case 'scanner':
                let barY = ((frameIndex % totalFrames) / totalFrames) * h;
                if (Math.abs(targetY - barY) < 30) {
                    currentGlow = 30;
                    customTextColor = '#00efff';
                }
                break;
            case 'wave_shear':
                skewY = Math.sin(tProgress) * 0.2;
                break;
            case 'eclipse_dark':
                let dark = Math.abs(Math.sin(tProgress)) * 0.8;
                opacity = 1.0 - dark;
                break;
            case 'hyper_zoom':
                scaleX = scaleY = Math.max(0.1, ((frameIndex % totalFrames) / totalFrames) * 3.0);
                break;
            case 'flicker_slow':
                opacity = Math.sin(tProgress * 0.5) > 0 ? 1.0 : 0.2;
                break;
            case 'pendulum_fast':
                rotationAngle = Math.sin(tProgress * 3) * 0.4;
                break;
            case 'dna_helix':
                targetX += Math.sin(tProgress) * 30;
                break;
            case 'quantum_state':
                if(frameIndex % 3 === 0) {
                    targetX += (Math.random() - 0.5) * 30;
                    targetY += (Math.random() - 0.5) * 30;
                }
                break;
            case 'blackhole':
                let bhDist = 1 - (frameIndex / totalFrames) * 0.5;
                scaleX = scaleY = bhDist;
                rotationAngle = tProgress;
                break;
            case 'supernova':
                if (frameIndex > totalFrames * 0.6) {
                    scaleX = scaleY = 1.0 + (frameIndex / totalFrames) * 2.0;
                    opacity = 1.0 - (frameIndex / totalFrames);
                }
                break;
            case 'nebula_float':
                targetX += Math.cos(tProgress * 0.5) * 15;
                targetY += Math.sin(tProgress * 0.3) * 15;
                break;
            case 'cosmic_ray':
                targetX += Math.tan(Math.sin(tProgress)) * 10;
                break;
            case 'subwoofer':
                let bass = Math.sin(tProgress * 4) * 8;
                scaleX = scaleY = 1.0 + Math.abs(bass) * 0.015;
                break;
        }

        // Apply Native 2D Transformation Canvas Engine Sequence Matrices
        ctx.translate(targetX, targetY);
        if (rotationAngle !== 0) ctx.rotate(rotationAngle);
        if (scaleX !== 1 || scaleY !== 1) ctx.scale(scaleX, scaleY);
        if (skewX !== 0 || skewY !== 0) ctx.transform(1, skewY, skewX, 1, 0, 0);
        
        ctx.globalAlpha = opacity;
        ctx.shadowColor = customTextColor + '77';
        ctx.shadowBlur = currentGlow;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = customTextColor;
        ctx.font = `bold ${layer.size}px "${layer.font}"`;
        
        ctx.fillText(layer.text || '', 0, 0);
        ctx.restore();
    });
}

// Coordinate calculation handler unified for Mouse and Touch events
function getCanvasCoordinates(e) {
    const rect = c.getBoundingClientRect();
    const scaleX = c.width / rect.width;
    const scaleY = c.height / rect.height;
    
    let clientX, clientY;
    if (e.touches && e.touches.length > 0) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
    } else {
        clientX = e.clientX;
        clientY = e.clientY;
    }
    
    return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top) * scaleY
    };
}

// Checking bounding bounds around text elements to pick target element
function handleStart(coords) {
    const layers = getActiveLayers().reverse(); // Check top layers first
    
    for (let layer of layers) {
        ctx.save();
        ctx.font = `bold ${layer.size}px "${layer.font}"`;
        const textWidth = ctx.measureText(layer.text || '').width;
        const textHeight = layer.size; 
        ctx.restore();
        
        if (coords.x >= (layer.x - textWidth / 2 - 15) && 
            coords.x <= (layer.x + textWidth / 2 + 15) &&
            coords.y >= (layer.y - textHeight / 2 - 15) && 
            coords.y <= (layer.y + textHeight / 2 + 15)) {
            
            selectedLayerRowId = layer.id;
            isDragging = true;
            dragOffsetX = coords.x - layer.x;
            dragOffsetY = coords.y - layer.y;
            break;
        }
    }
}

function handleMove(coords) {
    if (!isDragging || !selectedLayerRowId) return;
    
    const targetX = Math.round(coords.x - dragOffsetX);
    const targetY = Math.round(coords.y - dragOffsetY);
    
    const targetRow = document.getElementById(selectedLayerRowId);
    if (targetRow) {
        targetRow.querySelector('.layer-x').value = targetX;
        targetRow.querySelector('.layer-y').value = targetY;
        preview();
    }
}

function handleEnd() {
    isDragging = false;
    selectedLayerRowId = null;
}

c.addEventListener('mousedown', (e) => handleStart(getCanvasCoordinates(e)));
window.addEventListener('mousemove', (e) => handleMove(getCanvasCoordinates(e)));
window.addEventListener('mouseup', handleEnd);

c.addEventListener('touchstart', (e) => {
    handleStart(getCanvasCoordinates(e));
});
window.addEventListener('touchmove', (e) => {
    if (isDragging) {
        e.preventDefault(); 
        handleMove(getCanvasCoordinates(e));
    }
}, { passive: false });
window.addEventListener('touchend', handleEnd);

function adjustColorBrightness(hex, percent) {
    let R = parseInt(hex.substring(1,3),16);
    let G = parseInt(hex.substring(3,5),16);
    let B = parseInt(hex.substring(5,7),16);
    R = parseInt(R * (100 + percent) / 100);
    G = parseInt(G * (100 + percent) / 100);
    B = parseInt(B * (100 + percent) / 100);
    R = (R<255)?R:255; G = (G<255)?G:255; B = (B<255)?B:255;
    const rHex = (R.toString(16).length==1)?"0"+R.toString(16):R.toString(16);
    const gHex = (G.toString(16).length==1)?"0"+G.toString(16):G.toString(16);
    const bHex = (B.toString(16).length==1)?"0"+B.toString(16):B.toString(16);
    return "#"+rHex+gHex+bHex;
}

function preview() {
    const layers = getActiveLayers();
    draw(layers, 0, 1);
    statusEl.textContent = '✅ Realtime Drag & Custom Preview Ready';
    statusEl.style.color = '#00e676';
}

function downloadPNG() {
    const layers = getActiveLayers();
    draw(layers, 0, 1);
    const link = document.createElement('a');
    link.download = 'custom-banner.png';
    link.href = c.toDataURL('image/png');
    link.click();
    statusEl.textContent = '✅ PNG downloaded!';
    statusEl.style.color = '#00e676';
}

// ============================================================
// GIF ENCODER ENGINE (UNTOUCHED CORE)
// ============================================================
function createGIF(frames, w, h, delay) {
    let out = [];
    out.push(0x47, 0x49, 0x46, 0x38, 0x39, 0x61); 
    out.push(w & 0xFF, (w >> 8) & 0xFF);
    out.push(h & 0xFF, (h >> 8) & 0xFF);
    out.push(0xF7, 0x00, 0x00); 
    
    let palette = [];
    let baseBg = bannerBgInput.value;
    let bgR = parseInt(baseBg.substring(1,3),16) || 11;
    let bgG = parseInt(baseBg.substring(3,5),16) || 11;
    let bgB = parseInt(baseBg.substring(5,7),16) || 26;

    for (let i = 0; i < 32; i++) palette.push(bgR, bgG, Math.min(255, bgB + i));
    for (let i = 0; i < 32; i++) palette.push(Math.min(255, bgR+i), bgG, Math.min(255, bgB+30+i));
    
    const layers = getActiveLayers();
    let sampleHex = (layers.length > 0 ? layers[0].color : '#f5a623').replace('#', '');
    let r = parseInt(sampleHex.substring(0,2), 16) || 245;
    let g = parseInt(sampleHex.substring(2,4), 16) || 166;
    let b = parseInt(sampleHex.substring(4,6), 16) || 35;
    
    for (let i = 0; i < 128; i++) {
        let factor = i / 127;
        palette.push(Math.round(r * factor), Math.round(g * factor), Math.round(b * factor));
    }
    while(palette.length < 256 * 3) {
        palette.push(255, 255, 255); 
    }
    out.push(...palette);

    out.push(0x21, 0xFF, 0x0B, ...[0x4E, 0x45, 0x54, 0x53, 0x43, 0x41, 0x50, 0x45, 0x32, 0x2E, 0x30], 0x03, 0x01, 0x00, 0x00, 0x00);

    for (let f = 0; f < frames.length; f++) {
        out.push(0x21, 0xF9, 0x04, 0x04, delay & 0xFF, (delay >> 8) & 0xFF, 0x00, 0x00);
        out.push(0x2C, 0x00, 0x00, 0x00, 0x00, w & 0xFF, (w >> 8) & 0xFF, h & 0xFF, (h >> 8) & 0xFF, 0x00);
        
        const fCtx = frames[f].getContext('2d');
        const imgData = fCtx.getImageData(0, 0, w, h).data;
        const indexes = [];
        
        for (let i = 0; i < imgData.length; i += 4) {
            let ir = imgData[i], ig = imgData[i+1], ib = imgData[i+2];
            let minDst = Number.MAX_VALUE, bestIdx = 0;
            for (let j = 0; j < 256; j++) {
                let pr = palette[j*3], pg = palette[j*3+1], pb = palette[j*3+2];
                let dst = (ir-pr)*(ir-pr) + (ig-pg)*(ig-pg) + (ib-pb)*(ib-pb);
                if (dst < minDst) { minDst = dst; bestIdx = j; }
            }
            indexes.push(bestIdx);
        }
        
        out.push(0x08); 
        let encoded = lzwPack(indexes);
        
        for (let i = 0; i < encoded.length; i += 255) {
            let chunk = encoded.slice(i, i + 255);
            out.push(chunk.length);
            out.push(...chunk);
        }
        out.push(0x00); 
    }
    
    out.push(0x3B); 
    return new Uint8Array(out);
}

function lzwPack(pixels) {
    let outBytes = [];
    let bitBuffer = 0, bitCount = 0;
    
    function writeCode(code, size) {
        bitBuffer |= (code << bitCount);
        bitCount += size;
        while (bitCount >= 8) {
            outBytes.push(bitBuffer & 0xFF);
            bitBuffer >>= 8;
            bitCount -= 8;
        }
    }
    
    let clearBy = 256, endBy = 257;
    let dict = new Map();
    
    function resetDict() {
        dict.clear();
        for (let i = 0; i < 256; i++) dict.set(String.fromCharCode(i), i);
    }
    
    resetDict();
    let nextCode = 258, codeSize = 9;
    writeCode(clearBy, codeSize);
    
    let current = String.fromCharCode(pixels[0]);
    for (let i = 1; i < pixels.length; i++) {
        let p = String.fromCharCode(pixels[i]);
        let combo = current + p;
        if (dict.has(combo)) {
            current = combo;
        } else {
            writeCode(dict.get(current), codeSize);
            if (nextCode < 4096) {
                dict.set(combo, nextCode++);
                if (nextCode - 1 === (1 << codeSize)) codeSize++;
            } else {
                writeCode(clearBy, codeSize);
                resetDict();
                nextCode = 258;
                codeSize = 9;
            }
            current = p;
        }
    }
    writeCode(dict.get(current), codeSize);
    writeCode(endBy, codeSize);
    
    if (bitCount > 0) outBytes.push(bitBuffer & 0xFF);
    return outBytes;
}

function downloadGIF() {
    const layers = getActiveLayers();
    const w = c.width;
    const h = c.height;
    
    statusEl.textContent = '⏳ Generating Configured GIF...';
    statusEl.style.color = '#f5a623';
    progress.style.display = 'block';
    plabel.style.display = 'block';
    fill.style.width = '0%';
    
    const totalFrames = 36; 
    const delay = 5; 
    const frames = [];
    let frameIndex = 0;
    
    function captureFrame() {
        const pct = Math.round((frameIndex / totalFrames) * 100);
        fill.style.width = pct + '%';
        plabel.textContent = `Rendering Frame ${frameIndex + 1}/${totalFrames}`;
        
        const frameLayers = layers.map(l => Object.assign({}, l));
        draw(frameLayers, frameIndex, totalFrames);
        
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = w;
        tempCanvas.height = h;
        const tempCtx = tempCanvas.getContext('2d');
        tempCtx.drawImage(c, 0, 0);
        frames.push(tempCanvas);
        
        frameIndex++;
        
        if (frameIndex < totalFrames) {
            setTimeout(captureFrame, 30);
        } else {
            plabel.textContent = 'Encoding Canvas Visual Layers...';
            
            setTimeout(() => {
                try {
                    const gifUint8 = createGIF(frames, w, h, delay);
                    const blob = new Blob([gifUint8], { type: 'image/gif' });
                    const url = URL.createObjectURL(blob);
                    
                    const link = document.createElement('a');
                    link.download = `custom-banner-${w}x${h}.gif`;
                    link.href = url;
                    link.click();
                    URL.revokeObjectURL(url);
                    
                    progress.style.display = 'none';
                    plabel.style.display = 'none';
                    statusEl.textContent = '✅ Custom GIF downloaded successfully!';
                    statusEl.style.color = '#00e676';
                    setTimeout(() => draw(layers, 0, 1), 200);
                } catch(e) {
                    progress.style.display = 'none';
                    plabel.style.display = 'none';
                    statusEl.textContent = '❌ Error: ' + e.message;
                    statusEl.style.color = '#ff6b6b';
                    draw(layers, 0, 1);
                }
            }, 50);
        }
    }
    captureFrame();
}
