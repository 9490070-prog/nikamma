<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎯 GIF Banner · Dynamic Image Layers</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        :root {
            --bg-primary: #0a0a16;
            --bg-secondary: #12122a;
            --bg-card: #1a1a3a;
            --bg-input: #0f0f25;
            --accent: #f5a623;
            --accent-glow: rgba(245, 166, 35, 0.4);
            --text-main: #f0f0ff;
            --text-muted: #8e8eb0;
            --success: #00e676;
            --danger: #ff4d6d;
            --border-subtle: rgba(255,255,255,0.06);
            --gradient-btn: linear-gradient(135deg, #f5a623, #f57c00);
        }
        body {
            background: var(--bg-primary);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            padding: 8px;
            color: var(--text-main);
        }
        .box {
            background: var(--bg-secondary);
            padding: 14px 16px;
            border-radius: 20px;
            max-width: 1200px;
            width: 100%;
            border: 1px solid rgba(255,255,255,0.03);
            box-shadow: 0 30px 60px rgba(0,0,0,0.7);
        }
        h2 {
            font-size: clamp(16px, 3vw, 24px);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 0 0 8px 0;
            letter-spacing: -0.5px;
            flex-wrap: wrap;
        }
        h2 span {
            background: linear-gradient(135deg, #fff 30%, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .top-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 5px;
            background: rgba(0,0,0,0.3);
            padding: 8px 10px;
            border-radius: 12px;
            margin-bottom: 8px;
            border: 1px solid var(--border-subtle);
        }
        .top-row .item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .top-row .item label {
            font-size: 7px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: var(--text-muted);
            font-weight: 600;
        }
        .top-row .item input[type="number"],
        .top-row .item input[type="text"] {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            padding: 3px 5px;
            border-radius: 5px;
            color: #fff;
            font-size: 10px;
            outline: none;
            width: 100%;
        }
        .top-row .item input:focus {
            border-color: var(--accent);
        }
        .top-row .item input[type="color"] {
            width: 28px;
            height: 24px;
            border: none;
            padding: 0;
            border-radius: 5px;
            background: transparent;
            cursor: pointer;
        }
        .top-row .item .color-wrapper {
            display: flex;
            gap: 3px;
            align-items: center;
        }
        .top-row .item .color-wrapper input[type="text"] {
            width: 40px;
            padding: 2px 3px;
            font-size: 8px;
        }

        /* Image Layers Container */
        .image-layers-container {
            background: rgba(0,0,0,0.2);
            padding: 6px;
            border-radius: 10px;
            max-height: 280px;
            overflow-y: auto;
            margin-bottom: 8px;
            border: 1px solid var(--border-subtle);
        }
        .image-layer-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 4px;
            background: var(--bg-card);
            padding: 5px 8px;
            border-radius: 8px;
            margin-bottom: 4px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .image-layer-row .layer-label {
            font-size: 8px;
            font-weight: 700;
            color: var(--accent);
            min-width: 30px;
        }
        .image-layer-row input[type="file"] {
            display: none;
        }
        .image-layer-row .file-label {
            background: rgba(255,255,255,0.05);
            border: 1px dashed var(--border-subtle);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 7px;
            cursor: pointer;
            color: var(--text-muted);
            transition: 0.2s;
        }
        .image-layer-row .file-label:hover {
            border-color: var(--accent);
            color: #fff;
        }
        .image-layer-row .img-preview {
            width: 30px;
            height: 30px;
            object-fit: cover;
            border-radius: 4px;
            border: 1px solid var(--border-subtle);
            background: #000;
        }
        .image-layer-row input[type="number"] {
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border-subtle);
            padding: 2px 4px;
            border-radius: 4px;
            color: #fff;
            font-size: 8px;
            width: 40px;
            outline: none;
        }
        .image-layer-row input[type="number"]:focus {
            border-color: var(--accent);
        }
        .image-layer-row select {
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border-subtle);
            padding: 2px 3px;
            border-radius: 4px;
            color: #fff;
            font-size: 7px;
            outline: none;
            cursor: pointer;
        }
        .image-layer-row .btn-del-img {
            background: var(--danger);
            border: none;
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 700;
            cursor: pointer;
            font-size: 8px;
        }
        .image-layer-row .btn-del-img:hover { background: #e03a5a; }
        .image-layer-row .layer-order {
            font-size: 7px;
            color: var(--text-muted);
            min-width: 20px;
        }

        .btn-add-image {
            background: rgba(255,255,255,0.03);
            border: 1px dashed rgba(255,255,255,0.15);
            color: var(--text-muted);
            padding: 4px;
            width: 100%;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 6px;
            font-size: 9px;
        }
        .btn-add-image:hover {
            background: rgba(255,255,255,0.06);
            color: #fff;
            border-color: var(--accent);
        }

        .text-rows-container {
            background: rgba(0,0,0,0.2);
            padding: 5px;
            border-radius: 8px;
            max-height: 150px;
            overflow-y: auto;
            margin-bottom: 6px;
            border: 1px solid var(--border-subtle);
        }
        .text-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 2px;
            background: var(--bg-card);
            padding: 3px 5px;
            border-radius: 6px;
            margin-bottom: 3px;
            border: 1px solid rgba(255,255,255,0.02);
        }
        .text-row input.layer-text {
            flex: 2;
            min-width: 40px;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border-subtle);
            padding: 2px 4px;
            border-radius: 3px;
            color: #fff;
            font-size: 9px;
            outline: none;
        }
        .text-row input.layer-text:focus {
            border-color: var(--accent);
        }
        .text-row .input-group-custom {
            display: flex;
            align-items: center;
            background: rgba(0,0,0,0.25);
            border-radius: 3px;
            padding-left: 2px;
            border: 1px solid var(--border-subtle);
        }
        .text-row .input-group-custom span {
            font-size: 5px;
            color: var(--text-muted);
            font-weight: 700;
        }
        .text-row .input-group-custom input[type="number"] {
            width: 20px;
            padding: 1px 1px;
            border: none;
            background: transparent;
            color: #fff;
            font-size: 8px;
            text-align: center;
            outline: none;
        }
        .text-row select {
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border-subtle);
            padding: 1px 2px;
            border-radius: 3px;
            color: #fff;
            font-size: 7px;
            outline: none;
            cursor: pointer;
        }
        .text-row input[type="color"] {
            width: 16px;
            height: 16px;
            padding: 0;
            border: none;
            border-radius: 3px;
            background: transparent;
            cursor: pointer;
        }
        .btn-del {
            background: var(--danger);
            border: none;
            color: white;
            padding: 1px 4px;
            border-radius: 3px;
            font-weight: 700;
            cursor: pointer;
            font-size: 8px;
        }
        .btn-del:hover { background: #e03a5a; }
        .btn-add {
            background: rgba(255,255,255,0.03);
            border: 1px dashed rgba(255,255,255,0.15);
            color: var(--text-muted);
            padding: 4px;
            width: 100%;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 6px;
            font-size: 9px;
        }
        .btn-add:hover {
            background: rgba(255,255,255,0.06);
            color: #fff;
            border-color: var(--accent);
        }
        .actions-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            justify-content: center;
            margin-bottom: 6px;
        }
        .btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-subtle);
            color: #fff;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 9px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn:hover { transform: translateY(-1px); background: rgba(255,255,255,0.1); }
        .btn-primary {
            background: var(--gradient-btn);
            border: none;
            color: #000;
            font-weight: 700;
        }
        .btn-primary:hover { box-shadow: 0 3px 12px var(--accent-glow); }
        .btn-g { background: linear-gradient(135deg, #00d2ff, #0088ff); border: none; }

        .canvas-container {
            background: #000;
            padding: 3px;
            border-radius: 8px;
            margin: 4px 0 2px;
            border: 1px solid var(--border-subtle);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            width: 100%;
        }
        .canvas-container canvas {
            border-radius: 5px;
            display: block;
            cursor: grab;
            max-width: 100%;
            height: auto;
            image-rendering: auto;
        }
        .drag-hint {
            font-size: 7px;
            color: var(--accent);
            text-align: center;
            margin-top: 1px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }
        .status-box {
            background: rgba(0,0,0,0.3);
            border-radius: 6px;
            padding: 4px 6px;
            margin-top: 4px;
        }
        .status { font-weight: 600; font-size: 9px; }
        .progress { width: 100%; height: 2px; background: #1e1e3a; border-radius: 20px; margin: 2px 0 1px; display: none; overflow: hidden; }
        .progress .fill { height: 100%; width: 0%; background: linear-gradient(90deg, #00d2ff, var(--accent)); }
        .plabel { color: var(--text-muted); font-size: 8px; display: none; }
        ::-webkit-scrollbar { width: 2px; }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 8px; }

        @media (max-width: 600px) {
            .box { padding: 8px; }
            .top-row { grid-template-columns: repeat(2, 1fr); }
            .image-layer-row { flex-wrap: wrap; }
        }
        @media (max-width: 400px) {
            .top-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="box">
    <h2>🖼️ <span>Dynamic Image Layers · Multiple Images</span></h2>

    <!-- TOP CONTROLS -->
    <div class="top-row">
        <div class="item">
            <label>Width (px)</label>
            <input type="number" id="bannerWidth" value="600" min="100" max="4000" oninput="updateCanvasSize()">
        </div>
        <div class="item">
            <label>Height (px)</label>
            <input type="number" id="bannerHeight" value="300" min="100" max="4000" oninput="updateCanvasSize()">
        </div>
        <div class="item">
            <label>GIF Quality</label>
            <select id="gifQuality" onchange="updateQuality()">
                <option value="low">Low (240p)</option>
                <option value="medium" selected>Medium (480p)</option>
                <option value="high">High (720p)</option>
                <option value="hd">HD (1080p)</option>
                <option value="4k">4K (2160p)</option>
            </select>
        </div>
        <div class="item">
            <label>Background</label>
            <div class="color-wrapper">
                <input type="color" id="bannerBg" value="#0b0b1a" oninput="updateBg()">
                <input type="text" id="bannerBgHex" value="#0b0b1a" readonly>
            </div>
        </div>
    </div>

    <!-- ===== DYNAMIC IMAGE LAYERS ===== -->
    <div class="image-layers-container" id="imageLayersContainer">
        <!-- Image layers will be added here -->
        <div style="text-align:center;padding:8px;color:var(--text-muted);font-size:8px;" id="noImageMsg">
            No images added. Click "Add Image Layer" below.
        </div>
    </div>
    <button class="btn-add-image" onclick="addImageLayer()">🖼️ Add Image Layer</button>

    <!-- TEXT LAYERS -->
    <div class="text-rows-container" id="rowsContainer"></div>
    <button class="btn-add" onclick="addNewRow()">➕ Add Text Layer</button>

    <div class="actions-bar">
        <button class="btn btn-primary" onclick="preview()">⚡ Preview</button>
        <button class="btn" onclick="downloadPNG()">📸 PNG</button>
        <button class="btn btn-g" onclick="downloadGIF()">⬇️ GIF</button>
    </div>

    <div class="canvas-container">
        <canvas id="c" width="600" height="300"></canvas>
    </div>
    <div class="drag-hint">👆 Drag image or text on canvas to reposition</div>

    <div class="status-box">
        <div class="progress" id="progress"><div class="fill" id="fill"></div></div>
        <div class="plabel" id="plabel">Processing...</div>
        <div class="status" id="status">✅ Add multiple images · Each image has own settings</div>
    </div>
</div>
<script>
    (function(){
        const c = document.getElementById('c');
        const ctx = c.getContext('2d');
        const statusEl = document.getElementById('status');
        const progress = document.getElementById('progress');
        const fill = document.getElementById('fill');
        const plabel = document.getElementById('plabel');
        const rowsContainer = document.getElementById('rowsContainer');
        const imageLayersContainer = document.getElementById('imageLayersContainer');
        const noImageMsg = document.getElementById('noImageMsg');
        const bannerWidthInput = document.getElementById('bannerWidth');
        const bannerHeightInput = document.getElementById('bannerHeight');
        const bannerBgInput = document.getElementById('bannerBg');
        const bannerBgHex = document.getElementById('bannerBgHex');
        const gifQualitySelect = document.getElementById('gifQuality');

        // ===== IMAGE LAYERS STORE =====
        let imageLayers = [];
        let imageLayerIdCounter = 0;

        // Text layers store
        const layerCoords = {};
        let canvasWidth = 600, canvasHeight = 300;
        let currentQuality = 'medium';
        let isDragging = false;
        let draggedElement = null;
        let dragOffset = { x: 0, y: 0 };
        let draggedLayerType = null;

        const initialLayers = [
            { text: '✨ Multiple Images', color: '#f5a623', size: 32, font: 'Arial', anim: 'wave' },
            { text: '✦ Each layer customizable ✦', color: '#b0b0ff', size: 14, font: 'Arial', anim: 'pulse' }
        ];

        // ===== ADD IMAGE LAYER =====
        function addImageLayer(imageDataUrl = null) {
            const id = 'img_' + (++imageLayerIdCounter) + '_' + Date.now();
            const layer = {
                id: id,
                image: null,
                dataUrl: imageDataUrl || null,
                x: 50 + (imageLayers.length * 20),
                y: 50 + (imageLayers.length * 20),
                width: 150,
                height: 150,
                opacity: 100,
                brightness: 0,
                contrast: 0,
                saturation: 0,
                blur: 0,
                radius: 0,
                border: 0,
                borderColor: '#f5a623',
                shadow: 0,
                rotation: 0,
                flipH: false,
                flipV: false,
                animation: 'none',
                animTime: 8,
                visible: true
            };
            imageLayers.push(layer);
            renderImageLayers();
            
            // If image data provided, load it
            if (imageDataUrl) {
                const img = new Image();
                img.onload = function() {
                    layer.image = img;
                    renderImageLayers();
                    preview();
                };
                img.src = imageDataUrl;
            }
            
            noImageMsg.style.display = 'none';
            preview();
        }

        // ===== RENDER IMAGE LAYERS UI =====
        function renderImageLayers() {
            if (imageLayers.length === 0) {
                noImageMsg.style.display = 'block';
                imageLayersContainer.innerHTML = `<div style="text-align:center;padding:8px;color:var(--text-muted);font-size:8px;" id="noImageMsg">No images added. Click "Add Image Layer" below.</div>`;
                return;
            }
            
            let html = '';
            imageLayers.forEach((layer, index) => {
                const previewSrc = layer.dataUrl || '';
                html += `
                    <div class="image-layer-row" data-id="${layer.id}">
                        <span class="layer-order">#${index + 1}</span>
                        <span class="layer-label">🖼️</span>
                        ${previewSrc ? `<img src="${previewSrc}" class="img-preview" id="preview_${layer.id}" alt="preview">` : '<span style="font-size:7px;color:var(--text-muted);">No image</span>'}
                        <label class="file-label" for="file_${layer.id}">📂 Upload</label>
                        <input type="file" id="file_${layer.id}" accept="image/*" onchange="uploadImageToLayer('${layer.id}', event)">
                        
                        <input type="number" value="${layer.width}" min="10" max="800" placeholder="W" onchange="updateImageLayer('${layer.id}', 'width', this.value)">
                        <input type="number" value="${layer.height}" min="10" max="800" placeholder="H" onchange="updateImageLayer('${layer.id}', 'height', this.value)">
                        
                        <select onchange="updateImageLayer('${layer.id}', 'animation', this.value)">
                            <option value="none" ${layer.animation==='none'?'selected':''}>None</option>
                            <option value="zoom" ${layer.animation==='zoom'?'selected':''}>Zoom</option>
                            <option value="rotate" ${layer.animation==='rotate'?'selected':''}>Rotate</option>
                            <option value="bounce" ${layer.animation==='bounce'?'selected':''}>Bounce</option>
                            <option value="fade" ${layer.animation==='fade'?'selected':''}>Fade</option>
                            <option value="slide" ${layer.animation==='slide'?'selected':''}>Slide</option>
                            <option value="wave" ${layer.animation==='wave'?'selected':''}>Wave</option>
                            <option value="pulse" ${layer.animation==='pulse'?'selected':''}>Pulse</option>
                            <option value="spin" ${layer.animation==='spin'?'selected':''}>Spin</option>
                            <option value="glow" ${layer.animation==='glow'?'selected':''}>Glow</option>
                            <option value="shake" ${layer.animation==='shake'?'selected':''}>Shake</option>
                            <option value="flip" ${layer.animation==='flip'?'selected':''}>Flip</option>
                            <option value="swing" ${layer.animation==='swing'?'selected':''}>Swing</option>
                            <option value="float" ${layer.animation==='float'?'selected':''}>Float</option>
                        </select>
                        
                        <input type="number" value="${layer.opacity}" min="10" max="100" placeholder="Op" onchange="updateImageLayer('${layer.id}', 'opacity', this.value)" style="width:30px;">
                        
                        <button class="btn-del-img" onclick="removeImageLayer('${layer.id}')">✕</button>
                    </div>
                `;
            });
            imageLayersContainer.innerHTML = html;
        }

        // ===== UPLOAD IMAGE TO LAYER =====
        window.uploadImageToLayer = function(layerId, event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const layer = imageLayers.find(l => l.id === layerId);
                    if (layer) {
                        layer.image = img;
                        layer.dataUrl = e.target.result;
                        // Auto-size image
                        let maxW = canvasWidth * 0.4, maxH = canvasHeight * 0.4;
                        let w = Math.min(img.width, maxW);
                        let h = Math.min(img.height, maxH);
                        layer.width = w;
                        layer.height = h;
                        renderImageLayers();
                        preview();
                        statusEl.textContent = '✅ Image uploaded to layer!';
                    }
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        };

        // ===== UPDATE IMAGE LAYER =====
        window.updateImageLayer = function(layerId, key, value) {
            const layer = imageLayers.find(l => l.id === layerId);
            if (!layer) return;
            if (key === 'width' || key === 'height' || key === 'opacity' || key === 'brightness' || 
                key === 'contrast' || key === 'saturation' || key === 'blur' || key === 'radius' ||
                key === 'border' || key === 'shadow' || key === 'rotation' || key === 'animTime') {
                layer[key] = parseFloat(value) || 0;
            } else if (key === 'animation') {
                layer[key] = value;
            } else {
                layer[key] = value;
            }
            // Clamp values
            if (key === 'width' || key === 'height') {
                layer[key] = Math.max(10, Math.min(800, layer[key]));
            }
            if (key === 'opacity') {
                layer[key] = Math.max(10, Math.min(100, layer[key]));
            }
            if (key === 'blur') {
                layer[key] = Math.max(0, Math.min(20, layer[key]));
            }
            renderImageLayers();
            preview();
        };

        // ===== REMOVE IMAGE LAYER =====
        window.removeImageLayer = function(layerId) {
            imageLayers = imageLayers.filter(l => l.id !== layerId);
            renderImageLayers();
            if (imageLayers.length === 0) {
                noImageMsg.style.display = 'block';
            }
            preview();
        };

        // ===== QUALITY =====
        function updateQuality() {
            currentQuality = gifQualitySelect.value;
            const qualityMap = {
                low: { w: 320, h: 180, label: 'Low (240p)' },
                medium: { w: 640, h: 360, label: 'Medium (480p)' },
                high: { w: 960, h: 540, label: 'High (720p)' },
                hd: { w: 1280, h: 720, label: 'HD (1080p)' },
                '4k': { w: 1920, h: 1080, label: '4K (2160p)' }
            };
            const q = qualityMap[currentQuality] || qualityMap.medium;
            statusEl.textContent = `✅ Quality: ${q.label}`;
            preview();
        }

        // ===== CANVAS SIZE =====
        function updateCanvasSize() {
            let w = parseInt(bannerWidthInput.value) || 600;
            let h = parseInt(bannerHeightInput.value) || 300;
            w = Math.max(100, Math.min(4000, w));
            h = Math.max(100, Math.min(4000, h));
            canvasWidth = w;
            canvasHeight = h;
            c.width = w;
            c.height = h;
            
            const container = c.parentElement;
            const maxWidth = container.clientWidth - 6;
            if (w > maxWidth) {
                c.style.width = maxWidth + 'px';
                c.style.height = (h * (maxWidth / w)) + 'px';
            } else {
                c.style.width = w + 'px';
                c.style.height = h + 'px';
            }
            preview();
        }

        function updateBg() {
            bannerBgHex.value = bannerBgInput.value;
            preview();
        }

        // ===== ANIMATION ENGINE FOR IMAGE LAYERS =====
        function getLayerAnimation(t, layer, w, h) {
            let result = { dx: 0, dy: 0, scale: 1, rotation: 0, opacity: 1, glow: 0, hue: 0 };
            const speed = 1 / (layer.animTime || 8);
            const phase = t * speed;
            const animType = layer.animation || 'none';
            
            switch(animType) {
                case 'none': break;
                case 'zoom': result.scale = 1 + 0.15 * Math.sin(phase); break;
                case 'rotate': result.rotation = phase * 0.5; break;
                case 'bounce': result.dy = -Math.abs(Math.sin(phase)) * 25; break;
                case 'fade': result.opacity = 0.4 + 0.6 * (0.5 + 0.5 * Math.sin(phase)); break;
                case 'slide': result.dx = Math.sin(phase) * w * 0.08; break;
                case 'wave': result.dy = Math.sin(phase) * h * 0.06; break;
                case 'pulse': result.glow = 10 + Math.sin(phase) * 15; break;
                case 'spin': result.rotation = phase * 2; break;
                case 'glow': result.glow = 5 + Math.sin(phase) * 20; break;
                case 'shake': result.dx = Math.sin(phase * 20) * 3; result.dy = Math.cos(phase * 22) * 3; break;
                case 'flip': result.scale = Math.sin(phase) > 0 ? 1 : -1; break;
                case 'swing': result.dx = Math.sin(phase * 0.8) * 20; result.rotation = Math.sin(phase * 0.8) * 0.2; break;
                case 'float': result.dy = Math.sin(phase * 0.7) * 20; break;
                default: break;
            }
            return result;
        }

        // ===== DRAW =====
        function draw(layers, frameIndex = 0, totalFrames = 1) {
            const w = canvasWidth, h = canvasHeight;
            const baseBg = bannerBgInput.value;
            
            ctx.clearRect(0, 0, w, h);
            
            const grad = ctx.createRadialGradient(w*0.5, h*0.5, 10, w*0.5, h*0.5, w*0.7);
            grad.addColorStop(0, baseBg);
            grad.addColorStop(0.7, adjustColorBrightness(baseBg, -25));
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);

            // ===== DRAW ALL IMAGE LAYERS =====
            const t = totalFrames > 1 ? (frameIndex / totalFrames) * Math.PI * 2 : 0;
            
            imageLayers.forEach(layer => {
                if (!layer.image || !layer.visible) return;
                
                const anim = getLayerAnimation(t, layer, w, h);
                let dx = layer.x + (anim.dx || 0);
                let dy = layer.y + (anim.dy || 0);
                let dw = layer.width * (anim.scale || 1);
                let dh = layer.height * (anim.scale || 1);
                let rotation = (layer.rotation || 0) * Math.PI / 180 + (anim.rotation || 0);
                let opacity = (anim.opacity || 1) * (layer.opacity / 100);
                let glow = (layer.shadow || 0) + (anim.glow || 0);

                dx = dx - (dw - layer.width) / 2;
                dy = dy - (dh - layer.height) / 2;

                let filterStr = '';
                if (layer.brightness !== 0) filterStr += `brightness(${100 + layer.brightness}%) `;
                if (layer.contrast !== 0) filterStr += `contrast(${100 + layer.contrast}%) `;
                if (layer.saturation !== 0) filterStr += `saturate(${100 + layer.saturation}%) `;
                if (layer.blur > 0) filterStr += `blur(${layer.blur}px) `;

                let flipX = layer.flipH ? -1 : 1;
                let flipY = layer.flipV ? -1 : 1;

                ctx.save();
                ctx.globalAlpha = Math.max(0, Math.min(1, opacity));
                ctx.shadowColor = layer.borderColor;
                ctx.shadowBlur = glow;

                let cx = dx + dw/2, cy = dy + dh/2;
                ctx.translate(cx, cy);
                ctx.rotate(rotation);
                ctx.scale(flipX, flipY);
                ctx.translate(-cx, -cy);

                if (layer.radius > 0) {
                    ctx.beginPath();
                    roundRect(ctx, dx, dy, dw, dh, layer.radius);
                    ctx.clip();
                }

                if (filterStr) ctx.filter = filterStr;
                ctx.drawImage(layer.image, dx, dy, dw, dh);
                ctx.filter = 'none';

                if (layer.border > 0) {
                    ctx.shadowBlur = 0;
                    ctx.strokeStyle = layer.borderColor;
                    ctx.lineWidth = layer.border;
                    if (layer.radius > 0) {
                        ctx.beginPath();
                        roundRect(ctx, dx, dy, dw, dh, layer.radius);
                        ctx.stroke();
                    } else {
                        ctx.strokeRect(dx, dy, dw, dh);
                    }
                }
                ctx.restore();
            });

            // ===== DRAW TEXT LAYERS =====
            const textT = totalFrames > 1 ? (frameIndex / totalFrames) * Math.PI * 2 : 0;
            layers.forEach(layer => {
                ctx.save();
                let targetX = layer.x, targetY = layer.y;
                let glow = 12, opacity = 1;
                if (layer.anim === 'wave') targetY += Math.sin(textT) * canvasHeight * 0.04;
                else if (layer.anim === 'pulse') glow = 12 + Math.sin(textT)*10;
                else if (layer.anim === 'slide') targetX += Math.sin(textT) * canvasWidth * 0.05;
                else if (layer.anim === 'flicker') opacity = Math.random() > 0.8 ? 0.3 : 1;

                ctx.globalAlpha = opacity;
                ctx.shadowColor = layer.color + '99';
                ctx.shadowBlur = glow;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = layer.color;
                ctx.font = `bold ${layer.size}px "${layer.font}"`;
                ctx.fillText(layer.text || '', targetX, targetY);
                ctx.restore();
            });
        }

        function roundRect(ctx, x, y, w, h, r) {
            if (r > w/2) r = w/2;
            if (r > h/2) r = h/2;
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            return ctx;
        }

        function adjustColorBrightness(hex, percent) {
            let r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
            r = Math.min(255, Math.max(0, r + percent));
            g = Math.min(255, Math.max(0, g + percent));
            b = Math.min(255, Math.max(0, b + percent));
            return '#' + [r,g,b].map(c => c.toString(16).padStart(2,'0')).join('');
        }

        // ===== TEXT LAYERS =====
        function addNewRow(text = 'New Layer', color = '#ffffff', size = 18, font = 'Arial', anim = 'static') {
            const rowId = 'row_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
            const rowHtml = `
                <div class="text-row" id="${rowId}" data-id="${rowId}">
                    <input type="text" class="layer-text" value="${text}" placeholder="Text..." oninput="preview()">
                    <div class="input-group-custom">
                        <span>SZ</span>
                        <input type="number" class="layer-size" value="${size}" min="8" max="200" oninput="preview()">
                    </div>
                    <select class="layer-font" onchange="preview()">
                        <option value="Arial" ${font==='Arial'?'selected':''}>Arial</option>
                        <option value="Times New Roman" ${font==='Times New Roman'?'selected':''}>Times</option>
                        <option value="Courier New" ${font==='Courier New'?'selected':''}>Courier</option>
                        <option value="Impact" ${font==='Impact'?'selected':''}>Impact</option>
                        <option value="Comic Sans MS" ${font==='Comic Sans MS'?'selected':''}>Comic</option>
                    </select>
                    <select class="layer-anim" onchange="preview()">
                        <option value="static" ${anim==='static'?'selected':''}>Static</option>
                        <option value="wave" ${anim==='wave'?'selected':''}>Wave</option>
                        <option value="pulse" ${anim==='pulse'?'selected':''}>Pulse</option>
                        <option value="slide" ${anim==='slide'?'selected':''}>Slide</option>
                        <option value="flicker" ${anim==='flicker'?'selected':''}>Flicker</option>
                    </select>
                    <input type="color" class="layer-clr" value="${color}" oninput="preview()">
                    <button class="btn-del" onclick="removeRow('${rowId}')">✕</button>
                </div>
            `;
            rowsContainer.insertAdjacentHTML('beforeend', rowHtml);
            preview();
        }

        function removeRow(id) {
            const row = document.getElementById(id);
            if (row) { row.remove(); delete layerCoords[id]; preview(); }
        }

        function getActiveLayers() {
            const rows = rowsContainer.querySelectorAll('.text-row');
            const layers = [];
            const total = rows.length;
            const h = canvasHeight, w = canvasWidth;
            rows.forEach((row, idx) => {
                const id = row.getAttribute('data-id');
                let x = w/2, y = h/2;
                if (layerCoords[id] === undefined) {
                    if (total === 2) y = (idx === 0) ? h*0.32 : h*0.72;
                    else if (total > 2) y = h*0.18 + (idx * ((h*0.64)/(total-1)));
                    layerCoords[id] = { x: w/2, y: y };
                }
                const coords = layerCoords[id];
                layers.push({
                    id: id,
                    text: row.querySelector('.layer-text').value || '',
                    color: row.querySelector('.layer-clr').value,
                    size: parseInt(row.querySelector('.layer-size').value) || 18,
                    font: row.querySelector('.layer-font').value,
                    anim: row.querySelector('.layer-anim').value,
                    x: coords.x,
                    y: coords.y
                });
            });
            return layers;
        }

        function preview() {
            draw(getActiveLayers(), 0, 1);
            statusEl.textContent = `✅ Preview · ${imageLayers.length} images loaded`;
            statusEl.style.color = '#00e676';
        }

        function downloadPNG() {
            draw(getActiveLayers(), 0, 1);
            try {
                const link = document.createElement('a');
                link.download = 'custom-banner.png';
                link.href = c.toDataURL('image/png');
                link.click();
                statusEl.textContent = '✅ PNG saved!';
            } catch(e) {
                statusEl.textContent = '❌ Error: ' + e.message;
                statusEl.style.color = '#ff4d6d';
            }
        }

        // ===== DRAG for Image Layers =====
        function getEventCoords(e) {
            const rect = c.getBoundingClientRect();
            const scaleX = canvasWidth / rect.width;
            const scaleY = canvasHeight / rect.height;
            const cx = e.touches ? e.touches[0].clientX : e.clientX;
            const cy = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: (cx - rect.left) * scaleX,
                y: (cy - rect.top) * scaleY
            };
        }

        function dragStart(e) {
            const coords = getEventCoords(e);
            
            // Check image layers first (top to bottom)
            for (let i = imageLayers.length - 1; i >= 0; i--) {
                const layer = imageLayers[i];
                if (!layer.image || !layer.visible) continue;
                if (coords.x >= layer.x && coords.x <= layer.x + layer.width &&
                    coords.y >= layer.y && coords.y <= layer.y + layer.height) {
                    isDragging = true;
                    draggedElement = layer.id;
                    draggedLayerType = 'image';
                    dragOffset.x = coords.x - layer.x;
                    dragOffset.y = coords.y - layer.y;
                    return;
                }
            }
            
            // Check text layers
            const layers = getActiveLayers();
            for (let i = layers.length-1; i>=0; i--) {
                const l = layers[i];
                ctx.font = `bold ${l.size}px "${l.font}"`;
                const tw = ctx.measureText(l.text || ' ').width;
                const th = l.size;
                if (coords.x >= l.x - tw/2 && coords.x <= l.x + tw/2 &&
                    coords.y >= l.y - th/2 && coords.y <= l.y + th/2) {
                    isDragging = true;
                    draggedElement = l.id;
                    draggedLayerType = 'text';
                    dragOffset.x = coords.x - l.x;
                    dragOffset.y = coords.y - l.y;
                    return;
                }
            }
        }

        function dragMove(e) {
            if (!isDragging) return;
            e.preventDefault();
            const coords = getEventCoords(e);
            
            if (draggedLayerType === 'image') {
                const layer = imageLayers.find(l => l.id === draggedElement);
                if (layer) {
                    layer.x = coords.x - dragOffset.x;
                    layer.y = coords.y - dragOffset.y;
                    renderImageLayers();
                    preview();
                }
            } else if (draggedLayerType === 'text') {
                layerCoords[draggedElement].x = coords.x - dragOffset.x;
                layerCoords[draggedElement].y = coords.y - dragOffset.y;
                preview();
            }
        }

        function dragEnd() { isDragging = false; draggedElement = null; draggedLayerType = null; }

        c.addEventListener('mousedown', dragStart);
        window.addEventListener('mousemove', dragMove);
        window.addEventListener('mouseup', dragEnd);
        c.addEventListener('touchstart', dragStart, { passive: false });
        window.addEventListener('touchmove', dragMove, { passive: false });
        window.addEventListener('touchend', dragEnd);

        // ===== GIF Download =====
        function downloadGIF() {
            const layers = getActiveLayers();
            
            const qualityMap = {
                low: { scale: 0.5, label: 'Low (240p)' },
                medium: { scale: 1, label: 'Medium (480p)' },
                high: { scale: 1.5, label: 'High (720p)' },
                hd: { scale: 2, label: 'HD (1080p)' },
                '4k': { scale: 3.5, label: '4K (2160p)' }
            };
            const quality = qualityMap[currentQuality] || qualityMap.medium;
            
            let outW = Math.round(canvasWidth * quality.scale);
            let outH = Math.round(canvasHeight * quality.scale);
            outW = Math.min(outW, 3840);
            outH = Math.min(outH, 2160);
            
            statusEl.textContent = `⏳ Generating ${quality.label} (${outW}×${outH})...`;
            statusEl.style.color = '#f5a623';
            progress.style.display = 'block';
            plabel.style.display = 'block';
            fill.style.width = '0%';
            
            const totalFrames = 20;
            const delay = Math.round(10 / quality.scale);
            const frames = [];
            let frameIndex = 0;

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = outW;
            tempCanvas.height = outH;
            const tempCtx = tempCanvas.getContext('2d');

            function captureFrame() {
                const pct = Math.round((frameIndex/totalFrames)*100);
                fill.style.width = pct + '%';
                plabel.textContent = `Frame ${frameIndex+1}/${totalFrames}`;
                
                draw(layers, frameIndex, totalFrames);
                
                tempCtx.clearRect(0, 0, outW, outH);
                tempCtx.imageSmoothingEnabled = true;
                tempCtx.imageSmoothingQuality = 'high';
                tempCtx.drawImage(c, 0, 0, canvasWidth, canvasHeight, 0, 0, outW, outH);
                
                const frameCanvas = document.createElement('canvas');
                frameCanvas.width = outW;
                frameCanvas.height = outH;
                const fCtx = frameCanvas.getContext('2d');
                fCtx.drawImage(tempCanvas, 0, 0);
                frames.push(frameCanvas);
                
                frameIndex++;
                
                if (frameIndex < totalFrames) {
                    setTimeout(captureFrame, 50);
                } else {
                    plabel.textContent = 'Encoding GIF...';
                    setTimeout(() => {
                        try {
                            const gifData = createGIF(frames, outW, outH, delay);
                            const blob = new Blob([gifData], { type: 'image/gif' });
                            const url = URL.createObjectURL(blob);
                            
                            const link = document.createElement('a');
                            link.download = `custom-banner-${outW}x${outH}-${currentQuality}.gif`;
                            link.href = url;
                            document.body.appendChild(link);
                            link.click();
                            document.body.removeChild(link);
                            
                            setTimeout(() => URL.revokeObjectURL(url), 1000);
                            
                            progress.style.display = 'none';
                            plabel.style.display = 'none';
                            statusEl.textContent = `✅ GIF saved! ${quality.label} (${outW}×${outH})`;
                            statusEl.style.color = '#00e676';
                            setTimeout(() => draw(layers, 0, 1), 200);
                        } catch(e) {
                            progress.style.display = 'none';
                            plabel.style.display = 'none';
                            statusEl.textContent = '❌ Error: ' + e.message;
                            statusEl.style.color = '#ff4d6d';
                            draw(layers, 0, 1);
                        }
                    }, 100);
                }
            }
            captureFrame();
        }

        // ===== GIF Encoder =====
        function createGIF(frames, w, h, delay) {
            let out = [];
            out.push(0x47,0x49,0x46,0x38,0x39,0x61);
            out.push(w & 0xFF, (w>>8)&0xFF);
            out.push(h & 0xFF, (h>>8)&0xFF);
            out.push(0xF7,0x00,0x00);
            
            let palette = [];
            let bg = bannerBgInput.value;
            let br = parseInt(bg.slice(1,3),16)||11, bg_ = parseInt(bg.slice(3,5),16)||11, bb = parseInt(bg.slice(5,7),16)||26;
            for (let i=0;i<32;i++) palette.push(br, bg_, Math.min(255, bb+i));
            for (let i=0;i<32;i++) palette.push(Math.min(255, br+i), bg_, Math.min(255, bb+20+i));
            let sample = getActiveLayers().length?getActiveLayers()[0].color:'#f5a623';
            let r=parseInt(sample.slice(1,3),16)||245, g=parseInt(sample.slice(3,5),16)||166, b=parseInt(sample.slice(5,7),16)||35;
            for (let i=0;i<128;i++) { let f=i/127; palette.push(Math.round(r*f), Math.round(g*f), Math.round(b*f)); }
            while(palette.length<768) palette.push(255,255,255);
            out.push(...palette);

            out.push(0x21,0xFF,0x0B,0x4E,0x45,0x54,0x53,0x43,0x41,0x50,0x45,0x32,0x2E,0x30,0x03,0x01,0x00,0x00,0x00);

            for (let f=0; f<frames.length; f++) {
                out.push(0x21,0xF9,0x04,0x04, delay & 0xFF, (delay>>8)&0xFF, 0x00, 0x00);
                out.push(0x2C,0x00,0x00,0x00,0x00, w & 0xFF,(w>>8)&0xFF, h & 0xFF,(h>>8)&0xFF,0x00);
                
                const imgData = frames[f].getContext('2d').getImageData(0,0,w,h).data;
                const indexes = [];
                for (let i=0; i<imgData.length; i+=4) {
                    let ir=imgData[i], ig=imgData[i+1], ib=imgData[i+2];
                    let minDst=Infinity, bestIdx=0;
                    for (let j=0; j<256; j++) {
                        let pr=palette[j*3], pg=palette[j*3+1], pb=palette[j*3+2];
                        let dst=(ir-pr)*(ir-pr)+(ig-pg)*(ig-pg)+(ib-pb)*(ib-pb);
                        if (dst<minDst) { minDst=dst; bestIdx=j; }
                    }
                    indexes.push(bestIdx);
                }
                
                out.push(0x08);
                let encoded = lzwEncode(indexes);
                for (let i=0; i<encoded.length; i+=255) {
                    let chunk = encoded.slice(i, i+255);
                    out.push(chunk.length);
                    out.push(...chunk);
                }
                out.push(0x00);
            }
            out.push(0x3B);
            return new Uint8Array(out);
        }

        function lzwEncode(pixels) {
            let out = [], bitBuffer = 0, bitCount = 0;
            const writeCode = (code, size) => {
                bitBuffer |= (code << bitCount);
                bitCount += size;
                while (bitCount >= 8) {
                    out.push(bitBuffer & 0xFF);
                    bitBuffer >>= 8;
                    bitCount -= 8;
                }
            };
            
            let dict = new Map();
            const resetDict = () => {
                dict.clear();
                for(let i=0;i<256;i++) dict.set(String.fromCharCode(i), i);
            };
            resetDict();
            
            let nextCode = 258, codeSize = 9;
            writeCode(256, codeSize);
            
            let current = String.fromCharCode(pixels[0]);
            for (let i=1; i<pixels.length; i++) {
                let p = String.fromCharCode(pixels[i]);
                let combo = current + p;
                if (dict.has(combo)) {
                    current = combo;
                } else {
                    writeCode(dict.get(current), codeSize);
                    if (nextCode < 4096) {
                        dict.set(combo, nextCode++);
                        if (nextCode-1 === (1<<codeSize)) codeSize++;
                    } else {
                        writeCode(256, codeSize);
                        resetDict();
                        nextCode = 258;
                        codeSize = 9;
                    }
                    current = p;
                }
            }
            writeCode(dict.get(current), codeSize);
            writeCode(257, codeSize);
            if (bitCount > 0) out.push(bitBuffer & 0xFF);
            return out;
        }

        function handleResize() {
            updateCanvasSize();
        }

        // ===== EXPOSE GLOBALS =====
        window.addNewRow = addNewRow;
        window.removeRow = removeRow;
        window.preview = preview;
        window.downloadPNG = downloadPNG;
        window.downloadGIF = downloadGIF;
        window.updateCanvasSize = updateCanvasSize;
        window.updateBg = updateBg;
        window.updateQuality = updateQuality;
        window.addImageLayer = addImageLayer;
        window.uploadImageToLayer = uploadImageToLayer;
        window.updateImageLayer = updateImageLayer;
        window.removeImageLayer = removeImageLayer;

        // ===== INIT =====
        initialLayers.forEach(l => addNewRow(l.text, l.color, l.size, l.font, l.anim));
        
        let w = parseInt(bannerWidthInput.value) || 600;
        let h = parseInt(bannerHeightInput.value) || 300;
        canvasWidth = w;
        canvasHeight = h;
        c.width = w;
        c.height = h;
        
        setTimeout(updateCanvasSize, 50);
        window.addEventListener('resize', handleResize);
        updateQuality();
        
        // Add default image layer with demo
        setTimeout(() => {
            addImageLayer();
        }, 100);
        
        statusEl.textContent = '✅ Add multiple images · Each layer has own settings!';
        statusEl.style.color = '#00e676';
    })();
</script>
</body>
</html>
