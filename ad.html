<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#121212">
    <title>Nikamma 4K v3.9 | Ultimate HD</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --main: #00bcd4;
            --bg: #0b0b0b;
            --card: #1a1a1a;
            --text: #ffffff;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Poppins', sans-serif;
            padding-bottom: 70px;
            overflow-x: hidden;
        }

        /* Header */
        header {
            background: #121212;
            padding: 12px 16px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #222;
        }
        .header-flex {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1400px;
            margin: 0 auto;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .menu-icon {
            font-size: 24px;
            color: var(--main);
            cursor: pointer;
        }
        .app-title {
            font-weight: 800;
            font-size: 18px;
            color: var(--main);
            letter-spacing: 1px;
        }
        .search-icon {
            font-size: 20px;
            cursor: pointer;
            color: #ccc;
        }
        #searchBox {
            display: none;
            flex: 1;
            max-width: 300px;
        }
        #searchInput {
            width: 100%;
            background: #222;
            border: none;
            padding: 8px 16px;
            border-radius: 40px;
            color: white;
            font-family: inherit;
            outline: none;
        }

        /* Video Player */
        #videoContainer {
            display: none;
            background: black;
            position: sticky;
            top: 60px;
            z-index: 99;
        }
        .player-wrapper {
            position: relative;
            background: #000;
            aspect-ratio: 16/9;
        }
        #advVideo {
            width: 100%;
            height: 100%;
            object-fit: fill;
        }
        .player-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 12px;
            opacity: 0;
            transition: 0.2s;
            pointer-events: none;
        }
        .player-overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }
        .controls-row {
            display: flex;
            gap: 12px;
            align-items: center;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            padding: 8px 16px;
            border-radius: 40px;
            width: fit-content;
        }
        .ctrl-btn {
            background: none;
            border: none;
            color: white;
            font-size: 22px;
            cursor: pointer;
        }
        .video-info {
            display: flex;
            justify-content: space-between;
            padding: 8px 12px;
            background: #111;
        }
        #videoTitle {
            color: var(--main);
            font-weight: bold;
            font-size: 13px;
        }
        .close-vid {
            background: #f44336;
            border: none;
            padding: 4px 12px;
            border-radius: 20px;
            color: white;
            font-size: 11px;
            cursor: pointer;
        }

        /* Horizontal Scroll Categories */
        .category-block {
            margin-bottom: 28px;
            padding: 0 12px;
        }
        .category-head {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 8px 4px 12px 4px;
        }
        .category-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 16px;
            text-transform: uppercase;
        }
        .category-title i {
            color: var(--main);
            font-size: 18px;
        }
        .view-all-btn {
            background: rgba(0,188,212,0.15);
            color: var(--main);
            border: 1px solid rgba(0,188,212,0.3);
            padding: 5px 14px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
        }
        .scroll-horizontal {
            display: flex;
            flex-wrap: nowrap;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            gap: 12px;
            padding-bottom: 12px;
            scrollbar-width: thin;
        }
        .scroll-horizontal::-webkit-scrollbar {
            height: 3px;
        }
        .card {
            flex: 0 0 auto;
            width: 130px;
            background: var(--card);
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid #282828;
            scroll-snap-align: start;
            position: relative;
            transition: 0.2s;
        }
        @media (min-width: 500px) { .card { width: 150px; } }
        @media (min-width: 700px) { .card { width: 170px; } }
        .card img {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            display: block;
        }
        .card-title {
            padding: 8px 5px;
            font-size: 11px;
            text-align: center;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            background: rgba(0,0,0,0.4);
        }
        .card.active-card {
            border: 2px solid var(--main);
            transform: scale(0.97);
        }
        .fav-icon {
            position: absolute;
            top: 6px;
            right: 6px;
            background: rgba(0,0,0,0.6);
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            cursor: pointer;
            z-index: 5;
            backdrop-filter: blur(4px);
        }
        .fav-icon.active {
            color: #ff3b30;
            background: white;
        }

        /* Slider */
        .slider-container {
            width: 100%;
            height: 180px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        .slider-track {
            display: flex;
            transition: 0.5s ease;
            height: 100%;
        }
        .slide {
            min-width: 100%;
            height: 100%;
        }
        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* More section + profile */
        .profile-section {
            padding: 24px 20px;
            max-width: 500px;
            margin: 0 auto;
        }
        .profile-card {
            background: #1a1a1a;
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 20px;
            text-align: center;
            border: 1px solid #2a2a2a;
        }
        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--main);
            margin-bottom: 12px;
        }
        .theme-dots {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 16px;
        }
        .dot {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid white;
        }
        input {
            background: #222;
            border: none;
            padding: 10px 16px;
            border-radius: 40px;
            color: white;
            width: 100%;
            margin: 12px 0;
        }
        .btn-primary {
            background: var(--main);
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
        }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: rgba(18,18,18,0.96);
            backdrop-filter: blur(12px);
            display: flex;
            justify-content: space-around;
            padding: 8px 0 12px;
            border-top: 1px solid #222;
            z-index: 200;
        }
        .nav-item {
            text-align: center;
            font-size: 10px;
            color: #888;
            font-weight: 600;
            cursor: pointer;
            flex: 1;
        }
        .nav-item i {
            font-size: 20px;
            display: block;
            margin-bottom: 3px;
        }
        .nav-item.active {
            color: var(--main);
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 75%;
            max-width: 280px;
            height: 100%;
            background: #0f0f0f;
            z-index: 1000;
            transform: translateX(-100%);
            transition: 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            padding-top: 20px;
            border-right: 1px solid #222;
        }
        .sidebar.open {
            transform: translateX(0);
        }
        .sidebar a {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 24px;
            color: #bbb;
            text-decoration: none;
            font-size: 14px;
            border-bottom: 1px solid #1e1e1e;
        }
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 999;
            display: none;
        }
        .overlay.show {
            display: block;
        }

        .empty-msg {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        @media (min-width: 1024px) {
            .sidebar {
                transform: translateX(0);
                top: 60px;
                height: calc(100% - 60px);
            }
            .overlay {
                display: none !important;
            }
            .menu-icon {
                display: none;
            }
            .bottom-nav {
                display: none;
            }
            body {
                padding-bottom: 0;
            }
            .main-content {
                margin-left: 280px;
            }
            #videoContainer {
                margin-left: 280px;
                width: calc(100% - 280px);
            }
        }

        .loader {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid #333;
            border-top-color: var(--main);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .splash {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle, #1a1a1a, #000);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
    </style>
</head>
<body>

<!-- Splash -->
<div id="splash" class="splash">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTf7ax2YDbvMh3IxQPzSyY1YIewn8Q_1bDgR04kRJT5-A&s=10" style="width:90px; border-radius: 20px;">
    <h2 style="color:#00bcd4; margin-top: 12px;">Nikamma 4K</h2>
    <div class="loader" style="margin-top: 20px;"></div>
</div>

<!-- Sidebar -->
<div class="sidebar" id="sidebar">
    <a href="#" onclick="navigateHome()"><i class="fa fa-home"></i> Home</a>
    <div id="dynamicSideMenu"></div>
    <a href="#" id="rateLink"><i class="fa fa-star"></i> Rate Us</a>
    <a href="#" id="privacyLink"><i class="fa fa-lock"></i> Privacy</a>
    <a href="#" onclick="shareApp()"><i class="fa fa-share"></i> Share App</a>
    <a href="#" onclick="forceRefresh()"><i class="fa fa-sync"></i> Force Refresh</a>
</div>
<div class="overlay" id="overlay" onclick="closeSidebar()"></div>

<!-- Header -->
<header>
    <div class="header-flex">
        <div class="logo-area">
            <i class="fa fa-bars menu-icon" onclick="openSidebar()"></i>
            <span class="app-title">NIKAMMA 4K</span>
        </div>
        <div style="display: flex; gap: 12px;">
            <div id="searchBox"><input type="text" id="searchInput" placeholder="Search..." onkeyup="searchItems()"></div>
            <i class="fa fa-search search-icon" onclick="toggleSearch()"></i>
        </div>
    </div>
</header>

<!-- Video Player -->
<div id="videoContainer">
    <div class="player-wrapper">
        <video id="advVideo" playsinline autoplay muted></video>
        <div class="player-overlay" id="playerOverlay">
            <div style="display: flex; justify-content: flex-end;">
                <button class="ctrl-btn" id="closePlayerBtn"><i class="material-icons-round">close</i></button>
            </div>
            <div class="controls-row">
                <button class="ctrl-btn" id="playPauseBtn"><i class="material-icons-round">pause</i></button>
                <button class="ctrl-btn" id="muteBtn"><i class="material-icons-round">volume_off</i></button>
                <div style="flex:1"></div>
                <span id="fitBadge" style="font-size: 11px; background:#00000099; padding:4px 10px; border-radius:20px;">FILL</span>
                <button class="ctrl-btn" id="fitBtn"><i class="material-icons-round">aspect_ratio</i></button>
                <button class="ctrl-btn" id="fullBtn"><i class="material-icons-round">fullscreen</i></button>
            </div>
        </div>
    </div>
    <div class="video-info">
        <span id="videoTitle">Now Playing</span>
        <button class="close-vid" onclick="stopVideo()">CLOSE</button>
    </div>
</div>

<!-- Main Content -->
<div class="main-content" id="mainContent">
    <div class="slider-container" id="sliderWrap" style="display: none;">
        <div class="slider-track" id="sliderTrack"></div>
    </div>
    <div id="homeCategories"></div>
    <div id="categoryDetailView" style="display: none;">
        <div style="display: flex; justify-content: space-between; padding: 12px 16px;">
            <div class="category-title" id="detailTitle"><i class="fa fa-folder"></i> CATEGORY</div>
        </div>
        <div class="scroll-horizontal" id="detailGrid"></div>
    </div>
    <div id="moreView" style="display: none;">
        <div class="profile-section">
            <div class="profile-card" id="profileCard">
                <div id="guestView">
                    <i class="fa fa-user-circle" style="font-size: 60px; color:#555;"></i>
                    <h3>Guest User</h3>
                    <input type="text" id="usernameInput" placeholder="Enter username">
                    <button class="btn-primary" onclick="loginUser()">LOGIN</button>
                </div>
                <div id="userView" style="display: none;">
                    <img class="avatar" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR6A63t7tXh8Gj7956mGq4n8-yK9vT-w_S46A&s">
                    <h3 id="welcomeMsg"></h3>
                    <button class="btn-primary" style="background:#ff3b30;" onclick="logoutUser()">LOGOUT</button>
                </div>
            </div>
            <div class="profile-card">
                <h4>App Theme</h4>
                <div class="theme-dots">
                    <div class="dot" style="background:#00bcd4;" onclick="setTheme('#00bcd4')"></div>
                    <div class="dot" style="background:#ff9800;" onclick="setTheme('#ff9800')"></div>
                    <div class="dot" style="background:#e91e63;" onclick="setTheme('#e91e63')"></div>
                    <div class="dot" style="background:#4caf50;" onclick="setTheme('#4caf50')"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bottom Nav -->
<div class="bottom-nav">
    <div class="nav-item active" id="homeNav" onclick="showHome()"><i class="fa fa-home"></i> HOME</div>
    <div class="nav-item" id="liveNav" style="display: none;" onclick="showLive()"><i class="fa fa-circle-play"></i> LIVE</div>
    <div class="nav-item" onclick="showFavorites()"><i class="fa fa-heart"></i> FAV</div>
    <div class="nav-item" onclick="showMore()"><i class="fa fa-ellipsis"></i> MORE</div>
</div>

<script>
    // ---------- GLOBAL DATA ----------
    let masterData = [];
    let categoriesList = [];
    let favorites = JSON.parse(localStorage.getItem('favs_nk') || '[]');
    let currentStream = null;
    let hlsPlayer = null;
    let mpegPlayer = null;
    const videoEl = document.getElementById('advVideo');
    const splashDiv = document.getElementById('splash');

    // ---------- HELPERS ----------
    function saveFavs() { localStorage.setItem('favs_nk', JSON.stringify(favorites)); }
    function toggleFavItem(url, ev) { 
        ev.stopPropagation();
        let idx = favorites.indexOf(url);
        if(idx > -1) favorites.splice(idx,1); else favorites.push(url);
        saveFavs();
        document.querySelectorAll(`.fav-icon[data-url="${url}"]`).forEach(el => {
            if(favorites.includes(url)) el.classList.add('active');
            else el.classList.remove('active');
        });
        if(document.getElementById('categoryDetailView').style.display === 'block' && document.getElementById('detailTitle').innerText.includes('FAV')) showFavorites();
    }

    // Player logic
    function destroyPlayers() { if(hlsPlayer) { hlsPlayer.destroy(); hlsPlayer=null; } if(mpegPlayer) { mpegPlayer.destroy(); mpegPlayer=null; } videoEl.pause(); videoEl.src = ''; videoEl.load(); }
    function playVideo(url, title) {
        if(!url || url === '#') return;
        stopVideo();
        document.getElementById('videoContainer').style.display = 'block';
        document.getElementById('videoTitle').innerText = title;
        destroyPlayers();
        currentStream = url;
        const isM3u8 = url.includes('.m3u8');
        if(isM3u8 && window.Hls && Hls.isSupported()) {
            hlsPlayer = new Hls({ lowLatencyMode: true });
            hlsPlayer.loadSource(url);
            hlsPlayer.attachMedia(videoEl);
            hlsPlayer.on(Hls.Events.MANIFEST_PARSED, () => videoEl.play().catch(e=>console.warn));
        } else {
            videoEl.src = url;
            videoEl.play().catch(e=>console.warn);
        }
        videoEl.onplaying = () => { document.getElementById('playerOverlay').classList.add('visible'); setTimeout(()=> { if(!videoEl.paused) document.getElementById('playerOverlay').classList.remove('visible'); }, 4000); };
        window.scrollTo({top:0, behavior:'smooth'});
    }
    window.stopVideo = function() { destroyPlayers(); document.getElementById('videoContainer').style.display = 'none'; currentStream = null; document.querySelectorAll('.card').forEach(c => c.classList.remove('active-card')); showSliderIfNeeded(); };
    function showSliderIfNeeded() { let sliders = masterData.filter(i=> (i.Category||'').toLowerCase() === 'slider'); if(document.getElementById('homeCategories').style.display !== 'none' && sliders.length) document.getElementById('sliderWrap').style.display = 'block'; else document.getElementById('sliderWrap').style.display = 'none'; }

    // UI Controls
    let fitIndex = 2; const fits = ['contain','cover','fill'];
    function setFitMode() { videoEl.classList.remove('fit-contain','fit-cover','fit-fill'); videoEl.classList.add('fit-'+fits[fitIndex]); document.getElementById('fitBadge').innerText = fits[fitIndex].toUpperCase(); }
    document.getElementById('fitBtn').onclick = () => { fitIndex = (fitIndex+1)%3; setFitMode(); };
    document.getElementById('fullBtn').onclick = () => { if(videoEl.requestFullscreen) videoEl.requestFullscreen(); };
    document.getElementById('playPauseBtn').onclick = () => { if(videoEl.paused) videoEl.play(); else videoEl.pause(); };
    videoEl.onplay = () => document.getElementById('playPauseBtn').innerHTML = '<i class="material-icons-round">pause</i>';
    videoEl.onpause = () => document.getElementById('playPauseBtn').innerHTML = '<i class="material-icons-round">play_arrow</i>';
    document.getElementById('muteBtn').onclick = () => { videoEl.muted = !videoEl.muted; document.getElementById('muteBtn').innerHTML = `<i class="material-icons-round">${videoEl.muted ? 'volume_off' : 'volume_up'}</i>`; };
    document.getElementById('closePlayerBtn').onclick = () => stopVideo();
    setFitMode();

    // Render Home (Horizontal scroll each category, max 5 cards + view all)
    function renderHome() {
        let cats = categoriesList.filter(c => c.name.toLowerCase() !== 'slider');
        if(!cats.length) cats = [...new Set(masterData.map(i=> (i.Category||'').trim()).filter(c=>c && c.toLowerCase()!=='slider'))].map(c=>({name:c, icon:'fa-folder'}));
        let html = '';
        for(let cat of cats) {
            let items = masterData.filter(i => (i.Category||'').trim().toLowerCase() === cat.name.toLowerCase()).slice().reverse();
            if(items.length === 0) continue;
            let displayItems = items.slice(0,5);
            let showAll = items.length > 5;
            html += `<div class="category-block"><div class="category-head"><div class="category-title"><i class="${cat.icon.includes('fa-') ? cat.icon : 'fa fa-'+cat.icon}"></i> ${cat.name}</div>${showAll ? `<div class="view-all-btn" onclick="viewFullCategory('${cat.name}')">View All</div>` : ''}</div><div class="scroll-horizontal">`;
            for(let item of displayItems) {
                let thumb = item.Thumbnail || item.thumbnail || 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTf7ax2YDbvMh3IxQPzSyY1YIewn8Q_1bDgR04kRJT5-A&s=10';
                let name = item.name || item.Name || 'Untitled';
                let url = item.URL || item.url || '#';
                let isFav = favorites.includes(url);
                html += `<div class="card" data-vurl="${escapeHtml(url)}"><div class="fav-icon ${isFav ? 'active' : ''}" data-url="${escapeHtml(url)}" onclick="toggleFavItem('${escapeHtml(url)}', event)"><i class="fa fa-heart"></i></div><div onclick="playVideo('${escapeHtml(url)}', '${escapeHtml(name)}'); this.parentElement.classList.add('active-card');"><img src="${thumb}" loading="lazy"><div class="card-title">${escapeHtml(name)}</div></div></div>`;
            }
            html += `</div></div>`;
        }
        if(!html) document.getElementById('homeCategories').innerHTML = `<div class="empty-msg"><i class="fa fa-tv"></i><h3>No Content</h3></div>`;
        else document.getElementById('homeCategories').innerHTML = html;
        showSliderIfNeeded();
    }

    window.viewFullCategory = (catName) => {
        document.getElementById('homeCategories').style.display = 'none';
        document.getElementById('categoryDetailView').style.display = 'block';
        document.getElementById('moreView').style.display = 'none';
        let items = masterData.filter(i => (i.Category||'').trim().toLowerCase() === catName.toLowerCase()).slice().reverse();
        document.getElementById('detailTitle').innerHTML = `<i class="fa fa-folder-open"></i> ${catName.toUpperCase()}`;
        let grid = document.getElementById('detailGrid');
        if(!items.length) { grid.innerHTML = `<div class="empty-msg">No items</div>`; return; }
        grid.innerHTML = items.map(item => {
            let thumb = item.Thumbnail || item.thumbnail || 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTf7ax2YDbvMh3IxQPzSyY1YIewn8Q_1bDgR04kRJT5-A&s=10';
            let name = item.name || item.Name;
            let url = item.URL || item.url;
            let isFav = favorites.includes(url);
            return `<div class="card"><div class="fav-icon ${isFav ? 'active' : ''}" data-url="${escapeHtml(url)}" onclick="toggleFavItem('${escapeHtml(url)}', event)"><i class="fa fa-heart"></i></div><div onclick="playVideo('${escapeHtml(url)}', '${escapeHtml(name)}')"><img src="${thumb}" loading="lazy"><div class="card-title">${escapeHtml(name)}</div></div></div>`;
        }).join('');
    };
    window.showHome = function() { document.getElementById('homeCategories').style.display = 'block'; document.getElementById('categoryDetailView').style.display = 'none'; document.getElementById('moreView').style.display = 'none'; renderHome(); document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active')); document.getElementById('homeNav').classList.add('active'); closeSidebar(); };
    window.showLive = function() { viewFullCategory('Live'); document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active')); document.getElementById('liveNav').classList.add('active'); closeSidebar(); };
    window.showFavorites = function() { 
        let favItems = masterData.filter(i => favorites.includes(i.URL || i.url));
        document.getElementById('homeCategories').style.display = 'none';
        document.getElementById('categoryDetailView').style.display = 'block';
        document.getElementById('moreView').style.display = 'none';
        document.getElementById('detailTitle').innerHTML = `<i class="fa fa-heart" style="color:#ff3b30;"></i> MY FAVORITES`;
        let grid = document.getElementById('detailGrid');
        if(!favItems.length) { grid.innerHTML = `<div class="empty-msg"><i class="fa fa-heart-broken"></i><h3>No favorites yet</h3></div>`; return; }
        grid.innerHTML = favItems.map(item => {
            let thumb = item.Thumbnail || item.thumbnail || 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTf7ax2YDbvMh3IxQPzSyY1YIewn8Q_1bDgR04kRJT5-A&s=10';
            let name = item.name || item.Name;
            let url = item.URL || item.url;
            return `<div class="card"><div class="fav-icon active" onclick="toggleFavItem('${escapeHtml(url)}', event)"><i class="fa fa-heart"></i></div><div onclick="playVideo('${escapeHtml(url)}', '${escapeHtml(name)}')"><img src="${thumb}"><div class="card-title">${escapeHtml(name)}</div></div></div>`;
        }).join('');
        document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active')); 
        closeSidebar();
    };
    window.showMore = function() { document.getElementById('homeCategories').style.display = 'none'; document.getElementById('categoryDetailView').style.display = 'none'; document.getElementById('moreView').style.display = 'block'; let user = localStorage.getItem('nik_user'); if(user) { document.getElementById('guestView').style.display='none'; document.getElementById('userView').style.display='block'; document.getElementById('welcomeMsg').innerText = `Hi, ${user}`; } else { document.getElementById('guestView').style.display='block'; document.getElementById('userView').style.display='none'; } document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active')); closeSidebar(); };
    function loginUser() { let name = document.getElementById('usernameInput').value.trim(); if(name) { localStorage.setItem('nik_user', name); showMore(); } }
    function logoutUser() { localStorage.removeItem('nik_user'); showMore(); }
    function setTheme(color) { document.documentElement.style.setProperty('--main', color); localStorage.setItem('theme_color', color); }
    function navigateHome() { showHome(); }
    function shareApp() { let url = window.location.href; if(navigator.share) navigator.share({title:'Nikamma 4K', url}); else alert("Share via browser options"); }
    function toggleSearch() { let box = document.getElementById('searchBox'); box.style.display = box.style.display === 'none' ? 'flex' : 'none'; if(box.style.display === 'flex') document.getElementById('searchInput').focus(); }
    function searchItems() { let term = document.getElementById('searchInput').value.trim().toLowerCase(); if(!term) { showHome(); return; } let filtered = masterData.filter(i => (i.name||i.Name||'').toLowerCase().includes(term) && (i.Category||'').toLowerCase() !== 'slider'); document.getElementById('homeCategories').style.display = 'none'; document.getElementById('categoryDetailView').style.display = 'block'; document.getElementById('moreView').style.display = 'none'; document.getElementById('detailTitle').innerHTML = `<i class="fa fa-search"></i> SEARCH: ${term}`; let grid = document.getElementById('detailGrid'); if(!filtered.length) { grid.innerHTML = `<div class="empty-msg"><i class="fa fa-search"></i><h3>No results</h3></div>`; return; } grid.innerHTML = filtered.map(item => { let thumb = item.Thumbnail || item.thumbnail || 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTf7ax2YDbvMh3IxQPzSyY1YIewn8Q_1bDgR04kRJT5-A&s=10'; let name = item.name || item.Name; let url = item.URL || item.url; let isFav = favorites.includes(url); return `<div class="card"><div class="fav-icon ${isFav ? 'active' : ''}" onclick="toggleFavItem('${escapeHtml(url)}', event)"><i class="fa fa-heart"></i></div><div onclick="playVideo('${escapeHtml(url)}', '${escapeHtml(name)}')"><img src="${thumb}"><div class="card-title">${escapeHtml(name)}</div></div></div>`; }).join(''); }
    function forceRefresh() { localStorage.removeItem('data_cache_nk'); location.reload(); }
    function openSidebar() { document.getElementById('sidebar').classList.add('open'); document.getElementById('overlay').classList.add('show'); }
    function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('show'); }

    // Data fetching
    async function fetchData() {
        return new Promise((resolve) => {
            Papa.parse('https://docs.google.com/spreadsheets/d/e/2PACX-1vQJM1FvOsBuKL_Al7PpwYerGDVFhs5tLF4PaVs3_TOLX-TFLW-iF3B6qLLLeuuBmjfZFGe3CFxJA-TR/pub?gid=1155331852&single=true&output=csv', {
                download: true, header: true, complete: (catRes) => {
                    let cats = catRes.data.filter(r => (r.Category||'').trim() && r.Status !== 'inactive').map(r => ({ name: (r.Category||'').trim(), icon: (r.Icon||'folder').trim() }));
                    Papa.parse('https://docs.google.com/spreadsheets/d/e/2PACX-1vQJM1FvOsBuKL_Al7PpwYerGDVFhs5tLF4PaVs3_TOLX-TFLW-iF3B6qLLLeuuBmjfZFGe3CFxJA-TR/pub?output=csv', { download: true, header: true, complete: (itemRes) => {
                        let items = itemRes.data.filter(i => i.name || i.Name);
                        categoriesList = cats.length ? cats : [...new Set(items.map(i=> (i.Category||'').trim()).filter(Boolean))].map(c=>({name:c, icon:'fa-folder'}));
                        masterData = items.filter(i => { let cat = (i.Category||'').toLowerCase(); return cat === 'slider' || categoriesList.some(c=>c.name.toLowerCase()===cat); });
                        let sliders = masterData.filter(i=> (i.Category||'').toLowerCase()==='slider');
                        let sliderTrack = document.getElementById('sliderTrack');
                        if(sliders.length && sliderTrack) {
                            sliderTrack.innerHTML = sliders.map(s => `<div class="slide"><img src="${s.Thumbnail||s.thumbnail||'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTf7ax2YDbvMh3IxQPzSyY1YIewn8Q_1bDgR04kRJT5-A&s=10'}" loading="lazy"></div>`).join('');
                            let idx=0; setInterval(()=>{ if(sliderTrack.children.length){ idx=(idx+1)%sliderTrack.children.length; sliderTrack.style.transform=`translateX(-${idx*100}%)`; } }, 4000);
                        }
                        let hasLive = masterData.some(i => (i.Category||'').toLowerCase() === 'live');
                        document.getElementById('liveNav').style.display = hasLive ? 'block' : 'none';
                        renderHome();
                        let savedTheme = localStorage.getItem('theme_color'); if(savedTheme) setTheme(savedTheme);
                        splashDiv.style.opacity = '0'; setTimeout(()=> splashDiv.style.display = 'none', 400);
                        resolve();
                    }});
                }
            });
        });
    }
    function escapeHtml(str) { if(!str) return ''; return String(str).replace(/[&<>]/g, function(m){ if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }
    fetchData();
    // side menu dynamic
    setInterval(()=>{ let side = document.getElementById('dynamicSideMenu'); if(categoriesList.length && side && side.children.length===0){ categoriesList.forEach(c=> { if(c.name.toLowerCase() !== 'slider') side.innerHTML += `<a href="#" onclick="viewFullCategory('${c.name}'); closeSidebar();"><i class="fa fa-folder"></i> ${c.name}</a>`; }); } }, 500);
</script>
</body>
