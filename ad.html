<!DOCTYPE html>
<html lang="ur">
<head>
    <meta name="theme-color" content="#121212">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="msapplication-navbutton-color" content="#121212">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nikamma 4k v3.9 | Ultimate HD</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { 
            --main-color: #00bcd4; 
            --dark-bg: #0b0b0b; 
            --card-bg: #1a1a1a; 
            --header-bg: #121212;
            --splash-bg: radial-gradient(circle, #1a1a1a 0%, #0b0b0b 100%);
            --max-width: 1400px;
            --main-font: 'Poppins', sans-serif;
            --primary: #007aff; 
            --panel: rgba(15, 15, 15, 0.85);
        }
        
        * {
            box-sizing: border-box;
        }

        body { 
            background: var(--dark-bg); color: white; 
            font-family: var(--main-font); 
            margin: 0; padding-bottom: 80px; overflow-x: hidden;
            user-select: none; -webkit-tap-highlight-color: transparent;
            transition: background 0.3s ease;
        }
        .container { max-width: var(--max-width); margin: 0 auto; width: 100%; }
        
        .exo-container { 
            position: relative; 
            width: 100%; 
            background: #000; 
            overflow: hidden; 
            aspect-ratio: 16/9;
        }
        .exo-container video { 
            width: 100%; 
            height: 100%; 
            transition: object-fit 0.3s ease, filter 0.1s ease; 
            display: block;
        }
        .fit-contain { object-fit: contain; }
        .fit-cover { object-fit: cover; }
        .fit-fill { object-fit: fill; }
        .exo-loader { 
            position: absolute; 
            inset: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            z-index: 20; 
            background: rgba(0,0,0,0.5); 
        }
        .spinner { 
            width: 40px; 
            height: 40px; 
            border: 3px solid rgba(255,255,255,0.1); 
            border-top-color: var(--primary); 
            border-radius: 50%; 
            animation: spin 0.8s linear infinite; 
        }
        .exo-overlay { 
            position: absolute; 
            inset: 0; 
            background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, transparent 50%, rgba(0,0,0,0.6) 100%); 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            padding: 15px; 
            opacity: 0; 
            transition: opacity 0.3s ease; 
            z-index: 10; 
            pointer-events: none;
        }
        .exo-overlay.visible { opacity: 1; pointer-events: auto; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; width: 100%;}
        .live-tag { background: #ff3b30; color: white; padding: 4px 12px; border-radius: 30px; font-size: 11px; font-weight: bold; }
        .menu-bar { display: flex; align-items: center; gap: 10px; background: var(--panel); padding: 8px 15px; border-radius: 12px; backdrop-filter: blur(10px); }
        .icon-btn { background: none; border: none; color: white; cursor: pointer; padding: 8px; border-radius: 40px; transition: 0.2s; }
        .icon-btn:active { transform: scale(0.95); background: rgba(255,255,255,0.1);}
        .material-icons-round { font-size: 26px; }
        .spacer { flex-grow: 1; }
        .fit-mode-badge { background: rgba(0,0,0,0.6); padding: 4px 10px; border-radius: 20px; font-size: 11px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* GESTURE INDICATOR */
        .gesture-indicator { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.7); backdrop-filter: blur(10px); border-radius: 40px; padding: 12px 24px; display: flex; align-items: center; gap: 12px; z-index: 10000; opacity: 0; transition: opacity 0.2s; pointer-events: none; font-size: 18px; color: white; }
        .gesture-indicator i { font-size: 24px; }
        
        /* SPLASH */
        #splash-screen { position: fixed; top:0; left:0; width:100%; height:100%; background: var(--splash-bg); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.5s ease-out; }
        .splash-logo { width: 100px; height: 100px; border-radius: 20px; margin-bottom: 5px; animation: pulse 2s infinite; object-fit: cover; }
        #splash-screen h2 { margin: 0; color: var(--main-color); font-weight: 800; letter-spacing: 2px; font-size: 24px; }
        .splash-loader { margin-top: 10px; color: #444; font-size: 20px; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        
        /* HEADER */
        header { background: var(--header-bg); padding: 12px 15px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid #222; height: 60px; }
        .header-content { display: flex; width: 100%; max-width: var(--max-width); margin: 0 auto; align-items: center; justify-content: space-between; }
        .menu-icon-btn { font-size: 24px; cursor: pointer; color: var(--main-color); width: 36px; text-align: center; }
        .app-name { font-weight: 800; font-size: 18px; color: var(--main-color); letter-spacing: 0.5px; text-transform: uppercase; margin-left: 8px; }
        .header-right { display: flex; align-items: center; gap: 12px; cursor: pointer; }
        #search-container { display: none; flex: 1; align-items: center; gap: 10px; margin: 0 20px; width: 100%; }
        #searchBar { flex: 1; background: #222; border: 1px solid #333; color: white; padding: 8px 15px; border-radius: 20px; outline: none; font-size: 14px; font-family: var(--main-font); height: 38px; }
        .search-close { display: flex; align-items: center; justify-content: center; width: 38px; height: 38px; background: rgba(255,255,255,0.1); border-radius: 50%; cursor: pointer; }
        
        /* HORIZONTAL SCROLL CATEGORY - MOBILE FRIENDLY 5 CARDS */
        .category-section { margin-bottom: 28px; padding: 0 12px; }
        .category-header { display: flex; justify-content: space-between; align-items: baseline; padding: 6px 4px 12px 4px; flex-wrap: wrap; }
        .category-title { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; color: #fff; text-transform: uppercase; letter-spacing: 0.5px; }
        .category-title i { color: var(--main-color); font-size: 18px; }
        .read-more-btn { background: rgba(0, 188, 212, 0.15); color: var(--main-color); border: 1px solid rgba(0, 188, 212, 0.3); padding: 5px 14px; border-radius: 30px; font-size: 11px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .read-more-btn:active { transform: scale(0.96); background: var(--main-color); color: #000; }
        
        /* HORIZONTAL SCROLLING GRID -> row nowrap, snaps */
        .horizontal-scroll {
            display: flex;
            flex-wrap: nowrap;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            gap: 12px;
            padding: 4px 2px 12px 2px;
            scrollbar-width: thin;
            -webkit-overflow-scrolling: touch;
        }
        .horizontal-scroll::-webkit-scrollbar { height: 4px; }
        .horizontal-scroll::-webkit-scrollbar-track { background: #222; border-radius: 4px; }
        .horizontal-scroll::-webkit-scrollbar-thumb { background: var(--main-color); border-radius: 4px; }
        
        .card {
            flex: 0 0 auto;
            width: 130px;
            background: var(--card-bg);
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid #282828;
            cursor: pointer;
            transition: 0.2s ease;
            scroll-snap-align: start;
            position: relative;
        }
        /* tablet+ 5 cards visible konsept: width increase */
        @media (min-width: 600px) { .card { width: 160px; } }
        @media (min-width: 900px) { .card { width: 190px; } }
        @media (min-width: 1200px) { .card { width: 220px; } }
        
        .card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; display: block; background: var(--card-bg); transition: filter 0.3s; }
        .card-title { font-size: 12px; padding: 8px 6px; text-align: center; color: #efefef; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: rgba(0,0,0,0.3); }
        .card.playing { border: 2px solid var(--main-color); transform: scale(0.98); background: var(--main-color); }
        .card.playing .card-title { color: #000; font-weight: 800; }
        
        .fav-badge { position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,0.6); color: white; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 5; font-size: 12px; cursor: pointer; backdrop-filter: blur(4px); }
        .fav-badge.active { color: #ff3b30; background: rgba(255,255,255,0.9); }
        
        /* Empty state */
        .empty-state { text-align: center; padding: 60px 20px; color: #666; }
        .empty-state i { font-size: 64px; opacity: 0.5; margin-bottom: 20px; }
        
        /* Sidenav */
        .sidenav { height: 100%; width: 70%; max-width: 320px; position: fixed; z-index: 2005; top: 0; left: 0; background: #111; overflow-x: hidden; transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); transform: translateX(-100%); padding-top: 0; box-shadow: 10px 0 30px rgba(0,0,0,0.5); }
        .sidenav.open { transform: translateX(0); }
        .nav-header { width: 100%; height: 140px; background: #000; border-bottom: 2px solid var(--main-color); }
        .nav-header img { width: 100%; height: 100%; object-fit: cover; }
        .sidenav a { padding: 14px 25px; text-decoration: none; font-size: 15px; color: #bbb; display: flex; align-items: center; gap: 15px; border-bottom: 1px solid #1a1a1a; transition: 0.2s; }
        #menu-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 2004; opacity: 0; transition: opacity 0.4s ease; }
        #menu-overlay.visible { display: block; opacity: 1; }
        
        /* Video Box */
        #videoBox { display: none; width: 100%; background: #000; position: sticky; top: 60px; z-index: 1001; }
        .slider { width: 100%; height: 200px; overflow: hidden; position: relative; background: #000; margin-bottom: 5px; }
        .slides-track { display: flex; transition: 0.7s cubic-bezier(0.25, 1, 0.5, 1); height: 100%; }
        .slide-item { min-width: 100%; height: 100%; }
        .slide-item img { width: 100%; height: 100%; object-fit: cover; }
        
        /* Bottom Nav */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: rgba(18,18,18,0.96); display: flex; justify-content: space-around; padding: 10px 0; backdrop-filter: blur(10px); border-top: 1px solid #222; z-index: 1000; }
        .nav-btn { text-align: center; font-size: 10px; color: #888; flex: 1; cursor: pointer; font-weight: 600; text-transform: uppercase; }
        .nav-btn i { font-size: 20px; margin-bottom: 2px; display: block; }
        .nav-btn.active { color: var(--main-color); }
        
        /* Profile & More */
        .profile-container { padding: 20px; max-width: 600px; margin: 0 auto; }
        .profile-card { background: var(--card-bg); border-radius: 15px; border: 1px solid #282828; padding: 20px; margin-bottom: 20px; text-align: center; }
        .profile-pic { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 2px solid var(--main-color); margin-bottom: 10px; }
        .profile-btn { background: var(--main-color); color: black; border: none; padding: 10px 20px; border-radius: 20px; font-weight: 600; cursor: pointer; width: 100%; }
        .theme-selector { display: flex; justify-content: center; gap: 15px; margin: 15px 0; }
        .theme-dot { width: 35px; height: 35px; border-radius: 50%; cursor: pointer; border: 2px solid white; }
        
        .internet-checker { position: fixed; inset: 0; background: #0a0a0a; z-index: 30000; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .internet-checker .retry-btn { margin-top: 30px; background: var(--main-color); padding: 12px 35px; border-radius: 50px; font-weight: bold; border: none; }
        
        .img-loading { filter: blur(6px); transition: filter 0.4s; }
        .img-loaded { filter: blur(0); }
        @media (min-width: 1025px) { .bottom-nav { display: none; } .sidenav { width: 260px; transform: translateX(0); top: 60px; height: calc(100% - 60px); } .container { margin-left: 270px; } #videoBox { margin-left: 260px; width: calc(100% - 260px); } .menu-icon-btn { display: none; } }
    </style>
</head>
<body id="swipe-area">

<div id="internetChecker" class="internet-checker"><div><i class="fa fa-wifi" style="font-size: 60px; color:var(--main-color);"></i><h2>No Internet</h2><button class="retry-btn" onclick="checkInternetAgain()">Retry</button></div></div>
<div id="splash-screen" style="display: flex;"><img id="splash-logo-img" src="" class="splash-logo"><h2>Nikamma 4k</h2><div class="splash-loader"><i class="fa fa-circle-notch fa-spin"></i> Loading...</div></div>
<div id="ptr-container" style="position:fixed;top:0;left:0;right:0;height:70px;transform:translateY(-70px);background:#00bcd4;z-index:9998;display:flex;align-items:center;justify-content:center;gap:10px;"><span>Pull to refresh</span></div>
<div id="menu-overlay" onclick="closeNav()"></div>
<div id="mySidenav" class="sidenav"><div class="nav-header"><img id="nav-header-static-img" src=""></div><div id="sideNavDynamicLinks"></div><a href="#" id="rating-link"><i class="fa fa-star"></i> Rate Us</a><a href="#" id="privacy-link"><i class="fa fa-user-shield"></i> Privacy</a><a href="#" onclick="shareApp(event)"><i class="fa fa-share-alt"></i> Share</a><a href="#" onclick="forceRefreshData()"><i class="fa fa-sync"></i> Force Refresh</a></div>

<header><div class="header-content"><div class="header-left" id="header-main"><div class="menu-icon-btn" onclick="openNav()"><i class="fa fa-bars"></i></div><div class="app-name">Nikamma 4k</div></div><div id="search-container"><input type="text" id="searchBar" placeholder="Search..." onkeyup="search()"><div class="search-close" onclick="toggleSearch(false)"><i class="fas fa-times"></i></div></div><div class="header-right" id="header-icons"><div onclick="toggleSearch(true)"><i class="fa fa-search"></i></div></div></div></header>

<div id="videoBox"><div class="exo-container" id="advancedPlayerContainer"><div class="exo-loader" id="exoLoader"><div class="spinner"></div></div><video id="advancedVideo" class="fit-fill" muted autoplay playsinline></video><div class="exo-overlay" id="exoOverlay"><div class="top-bar"><button class="icon-btn" id="exoTopCloseBtn"><span class="material-icons-round">close</span></button><div class="live-tag">LIVE</div></div><div class="menu-bar"><button class="icon-btn" id="exoPlayBtn"><span class="material-icons-round">pause</span></button><button class="icon-btn" id="exoMuteBtn"><span class="material-icons-round">volume_off</span></button><div class="spacer"></div><span id="mode-text" class="fit-mode-badge">FILL</span><button class="icon-btn" id="exoScreenSetBtn"><span class="material-icons-round">aspect_ratio</span></button><button class="icon-btn" id="exoFullBtn"><span class="material-icons-round">fullscreen</span></button></div></div></div><div id="iframePlayerBox" style="display:none; aspect-ratio:16/9;"><iframe id="iframePlayer" style="width:100%;height:100%;border:none;"></iframe><div style="position:absolute;top:8px;left:8px;"><button onclick="stopVideo()" style="background:rgba(0,0,0,0.7);border:none;color:white;width:36px;border-radius:50%;">✕</button></div></div><div style="padding:10px; display:flex; justify-content:space-between;"><span id="videoTitle" style="color:var(--main-color);font-weight:bold;"></span><button onclick="stopVideo()" style="background:#f44336; border:none; color:white; padding:5px 12px;">CLOSE</button></div></div>

<div class="container">
    <div class="slider" id="mainSlider" style="display:none;"><div class="slides-track" id="sliderTrack"></div></div>
    <div id="homeCategoriesContainer"></div>
    <div id="mainCategoryView" style="display: none;"><div class="category-header" style="padding:10px 15px;"><div class="category-title" id="specificCategoryTitle"><i class="fa fa-folder"></i> CATEGORY</div></div><div class="horizontal-scroll" id="specificGrid"></div></div>
    <div id="moreSectionView" style="display: none;"><div class="profile-container"><div class="profile-card" id="profileContent"><div id="loggedOutView"><i class="fa fa-user-circle" style="font-size:60px;color:#444;"></i><h3>Guest User</h3><input type="text" id="loginUsername" placeholder="Username"><button class="profile-btn" onclick="userLogin()">LOGIN</button></div><div id="loggedInView" style="display:none;"><img id="userPic" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR6A63t7tXh8Gj7956mGq4n8-yK9vT-w_S46A&s" class="profile-pic"><h3 id="welcomeUser">Hi!</h3><button class="profile-btn" style="background:#ff3b30;" onclick="userLogout()">LOGOUT</button></div></div><div class="profile-card"><h4>Theme</h4><div class="theme-selector"><div class="theme-dot" style="background:#00bcd4;" onclick="changeTheme('#00bcd4')"></div><div class="theme-dot" style="background:#ff9800;"></div><div class="theme-dot" style="background:#e91e63;"></div><div class="theme-dot" style="background:#4caf50;"></div></div></div></div></div>
</div>

<div class="bottom-nav"><div class="nav-btn active" id="home-nav-btn" onclick="filterData('All', this)"><i class="fa fa-house"></i>HOME</div><div class="nav-btn" id="live-nav-btn" style="display:none;" onclick="filterData('Live', this)"><i class="fa fa-circle-play"></i>LIVE</div><div class="nav-btn" id="fav-nav-btn" onclick="showFavorites(this)"><i class="fa fa-heart"></i>FAV</div><div class="nav-btn" id="more-nav-btn" onclick="showMoreSection(this)"><i class="fa fa-ellipsis"></i>MORE</div></div>
<div id="gestureIndicator" class="gesture-indicator"><i id="gestureIcon"></i><span id="gestureValue"></span></div>

<script>
    const MASTER_LOGO = 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTf7ax2YDbvMh3IxQPzSyY1YIewn8Q_1bDgR04kRJT5-A&s=10';
    const NAV_HEADER_IMAGE = 'https://drive.google.com/thumbnail?id=1DXQpAofda-bZPS20Q-bqo6neUDznYqW9&sz=w1000';
    let rawData = [], availableCategories = [], favorites = JSON.parse(localStorage.getItem('nikamma_fav_list') || '[]');
    let currentCategory = 'All';
    let currentMpegtsPlayer = null, currentHlsPlayer = null, currentSourceUrl = null;
    const advVideo = document.getElementById('advancedVideo');
    
    // ---------- Helper functions ----------
    function saveFavs() { localStorage.setItem('nikamma_fav_list', JSON.stringify(favorites)); }
    function escapeHtml(str) { if(!str) return ''; return String(str).replace(/[&<>]/g, function(m){if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }
    function handleImageError(img) { if(img && img.src !== MASTER_LOGO) img.src = MASTER_LOGO; }
    function handleImageLoad(img) { img.classList.remove('img-loading'); img.classList.add('img-loaded'); }
    
    window.toggleFav = function(e, url) { e.stopPropagation(); let idx = favorites.indexOf(url); if(idx > -1) favorites.splice(idx,1); else favorites.push(url); saveFavs(); document.querySelectorAll(`.fav-badge[data-url="${url}"]`).forEach(b => { if(favorites.includes(url)) b.classList.add('active'); else b.classList.remove('active'); }); if(currentCategory === 'favorites_view') showFavorites(document.getElementById('fav-nav-btn')); };
    
    function buildCategoryHorizontals() {
        const homeContainer = document.getElementById('homeCategoriesContainer');
        let cats = availableCategories.filter(c => c.name.toLowerCase() !== 'slider' && c.name.toLowerCase() !== 'live');
        if(!cats.length) cats = [...new Set(rawData.map(i=>(i.Category||i.category||"").trim()))].filter(c=>c && c.toLowerCase()!=='slider').map(c=>({name:c, icon:'fa-folder'}));
        let html = '';
        cats.forEach(cat => {
            let items = rawData.filter(d => (d.Category||d.category||"").trim().toLowerCase() === cat.name.toLowerCase());
            if(!items.length) return;
            items = items.slice().reverse();
            const showAll = items.length > 5;
            const first5 = items.slice(0,5);
            html += `<div class="category-section"><div class="category-header"><div class="category-title"><i class="${cat.icon.includes(' ') ? cat.icon : 'fa fa-'+cat.icon}"></i> ${cat.name}</div>${showAll ? `<div class="read-more-btn" onclick="filterData('${cat.name}', null, false)">View All</div>` : ''}</div><div class="horizontal-scroll" id="scroll-cat-${cat.name.replace(/\s/g,'')}">`;
            first5.forEach(item => {
                let thumb = item.Thumbnail || item.thumbnail || MASTER_LOGO, title = item.name || item.Name || "Untitled", url = item.URL || item.url || "#";
                let isFav = favorites.includes(url);
                html += `<div class="card" data-url="${escapeHtml(url)}" data-title="${escapeHtml(title)}"><div class="fav-badge ${isFav ? 'active' : ''}" data-url="${escapeHtml(url)}" onclick="toggleFav(event, '${escapeHtml(url)}')"><i class="fa fa-heart"></i></div><div onclick="play('${escapeHtml(url)}', '${escapeHtml(title)}', this.parentElement)"><img src="${thumb}" loading="lazy" onerror="handleImageError(this)" onload="handleImageLoad(this)" class="img-loading"><div class="card-title">${title}</div></div></div>`;
            });
            html += `</div></div>`;
        });
        if(!html) homeContainer.innerHTML = `<div class="empty-state"><i class="fa fa-folder-open"></i><h3>No content</h3></div>`;
        else homeContainer.innerHTML = html;
    }
    
    window.filterData = function(cat, btn, closeSide=true) {
        if(closeSide) closeNav();
        currentCategory = cat;
        document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
        if(btn) btn.classList.add('active');
        document.getElementById('homeCategoriesContainer').style.display = cat === 'All' ? 'block' : 'none';
        document.getElementById('mainCategoryView').style.display = cat !== 'All' && cat !== 'favorites_view' && cat !== 'more_section' ? 'block' : 'none';
        document.getElementById('moreSectionView').style.display = 'none';
        if(cat === 'All') { buildCategoryHorizontals(); document.getElementById('mainSlider').style.display = rawData.some(d=>(d.Category||d.category||"").toLowerCase()==='slider') ? 'block' : 'none'; return; }
        if(cat === 'more_section') { document.getElementById('moreSectionView').style.display = 'block'; return; }
        if(cat === 'favorites_view') { showFavorites(document.getElementById('fav-nav-btn')); return; }
        let filtered = rawData.filter(d => (d.Category||d.category||"").trim().toLowerCase() === cat.toLowerCase()).slice().reverse();
        const specTitle = document.getElementById('specificCategoryTitle');
        let matched = availableCategories.find(c=>c.name.toLowerCase()===cat.toLowerCase());
        let icon = matched ? (matched.icon.includes(' ') ? matched.icon : 'fa fa-'+matched.icon) : 'fa fa-folder';
        specTitle.innerHTML = `<i class="${icon}"></i> ${cat.toUpperCase()}`;
        const grid = document.getElementById('specificGrid');
        if(!filtered.length) { grid.innerHTML = `<div class="empty-state" style="min-width:100%"><i class="fa fa-ban"></i><h3>No items</h3></div>`; return; }
        grid.innerHTML = filtered.map(item => {
            let thumb = item.Thumbnail || item.thumbnail || MASTER_LOGO, title = item.name || item.Name || "Untitled", url = item.URL || item.url || "#";
            let isFav = favorites.includes(url);
            return `<div class="card" data-url="${escapeHtml(url)}"><div class="fav-badge ${isFav ? 'active' : ''}" data-url="${escapeHtml(url)}" onclick="toggleFav(event, '${escapeHtml(url)}')"><i class="fa fa-heart"></i></div><div onclick="play('${escapeHtml(url)}', '${escapeHtml(title)}', this.parentElement)"><img src="${thumb}" loading="lazy" onerror="handleImageError(this)" onload="handleImageLoad(this)" class="img-loading"><div class="card-title">${title}</div></div></div>`;
        }).join('');
    };
    
    window.showFavorites = function(btn) { 
        closeNav(); currentCategory = 'favorites_view';
        document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active')); if(btn) btn.classList.add('active');
        document.getElementById('homeCategoriesContainer').style.display = 'none';
        document.getElementById('moreSectionView').style.display = 'none';
        document.getElementById('mainCategoryView').style.display = 'block';
        document.getElementById('specificCategoryTitle').innerHTML = `<i class="fa fa-heart" style="color:#ff3b30;"></i> MY FAVORITES`;
        let favItems = rawData.filter(d => favorites.includes(d.URL || d.url));
        const grid = document.getElementById('specificGrid');
        if(!favItems.length) grid.innerHTML = `<div class="empty-state" style="min-width:100%"><i class="fa fa-heart-broken"></i><h3>No favorites</h3></div>`;
        else grid.innerHTML = favItems.map(item => {
            let thumb = item.Thumbnail || item.thumbnail || MASTER_LOGO, title = item.name || item.Name || "Untitled", url = item.URL || item.url || "#";
            return `<div class="card"><div class="fav-badge active" onclick="toggleFav(event, '${escapeHtml(url)}')"><i class="fa fa-heart"></i></div><div onclick="play('${escapeHtml(url)}', '${escapeHtml(title)}', this.parentElement)"><img src="${thumb}" loading="lazy" class="img-loading" onload="handleImageLoad(this)"><div class="card-title">${title}</div></div></div>`;
        }).join('');
    };
    
    window.showMoreSection = function(btn) { filterData('more_section', btn); let user = localStorage.getItem('nikamma_user'); if(user) { document.getElementById('loggedOutView').style.display = 'none'; document.getElementById('loggedInView').style.display = 'block'; document.getElementById('welcomeUser').innerText = `Hi, ${user}!`; } else { document.getElementById('loggedOutView').style.display = 'block'; document.getElementById('loggedInView').style.display = 'none'; } };
    window.userLogin = function(){ let u = document.getElementById('loginUsername').value.trim(); if(u){ localStorage.setItem('nikamma_user',u); showMoreSection(document.getElementById('more-nav-btn')); } };
    window.userLogout = function(){ localStorage.removeItem('nikamma_user'); showMoreSection(document.getElementById('more-nav-btn')); };
    window.changeTheme = function(color){ document.documentElement.style.setProperty('--main-color', color); localStorage.setItem('nikamma_theme', color); };
    
    // ---------- Video Player ----------
    function destroyPlayer() { if(currentMpegtsPlayer) { currentMpegtsPlayer.destroy(); currentMpegtsPlayer=null; } if(currentHlsPlayer) { currentHlsPlayer.destroy(); currentHlsPlayer=null; } advVideo.pause(); advVideo.removeAttribute('src'); advVideo.load(); }
    function loadIntoAdvancedPlayer(url, title, autoPlay=true) { if(url===currentSourceUrl) return; destroyPlayer(); currentSourceUrl=url; document.getElementById('exoLoader').style.display='flex'; advVideo.muted=true; const isM3u8 = url.includes('.m3u8'); if(isM3u8 && window.Hls && Hls.isSupported()){ currentHlsPlayer=new Hls({lowLatencyMode:true}); currentHlsPlayer.loadSource(url); currentHlsPlayer.attachMedia(advVideo); currentHlsPlayer.on(Hls.Events.MANIFEST_PARSED,()=>{ if(autoPlay) advVideo.play().catch(e=>console.log); }); } else { advVideo.src=url; if(autoPlay) advVideo.play(); } advVideo.onplaying=()=>{ document.getElementById('exoLoader').style.display='none'; }; advVideo.onerror=()=>{ document.getElementById('exoLoader').style.display='none'; }; }
    window.play = function(url, title, cardEl){ if(!url || url==='#') return; document.querySelectorAll('.card').forEach(c=>c.classList.remove('playing')); if(cardEl) cardEl.classList.add('playing'); document.getElementById('videoBox').style.display='block'; document.getElementById('videoTitle').innerText=title; document.getElementById('mainSlider').style.display='none'; document.getElementById('iframePlayerBox').style.display='none'; document.getElementById('advancedPlayerContainer').style.display=''; loadIntoAdvancedPlayer(url, title, true); window.scrollTo({top:0,behavior:'smooth'}); };
    window.stopVideo = function(){ destroyPlayer(); currentSourceUrl=null; document.getElementById('videoBox').style.display='none'; document.getElementById('iframePlayerBox').style.display='none'; document.getElementById('advancedPlayerContainer').style.display=''; document.querySelectorAll('.card').forEach(c=>c.classList.remove('playing')); let sliders=rawData.some(d=>(d.Category||'').toLowerCase()==='slider'); if(currentCategory==='All' && sliders) document.getElementById('mainSlider').style.display='block'; };
    
    // Player UI
    const exoPlayBtn = document.getElementById('exoPlayBtn'), exoMuteBtn = document.getElementById('exoMuteBtn'), exoFullBtn = document.getElementById('exoFullBtn'), exoScreenSetBtn = document.getElementById('exoScreenSetBtn'), modeTextSpan = document.getElementById('mode-text'), exoOverlay = document.getElementById('exoOverlay');
    let fitIdx=2; const fits=['contain','cover','fill'];
    function setFit(){ advVideo.classList.remove('fit-contain','fit-cover','fit-fill'); advVideo.classList.add('fit-'+fits[fitIdx]); modeTextSpan.innerText=fits[fitIdx].toUpperCase(); }
    exoScreenSetBtn.onclick=()=>{ fitIdx=(fitIdx+1)%3; setFit(); }; exoPlayBtn.onclick=()=>{ if(advVideo.paused) advVideo.play(); else advVideo.pause(); }; advVideo.onplay=()=>exoPlayBtn.innerHTML='<span class="material-icons-round">pause</span>'; advVideo.onpause=()=>exoPlayBtn.innerHTML='<span class="material-icons-round">play_arrow</span>'; exoMuteBtn.onclick=()=>{ advVideo.muted=!advVideo.muted; exoMuteBtn.innerHTML=`<span class="material-icons-round">${advVideo.muted?'volume_off':'volume_up'}</span>`; }; exoFullBtn.onclick=()=>{ const c=document.getElementById('advancedPlayerContainer'); if(c.requestFullscreen)c.requestFullscreen(); }; setFit();
    document.getElementById('exoTopCloseBtn').onclick=()=>stopVideo();
    function showControls(){ exoOverlay.classList.add('visible'); if(window.ct)clearTimeout(window.ct); if(!advVideo.paused) window.ct=setTimeout(()=>exoOverlay.classList.remove('visible'),4000); }
    advVideo.addEventListener('click',()=>showControls()); advVideo.addEventListener('play',()=>showControls());
    
    // Data loading
    let isRefreshing=false;
    async function fetchFreshData() {
        return new Promise(resolve=>{
            Papa.parse('https://docs.google.com/spreadsheets/d/e/2PACX-1vQJM1FvOsBuKL_Al7PpwYerGDVFhs5tLF4PaVs3_TOLX-TFLW-iF3B6qLLLeuuBmjfZFGe3CFxJA-TR/pub?gid=1155331852&single=true&output=csv',{download:true,header:true,complete:cats=>{
                let loadedCats = cats.data.filter(r=>(r.Category||r.category||'').trim() && (r.Status||'').toLowerCase()!=='inactive').map(r=>({name:(r.Category||r.category||'').trim(), icon: (r.Icon||r.icon||'folder').trim()}));
                Papa.parse('https://docs.google.com/spreadsheets/d/e/2PACX-1vQJM1FvOsBuKL_Al7PpwYerGDVFhs5tLF4PaVs3_TOLX-TFLW-iF3B6qLLLeuuBmjfZFGe3CFxJA-TR/pub?output=csv',{download:true,header:true,complete:items=>{
                    let data = items.data.filter(i=>i.name||i.Name).map(i=>{ i.Category = i.Category||i.category||''; return i; });
                    if(loadedCats.length) availableCategories = loadedCats;
                    else availableCategories = [...new Set(data.map(i=>(i.Category||'').trim()).filter(Boolean))].map(c=>({name:c,icon:'fa-folder'}));
                    rawData = data.filter(i=>{ let cat = (i.Category||'').toLowerCase(); return cat==='slider' || availableCategories.some(c=>c.name.toLowerCase()===cat); });
                    localStorage.setItem('nikamma_cache_v2', JSON.stringify({rawData, availableCategories, ts:Date.now()}));
                    updateUI();
                    resolve(true);
                }});
            }});
        });
    }
    function updateUI(){ buildCategoryHorizontals(); updateSlider(); let hasLive = rawData.some(d=>(d.Category||'').toLowerCase()==='live'); document.getElementById('live-nav-btn').style.display=hasLive?'block':'none'; filterData('All', document.getElementById('home-nav-btn'), false); document.getElementById('splash-screen').style.opacity='0'; setTimeout(()=>document.getElementById('splash-screen').style.display='none',500); }
    function updateSlider(){ let sliders = rawData.filter(d=>(d.Category||'').toLowerCase()==='slider'); let track = document.getElementById('sliderTrack'); if(sliders.length && track){ track.innerHTML = sliders.map(s=>`<div class="slide-item"><img src="${s.Thumbnail||s.thumbnail||MASTER_LOGO}" loading="lazy"></div>`).join(''); if(window.slideInt) clearInterval(window.slideInt); let idx=0; window.slideInt=setInterval(()=>{ if(track.children.length){ idx=(idx+1)%track.children.length; track.style.transform=`translateX(-${idx*100}%)`; } },4000); } }
    window.forceRefreshData = async function(){ if(isRefreshing)return; isRefreshing=true; await fetchFreshData(); isRefreshing=false; closeNav(); };
    async function init(){ let cachedColor=localStorage.getItem('nikamma_theme'); if(cachedColor) document.documentElement.style.setProperty('--main-color',cachedColor); let cache = localStorage.getItem('nikamma_cache_v2'); if(cache){ let c=JSON.parse(cache); if(c.rawData && c.rawData.length){ rawData=c.rawData; availableCategories=c.availableCategories; updateUI(); } } await fetchFreshData(); }
    document.getElementById('nav-header-static-img').src=NAV_HEADER_IMAGE; document.getElementById('splash-logo-img').src=MASTER_LOGO;
    function openNav(){ document.getElementById("mySidenav").classList.add("open"); document.getElementById("menu-overlay").classList.add("visible"); }
    function closeNav(){ if(window.innerWidth>=1025)return; document.getElementById("mySidenav").classList.remove("open"); document.getElementById("menu-overlay").classList.remove("visible"); }
    function toggleSearch(show){ document.getElementById('header-main').style.display=show?'none':'flex'; document.getElementById('header-icons').style.display=show?'none':'flex'; document.getElementById('search-container').style.display=show?'flex':'none'; if(show) document.getElementById('searchBar').focus(); }
    window.search=function(){ let term=document.getElementById('searchBar').value.toLowerCase(); if(!term){ filterData('All',document.getElementById('home-nav-btn'),false); return; } let filtered=rawData.filter(d=>(d.name||d.Name||"").toLowerCase().includes(term) && (d.Category||'').toLowerCase()!=='slider'); document.getElementById('homeCategoriesContainer').style.display='none'; document.getElementById('mainCategoryView').style.display='block'; document.getElementById('specificCategoryTitle').innerHTML=`<i class="fa fa-search"></i> SEARCH`; let grid=document.getElementById('specificGrid'); if(!filtered.length){ grid.innerHTML=`<div class="empty-state"><i class="fa fa-search"></i><h3>No results</h3></div>`; return; } grid.innerHTML=filtered.map(item=>{ let thumb=item.Thumbnail||item.thumbnail||MASTER_LOGO, title=item.name||item.Name||"Untitled", url=item.URL||item.url||"#"; return `<div class="card"><div onclick="play('${escapeHtml(url)}','${escapeHtml(title)}',this.parentElement)"><img src="${thumb}" class="img-loading" onload="handleImageLoad(this)"><div class="card-title">${title}</div></div></div>`; }).join(''); };
    window.shareApp=function(e){ if(e)e.preventDefault(); let url=window.location.href; if(navigator.share)navigator.share({title:'Nikamma 4k',url:url}); else alert("Share via browser"); };
    window.checkInternetAgain=function(){ location.reload(); };
    init();
</script>
</body>
