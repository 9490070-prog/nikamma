<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Facebook Live Player</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d0d0d;
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container { width: 100%; max-width: 820px; }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .fb-logo {
      width: 36px; height: 36px;
      background: #1877F2;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; font-weight: bold; color: #fff;
    }
    .live-badge {
      background: #e02020; color: #fff;
      font-size: 11px; font-weight: 700;
      letter-spacing: 1.5px; padding: 3px 9px;
      border-radius: 4px; text-transform: uppercase;
      animation: pulse 1.8s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.6} }
    .title { color: #f0f0f0; font-size: 15px; font-weight: 500; }
    .player-wrapper {
      width: 100%;
      background: #111;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 40px rgba(24,119,242,0.18);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 460px;
    }
    .fb-video { width: 100% !important; }
    .footer {
      margin-top: 14px;
      text-align: center;
      color: #555;
      font-size: 12px;
    }
    .footer a { color: #1877F2; text-decoration: none; }
    .footer a:hover { text-decoration: underline; }
    .open-btn {
      display: inline-block;
      margin-top: 12px;
      background: #1877F2;
      color: #fff;
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.2s;
    }
    .open-btn:hover { background: #1560c0; text-decoration: none; }
  </style>
</head>
<body>

<!-- Facebook JS SDK -->
<div id="fb-root"></div>
<script>
  window.fbAsyncInit = function() {
    FB.init({
      appId: '',
      xfbml: true,
      version: 'v19.0'
    });
  };
  (function(d, s, id){
    var js, fjs = d.getElementsByTagName(s)[0];
    if (d.getElementById(id)) return;
    js = d.createElement(s); js.id = id;
    js.src = "https://connect.facebook.net/en_US/sdk.js";
    fjs.parentNode.insertBefore(js, fjs);
  }(document, 'script', 'facebook-jssdk'));
</script>

<div class="container">
  <div class="header">
    <div class="fb-logo">f</div>
    <span class="live-badge">Live</span>
    <span class="title">Facebook Live Video</span>
  </div>

  <div class="player-wrapper">
    <div
      class="fb-video"
      data-href="https://www.facebook.com/video/1483969843528660"
      data-width="820"
      data-show-text="false"
      data-autoplay="true"
      data-allowfullscreen="true">
    </div>
  </div>

  <div class="footer">
    <p>Agar video nahi chal raha:</p>
    <a class="open-btn" href="https://www.facebook.com/video/1483969843528660" target="_blank">
      Facebook par Direct Kholein ↗
    </a>
  </div>
</div>

</body>
</html>
