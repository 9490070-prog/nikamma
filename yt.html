<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook ویڈیو ایمبیڈ</title>
    <style>
        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }
        .video-container {
            width: 100%;
            max-width: 800px;
            margin: 20px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
        }
        .video-container iframe {
            width: 100%;
            height: 450px;
            border: none;
            display: block;
        }
        /* نوٹ: یہ کوڈ Facebook کی برانڈنگ کو نہیں ہٹاتا */
        .note {
            color: #888;
            text-align: center;
            padding: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="video-container">
        <iframe 
            src="https://www.facebook.com/plugins/video.php?href=https%3A%2F%2Fwww.facebook.com%2Fshepherdbushiriministries%2Fvideos%2F1441467191347612%2F&show_text=0&autoplay=0&mute=0&controls=1"
            scrolling="no" 
            allowfullscreen="true" 
            allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share">
        </iframe>
    </div>
    
</body>
</html>
