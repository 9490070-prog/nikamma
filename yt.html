<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="referrer" content="no-referrer">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Turbo Universal Player</title>
    
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js"></script>

    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle, #141414 0%, #070707 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }
        .player-wrapper {
            width: 95%;
            max-width: 850px;
            background: #000;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.06);
            position: relative;
        }
        .video-js {
            width: 100% !important;
            height: auto !important;
            aspect-ratio: 16/9;
        }
        /* Custom Premium Accent styling for VideoJS controls */
        .vjs-matrix.video-js { color: #00ffcc; }
        .vjs-matrix .vjs-big-play-button {
            background-color: rgba(0, 255, 204, 0.15) !important;
            border-color: #00ffcc !important;
            border-radius: 50% !important;
            width: 70px !important;
            height: 70px !important;
            line-height: 66px !important;
            margin-top: -35px !important;
            margin-left: -35px !important;
            backdrop-filter: blur(4px);
            transition: all 0.3s ease;
        }
        .video-js:hover .vjs-big-play-button {
            background-color: rgba(0, 255, 204, 0.3) !important;
            transform: scale(1.08);
        }
        .vjs-matrix .vjs-play-progress, .vjs-matrix .vjs-volume-level { background: #00ffcc !important; }
        .engine-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.65);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            color: #ffffff;
            font-weight: bold;
            letter-spacing: 1px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>

<div class="player-wrapper">
    <div id="engine-mode" class="engine-badge">INITIALIZING...</div>

    <video 
        id="universal-core" 
        class="video-js vjs-matrix vjs-default-skin vjs-big-play-centered" 
        controls 
        preload="auto" 
        autoplay 
        muted
        playsinline>
    </video>
</div>

<script>
    // Universal URL Input Controller (Dono .m3u8 ya .ts formats yahan work karenge)
    const streamUrl = "https://catchup.yuppcdn.net/amazonv2/36/preview/asianetmovies/master/chunklist.m3u8?hdnts=st=1662922116~exp=1662922716~acl=";
    
    const videoEl = document.getElementById('universal-core');
    const badge = document.getElementById('engine-mode');

    // Logic to detect extension format type
    const isTS = streamUrl.split('?')[0].endsWith('.ts') || streamUrl.includes('/live/');

    if (isTS && mpegts.getFeatureList().mseLivePlayback) {
        // --- PROCESS RAW TS STREAMS ---
        badge.innerText = "ENGINE: MPEG-TS";
        badge.style.color = "#00ffcc";
        
        var mpegtsPlayer = mpegts.createPlayer({
            type: 'mse',
            isLive: true,
            url: streamUrl
        }, {
            enableWorker: true,
            lazyLoad: false
        });
        
        // Initialize Video.js standard layout skin over HTML5 element
        var player = videojs('universal-core');
        mpegtsPlayer.attachMediaElement(videoEl);
        mpegtsPlayer.load();
        mpegtsPlayer.play();
        
    } else {
        // --- PROCESS M3U8 (HLS) STREAMS ---
        badge.innerText = "ENGINE: HLS (.M3U8)";
        badge.style.color = "#ffaa00";

        var player = videojs('universal-core', {
            html5: {
                vhs: {
                    overrideNative: true,
                    withCredentials: false
                }
            }
        });

        player.src({
            src: streamUrl,
            type: 'application/x-mpegURL'
        });

        player.ready(function() {
            player.play().catch(function(error) {
                console.log("Autoplay context: Manual touch interaction needed on mobile devices.");
            });
        });
    }
</script>

</body>
</html>
