<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Pro Player · Zero Margin · Auto-Play · Advanced</title>
    <!-- Ultra-clean, professional, auto-play, fast, zero-radius, zero-margin -->
    <style>
        /* global reset — zero everything */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            padding: 0;
            color: #f0f0f0;
        }

        #wrap {
            width: 100%;
            max-width: 1440px;
            padding: 0;
            margin: 0 auto;
        }

        /* ---------- URL BAR — minimalist ---------- */
        #urow {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            padding: 0 4px;
        }

        #uin {
            flex: 1;
            background: #141414;
            border: 1px solid #2a2a2a;
            border-radius: 10px;
            color: #eee;
            padding: 12px 16px;
            font-size: 14px;
            font-weight: 450;
            font-family: inherit;
            outline: none;
            transition: border 0.15s, box-shadow 0.15s;
            letter-spacing: 0.2px;
        }

        #uin:focus {
            border-color: #666;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.03);
        }

        #uin::placeholder {
            color: #444;
            font-weight: 400;
        }

        #gobtn {
            background: #ffffff;
            color: #0a0a0a;
            border: none;
            border-radius: 10px;
            padding: 12px 28px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.15s;
            white-space: nowrap;
            letter-spacing: 0.3px;
        }

        #gobtn:hover {
            background: #e6e6e6;
            transform: scale(0.97);
        }

        /* ---------- SHELL — zero radius, zero margin ---------- */
        #shell {
            background: #000;
            border-radius: 0;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.85);
            position: relative;
            width: 100%;
            height: 220px;
            margin: 0;
            padding: 0;
        }

        #rbox {
            position: relative;
            width: 100%;
            height: 100%;
            background: #080808;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        /* IFRAME — fills container */
        #yf {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: none;
            object-fit: cover;
            margin: 0;
            padding: 0;
        }

        /* ---------- MASK LAYERS ---------- */
        .mask {
            position: absolute;
            left: 0;
            right: 0;
            z-index: 10;
            background: #000;
            pointer-events: none;
        }
        #mtop { top: 0; height: 44px; }
        #mbot { bottom: 0; height: 48px; }
        .mside {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 12px;
            z-index: 10;
            background: #000;
            pointer-events: none;
        }
        #mleft { left: 0; }
        #mright { right: 0; }

        /* ---------- OVERLAY ---------- */
        #ov {
            position: absolute;
            inset: 0;
            z-index: 15;
            cursor: pointer;
            display: none;
            margin: 0;
            padding: 0;
        }

        /* ---------- PLACEHOLDER ---------- */
        #ph {
            position: absolute;
            inset: 0;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: #0d0d0d;
            margin: 0;
            padding: 0;
        }
        #ph-icon { font-size: 38px; opacity: 0.06; font-weight: 300; }
        #ph p { font-size: 12px; color: #3a3a3a; letter-spacing: 0.3px; }

        /* ---------- CENTER FLASH ---------- */
        #cfl {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            z-index: 25;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.55);
            border-radius: 50%;
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.12s cubic-bezier(0.2, 0, 0.2, 1), opacity 0.18s;
            opacity: 0;
            backdrop-filter: blur(3px);
        }
        #cfl svg { width: 22px; height: 22px; fill: #fff; }

        /* ---------- SPINNER ---------- */
        #spinner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            display: none;
        }
        #spinner::after {
            content: '';
            display: block;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #fff;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ---------- CONTROLS BAR ---------- */
        #cbar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 30;
            padding: 28px 12px 10px;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.95));
            opacity: 0;
            transition: opacity 0.25s;
            display: none;
            margin: 0;
        }
        #shell:hover #cbar,
        #shell.show #cbar { opacity: 1; }

        /* seek */
        #sk {
            position: relative;
            height: 18px;
            display: flex;
            align-items: center;
            margin-bottom: 4px;
            cursor: pointer;
        }
        #sk-track {
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 4px;
            position: relative;
            transition: height 0.15s;
            overflow: visible;
        }
        #sk:hover #sk-track { height: 5px; }
        #sk-buf {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            background: rgba(255, 255, 255, 0.18);
            border-radius: 4px;
            width: 0;
        }
        #sk-fill {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            background: #fff;
            border-radius: 4px;
            width: 0;
            transition: width 0.06s linear;
        }
        #sk-dot {
            position: absolute;
            top: 50%;
            left: 0;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #fff;
            transform: translate(-50%, -50%);
            opacity: 0;
            transition: opacity 0.15s;
            pointer-events: none;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
        }
        #sk:hover #sk-dot { opacity: 1; }
        #sk-in {
            position: absolute;
            inset: -5px 0;
            width: 100%;
            opacity: 0;
            cursor: pointer;
            z-index: 5;
        }

        /* bottom row */
        #bot {
            display: flex;
            align-items: center;
            gap: 2px;
        }
        .cb {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.75);
            cursor: pointer;
            padding: 5px 5px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.12s, background 0.12s;
            flex-shrink: 0;
        }
        .cb:hover { color: #fff; background: rgba(255, 255, 255, 0.06); }
        .cb svg { width: 16px; height: 16px; }

        #tdisp {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
            padding: 0 5px;
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.2px;
        }
        #spc { flex: 1; }

        /* volume */
        #vg {
            display: flex;
            align-items: center;
            gap: 2px;
        }
        #vtrack {
            width: 0;
            overflow: hidden;
            transition: width 0.22s;
            display: flex;
            align-items: center;
        }
        #vg:hover #vtrack,
        #vg:focus-within #vtrack { width: 58px; }
        #vi {
            -webkit-appearance: none;
            appearance: none;
            width: 58px;
            height: 3px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.2);
            outline: none;
            cursor: pointer;
        }
        #vi::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }

        /* speed */
        #spdbtn {
            background: rgba(255, 255, 255, 0.06);
            border: none;
            border-radius: 5px;
            color: rgba(255, 255, 255, 0.8);
            padding: 3px 8px;
            font-size: 11px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.12s;
            letter-spacing: 0.2px;
        }
        #spdbtn:hover { background: rgba(255, 255, 255, 0.14); color: #fff; }

        #spdmenu {
            position: absolute;
            bottom: 46px;
            right: 38px;
            background: #1a1a1a;
            border: 1px solid #2e2e2e;
            border-radius: 8px;
            overflow: hidden;
            display: none;
            z-index: 50;
            min-width: 76px;
            backdrop-filter: blur(6px);
        }
        #spdmenu.open { display: block; }
        #spdmenu button {
            display: block;
            width: 100%;
            padding: 7px 0;
            text-align: center;
            background: none;
            border: none;
            color: #aaa;
            font-size: 11px;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.1s, color 0.1s;
        }
        #spdmenu button:hover { background: rgba(255, 255, 255, 0.05); color: #fff; }
        #spdmenu button.on { color: #fff; font-weight: 600; }

        /* fullscreen */
        #fsbtn svg { transition: transform 0.2s; }

        /* responsive */
        @media (max-width: 600px) {
            #urow { flex-wrap: wrap; padding: 0 2px; gap: 8px; }
            #gobtn { flex: 1; justify-content: center; padding: 10px 16px; font-size: 13px; }
            #tdisp { font-size: 10px; padding: 0 3px; }
            .cb svg { width: 14px; height: 14px; }
            #shell { height: 220px; }
        }
    </style>
</head>
<body>
<div id="wrap">
    <!-- URL bar -->
    <div id="urow">
        <input id="uin" type="text" placeholder="Paste YouTube link... (youtu.be/... or watch?v=...)" />
        <button id="gobtn">▶&nbsp; Load</button>
    </div>

    <!-- Player shell — zero everything -->
    <div id="shell">
        <div id="rbox">
            <!-- placeholder -->
            <div id="ph">
                <div id="ph-icon">▶</div>
                <p>Paste link &amp; press Load — auto-play</p>
            </div>

            <!-- iframe -->
            <iframe id="yf"
                    allow="autoplay; encrypted-media; picture-in-picture"
                    allowfullscreen
                    sandbox="allow-scripts allow-same-origin allow-presentation allow-popups">
            </iframe>

            <!-- masks -->
            <div class="mask" id="mtop"></div>
            <div class="mask" id="mbot"></div>
            <div class="mside" id="mleft"></div>
            <div class="mside" id="mright"></div>

            <!-- overlay -->
            <div id="ov"></div>

            <!-- spinner -->
            <div id="spinner"></div>

            <!-- center flash -->
            <div id="cfl"><svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg></div>

            <!-- custom controls -->
            <div id="cbar">
                <div id="sk">
                    <div id="sk-track">
                        <div id="sk-buf"></div>
                        <div id="sk-fill"></div>
                        <div id="sk-dot"></div>
                    </div>
                    <input type="range" id="sk-in" min="0" max="10000" value="0" step="1">
                </div>

                <div id="bot">
                    <button class="cb" id="pbtn" title="Play / Pause (Space)">
                        <svg viewBox="0 0 24 24" fill="currentColor" id="pico"><polygon points="5,3 19,12 5,21"/></svg>
                    </button>

                    <button class="cb" id="bbtn" title="Back 10s (←)">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="1,4 1,10 7,10"/><path d="M3.51 15a9 9 0 1 0 .49-4.49"/>
                            <text x="7.2" y="15.5" font-size="5" fill="currentColor" stroke="none" font-family="Inter,sans-serif" font-weight="600">10</text>
                        </svg>
                    </button>

                    <button class="cb" id="fbtn" title="Forward 10s (→)">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="23,4 23,10 17,10"/><path d="M20.49 15a9 9 0 1 1-.49-4.49"/>
                            <text x="7.2" y="15.5" font-size="5" fill="currentColor" stroke="none" font-family="Inter,sans-serif" font-weight="600">10</text>
                        </svg>
                    </button>

                    <div id="vg">
                        <button class="cb" id="mbtn" title="Mute (M)">
                            <svg viewBox="0 0 24 24" id="vico" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polygon points="11,5 6,9 2,9 2,15 6,15 11,19" fill="currentColor" stroke="none"/>
                                <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                                <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
                            </svg>
                        </button>
                        <div id="vtrack"><input type="range" id="vi" min="0" max="100" value="80"></div>
                    </div>

                    <span id="tdisp">0:00 / 0:00</span>
                    <div id="spc"></div>

                    <button id="spdbtn">1x</button>
                    <div id="spdmenu">
                        <button data-s="0.25">0.25x</button><button data-s="0.5">0.5x</button>
                        <button data-s="0.75">0.75x</button><button data-s="1" class="on">1x</button>
                        <button data-s="1.25">1.25x</button><button data-s="1.5">1.5x</button>
                        <button data-s="1.75">1.75x</button><button data-s="2">2x</button>
                    </div>

                    <button class="cb" id="fsbtn" title="Fullscreen (F)">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="fsico">
                            <polyline points="15,3 21,3 21,9"/><polyline points="9,21 3,21 3,15"/>
                            <line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        "use strict";

        // ---- helpers ----
        const $ = id => document.getElementById(id);
        function fmt(s) {
            s = Math.floor(s || 0);
            const m = Math.floor(s / 60), r = s % 60;
            return m + ':' + (r < 10 ? '0' : '') + r;
        }
        function getVideoId(u) {
            u = (u || '').trim();
            const patterns = [
                /[?&]v=([a-zA-Z0-9_-]{11})/,
                /youtu\.be\/([a-zA-Z0-9_-]{11})/,
                /embed\/([a-zA-Z0-9_-]{11})/,
                /shorts\/([a-zA-Z0-9_-]{11})/
            ];
            for (const p of patterns) {
                const m = u.match(p);
                if (m) return m[1];
            }
            if (/^[a-zA-Z0-9_-]{11}$/.test(u)) return u;
            return null;
        }

        // ---- DOM ----
        const shell = $('shell'), yf = $('yf'), ph = $('ph'), ov = $('ov'), cbar = $('cbar');
        const spinner = $('spinner'), cfl = $('cfl');
        const pbtn = $('pbtn'), pico = $('pico'), bbtn = $('bbtn'), fbtn = $('fbtn');
        const mbtn = $('mbtn'), vico = $('vico'), vi = $('vi');
        const skIn = $('sk-in'), skFill = $('sk-fill'), skDot = $('sk-dot'), skBuf = $('sk-buf');
        const tdisp = $('tdisp'), spdbtn = $('spdbtn'), spdmenu = $('spdmenu');
        const fsbtn = $('fsbtn'), fsico = $('fsico');

        // ---- icons ----
        const ICONS = {
            play: '<polygon points="5,3 19,12 5,21"/>',
            pause: '<rect x="5" y="3" width="4" height="18" rx="1"/><rect x="15" y="3" width="4" height="18" rx="1"/>',
            volOn: '<polygon points="11,5 6,9 2,9 2,15 6,15 11,19" fill="currentColor" stroke="none"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>',
            volOff: '<polygon points="11,5 6,9 2,9 2,15 6,15 11,19" fill="currentColor" stroke="none"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>',
            fsMax: '<polyline points="15,3 21,3 21,9"/><polyline points="9,21 3,21 3,15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>',
            fsMin: '<polyline points="4,14 10,14 10,20"/><polyline points="20,10 14,10 14,4"/><line x1="10" y1="14" x2="3" y2="21"/><line x1="21" y1="3" x2="14" y2="10"/>'
        };

        function setPlayUI(on) {
            pico.innerHTML = on ? ICONS.pause : ICONS.play;
            cfl.querySelector('svg').innerHTML = on ? ICONS.pause : ICONS.play;
        }

        // ---- state ----
        let playing = false, muted = false, cur = 0, dur = 0, vol = 80, spd = 1;
        let ytPlayer = null, rafId = null, hideTimer = null, seekDragging = false;

        // ---- load video (auto-play enabled) ----
        function loadVideo() {
            const id = getVideoId($('uin').value);
            if (!id) { alert('Valid YouTube ID nahi mili!'); return; }

            ph.style.display = 'none';
            spinner.style.display = 'block';
            ov.style.display = 'block';
            cbar.style.display = 'block';

            const src =
                'https://www.youtube.com/embed/' + id +
                '?autoplay=1' +
                '&controls=1' +
                '&rel=0' +
                '&modestbranding=1' +
                '&showinfo=0' +
                '&iv_load_policy=3' +
                '&fs=1' +
                '&playsinline=1' +
                '&enablejsapi=1';

            yf.src = src;
            yf.style.display = 'block';

            // shift iframe to clip YT chrome
            yf.style.top = '-44px';
            yf.style.position = 'absolute';
            yf.style.left = '0';
            yf.style.width = '100%';
            yf.style.height = 'calc(100% + 96px)';

            yf.onload = function() {
                spinner.style.display = 'none';
                if (window.YT && YT.Player && !ytPlayer) {
                    ytPlayer = new YT.Player('yf', {
                        events: {
                            onReady: function(e) {
                                e.target.setVolume(vol);
                                // auto-play is already triggered by autoplay=1
                                startLoop();
                            },
                            onStateChange: function(e) {
                                if (e.data === 1) { setPlayUI(true); startLoop(); }
                                if (e.data === 2 || e.data === 0) { setPlayUI(false); }
                            }
                        }
                    });
                } else {
                    startLoop();
                }
            };
        }

        window.onYouTubeIframeAPIReady = function() {};

        // ---- RAF loop ----
        function startLoop() {
            cancelAnimationFrame(rafId);
            function tick() {
                if (ytPlayer && ytPlayer.getCurrentTime) {
                    try {
                        const nc = ytPlayer.getCurrentTime() || 0;
                        const nd = ytPlayer.getDuration() || 0;
                        if (!seekDragging) { cur = nc; dur = nd; }
                        const pct = dur ? ((cur / dur) * 100) : 0;
                        skFill.style.width = pct + '%';
                        skDot.style.left = pct + '%';
                        skIn.value = Math.round(pct * 100);
                        const loaded = ytPlayer.getVideoLoadedFraction ? (ytPlayer.getVideoLoadedFraction() || 0) : 0;
                        skBuf.style.width = (loaded * 100) + '%';
                        tdisp.textContent = fmt(cur) + ' / ' + fmt(dur);
                    } catch (_) {}
                }
                rafId = requestAnimationFrame(tick);
            }
            tick();
        }

        // ---- events ----
        $('gobtn').addEventListener('click', loadVideo);
        $('uin').addEventListener('keydown', function(e) { if (e.key === 'Enter') loadVideo(); });

        ov.addEventListener('click', function() {
            if (!ytPlayer) return;
            if (playing) { ytPlayer.pauseVideo(); } else { ytPlayer.playVideo(); }
            flashCenter();
        });
        ov.addEventListener('dblclick', function(e) { e.stopPropagation(); fsbtn.click(); });

        pbtn.addEventListener('click', function() {
            if (!ytPlayer) return;
            if (playing) ytPlayer.pauseVideo(); else ytPlayer.playVideo();
        });

        bbtn.addEventListener('click', function() { if (ytPlayer) ytPlayer.seekTo(Math.max(0, cur - 10), true); });
        fbtn.addEventListener('click', function() { if (ytPlayer) ytPlayer.seekTo(cur + 10, true); });

        mbtn.addEventListener('click', function() {
            if (!ytPlayer) return;
            if (muted) { ytPlayer.unMute(); muted = false; vico.innerHTML = ICONS.volOn; }
            else { ytPlayer.mute(); muted = true; vico.innerHTML = ICONS.volOff; }
        });

        vi.addEventListener('input', function() { vol = +vi.value; if (ytPlayer) ytPlayer.setVolume(vol); });

        skIn.addEventListener('mousedown', function() { seekDragging = true; });
        skIn.addEventListener('input', function() {
            if (!ytPlayer || !dur) return;
            const t = (skIn.value / 10000) * dur;
            cur = t;
            const pct = (t / dur) * 100;
            skFill.style.width = pct + '%';
            skDot.style.left = pct + '%';
            tdisp.textContent = fmt(t) + ' / ' + fmt(dur);
        });
        skIn.addEventListener('change', function() {
            seekDragging = false;
            if (!ytPlayer || !dur) return;
            ytPlayer.seekTo((skIn.value / 10000) * dur, true);
        });

        spdbtn.addEventListener('click', function(e) { e.stopPropagation(); spdmenu.classList.toggle('open'); });
        document.querySelectorAll('#spdmenu button').forEach(function(b) {
            b.addEventListener('click', function() {
                spd = parseFloat(b.dataset.s);
                if (ytPlayer) ytPlayer.setPlaybackRate(spd);
                spdbtn.textContent = b.textContent;
                document.querySelectorAll('#spdmenu button').forEach(function(x) { x.classList.remove('on'); });
                b.classList.add('on');
                spdmenu.classList.remove('open');
            });
        });
        document.addEventListener('click', function() { spdmenu.classList.remove('open'); });

        fsbtn.addEventListener('click', function() {
            if (!document.fullscreenElement) { if (shell.requestFullscreen) shell.requestFullscreen(); }
            else { if (document.exitFullscreen) document.exitFullscreen(); }
        });
        document.addEventListener('fullscreenchange', function() {
            fsico.innerHTML = document.fullscreenElement ? ICONS.fsMin : ICONS.fsMax;
        });

        function flashCenter() {
            cfl.style.transform = 'translate(-50%,-50%) scale(1)';
            cfl.style.opacity = '1';
            setTimeout(function() {
                cfl.style.transform = 'translate(-50%,-50%) scale(0)';
                cfl.style.opacity = '0';
            }, 500);
        }

        // auto-hide
        shell.addEventListener('mousemove', function() {
            shell.classList.add('show');
            clearTimeout(hideTimer);
            hideTimer = setTimeout(function() { shell.classList.remove('show'); }, 2800);
        });
        shell.addEventListener('mouseleave', function() {
            clearTimeout(hideTimer);
            shell.classList.remove('show');
        });

        // keyboard
        document.addEventListener('keydown', function(e) {
            if (['INPUT', 'SELECT', 'TEXTAREA'].includes(e.target.tagName)) return;
            const k = e.code;
            if (k === 'Space') { e.preventDefault(); pbtn.click(); }
            if (k === 'ArrowRight') { e.preventDefault(); fbtn.click(); }
            if (k === 'ArrowLeft') { e.preventDefault(); bbtn.click(); }
            if (k === 'ArrowUp') { e.preventDefault(); vi.value = Math.min(100, +vi.value + 5); if (ytPlayer) ytPlayer.setVolume(+vi.value); }
            if (k === 'ArrowDown') { e.preventDefault(); vi.value = Math.max(0, +vi.value - 5); if (ytPlayer) ytPlayer.setVolume(+vi.value); }
            if (k === 'KeyF') fsbtn.click();
            if (k === 'KeyM') mbtn.click();
        });

        setPlayUI(false);
    })();
</script>
<script src="https://www.youtube.com/iframe_api" async></script>
