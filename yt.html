<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ad Studio Pro - Direct GIF Export</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        :root {
            --bg-primary: #0a0e1a;
            --bg-secondary: #131b2e;
            --bg-card: #1a2440;
            --border-color: #2a3a5c;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --accent-green: #10b981;
            --accent-pink: #ec4899;
            --accent-orange: #f59e0b;
            --accent-red: #ef4444;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
        }
        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 10px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }
        .app {
            max-width: 480px;
            width: 100%;
            padding-bottom: 30px;
        }
        .header {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 12px 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            font-size: 16px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple), var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header .badge {
            background: var(--accent-green);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
            color: white;
        }
        .header .badge-adv {
            background: var(--accent-orange);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
            color: white;
            margin-left: 6px;
        }
        .card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 12px;
        }
        .card-title {
            font-size: 11px;
            font-weight: 700;
            color: var(--accent-blue);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card-title .title-icon {
            font-size: 16px;
        }
        .template-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
        }
        .template-item {
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 10px 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .template-item:active {
            transform: scale(0.95);
            border-color: var(--accent-blue);
        }
        .template-item .icon {
            font-size: 20px;
            display: block;
        }
        .template-item .name {
            font-size: 9px;
            font-weight: 600;
            margin-top: 3px;
        }
        .template-item .tag {
            font-size: 7px;
            color: var(--text-secondary);
        }
        .template-item .badge {
            font-size: 6px;
            padding: 1px 8px;
            border-radius: 8px;
            display: inline-block;
            margin-top: 3px;
            font-weight: 700;
        }
        .badge-gif {
            background: var(--accent-pink);
            color: white;
        }
        .badge-direct {
            background: #00ff87;
            color: #000;
        }
        .input-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .input-group label {
            font-size: 9px;
            color: var(--text-secondary);
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .input-group input,
        .input-group select {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 10px;
            color: var(--text-primary);
            font-size: 12px;
            outline: none;
            height: 36px;
            width: 100%;
        }
        .input-group input[type="color"] {
            padding: 2px;
            height: 36px;
            cursor: pointer;
        }
        .input-group input[type="range"] {
            padding: 0;
            height: 6px;
            background: var(--border-color);
            border-radius: 4px;
            -webkit-appearance: none;
        }
        .input-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--accent-blue);
            cursor: pointer;
        }
        .color-hex {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 11px;
            color: var(--text-secondary);
            font-family: monospace;
            height: 36px;
            display: flex;
            align-items: center;
        }
        .bg-options {
            display: flex;
            gap: 6px;
            margin-top: 4px;
        }
        .bg-options .btn {
            flex: 1;
            padding: 6px;
            font-size: 9px;
        }
        .btn-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 5px;
        }
        .btn {
            padding: 10px 4px;
            border: none;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s;
            text-align: center;
            color: white;
            touch-action: manipulation;
        }
        .btn:active {
            transform: scale(0.94);
        }
        .btn-blue { background: var(--accent-blue); }
        .btn-purple { background: var(--accent-purple); }
        .btn-green { background: var(--accent-green); }
        .btn-pink { background: var(--accent-pink); }
        .btn-red { background: var(--accent-red); }
        .btn-orange { background: var(--accent-orange); }
        .btn-outline { background: transparent; border: 1px solid var(--border-color); color: var(--text-primary); }
        
        .export-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 5px;
            margin-top: 8px;
        }
        .canvas-frame {
            background: var(--bg-primary);
            border: 2px dashed var(--border-color);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 180px;
            position: relative;
        }
        .canvas-frame .label {
            position: absolute;
            top: 8px;
            left: 12px;
            font-size: 8px;
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .canvas-frame.transparent-mode {
            background: repeating-conic-gradient(#1a2440 0% 25%, #0a0e1a 0% 50%) 0 0 / 20px 20px;
        }
        #adCanvas {
            background: #ffffff;
            position: relative;
            overflow: hidden;
            transition: all 0.2s;
            width: 320px;
            height: 50px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            touch-action: none;
        }
        #adCanvas.interstitial {
            width: 280px !important;
            height: 340px !important;
            border-radius: 16px;
        }
        #adCanvas.transparent-bg {
            background: transparent !important;
        }
        .ad-node {
            position: absolute;
            cursor: grab;
            user-select: none;
            touch-action: none;
            outline: 1px dashed rgba(0, 0, 0, 0.15);
            display: inline-block;
        }
        .ad-node:active { cursor: grabbing; }
        .ad-node.active {
            outline: 2px solid var(--accent-blue) !important;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
            z-index: 999;
        }
        .ad-node img {
            width: 100%;
            height: 100%;
            object-fit: fill;
            pointer-events: none;
            display: block;
        }
        .ad-node .text-inside {
            font-size: 14px;
            color: #000000;
            font-weight: 700;
            white-space: nowrap;
            pointer-events: none;
            padding: 2px 4px;
        }
        
        /* CSS ANIMATIONS */
        .text-bounce { animation: textBounce 0.8s ease infinite; }
        @keyframes textBounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        .text-flash { animation: textFlash 0.5s ease-in-out infinite alternate; }
        @keyframes textFlash { 0% { opacity: 0.3; color: #ff0000; } 100% { opacity: 1; color: #ffaa00; } }
        .gif-pulse { animation: gifPulse 1.2s ease-in-out infinite alternate; }
        @keyframes gifPulse { 0% { transform: scale(0.95); } 100% { transform: scale(1.05); } }
        
        .interstitial-close {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 26px;
            height: 26px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
            z-index: 1000;
            cursor: pointer;
        }
        #fileInput { display: none; }
        .inspector {
            background: var(--bg-card);
            border: 1px solid var(--accent-blue);
            border-radius: 12px;
            padding: 12px;
            margin-top: 10px;
            display: none;
        }
        .inspector-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }
        .inspector-grid .input-group input {
            padding: 6px 8px;
            height: 30px;
            font-size: 11px;
        }
        #textControls, #imageControls { display: none; margin-top: 6px; }
        .trans-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 6px 10px;
            margin-top: 4px;
        }
        .trans-toggle input[type="checkbox"] {
            width: 36px;
            height: 20px;
            -webkit-appearance: none;
            background: var(--border-color);
            border-radius: 10px;
            position: relative;
            cursor: pointer;
        }
        .trans-toggle input[type="checkbox"]:checked { background: var(--accent-blue); }
        .trans-toggle input[type="checkbox"]::before {
            content: ''; position: absolute; width: 16px; height: 16px; background: white; border-radius: 50%; top: 2px; left: 2px; transition: all 0.3s;
        }
        .trans-toggle input[type="checkbox"]:checked::before { left: 18px; }
        
        .adv-panel {
            background: var(--bg-card);
            border: 1px solid var(--accent-orange);
            border-radius: 12px;
            padding: 12px;
            margin-top: 8px;
            display: none;
        }
        .gif-options {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
            margin-top: 6px;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent-green);
            color: white;
            padding: 14px 24px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            z-index: 9999;
            display: none;
        }
        .toast.show { display: block; }
        .download-dialog {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 9998;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .download-dialog .dialog-box {
            background: var(--bg-secondary);
            border: 2px solid var(--accent-blue);
            border-radius: 20px;
            padding: 24px;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        .download-dialog .dialog-box .preview {
            background: var(--bg-primary);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 16px;
        }
        .download-dialog .dialog-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .progress-bar {
            width: 100%; height: 4px; background: var(--border-color); border-radius: 2px; margin: 8px 0; overflow: hidden; display: none;
        }
        .progress-bar .fill {
            height: 100%; background: var(--accent-blue); width: 0%;
        }
    </style>
</head>
<body>

    <div class="app">
        <div class="header">
            <h1>⚡ Ad Studio Pro</h1>
            <div>
                <span class="badge">Direct Embed</span>
                <span class="badge-adv">100% Export Ready</span>
            </div>
        </div>

        <div class="card">
            <div class="card-title"><span class="title-icon">📋</span> Embedded Animated Templates</div>
            <div class="template-grid">
                <div class="template-item" onclick="loadTemplate('direct_fire')">
                    <span class="icon">🔥</span>
                    <div class="name">Direct Fire</div>
                    <span class="badge badge-direct">EMBEDDED</span>
                </div>
                <div class="template-item" onclick="loadTemplate('direct_sale')">
                    <span class="icon">⚡</span>
                    <div class="name">Flash Sale</div>
                    <span class="badge badge-direct">EMBEDDED</span>
                </div>
                <div class="template-item" onclick="loadTemplate('direct_neon')">
                    <span class="icon">💡</span>
                    <div class="name">Neon Glow</div>
                    <span class="badge badge-direct">EMBEDDED</span>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-title"><span class="title-icon">🎛️</span> Format & Dimensions</div>
            <div class="input-grid">
                <div class="input-group">
                    <label>Ad Format</label>
                    <select id="adFormat" onchange="switchFormat()">
                        <option value="banner">Banner</option>
                        <option value="interstitial">Interstitial</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Corners (px)</label>
                    <input type="number" id="canvasRadius" value="0" oninput="mutateCanvas()">
                </div>
            </div>
            <div class="input-grid" id="dimRow" style="margin-top:8px;">
                <div class="input-group">
                    <label>Width</label>
                    <input type="number" id="canvasW" value="320" oninput="mutateCanvas()">
                </div>
                <div class="input-group">
                    <label>Height</label>
                    <input type="number" id="canvasH" value="50" oninput="mutateCanvas()">
                </div>
            </div>
            <div class="input-grid" style="margin-top:8px;">
                <div class="input-group">
                    <label>Background Color</label>
                    <input type="color" id="canvasBg" value="#ffffff" oninput="updateBg()">
                </div>
                <div class="input-group">
                    <label>Hex Code</label>
                    <div class="color-hex" id="canvasBgHex">#FFFFFF</div>
                </div>
            </div>
            <div class="bg-options">
                <button class="btn btn-blue" onclick="setSolidBg()">🔲 Solid</button>
                <button class="btn btn-orange" onclick="setTransparentBg()">✨ Transparent</button>
            </div>
        </div>

        <div class="card">
            <div class="card-title"><span class="title-icon">🧩</span> Add Elements</div>
            <div class="btn-row">
                <button class="btn btn-blue" onclick="addText()">+ Text</button>
                <label for="fileInput" class="btn btn-purple" style="text-align:center;cursor:pointer;">+ Local GIF</label>
                <input type="file" id="fileInput" accept="image/*" onchange="addImage(event)">
                <button class="btn btn-pink" onclick="addShape()">⬛ Shape</button>
                <button class="btn btn-outline" onclick="clearSelection()">Clear Sel</button>
            </div>
        </div>

        <div class="card">
            <div class="card-title"><span class="title-icon">💾</span> Export Full Banner</div>
            <div class="export-row">
                <button class="btn btn-green" onclick="exportPNG()">📸 PNG</button>
                <button class="btn btn-pink" onclick="exportFullGIF()">🎞️ Export GIF</button>
                <button class="btn btn-blue" onclick="exportMP4()">🎥 MP4</button>
                <button class="btn btn-orange" onclick="exportTransparent()">✨ Trans</button>
            </div>
            <div class="gif-options">
                <div class="input-group">
                    <label>Frames</label>
                    <input type="number" id="gifFrames" value="15" min="5" max="40">
                </div>
                <div class="input-group">
                    <label>Delay (ms)</label>
                    <input type="number" id="gifDelay" value="100" min="40" max="400">
                </div>
                <div class="input-group">
                    <label>Quality</label>
                    <input type="number" id="gifQuality" value="2" min="1" max="10">
                </div>
            </div>
            <div class="progress-bar" id="progressBar">
                <div class="fill" id="progressFill"></div>
            </div>
        </div>

        <div class="canvas-frame" id="canvasFrame">
            <span class="label" id="workspaceLabel">Banner Mode</span>
            <div id="adCanvas" onclick="clearSelection(event)">
                <div class="interstitial-close" id="closeBtn" onclick="showToast('Ad Closed!')">✕</div>
            </div>
        </div>

        <div class="inspector" id="inspector">
            <div class="title">🔧 Layer Inspector</div>
            <div class="inspector-grid">
                <div class="input-group"><label>Width</label><input type="number" id="elW" oninput="updateElement()"></div>
                <div class="input-group"><label>Height</label><input type="number" id="elH" oninput="updateElement()"></div>
            </div>
            <div class="inspector-grid" style="margin-top:6px;">
                <div class="input-group"><label>X</label><input type="number" id="elX" oninput="updateElementPos()"></div>
                <div class="input-group"><label>Y</label><input type="number" id="elY" oninput="updateElementPos()"></div>
            </div>
            <div id="textControls">
                <div class="input-group" style="margin-top:6px;">
                    <label>Text</label>
                    <input type="text" id="elText" oninput="updateElement()">
                </div>
                <div class="input-grid" style="margin-top:6px;">
                    <div class="input-group">
                        <label>Color</label>
                        <input type="color" id="elColor" oninput="updateElementColor()">
                    </div>
                </div>
            </div>
            <div style="display:grid;grid-template-columns:1fr;margin-top:8px;">
                <button class="btn btn-red" onclick="deleteElement()">🗑️ Delete Element</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <div class="download-dialog" id="downloadDialog">
        <div class="dialog-box">
            <h3>📥 Export Ready</h3>
            <div class="preview" id="dialogPreview"></div>
            <div class="dialog-actions">
                <button class="btn btn-green" onclick="dialogDownload()">⬇️ Save .GIF File</button>
                <button class="btn btn-red" onclick="closeDialog()">✕ Close</button>
            </div>
        </div>
    </div>

    <script>
        var canvas = document.getElementById('adCanvas');
        var canvasFrame = document.getElementById('canvasFrame');
        var inspector = document.getElementById('inspector');
        var textControls = document.getElementById('textControls');
        var imageControls = document.getElementById('imageControls');
        var toast = document.getElementById('toast');
        var downloadDialog = document.getElementById('downloadDialog');
        var dialogPreview = document.getElementById('dialogPreview');
        var progressBar = document.getElementById('progressBar');
        var progressFill = document.getElementById('progressFill');
        
        var selectedNode = null;
        var isDragging = false;
        var dragStartX, dragStartY, nodeStartX, nodeStartY;
        var dialogData = null;
        var dialogFilename = '';
        var isTransparent = false;
        var nodeCounter = 0;

        function showToast(msg) {
            toast.textContent = msg;
            toast.className = 'toast show';
            clearTimeout(toast._timer);
            toast._timer = setTimeout(function() { toast.classList.remove('show'); }, 3000);
        }

        // ===== TEMPLATE LOADER =====
        function loadTemplate(key) {
            clearCanvas();
            var base64Gif = DIRECT_EMBED_GIFS[key];
            if (!base64Gif) return;

            // Direct Immediate Add inside Canvas
            var node = document.createElement('div');
            node.className = 'ad-node active';
            node.id = 'node_' + (++nodeCounter);
            node.style.left = '10px';
            node.style.top = '5px';
            node.style.width = '40px';
            node.style.height = '40px';

            var img = document.createElement('img');
            img.src = base64Gif; // Local Base64 injected immediately
            img.style.width = '100%';
            img.style.height = '100%';
            node.appendChild(img);

            canvas.appendChild(node);
            setupDrag(node);
            selectElement(node);

            // Add Text Layer
            addText("SUPER DEAL FLASH SALE!");
            showToast("🎯 Template Loaded with Inline GIF!");
        }

        function clearCanvas() {
            var nodes = canvas.querySelectorAll('.ad-node');
            nodes.forEach(function(n) { n.remove(); });
            clearSelection();
        }

        function addText(customText) {
            var node = document.createElement('div');
            node.className = 'ad-node';
            node.id = 'node_' + (++nodeCounter);
            node.style.left = '60px';
            node.style.top = '15px';
            
            var txt = document.createElement('div');
            txt.className = 'text-inside text-bounce';
            txt.textContent = customText || 'New Text';
            txt.style.color = '#ff0055';
            txt.style.fontSize = '16px';
            txt.style.fontFamily = 'Impact';
            node.appendChild(txt);

            canvas.appendChild(node);
            setupDrag(node);
            selectElement(node);
        }

        function addImage(e) {
            var file = e.target.files[0];
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function(event) {
                var node = document.createElement('div');
                node.className = 'ad-node';
                node.id = 'node_' + (++nodeCounter);
                node.style.left = '20px';
                node.style.top = '5px';
                node.style.width = '40px';
                node.style.height = '40px';

                var img = document.createElement('img');
                img.src = event.target.result; // DataURL Base64
                node.appendChild(img);
                canvas.appendChild(node);
                setupDrag(node);
                selectElement(node);
                showToast("✅ Local GIF/Image Added!");
            };
            reader.readAsDataURL(file);
        }

        function addShape() {
            var node = document.createElement('div');
            node.className = 'ad-node';
            node.id = 'node_' + (++nodeCounter);
            node.style.left = '120px';
            node.style.top = '10px';
            node.style.width = '80px';
            node.style.height = '30px';
            node.style.backgroundColor = '#3b82f6';
            canvas.appendChild(node);
            setupDrag(node);
            selectElement(node);
        }

        // ===== 100% WORKING GIF EXPORT PIPELINE =====
        function exportFullGIF() {
            clearSelection();
            progressBar.style.display = 'block';
            progressFill.style.width = '10%';

            var framesToCapture = parseInt(document.getElementById('gifFrames').value) || 15;
            var frameDelay = parseInt(document.getElementById('gifDelay').value) || 100;
            var q = parseInt(document.getElementById('gifQuality').value) || 2;

            // Initialize cleaner gif.js encoder instance
            var gif = new GIF({
                workers: 2,
                quality: q,
                width: canvas.offsetWidth,
                height: canvas.offsetHeight,
                workerScript: 'https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js'
            });

            var currentFrame = 0;

            function captureNextFrame() {
                if (currentFrame >= framesToCapture) {
                    progressFill.style.width = '80%';
                    gif.on('finished', function(blob) {
                        progressFill.style.width = '100%';
                        setTimeout(function() { progressBar.style.display = 'none'; }, 500);
                        var finalGifUrl = URL.createObjectURL(blob);
                        showDialog(finalGifUrl, 'AdStudio_' + Date.now() + '.gif', 'gif');
                        showToast('🎯 GIF Compiled & Ready!');
                    });
                    gif.render();
                    return;
                }

                html2canvas(canvas, {
                    useCORS: true,
                    allowTaint: true,
                    backgroundColor: isTransparent ? null : canvas.style.backgroundColor
                }).then(function(cv) {
                    gif.addFrame(cv, { delay: frameDelay });
                    currentFrame++;
                    progressFill.style.width = Math.round((currentFrame / framesToCapture) * 70) + '%';
                    setTimeout(captureNextFrame, 50);
                }).catch(function(err) {
                    showToast("Export logic skipped bad layers", "error");
                    progressBar.style.display = 'none';
                });
            }

            setTimeout(captureNextFrame, 100);
        }

        function exportPNG() {
            clearSelection();
            html2canvas(canvas, { useCORS: true, allowTaint: true }).then(function(cv) {
                var url = cv.toDataURL('image/png');
                showDialog(url, 'Banner_' + Date.now() + '.png', 'png');
            });
        }

        function exportMP4() { exportFullGIF(); }
        function exportTransparent() { isTransparent = true; exportFullGIF(); }

        function forceDownload(dataUrl, filename) {
            var link = document.createElement('a');
            link.href = dataUrl;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast('💾 File Saved to Storage!');
            closeDialog();
        }

        function dialogDownload() {
            if (!dialogData) return;
            forceDownload(dialogData, dialogFilename);
        }

        function closeDialog() { downloadDialog.style.display = 'none'; }

        // ===== DRAG AND SELECTION LOGIC =====
        function setupDrag(node) {
            node.addEventListener('mousedown', startDrag);
            node.addEventListener('touchstart', startDrag, { passive: false });
        }

        function startDrag(e) {
            if (e.target.classList.contains('interstitial-close')) return;
            selectedNode = this;
            isDragging = true;
            selectElement(this);
            
            var point = e.touches ? e.touches[0] : e;
            dragStartX = point.clientX;
            dragStartY = point.clientY;
            nodeStartX = parseInt(selectedNode.style.left) || 0;
            nodeStartY = parseInt(selectedNode.style.top) || 0;

            document.addEventListener('mousemove', moveDrag);
            document.addEventListener('mouseup', stopDrag);
            document.addEventListener('touchmove', moveDrag, { passive: false });
            document.addEventListener('touchend', stopDrag);
        }

        function moveDrag(e) {
            if (!isDragging || !selectedNode) return;
            if(e.cancelable) e.preventDefault();
            var point = e.touches ? e.touches[0] : e;
            var dx = point.clientX - dragStartX;
            var dy = point.clientY - dragStartY;
            
            selectedNode.style.left = (nodeStartX + dx) + 'px';
            selectedNode.style.top = (nodeStartY + dy) + 'px';
            updateInspectorFields();
        }

        function stopDrag() {
            isDragging = false;
            document.removeEventListener('mousemove', moveDrag);
            document.removeEventListener('mouseup', stopDrag);
            document.removeEventListener('touchmove', moveDrag);
            document.removeEventListener('touchend', stopDrag);
        }

        function selectElement(node) {
            clearSelection();
            selectedNode = node;
            selectedNode.classList.add('active');
            inspector.style.display = 'block';
            
            var txt = selectedNode.querySelector('.text-inside');
            if (txt) {
                textControls.style.display = 'block';
                document.getElementById('elText').value = txt.textContent;
            } else {
                textControls.style.display = 'none';
            }
            updateInspectorFields();
        }

        function clearSelection(e) {
            if (e && e.target !== canvas) return;
            var nodes = canvas.querySelectorAll('.ad-node');
            nodes.forEach(function(n) { n.classList.remove('active'); });
            selectedNode = null;
            inspector.style.display = 'none';
        }

        function updateInspectorFields() {
            if (!selectedNode) return;
            document.getElementById('elW').value = selectedNode.offsetWidth;
            document.getElementById('elH').value = selectedNode.offsetHeight;
            document.getElementById('elX').value = parseInt(selectedNode.style.left) || 0;
            document.getElementById('elY').value = parseInt(selectedNode.style.top) || 0;
        }

        function updateElement() {
            if (!selectedNode) return;
            selectedNode.style.width = document.getElementById('elW').value + 'px';
            selectedNode.style.height = document.getElementById('elH').value + 'px';
            var txt = selectedNode.querySelector('.text-inside');
            if (txt) {
                txt.textContent = document.getElementById('elText').value;
            }
        }

        function updateElementPos() {
            if (!selectedNode) return;
            selectedNode.style.left = document.getElementById('elX').value + 'px';
            selectedNode.style.top = document.getElementById('elY').value + 'px';
        }

        function updateElementColor() {
            if (!selectedNode) return;
            var txt = selectedNode.querySelector('.text-inside');
            if (txt) txt.style.color = document.getElementById('elColor').value;
        }

        function deleteElement() {
            if (selectedNode) {
                selectedNode.remove();
                clearSelection();
                showToast("🗑️ Element removed");
            }
        }

        function switchFormat() {
            var format = document.getElementById('adFormat').value;
            if (format === 'interstitial') {
                canvas.className = 'interstitial';
                workspaceLabel.textContent = 'Interstitial Mode';
                closeBtn.style.display = 'flex';
                dimRow.style.display = 'none';
            } else {
                canvas.className = '';
                workspaceLabel.textContent = 'Banner Mode';
                closeBtn.style.display = 'none';
                dimRow.style.display = 'grid';
                mutateCanvas();
            }
        }

        function mutateCanvas() {
            if (document.getElementById('adFormat').value === 'interstitial') return;
            canvas.style.width = document.getElementById('canvasW').value + 'px';
            canvas.style.height = document.getElementById('canvasH').value + 'px';
            canvas.style.borderRadius = document.getElementById('canvasRadius').value + 'px';
        }

        function updateBg() { setSolidBg(); }
        function setTransparentBg() { isTransparent = true; canvas.classList.add('transparent-bg'); canvasFrame.classList.add('transparent-mode'); document.getElementById('canvasBgHex').innerHTML = '🚫 TRANS'; }
        function setSolidBg() { isTransparent = false; canvas.classList.remove('transparent-bg'); canvasFrame.classList.remove('transparent-mode'); var color = document.getElementById('canvasBg').value; canvas.style.backgroundColor = color; document.getElementById('canvasBgHex').innerText = color.toUpperCase(); }
    </script>
