<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#0d0d0d;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-family:'Inter',system-ui,sans-serif;
  color:#eee;
  padding:20px;
}
#wrap{width:120%;max-width:1000px}

/* URL bar */
#urow{display:flex;gap:10px;margin-bottom:14px}
#uin{
  flex:1;background:#161616;border:1.5px solid #282828;
  border-radius:10px;color:#eee;padding:12px 16px;
  font-size:14px;font-family:inherit;outline:none;transition:border .2s
}
#uin:focus{border-color:#505050}
#uin::placeholder{color:#444}
#gobtn{
  background:#fff;color:#000;border:none;border-radius:10px;
  padding:12px 26px;font-size:14px;font-weight:600;
  cursor:pointer;font-family:inherit;transition:opacity .2s;white-space:nowrap
}
#gobtn:hover{opacity:.85}

/* Shell */
#shell{
  background:#000;border-radius:14px;overflow:hidden;
  position:relative;box-shadow:0 8px 40px rgba(0,0,0,.7)
}

/* ratio box */
#rbox{position:relative;width:100%;padding-top:86.25%;background:#000}

/* iframe — normal embed WITH controls so it actually plays */
#yf{
  position:absolute;
  top:0;left:0;width:100%;height:100%;
  border:none;display:none;
}

/* ── MASK LAYERS ──
   These cover YouTube's title bar (top) and control bar (bottom)
   so nothing from YT UI is visible. z-index above iframe. */
.mask{position:absolute;left:0;right:0;z-index:10;background:#000;pointer-events:none}
#mtop{top:0;height:44px}     /* covers YT title bar */
#mbot{bottom:0;height:52px}  /* covers YT controls  */
/* side masks for any leftover gradients */
.mside{position:absolute;top:0;bottom:0;width:12px;z-index:10;background:#000;pointer-events:none}
#mleft{left:0}
#mright{right:0}

/* Our click catcher — sits above masks, below our controls */
#ov{position:absolute;inset:0;z-index:15;cursor:pointer;display:none}

/* Placeholder */
#ph{
  position:absolute;inset:0;z-index:5;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px
}
#ph-icon{font-size:56px;opacity:.1}
#ph p{font-size:13px;color:#444;letter-spacing:.3px}

/* Center play flash */
#cfl{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%) scale(0);
  z-index:25;pointer-events:none;
  background:rgba(0,0,0,.55);border-radius:50%;
  width:64px;height:64px;display:flex;align-items:center;justify-content:center;
  transition:transform .12s cubic-bezier(.2,0,.2,1),opacity .2s;opacity:0
}
#cfl svg{width:26px;height:26px;fill:#fff}

/* Controls bar */
#cbar{
  position:absolute;bottom:0;left:0;right:0;z-index:30;
  padding:36px 16px 14px;
  background:linear-gradient(transparent,rgba(0,0,0,.95));
  opacity:0;transition:opacity .3s;display:none
}
#shell:hover #cbar,#shell.show #cbar{opacity:1}

/* Seek */
#sk{position:relative;height:22px;display:flex;align-items:center;margin-bottom:10px;cursor:pointer}
#sk-track{
  width:100%;height:4px;background:rgba(255,255,255,.15);
  border-radius:4px;position:relative;transition:height .15s;overflow:visible
}
#sk:hover #sk-track{height:6px}
#sk-buf{position:absolute;left:0;top:0;height:100%;background:rgba(255,255,255,.2);border-radius:4px;width:0}
#sk-fill{position:absolute;left:0;top:0;height:100%;background:#fff;border-radius:4px;width:0;transition:width .1s linear}
#sk-dot{
  position:absolute;top:50%;left:0;
  width:14px;height:14px;border-radius:50%;background:#fff;
  transform:translate(-50%,-50%);opacity:0;transition:opacity .15s;pointer-events:none
}
#sk:hover #sk-dot{opacity:1}
#sk-in{position:absolute;inset:-5px 0;width:100%;opacity:0;cursor:pointer;z-index:5}

/* Bottom row */
#bot{display:flex;align-items:center;gap:5px}
.cb{
  background:none;border:none;color:rgba(255,255,255,.75);
  cursor:pointer;padding:7px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  transition:color .15s,background .15s;flex-shrink:0
}
.cb:hover{color:#fff;background:rgba(255,255,255,.09)}
.cb svg{width:20px;height:20px}

#tdisp{
  font-size:12.5px;color:rgba(255,255,255,.5);
  padding:0 6px;white-space:nowrap;font-variant-numeric:tabular-nums
}
#spc{flex:1}

/* Volume */
#vg{display:flex;align-items:center;gap:5px}
#vtrack{width:0;overflow:hidden;transition:width .22s;display:flex;align-items:center}
#vg:hover #vtrack,#vg:focus-within #vtrack{width:72px}
#vi{
  -webkit-appearance:none;appearance:none;
  width:72px;height:4px;border-radius:4px;
  background:rgba(255,255,255,.25);outline:none;cursor:pointer
}
#vi::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;cursor:pointer}

/* Speed */
#spdbtn{
  background:rgba(255,255,255,.1);border:none;border-radius:7px;
  color:rgba(255,255,255,.8);padding:5px 11px;
  font-size:13px;font-weight:600;font-family:inherit;
  cursor:pointer;transition:background .15s;letter-spacing:.2px
}
#spdbtn:hover{background:rgba(255,255,255,.17);color:#fff}
#spdmenu{
  position:absolute;bottom:56px;right:52px;
  background:#1d1d1d;border:1px solid #303030;border-radius:10px;
  overflow:hidden;display:none;z-index:50;min-width:90px
}
#spdmenu.open{display:block}
#spdmenu button{
  display:block;width:100%;padding:9px 0;text-align:center;
  background:none;border:none;color:#aaa;font-size:13px;
  font-family:inherit;cursor:pointer;transition:background .12s
}
#spdmenu button:hover{background:rgba(255,255,255,.07);color:#fff}
#spdmenu button.on{color:#fff;font-weight:600}

/* Loading spinner */
#spinner{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  z-index:20;display:none
}
#spinner::after{
  content:'';display:block;width:40px;height:40px;border-radius:50%;
  border:3px solid rgba(255,255,255,.15);border-top-color:#fff;
  animation:spin .8s linear infinite
}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="wrap">
  <div id="urow">
    <input id="uin" type="text" placeholder="YouTube URL paste karo... (youtu.be/... ya watch?v=...)"/>
    <button id="gobtn">▶&nbsp; Load</button>
  </div>

  <div id="shell">
    <div id="rbox">
      <!-- placeholder -->
      <div id="ph">
        <div id="ph-icon">▶</div>
        <p>YouTube link paste karo upar aur Load dabao</p>
      </div>

      <!-- youtube iframe -->
      <iframe id="yf"
        allow="autoplay; encrypted-media; picture-in-picture"
        allowfullscreen
        sandbox="allow-scripts allow-same-origin allow-presentation allow-popups">
      </iframe>

      <!-- masks to cover YT UI chrome -->
      <div class="mask" id="mtop"></div>
      <div class="mask" id="mbot"></div>
      <div class="mside" id="mleft"></div>
      <div class="mside" id="mright"></div>

      <!-- click overlay -->
      <div id="ov"></div>

      <!-- loading spinner -->
      <div id="spinner"></div>

      <!-- center icon flash -->
      <div id="cfl"><svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg></div>

      <!-- our controls -->
      <div id="cbar">
        <div id="sk">
          <div id="sk-track">
            <div id="sk-buf"></div>
            <div id="sk-fill"></div>
            <div id="sk-dot"></div>
          </div>
          <input type="range" id="sk-in" min="0" max="10000" value="0">
        </div>
        <div id="bot">
          <button class="cb" id="pbtn" title="Play / Pause (Space)">
            <svg viewBox="0 0 24 24" fill="currentColor" id="pico"><polygon points="5,3 19,12 5,21"/></svg>
          </button>
          <button class="cb" id="bbtn" title="Back 10s (←)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="1,4 1,10 7,10"/><path d="M3.51 15a9 9 0 1 0 .49-4.49"/>
              <text x="7.2" y="15.5" font-size="5" fill="currentColor" stroke="none" font-family="Inter,sans-serif" font-weight="600">10</text>
            </svg>
          </button>
          <button class="cb" id="fbtn" title="Forward 10s (→)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="23,4 23,10 17,10"/><path d="M20.49 15a9 9 0 1 1-.49-4.49"/>
              <text x="7.2" y="15.5" font-size="5" fill="currentColor" stroke="none" font-family="Inter,sans-serif" font-weight="600">10</text>
            </svg>
          </button>
          <div id="vg">
            <button class="cb" id="mbtn" title="Mute (M)">
              <svg viewBox="0 0 24 24" id="vico" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="11,5 6,9 2,9 2,15 6,15 11,19" fill="currentColor" stroke="none"/>
                <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
              </svg>
            </button>
            <div id="vtrack"><input type="range" id="vi" min="0" max="100" value="80"></div>
          </div>
          <span id="tdisp">0:00 / 0:00</span>
          <div id="spc"></div>
          <button id="spdbtn">1x</button>
          <div id="spdmenu">
            <button data-s="0.25">0.25x</button><button data-s="0.5">0.5x</button>
            <button data-s="0.75">0.75x</button><button data-s="1" class="on">1x</button>
            <button data-s="1.25">1.25x</button><button data-s="1.5">1.5x</button>
            <button data-s="1.75">1.75x</button><button data-s="2">2x</button>
          </div>
          <button class="cb" id="fsbtn" title="Fullscreen (F)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="fsico">
              <polyline points="15,3 21,3 21,9"/><polyline points="9,21 3,21 3,15"/>
              <line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
/* ── Helpers ── */
const $=id=>document.getElementById(id);
function fmt(s){s=Math.floor(s||0);const m=Math.floor(s/60),r=s%60;return m+':'+(r<10?'0':'')+r}
function getId(u){
  u=(u||'').trim();
  const pats=[/[?&]v=([a-zA-Z0-9_-]{11})/,/youtu\.be\/([a-zA-Z0-9_-]{11})/,
              /embed\/([a-zA-Z0-9_-]{11})/,/shorts\/([a-zA-Z0-9_-]{11})/];
  for(const p of pats){const m=u.match(p);if(m)return m[1];}
  if(/^[a-zA-Z0-9_-]{11}$/.test(u))return u;
  return null;
}

/* ── State ── */
let playing=false,muted=false,cur=0,dur=0,vol=80,spd=1;
let ytPlayer=null,rafId=null,hideT=null,seekDragging=false;

/* ── DOM ── */
const shell=$('shell'),yf=$('yf'),ph=$('ph'),ov=$('ov');
const cbar=$('cbar'),spinner=$('spinner'),cfl=$('cfl');
const pbtn=$('pbtn'),pico=$('pico');
const bbtn=$('bbtn'),fbtn=$('fbtn');
const mbtn=$('mbtn'),vico=$('vico'),vi=$('vi');
const skIn=$('sk-in'),skFill=$('sk-fill'),skDot=$('sk-dot'),skBuf=$('sk-buf');
const tdisp=$('tdisp'),spdbtn=$('spdbtn'),spdmenu=$('spdmenu');
const fsbtn=$('fsbtn'),fsico=$('fsico');

/* ── Icon SVG strings ── */
const IC={
  play:'<polygon points="5,3 19,12 5,21"/>',
  pause:'<rect x="5" y="3" width="4" height="18" rx="1"/><rect x="15" y="3" width="4" height="18" rx="1"/>',
  volOn:'<polygon points="11,5 6,9 2,9 2,15 6,15 11,19" fill="currentColor" stroke="none"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>',
  volOff:'<polygon points="11,5 6,9 2,9 2,15 6,15 11,19" fill="currentColor" stroke="none"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>',
  fsMax:'<polyline points="15,3 21,3 21,9"/><polyline points="9,21 3,21 3,15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>',
  fsMin:'<polyline points="4,14 10,14 10,20"/><polyline points="20,10 14,10 14,4"/><line x1="10" y1="14" x2="3" y2="21"/><line x1="21" y1="3" x2="14" y2="10"/>'
};

function setPlayUI(on){
  playing=on;
  pico.innerHTML=on?IC.pause:IC.play;
  cfl.querySelector('svg').innerHTML=on?IC.pause:IC.play;
}

/* ── LOAD VIDEO ── */
function loadVideo(){
  const id=getId($('uin').value);
  if(!id){alert('Valid YouTube URL nahi mili bhai!');return;}

  ph.style.display='none';
  spinner.style.display='block';
  ov.style.display='block';
  cbar.style.display='block';

  /* Use the standard YouTube embed WITH their native controls
     but we shift iframe to hide YT chrome and overlay our own controls */
  const src=
    'https://www.youtube.com/embed/'+id+
    '?autoplay=1'+
    '&controls=1'+        // keep YT controls ON so video actually plays reliably
    '&rel=0'+
    '&modestbranding=1'+
    '&showinfo=0'+
    '&iv_load_policy=3'+
    '&fs=1'+
    '&playsinline=1'+
    '&enablejsapi=1';

  yf.src=src;
  yf.style.display='block';

  /* shift iframe: push up so title bar clips out, extend down so their controls clip out */
  yf.style.top='-50px';
  yf.style.position='absolute';
  yf.style.left='0';
  yf.style.width='100%';
  yf.style.height='calc(100% + 100px)';

  yf.onload=()=>{
    spinner.style.display='none';
    /* Try IFrame API */
    if(window.YT&&YT.Player&&!ytPlayer){
      ytPlayer=new YT.Player('yf',{
        events:{
          onReady(e){
            e.target.setVolume(vol);
            startLoop();
          },
          onStateChange(e){
            if(e.data===1){setPlayUI(true);startLoop();}
            if(e.data===2||e.data===0){setPlayUI(false);}
          }
        }
      });
    } else {
      startLoop();
    }
  };
}

window.onYouTubeIframeAPIReady=function(){};

/* ── RAF progress loop ── */
function startLoop(){
  cancelAnimationFrame(rafId);
  function tick(){
    if(ytPlayer&&ytPlayer.getCurrentTime){
      try{
        const nc=ytPlayer.getCurrentTime()||0;
        const nd=ytPlayer.getDuration()||0;
        if(!seekDragging){cur=nc;dur=nd;}
        const pct=dur?((cur/dur)*100):0;
        skFill.style.width=pct+'%';
        skDot.style.left=pct+'%';
        skIn.value=Math.round(pct*100);
        skBuf.style.width=((ytPlayer.getVideoLoadedFraction?ytPlayer.getVideoLoadedFraction():0)*100)+'%';
        tdisp.textContent=fmt(cur)+' / '+fmt(dur);
      }catch(e){}
    }
    rafId=requestAnimationFrame(tick);
  }
  tick();
}

/* ── Controls ── */
$('gobtn').onclick=loadVideo;
$('uin').addEventListener('keydown',e=>{if(e.key==='Enter')loadVideo();});

/* Overlay click = play/pause */
ov.addEventListener('click',()=>{
  if(!ytPlayer)return;
  if(playing){ytPlayer.pauseVideo();}else{ytPlayer.playVideo();}
  flashCenter();
});
ov.addEventListener('dblclick',e=>{e.stopPropagation();fsbtn.click();});

pbtn.onclick=()=>{
  if(!ytPlayer)return;
  if(playing)ytPlayer.pauseVideo();else ytPlayer.playVideo();
};

bbtn.onclick=()=>ytPlayer&&ytPlayer.seekTo(Math.max(0,cur-10),true);
fbtn.onclick=()=>ytPlayer&&ytPlayer.seekTo(cur+10,true);

mbtn.onclick=()=>{
  if(!ytPlayer)return;
  if(muted){ytPlayer.unMute();muted=false;vico.innerHTML=IC.volOn;}
  else{ytPlayer.mute();muted=true;vico.innerHTML=IC.volOff;}
};

vi.addEventListener('input',()=>{vol=+vi.value;ytPlayer&&ytPlayer.setVolume(vol);});

/* Seek */
skIn.addEventListener('mousedown',()=>{seekDragging=true;});
skIn.addEventListener('input',()=>{
  if(!ytPlayer||!dur)return;
  const t=(skIn.value/10000)*dur;
  cur=t;
  const pct=(t/dur)*100;
  skFill.style.width=pct+'%';
  skDot.style.left=pct+'%';
  tdisp.textContent=fmt(t)+' / '+fmt(dur);
});
skIn.addEventListener('change',()=>{
  seekDragging=false;
  if(!ytPlayer||!dur)return;
  ytPlayer.seekTo((skIn.value/10000)*dur,true);
});

/* Speed */
spdbtn.onclick=e=>{e.stopPropagation();spdmenu.classList.toggle('open');};
document.querySelectorAll('#spdmenu button').forEach(b=>{
  b.onclick=()=>{
    spd=parseFloat(b.dataset.s);
    ytPlayer&&ytPlayer.setPlaybackRate(spd);
    spdbtn.textContent=b.textContent;
    document.querySelectorAll('#spdmenu button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    spdmenu.classList.remove('open');
  };
});
document.addEventListener('click',()=>spdmenu.classList.remove('open'));

/* Fullscreen */
fsbtn.onclick=()=>{
  if(!document.fullscreenElement)shell.requestFullscreen&&shell.requestFullscreen();
  else document.exitFullscreen&&document.exitFullscreen();
};
document.addEventListener('fullscreenchange',()=>{
  fsico.innerHTML=document.fullscreenElement?IC.fsMin:IC.fsMax;
});

/* Center flash */
function flashCenter(){
  cfl.style.transform='translate(-50%,-50%) scale(1)';cfl.style.opacity='1';
  setTimeout(()=>{cfl.style.transform='translate(-50%,-50%) scale(0)';cfl.style.opacity='0';},550);
}

/* Auto-hide controls */
shell.addEventListener('mousemove',()=>{
  shell.classList.add('show');clearTimeout(hideT);
  hideT=setTimeout(()=>shell.classList.remove('show'),3000);
});
shell.addEventListener('mouseleave',()=>{clearTimeout(hideT);shell.classList.remove('show');});

/* Keyboard */
document.addEventListener('keydown',e=>{
  if(['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName))return;
  const k=e.code;
  if(k==='Space'){e.preventDefault();pbtn.click();}
  if(k==='ArrowRight'){e.preventDefault();fbtn.click();}
  if(k==='ArrowLeft'){e.preventDefault();bbtn.click();}
  if(k==='ArrowUp'){e.preventDefault();vi.value=Math.min(100,+vi.value+5);ytPlayer&&ytPlayer.setVolume(+vi.value);}
  if(k==='ArrowDown'){e.preventDefault();vi.value=Math.max(0,+vi.value-5);ytPlayer&&ytPlayer.setVolume(+vi.value);}
  if(k==='KeyF')fsbtn.click();
  if(k==='KeyM')mbtn.click();
});
</script>
<script src="https://www.youtube.com/iframe_api" async></script>
</body>
</html>
