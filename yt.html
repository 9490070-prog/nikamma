<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advance Enterprise IPTV Player</title>
    
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest/dist/hls.light.min.js"></script>
    
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle, #1a1a1a 0%, #0a0a0a 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .player-card {
            width: 95%;
            max-width: 800px;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
        }
        video {
            width: 100%;
            height: auto;
            aspect-ratio: 16/9;
            display: block;
            object-fit: contain;
        }
        .status-bar {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.6);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            color: #00ffcc;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(0, 255, 204, 0.3);
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .pulse-dot {
            width: 8px;
            height: 8px;
            background: #00ffcc;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.6; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.6; }
        }
    </style>
</head>
<body>

<div class="player-card">
    <div class="status-bar">
        <div class="pulse-dot"></div>
        <span id="status-text">Connecting Securely...</span>
    </div>
    
    <video id="video-engine" controls crossorigin="anonymous" playsinline autoplay muted></video>
</div>

<script>
    const streamUrl = "https://cdn12isb.tamashaweb.com:8087/jazzauth/189H/playlist.m3u8";
    const video = document.getElementById('video-engine');
    const statusText = document.getElementById('status-text');

    // Advance Hls Engine Configuration for Mixed Content & IPTV Streams
    const config = {
        enableWorker: true, // Multi-threading toggle to bypass Main Thread CORS
        lowLatencyMode: true,
        backBufferLength: 30,
        maxBufferSize: 0,
        maxBufferLength: 10,
        progressive: true,
        // Force upgrade/bypass rules inside JS compiler
        xhrSetup: function (xhr, url) {
            xhr.withCredentials = false;
        }
    };

    if (Hls.isSupported()) {
        const hls = new Hls(config);
        
        statusText.innerText = "Transmuxing Stream...";
        hls.loadSource(streamUrl);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, function() {
            statusText.innerText = "LIVE";
            statusText.style.color = "#ff3333";
            document.querySelector('.pulse-dot').style.background = "#ff3333";
            
            video.play().catch(error => {
                statusText.innerText = "Click Play Button";
                statusText.style.color = "#fff";
            });
        });

        // Auto Recovery on Mixed Content/Network Drops
        hls.on(Hls.Events.ERROR, function (event, data) {
            if (data.fatal) {
                switch (data.type) {
                    case Hls.ErrorTypes.NETWORK_ERROR:
                        statusText.innerText = "Network Retry...";
                        hls.startLoad();
                        break;
                    case Hls.ErrorTypes.MEDIA_ERROR:
                        statusText.innerText = "Decoding Stream...";
                        hls.recoverMediaError();
                        break;
                    default:
                        statusText.innerText = "Loading Video...";
                        break;
                }
            }
        });
    } 
    // Apple Devices Safari Support
    else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = streamUrl;
        statusText.innerText = "LIVE (Native)";
    } else {
        statusText.innerText = "Browser Not Supported";
    }
</script>

</body>
</html>
