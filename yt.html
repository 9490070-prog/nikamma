<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ad Studio Pro - GIPHY GIF Export</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        :root {
            --bg-primary: #0a0e1a;
            --bg-secondary: #131b2e;
            --bg-card: #1a2440;
            --border-color: #2a3a5c;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --accent-green: #10b981;
            --accent-pink: #ec4899;
            --accent-orange: #f59e0b;
            --accent-red: #ef4444;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
        }
        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 10px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }
        .app {
            max-width: 480px;
            width: 100%;
            padding-bottom: 30px;
        }
        .header {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 12px 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            font-size: 16px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple), var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header .badge {
            background: var(--accent-green);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
            color: white;
        }
        .header .badge-adv {
            background: var(--accent-orange);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
            color: white;
            margin-left: 6px;
        }
        .card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 12px;
        }
        .card-title {
            font-size: 11px;
            font-weight: 700;
            color: var(--accent-blue);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card-title .title-icon {
            font-size: 16px;
        }
        .template-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
        }
        .template-item {
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 10px 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .template-item:active {
            transform: scale(0.95);
            border-color: var(--accent-blue);
        }
        .template-item .icon {
            font-size: 20px;
            display: block;
        }
        .template-item .name {
            font-size: 9px;
            font-weight: 600;
            margin-top: 3px;
        }
        .template-item .tag {
            font-size: 7px;
            color: var(--text-secondary);
        }
        .template-item .badge {
            font-size: 6px;
            padding: 1px 8px;
            border-radius: 8px;
            display: inline-block;
            margin-top: 3px;
            font-weight: 700;
        }
        .badge-giphy {
            background: #00ff87;
            color: #000;
        }
        .input-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .input-group label {
            font-size: 9px;
            color: var(--text-secondary);
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .input-group input,
        .input-group select {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 10px;
            color: var(--text-primary);
            font-size: 12px;
            outline: none;
            height: 36px;
            width: 100%;
        }
        .input-group input[type="color"] {
            padding: 2px;
            height: 36px;
            cursor: pointer;
        }
        .color-hex {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 11px;
            color: var(--text-secondary);
            font-family: monospace;
            height: 36px;
            display: flex;
            align-items: center;
        }
        .bg-options {
            display: flex;
            gap: 6px;
            margin-top: 4px;
        }
        .bg-options .btn {
            flex: 1;
            padding: 6px;
            font-size: 9px;
        }
        .btn-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 5px;
        }
        .btn {
            padding: 10px 4px;
            border: none;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s;
            text-align: center;
            color: white;
            touch-action: manipulation;
        }
        .btn:active {
            transform: scale(0.94);
        }
        .btn-blue { background: var(--accent-blue); }
        .btn-purple { background: var(--accent-purple); }
        .btn-green { background: var(--accent-green); }
        .btn-pink { background: var(--accent-pink); }
        .btn-red { background: var(--accent-red); }
        .btn-orange { background: var(--accent-orange); }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
        }
        .export-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-top: 8px;
        }
        .canvas-frame {
            background: var(--bg-primary);
            border: 2px dashed var(--border-color);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 180px;
            position: relative;
        }
        .canvas-frame .label {
            position: absolute;
            top: 8px;
            left: 12px;
            font-size: 8px;
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .canvas-frame.transparent-mode {
            background: repeating-conic-gradient(#1a2440 0% 25%, #0a0e1a 0% 50%) 0 0 / 20px 20px;
        }
        #adCanvas {
            background: #ffffff;
            position: relative;
            overflow: hidden;
            transition: all 0.2s;
            width: 320px;
            height: 50px;
            border-radius: 0px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            touch-action: none;
        }
        #adCanvas.interstitial {
            width: 280px !important;
            height: 340px !important;
            border-radius: 16px;
        }
        #adCanvas.transparent-bg {
            background: transparent !important;
        }
        .ad-node {
            position: absolute;
            cursor: grab;
            user-select: none;
            touch-action: none;
            outline: 1px dashed rgba(0, 0, 0, 0.15);
            display: inline-block;
        }
        .ad-node.active {
            outline: 2px solid var(--accent-blue) !important;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
            z-index: 999;
        }
        .ad-node img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
            display: block;
        }
        .ad-node .text-inside {
            font-size: 14px;
            color: #000000;
            font-weight: 700;
            white-space: nowrap;
            pointer-events: none;
            padding: 2px 4px;
        }

        /* ANIMATION IMPLEMENTATIONS */
        .anim-fade { animation: aFade 1s ease-in-out infinite alternate; }
        @keyframes aFade { 0% { opacity: 0.3; } 100% { opacity: 1; } }

        .anim-bounce { animation: aBounce 0.6s ease-in-out infinite alternate; }
        @keyframes aBounce { 0% { transform: translateY(0); } 100% { transform: translateY(-8px); } }

        .anim-pulse { animation: aPulse 0.8s ease-in-out infinite alternate; }
        @keyframes aPulse { 0% { transform: scale(0.95); } 100% { transform: scale(1.1); } }

        .anim-flash { animation: aFlash 0.4s steps(2, start) infinite; }
        @keyframes aFlash { 0%, 100% { visibility: visible; } 50% { visibility: hidden; } }

        .anim-spin { animation: aSpin 2s linear infinite; }
        @keyframes aSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent-green);
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            z-index: 9999;
            display: none;
        }
        .toast.show { display: block; }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: var(--border-color);
            border-radius: 3px;
            margin-top: 8px;
            display: none;
            overflow: hidden;
        }
        .progress-bar .fill {
            height: 100%;
            background: var(--accent-pink);
            width: 0%;
        }
        .download-dialog {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 9998;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .dialog-box {
            background: var(--bg-secondary);
            border: 2px solid var(--accent-blue);
            border-radius: 16px;
            padding: 20px;
            max-width: 360px;
            width: 100%;
            text-align: center;
        }
        .dialog-box .preview img {
            max-width: 100%;
            max-height: 200px;
            margin: 12px 0;
            border: 1px solid var(--border-color);
        }
        #fileInput { display: none; }
    </style>
</head>
<body>

    <div class="app">
        <div class="header">
            <h1>⚡ Ad Studio Pro</h1>
            <div>
                <span class="badge">Engine Fixed</span>
                <span class="badge-adv">GIF INLINE</span>
            </div>
        </div>

        <div class="card">
            <div class="card-title"><span class="title-icon">📋</span> Animated Ad Templates</div>
            <div class="template-grid">
                <div class="template-item" onclick="loadTemplate('fire_sale')">
                    <span class="icon">🔥</span>
                    <div class="name">Mega Sale</div>
                    <span class="badge badge-giphy">BOUNCE</span>
                </div>
                <div class="template-item" onclick="loadTemplate('neon_vibes')">
                    <span class="icon">⚡</span>
                    <div class="name">Neon Flash</div>
                    <span class="badge badge-giphy">FLASH</span>
                </div>
                <div class="template-item" onclick="loadTemplate('spin_pro')">
                    <span class="icon">🌀</span>
                    <div class="name">Spin Art</div>
                    <span class="badge badge-giphy">SPIN</span>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-title"><span class="title-icon">🎛&zwj;️</span> Dimensions & Assets</div>
            <div class="input-grid">
                <div class="input-group">
                    <label>Width</label>
                    <input type="number" id="canvasW" value="320" oninput="mutateCanvas()">
                </div>
                <div class="input-group">
                    <label>Height</label>
                    <input type="number" id="canvasH" value="50" oninput="mutateCanvas()">
                </div>
            </div>
            <div class="input-grid" style="margin-top: 8px;">
                <div class="input-group">
                    <label>Background</label>
                    <input type="color" id="canvasBg" value="#ffffff" oninput="updateBg()">
                </div>
                <div class="input-group">
                    <label>Hex Code</label>
                    <div class="color-hex" id="canvasBgHex">#FFFFFF</div>
                </div>
            </div>
            <div class="bg-options">
                <button class="btn btn-blue" onclick="setSolidBg()">🔲 Solid</button>
                <button class="btn btn-orange" onclick="setTransparentBg()">✨ Transparent</button>
            </div>
        </div>

        <div class="card">
            <div class="card-title"><span class="title-icon">🧩</span> Elements Creator</div>
            <div class="btn-row">
                <button class="btn btn-blue" onclick="addText('⚡ BUY NOW ⚡', 'anim-pulse')">+ Pulsing Text</button>
                <button class="btn btn-pink" onclick="addText('🔥 50% OFF', 'anim-bounce')">+ Bouncing Text</button>
                <label for="fileInput" class="btn btn-purple" style="text-align:center;cursor:pointer;">+ Image/GIF</label>
                <input type="file" id="fileInput" accept="image/*" onchange="addImage(event)">
                <button class="btn btn-outline" onclick="clearSelection()">Clear</button>
            </div>
        </div>

        <div class="card">
            <div class="card-title"><span class="title-icon">💾</span> Compile Studio Asset</div>
            <div class="export-row">
                <button class="btn btn-green" onclick="exportPNG()">📸 Instant PNG</button>
                <button class="btn btn-pink" onclick="exportFullGIF()">🎞️ Render Engine GIF</button>
            </div>
            <div class="progress-bar" id="progressBar">
                <div class="fill" id="progressFill"></div>
            </div>
        </div>

        <div class="canvas-frame" id="canvasFrame">
            <span class="label">Live Workspace Canvas</span>
            <div id="adCanvas" onclick="clearSelection(event)"></div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <div class="download-dialog" id="downloadDialog">
        <div class="dialog-box">
            <h3>📥 Output Compiled</h3>
            <div class="preview" id="dialogPreview"></div>
            <button class="btn btn-green" onclick="dialogDownload()" style="width:100%; padding:12px; font-size:14px;">⬇️ Download File</button>
            <button class="btn btn-red" onclick="closeDialog()" style="width:100%; margin-top:8px; padding:8px;">✕ Close</button>
        </div>
    </div>

    <script>
        var canvas = document.getElementById('adCanvas');
        var toast = document.getElementById('toast');
        var downloadDialog = document.getElementById('downloadDialog');
        var dialogPreview = document.getElementById('dialogPreview');
        var progressBar = document.getElementById('progressBar');
        var progressFill = document.getElementById('progressFill');
        var selectedNode = null;
        var nodeCounter = 0;
        var isTransparent = false;
        var dialogData = null;
        var dialogFilename = '';

        function showToast(msg) {
            toast.textContent = msg;
            toast.style.display = 'block';
            setTimeout(function() { toast.style.display = 'none'; }, 3000);
        }

        function mutateCanvas() {
            canvas.style.width = document.getElementById('canvasW').value + 'px';
            canvas.style.height = document.getElementById('canvasH').value + 'px';
        }

        function updateBg() {
            var col = document.getElementById('canvasBg').value;
            document.getElementById('canvasBgHex').textContent = col.toUpperCase();
            canvas.style.backgroundColor = col;
            isTransparent = false;
        }

        function setTransparentBg() {
            isTransparent = true;
            canvas.style.backgroundColor = 'transparent';
            document.getElementById('canvasBgHex').textContent = 'TRANSPARENT';
            showToast('✨ Transparent Mode Enabled');
        }

        function setSolidBg() {
            isTransparent = false;
            updateBg();
        }

        function addText(customText, animClass) {
            nodeCounter++;
            var node = document.createElement('div');
            node.className = 'ad-node active ' + (animClass || '');
            node.id = 'node_' + nodeCounter;
            node.style.left = '20px';
            node.style.top = '10px';

            var inner = document.createElement('div');
            inner.className = 'text-inside';
            inner.textContent = customText || 'New Text';
            inner.style.color = '#ffffff';
            inner.style.backgroundColor = '#ec4899';
            inner.style.borderRadius = '4px';

            node.appendChild(inner);
            canvas.appendChild(node);
            setupDrag(node);
            selectNode(node);
        }

        function addImage(e) {
            var file = e.target.files[0];
            if(!file) return;
            var reader = new FileReader();
            reader.onload = function(event) {
                nodeCounter++;
                var node = document.createElement('div');
                node.className = 'ad-node active';
                node.id = 'node_' + nodeCounter;
                node.style.left = '50px';
                node.style.top = '5px';
                node.style.width = '40px';
                node.style.height = '40px';

                var img = document.createElement('img');
                img.src = event.target.result;
                node.appendChild(img);
                canvas.appendChild(node);
                setupDrag(node);
                selectNode(node);
            };
            reader.readAsDataURL(file);
        }

        function loadTemplate(type) {
            canvas.innerHTML = '';
            if(type === 'fire_sale') {
                canvas.style.backgroundColor = '#131b2e';
                addText('🔥 MEGA WEEKEND SALE', 'anim-bounce');
            } else if(type === 'neon_vibes') {
                canvas.style.backgroundColor = '#000000';
                addText('⚡ FLASH 90% OFF ⚡', 'anim-flash');
            } else if(type === 'spin_pro') {
                canvas.style.backgroundColor = '#ffffff';
                addText('🌀 SPECIAL OFFER', 'anim-spin');
            }
            showToast('🎯 Loaded Template Module');
        }

        function setupDrag(el) {
            var posX = 0, posY = 0, mouseX = 0, mouseY = 0;
            el.addEventListener('mousedown', dragMouseDown);
            el.addEventListener('touchstart', dragTouchStart, {passive: false});

            function dragMouseDown(e) {
                e.preventDefault();
                selectNode(el);
                mouseX = e.clientX;
                mouseY = e.clientY;
                document.onmouseup = closeDragElement;
                document.onmousemove = elementDrag;
            }

            function dragTouchStart(e) {
                selectNode(el);
                var touch = e.touches[0];
                mouseX = touch.clientX;
                mouseY = touch.clientY;
                document.ontouchend = closeDragElement;
                document.ontouchmove = elementTouchDrag;
            }

            function elementDrag(e) {
                posX = mouseX - e.clientX;
                posY = mouseY - e.clientY;
                mouseX = e.clientX;
                mouseY = e.clientY;
                el.style.top = (el.offsetTop - posY) + "px";
                el.style.left = (el.offsetLeft - posX) + "px";
            }

            function elementTouchDrag(e) {
                var touch = e.touches[0];
                posX = mouseX - touch.clientX;
                posY = mouseY - touch.clientY;
                mouseX = touch.clientX;
                mouseY = touch.clientY;
                el.style.top = (el.offsetTop - posY) + "px";
                el.style.left = (el.offsetLeft - posX) + "px";
            }

            function closeDragElement() {
                document.onmouseup = null;
                document.onmousemove = null;
                document.ontouchend = null;
                document.ontouchmove = null;
            }
        }

        function selectNode(el) {
            clearSelection();
            selectedNode = el;
            el.classList.add('active');
        }

        function clearSelection(e) {
            if(e && e.target !== canvas) return;
            var nodes = canvas.querySelectorAll('.ad-node');
            nodes.forEach(function(n) { n.classList.remove('active'); });
            selectedNode = null;
        }

        function exportPNG() {
            clearSelection();
            html2canvas(canvas, { backgroundColor: isTransparent ? null : undefined }).then(function(cv) {
                showDialog(cv.toDataURL('image/png'), 'ad-output.png', 'png');
            });
        }

        function exportFullGIF() {
            clearSelection();
            progressBar.style.display = 'block';
            progressFill.style.width = '0%';
            showToast('⏳ Generating Render engine...');

            // Standalone inline worker build inject logic to avoid freeze/stop loop
            var workerCode = `
                importScripts("https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js");
            `;
            var workerBlob = new Blob([workerCode], {type: "application/javascript"});
            var workerUrl = URL.createObjectURL(workerBlob);

            var gif = new GIF({
                workers: 2,
                quality: 2,
                workerScript: workerUrl,
                background: isTransparent ? 'rgba(0,0,0,0)' : '#ffffff',
                transparent: isTransparent ? 0x00000000 : null
            });

            var framesCount = 12;
            var currentFrame = 0;

            function processFrameLoop() {
                if(currentFrame >= framesCount) {
                    showToast('📦 Packing Output Files... Please wait');
                    progressFill.style.width = '90%';
                    
                    gif.on('finished', function(blob) {
                        progressFill.style.width = '100%';
                        setTimeout(function() { progressBar.style.display = 'none'; }, 500);
                        var finalUrl = URL.createObjectURL(blob);
                        showDialog(finalUrl, 'animated-ad.gif', 'gif');
                        URL.revokeObjectURL(workerUrl);
                    });

                    gif.render();
                    return;
                }

                progressFill.style.width = ((currentFrame / framesCount) * 80) + '%';
                
                html2canvas(canvas, {
                    backgroundColor: isTransparent ? null : undefined,
                    logging: false,
                    useCORS: true
                }).then(function(cv) {
                    gif.addFrame(cv, {delay: 100, copy: true});
                    currentFrame++;
                    setTimeout(processFrameLoop, 60);
                });
            }

            processFrameLoop();
        }

        function showDialog(dataUrl, filename, type) {
            dialogData = dataUrl;
            dialogFilename = filename;
            dialogPreview.innerHTML = '';
            var img = document.createElement('img');
            img.src = dataUrl;
            dialogPreview.appendChild(img);
            downloadDialog.style.display = 'flex';
        }

        function closeDialog() {
            downloadDialog.style.display = 'none';
        }

        function dialogDownload() {
            var a = document.createElement('a');
            a.href = dialogData;
            a.download = dialogFilename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            closeDialog();
            showToast('🎉 Download Started successfully!');
        }
    </script>
</body>
</html>
