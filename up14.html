<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AR Satellite Finder Pro - Axis Fixed</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            user-select: none;
        }

        /* Camera Feed */
        #cameraVideo {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        .ar-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 2;
            background: rgba(0, 0, 0, 0.2);
            pointer-events: none;
        }

        /* Dashboard Top Cards */
        .hud-header {
            position: fixed;
            top: 15px; left: 0; right: 0;
            z-index: 10;
            display: flex;
            justify-content: space-around;
            padding: 0 10px;
            pointer-events: none;
        }

        .hud-card {
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 14px;
            padding: 8px 12px;
            min-width: 100px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
        }

        .hud-card .title {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            color: #94a3b8;
        }

        .hud-card .val {
            font-size: 18px;
            font-weight: 800;
            color: #38bdf8;
            margin-top: 2px;
        }

        .hud-card .sub-target {
            font-size: 11px;
            font-weight: 700;
            color: #f59e0b;
        }

        /* Top Horizontal Tracking Gauge */
        .azimuth-bar-container {
            position: fixed;
            top: 90px;
            left: 5%;
            width: 90%;
            height: 38px;
            background: rgba(15, 23, 42, 0.9);
            border: 2px solid rgba(255,255,255,0.25);
            border-radius: 20px;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .azimuth-center-line {
            position: absolute;
            width: 4px;
            height: 100%;
            background: #ef4444;
            z-index: 2;
        }

        .azimuth-pointer {
            position: absolute;
            width: 22px; height: 22px;
            background: #38bdf8;
            border: 2px solid #fff;
            border-radius: 50%;
            transition: left 0.05s linear;
            transform: translateX(-50%);
            box-shadow: 0 0 10px #38bdf8;
        }

        /* Center Target Crosshair */
        .crosshair-container {
            position: fixed;
            top: 55%; left: 50%;
            transform: translate(-50%, -50%);
            width: 240px; height: 240px;
            z-index: 5;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .reticle-ring {
            position: absolute;
            width: 100%; height: 100%;
            border: 3px dashed rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            transition: all 0.2s ease;
        }

        .reticle-center {
            width: 20px; height: 20px;
            border: 3px solid #ef4444;
            border-radius: 50%;
            background: rgba(239, 68, 68, 0.4);
            transition: all 0.2s;
        }

        /* Floating Satellite Marker */
        .sat-target-marker {
            position: absolute;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 6;
            pointer-events: none;
            transition: left 0.05s linear, top 0.05s linear;
        }

        .sat-icon-box {
            width: 62px; height: 62px;
            background: rgba(239, 68, 68, 0.3);
            border: 3px solid #ef4444;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ef4444;
            font-size: 26px;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.8);
            animation: pulseRed 1.2s infinite;
        }

        .sat-tag {
            background: rgba(15, 23, 42, 0.95);
            border: 2px solid #ef4444;
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 12px;
            margin-top: 6px;
            white-space: nowrap;
        }

        /* MATCHED / LOCKED STATE */
        .is-aligned .reticle-ring {
            border: 4px solid #4ade80;
            box-shadow: 0 0 35px rgba(74, 222, 128, 0.8);
        }
        .is-aligned .reticle-center {
            background: #4ade80;
            border-color: #4ade80;
        }
        .is-aligned .sat-icon-box {
            background: rgba(74, 222, 128, 0.35);
            border-color: #4ade80;
            color: #4ade80;
            box-shadow: 0 0 35px rgba(74, 222, 128, 0.9);
            animation: pulseGreen 0.8s infinite;
        }
        .is-aligned .sat-tag {
            border-color: #4ade80;
            color: #4ade80;
        }

        @keyframes pulseRed { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        @keyframes pulseGreen { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }

        /* Bottom Status & Controls */
        .hud-bottom {
            position: fixed;
            bottom: 20px; left: 0; right: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 0 15px;
        }

        .status-pill {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 700;
            color: #cbd5e1;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.6);
        }

        .status-pill.locked {
            border-color: #4ade80;
            color: #4ade80;
            background: rgba(20, 83, 45, 0.95);
        }

        .btn-group {
            display: flex;
            gap: 8px;
            pointer-events: auto;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            background: rgba(30, 41, 59, 0.92);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 10px 16px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Launch Overlay */
        .start-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #090d16;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 25px;
            text-align: center;
        }
        .start-screen i { font-size: 60px; color: #38bdf8; margin-bottom: 20px; }
        .start-screen h1 { font-size: 22px; font-weight: 700; margin-bottom: 10px; }
        .start-screen p { font-size: 13px; color: #94a3b8; max-width: 300px; margin-bottom: 30px; line-height: 1.6; }
        .btn-start {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            border: none;
            color: #fff;
            padding: 14px 36px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
        }

        .select-modal {
            position: fixed;
            bottom: -100%; left: 0; right: 0;
            background: #0f172a;
            border-top: 2px solid rgba(255,255,255,0.2);
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            padding: 24px 20px;
            z-index: 50;
            transition: bottom 0.3s ease-out;
            max-height: 60vh;
            overflow-y: auto;
        }
        .select-modal.open { bottom: 0; }
        .select-modal h3 { font-size: 14px; margin-bottom: 16px; color: #94a3b8; text-transform: uppercase; }
        .sat-item {
            padding: 14px 12px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            display: flex;
            justify-content: space-between;
            font-size: 15px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <video id="cameraVideo" autoplay playsinline muted></video>
    <div class="ar-overlay"></div>

    <!-- Start Overlay -->
    <div class="start-screen" id="startScreen">
        <i class="fas fa-satellite-dish"></i>
        <h1>AR Satellite Finder Pro</h1>
        <p>Inverted Horizontal & Vertical Camera Axis Corrected Version</p>
        <button class="btn-start" id="startBtn"><i class="fas fa-play" style="margin-right:8px;"></i> Start AR Camera</button>
    </div>

    <!-- Top Dashboard -->
    <div class="hud-header">
        <div class="hud-card">
            <div class="title">Azimuth (Dir)</div>
            <div class="val" id="hudAz">--°</div>
            <div class="sub-target" id="hudTargetAz">Target: --°</div>
        </div>
        <div class="hud-card">
            <div class="title">Elevation (Tilt)</div>
            <div class="val" id="hudEl">--°</div>
            <div class="sub-target" id="hudTargetEl">Target: --°</div>
        </div>
        <div class="hud-card">
            <div class="title">GPS Status</div>
            <div class="val" id="hudGps" style="font-size: 11px; color:#4ade80;">Active</div>
        </div>
    </div>

    <!-- Top Horizontal Tracking Gauge -->
    <div class="azimuth-bar-container">
        <div class="azimuth-center-line"></div>
        <div class="azimuth-pointer" id="azPointer"></div>
    </div>

    <!-- Target AR Marker -->
    <div class="sat-target-marker" id="satMarker">
        <div class="sat-icon-box"><i class="fas fa-satellite"></i></div>
        <div class="sat-tag" id="satTag">SES 8 (95.0°E)</div>
    </div>

    <!-- Center Reticle Alignment Target -->
    <div class="crosshair-container" id="crosshair">
        <div class="reticle-ring"></div>
        <div class="reticle-center"></div>
    </div>

    <!-- Bottom Controls & Direction Status -->
    <div class="hud-bottom">
        <div class="status-pill" id="statusPill">
            <i class="fas fa-arrow-left" id="statusIcon"></i>
            <span id="statusText">Rotate phone West or East...</span>
        </div>
        <div class="btn-group">
            <button class="btn" id="satSelectBtn"><i class="fas fa-list-ul"></i> Sat Select</button>
            <button class="btn" id="flipAxisBtn"><i class="fas fa-exchange-alt"></i> Invert Axis</button>
            <button class="btn" id="reGpsBtn"><i class="fas fa-crosshairs"></i> Refresh GPS</button>
        </div>
    </div>

    <!-- Satellite Selection Sheet -->
    <div class="select-modal" id="satModal">
        <h3>Select Target Satellite</h3>
        <div id="satList"></div>
    </div>

    <script>
        const SATELLITES = [
            { name: 'SES 8 (Dish TV India)', long: 95.0 },
            { name: 'GSAT 15 (DD Free Dish)', long: 93.5 },
            { name: 'GSAT 10 / 17 (Tata Play)', long: 83.0 },
            { name: 'ST 2 (Videocon d2h)', long: 88.0 },
            { name: 'Intelsat 20 (Airtel Digital TV)', long: 68.5 },
            { name: 'Paksat 1R', long: 38.0 },
            { name: 'Badr 4/5/6/7', long: 26.0 },
            { name: 'Hotbird 13B/13C', long: 13.0 }
        ];

        let state = {
            lat: 28.6139,
            lon: 77.2090,
            selectedSat: SATELLITES[0],
            targetAzimuth: 0,
            targetElevation: 0,
            phoneHeading: 0,
            phonePitch: 0,
            invertX: false, // Fix for flipped horizontal axis
            isLocked: false
        };

        const video = document.getElementById('cameraVideo');
        const startScreen = document.getElementById('startScreen');
        const startBtn = document.getElementById('startBtn');
        const satMarker = document.getElementById('satMarker');
        const crosshair = document.getElementById('crosshair');
        const statusPill = document.getElementById('statusPill');
        const statusText = document.getElementById('statusText');
        const statusIcon = document.getElementById('statusIcon');
        const azPointer = document.getElementById('azPointer');

        // Geostationary Orbital Trigonometry
        function calculateSatelliteAngles() {
            const latRad = state.lat * Math.PI / 180;
            const lonRad = state.lon * Math.PI / 180;
            const satLonRad = state.selectedSat.long * Math.PI / 180;

            const dLon = satLonRad - lonRad;

            // Azimuth Calculation
            const East = Math.sin(dLon);
            const North = -Math.sin(latRad) * Math.cos(dLon);
            let azRad = Math.atan2(East, North);
            let azDeg = (azRad * 180 / Math.PI + 360) % 360;

            // Elevation Calculation
            const R_earth = 6371;
            const R_sat = 42164;
            const cosGamma = Math.cos(latRad) * Math.cos(dLon);
            const sinGamma = Math.sqrt(Math.max(0, 1 - cosGamma * cosGamma));
            const elRad = Math.atan((cosGamma - (R_earth / R_sat)) / (sinGamma || 0.00001));
            let elDeg = elRad * 180 / Math.PI;

            state.targetAzimuth = azDeg;
            state.targetElevation = elDeg;

            document.getElementById('hudTargetAz').textContent = `Target: ${azDeg.toFixed(1)}°`;
            document.getElementById('hudTargetEl').textContent = `Target: ${elDeg.toFixed(1)}°`;
            document.getElementById('satTag').textContent = `${state.selectedSat.name} (${state.selectedSat.long}°E)`;
        }

        // Camera Initialization
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "environment" } },
                    audio: false
                });
                video.srcObject = stream;
            } catch (e) {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                video.srcObject = stream;
            }
        }

        // GPS Tracker
        function initGPS() {
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition(pos => {
                    state.lat = pos.coords.latitude;
                    state.lon = pos.coords.longitude;
                    document.getElementById('hudGps').textContent = `${state.lat.toFixed(1)}°, ${state.lon.toFixed(1)}°`;
                    calculateSatelliteAngles();
                }, err => {
                    calculateSatelliteAngles();
                }, { enableHighAccuracy: true });
            }
        }

        // Orientation Sensors
        function handleOrientation(e) {
            let heading = 0;
            if (e.webkitCompassHeading !== undefined && e.webkitCompassHeading !== null) {
                heading = e.webkitCompassHeading;
            } else if (e.alpha !== null) {
                heading = (360 - e.alpha) % 360;
            }

            let pitch = e.beta || 0;

            state.phoneHeading = heading;
            state.phonePitch = pitch;

            document.getElementById('hudAz').textContent = `${heading.toFixed(1)}°`;
            document.getElementById('hudEl').textContent = `${pitch.toFixed(1)}°`;

            renderAR();
        }

        // Corrected Horizontal Projection Logic
        function renderAR() {
            // Horizontal Delta (Azimuth Diff)
            let azDiff = state.targetAzimuth - state.phoneHeading;
            azDiff = ((azDiff + 540) % 360) - 180; // Normalize between -180 and +180

            // Apply Inversion state if toggled
            if (state.invertX) {
                azDiff = -azDiff;
            }

            // Vertical Delta (Elevation Diff)
            let elDiff = state.targetElevation - state.phonePitch;

            // 1. Top Pointer Bar (Corrected Direction)
            let gaugePct = 50 + (azDiff / 50) * 50; 
            gaugePct = Math.max(5, Math.min(95, gaugePct));
            azPointer.style.left = `${gaugePct}%`;

            // 2. Screen Space AR Projection Fix
            const fovScaleX = window.innerWidth / 50; 
            const fovScaleY = window.innerHeight / 50;

            // CORRECTED: Right moves Right (+), Left moves Left (-)
            const xPos = (window.innerWidth / 2) + (azDiff * fovScaleX);
            const yPos = (window.innerHeight / 2) - (elDiff * fovScaleY);

            satMarker.style.left = `${xPos}px`;
            satMarker.style.top = `${yPos}px`;

            // 3. Guidance Messaging & Alignment Lock
            if (Math.abs(azDiff) < 3.5 && Math.abs(elDiff) < 3.5) {
                if (!state.isLocked) {
                    state.isLocked = true;
                    crosshair.classList.add('is-aligned');
                    satMarker.classList.add('is-aligned');
                    statusPill.classList.add('locked');
                    statusText.textContent = "SATELLITE MATCHED & LOCKED!";
                    statusIcon.className = "fas fa-check-circle";
                    if (navigator.vibrate) navigator.vibrate([120, 60, 120]);
                }
            } else {
                if (state.isLocked) {
                    state.isLocked = false;
                    crosshair.classList.remove('is-aligned');
                    satMarker.classList.remove('is-aligned');
                    statusPill.classList.remove('locked');
                }

                if (Math.abs(elDiff) > 5) {
                    if (elDiff > 0) {
                        statusText.textContent = `Tilt Phone Up (${Math.abs(elDiff).toFixed(0)}°)`;
                        statusIcon.className = "fas fa-arrow-up";
                    } else {
                        statusText.textContent = `Tilt Phone Down (${Math.abs(elDiff).toFixed(0)}°)`;
                        statusIcon.className = "fas fa-arrow-down";
                    }
                } else {
                    if (azDiff > 0) {
                        statusText.textContent = `Turn Right / East (${Math.abs(azDiff).toFixed(0)}°)`;
                        statusIcon.className = "fas fa-arrow-right";
                    } else {
                        statusText.textContent = `Turn Left / West (${Math.abs(azDiff).toFixed(0)}°)`;
                        statusIcon.className = "fas fa-arrow-left";
                    }
                }
            }
        }

        // Render Satellite List Modal
        function renderSatList() {
            const container = document.getElementById('satList');
            container.innerHTML = '';
            SATELLITES.forEach(sat => {
                const item = document.createElement('div');
                item.className = 'sat-item';
                item.innerHTML = `<span>${sat.name}</span><strong>${sat.long}°E</strong>`;
                item.onclick = () => {
                    state.selectedSat = sat;
                    calculateSatelliteAngles();
                    document.getElementById('satModal').classList.remove('open');
                };
                container.appendChild(item);
            });
        }

        // Event Listeners
        startBtn.onclick = async () => {
            startScreen.style.display = 'none';
            await initCamera();
            initGPS();
            calculateSatelliteAngles();

            if ('ondeviceorientationabsolute' in window) {
                window.addEventListener('deviceorientationabsolute', handleOrientation);
            } else if (window.DeviceOrientationEvent) {
                if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                    DeviceOrientationEvent.requestPermission().then(res => {
                        if (res === 'granted') window.addEventListener('deviceorientation', handleOrientation);
                    });
                } else {
                    window.addEventListener('deviceorientation', handleOrientation);
                }
            }
        };

        document.getElementById('satSelectBtn').onclick = () => {
            renderSatList();
            document.getElementById('satModal').classList.toggle('open');
        };

        // Invert Axis Toggle Button
        document.getElementById('flipAxisBtn').onclick = () => {
            state.invertX = !state.invertX;
            alert(state.invertX ? "Horizontal Axis Inverted!" : "Horizontal Axis Normal!");
            renderAR();
        };

        document.getElementById('reGpsBtn').onclick = () => {
            initGPS();
        };
    </script>
</body>
</html>
