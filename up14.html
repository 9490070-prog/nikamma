<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Professional Satellite Finder AR Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            user-select: none;
        }

        /* Camera Background */
        #cameraVideo {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* Overlay Canvas & Darkening */
        .ar-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 2;
            background: rgba(5, 10, 20, 0.35);
            pointer-events: none;
        }

        /* HUD Header Top */
        .hud-header {
            position: fixed;
            top: 15px; left: 0; right: 0;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            padding: 0 12px;
            pointer-events: none;
        }

        .hud-card {
            background: rgba(10, 16, 30, 0.75);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 8px 12px;
            min-width: 90px;
            text-align: center;
        }

        .hud-card .title {
            font-size: 9px;
            text-transform: uppercase;
            color: #94a3b8;
            letter-spacing: 0.5px;
        }

        .hud-card .val {
            font-size: 16px;
            font-weight: 700;
            color: #38bdf8;
            margin-top: 2px;
        }

        .hud-card .val.target { color: #f59e0b; }
        .hud-card .val.success { color: #4ade80; }

        /* Center Target Reticle / Level Indicator */
        .crosshair-container {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 240px; height: 240px;
            z-index: 5;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .reticle-ring {
            position: absolute;
            width: 100%; height: 100%;
            border: 2px dashed rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transition: all 0.2s ease;
        }

        .reticle-center {
            width: 16px; height: 16px;
            border: 2px solid #ef4444;
            border-radius: 50%;
            background: rgba(239, 68, 68, 0.3);
            transition: all 0.2s;
        }

        /* Floating Satellite Marker in AR Space */
        .sat-target-marker {
            position: absolute;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: opacity 0.2s ease;
            z-index: 6;
        }

        .sat-icon-box {
            width: 48px; height: 48px;
            background: rgba(239, 68, 68, 0.2);
            border: 2px solid #ef4444;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ef4444;
            font-size: 20px;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.5);
            animation: pulseRed 1.5s infinite;
        }

        .sat-tag {
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #ef4444;
            color: #fff;
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 10px;
            margin-top: 5px;
            white-space: nowrap;
        }

        /* LOCKED STATE */
        .is-aligned .reticle-ring {
            border: 2px solid #4ade80;
            box-shadow: 0 0 25px rgba(74, 222, 128, 0.6);
        }
        .is-aligned .reticle-center {
            background: #4ade80;
            border-color: #4ade80;
        }
        .is-aligned .sat-icon-box {
            background: rgba(74, 222, 128, 0.3);
            border-color: #4ade80;
            color: #4ade80;
            box-shadow: 0 0 25px rgba(74, 222, 128, 0.8);
            animation: pulseGreen 1s infinite;
        }
        .is-aligned .sat-tag {
            border-color: #4ade80;
            color: #4ade80;
        }

        @keyframes pulseRed {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        @keyframes pulseGreen {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        /* Bottom Control Panel */
        .hud-bottom {
            position: fixed;
            bottom: 20px; left: 0; right: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 0 15px;
        }

        .status-pill {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: #cbd5e1;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-pill.locked {
            border-color: #4ade80;
            color: #4ade80;
            background: rgba(20, 83, 45, 0.85);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            pointer-events: auto;
        }

        .btn {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 10px 16px;
            border-radius: 25px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn:active { transform: scale(0.95); }

        /* Start Overlay */
        .start-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #090d16;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 25px;
            text-align: center;
        }

        .start-screen i { font-size: 50px; color: #38bdf8; margin-bottom: 15px; }
        .start-screen h1 { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
        .start-screen p { font-size: 12px; color: #94a3b8; max-width: 280px; margin-bottom: 25px; line-height: 1.5; }
        .btn-start {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            border: none;
            color: #fff;
            padding: 12px 30px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4);
        }

        /* Selector Modal */
        .select-modal {
            position: fixed;
            bottom: -100%;
            left: 0; right: 0;
            background: #0f172a;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 20px;
            z-index: 50;
            transition: bottom 0.3s ease;
            max-height: 50vh;
            overflow-y: auto;
        }
        .select-modal.open { bottom: 0; }
        .select-modal h3 { font-size: 14px; margin-bottom: 12px; color: #94a3b8; text-transform: uppercase; }
        .sat-item {
            padding: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            justify-content: space-between;
            font-size: 13px;
        }
        .sat-item:active { background: rgba(255,255,255,0.05); }
    </style>
</head>
<body>

    <!-- Camera Background -->
    <video id="cameraVideo" autoplay playsinline muted></video>
    <div class="ar-overlay"></div>

    <!-- Start Overlay -->
    <div class="start-screen" id="startScreen">
        <i class="fas fa-satellite-dish"></i>
        <h1>AR Satellite Finder Pro</h1>
        <p>Real-time AR tracking system to align your dish antenna accurately using camera & motion sensors.</p>
        <button class="btn-start" id="startBtn">Launch AR Finder</button>
    </div>

    <!-- Top HUD Data -->
    <div class="hud-header">
        <div class="hud-card">
            <div class="title">AZIMUTH (DIR)</div>
            <div class="val" id="hudAz">--°</div>
            <div class="title" style="margin-top:2px;" id="hudTargetAz">Target: --°</div>
        </div>
        <div class="hud-card">
            <div class="title">ELEVATION (TILT)</div>
            <div class="val" id="hudEl">--°</div>
            <div class="title" style="margin-top:2px;" id="hudTargetEl">Target: --°</div>
        </div>
        <div class="hud-card">
            <div class="title">GPS STATUS</div>
            <div class="val" id="hudGps" style="font-size: 11px; color:#4ade80;">Acquiring...</div>
        </div>
    </div>

    <!-- AR Target Marker -->
    <div class="sat-target-marker" id="satMarker">
        <div class="sat-icon-box"><i class="fas fa-satellite"></i></div>
        <div class="sat-tag" id="satTag">SES 8 (95.0°E)</div>
    </div>

    <!-- Center Reticle Indicator -->
    <div class="crosshair-container" id="crosshair">
        <div class="reticle-ring"></div>
        <div class="reticle-center"></div>
    </div>

    <!-- Bottom HUD Controls -->
    <div class="hud-bottom">
        <div class="status-pill" id="statusPill">
            <i class="fas fa-compass fa-spin"></i>
            <span id="statusText">Point phone towards sky...</span>
        </div>
        <div class="btn-group">
            <button class="btn" id="satSelectBtn"><i class="fas fa-list"></i> Select Sat</button>
            <button class="btn" id="reGpsBtn"><i class="fas fa-location-crosshairs"></i> GPS Sync</button>
        </div>
    </div>

    <!-- Satellite Selection List Modal -->
    <div class="select-modal" id="satModal">
        <h3>Choose Target Satellite</h3>
        <div id="satList"></div>
    </div>

    <script>
        const SATELLITES = [
            { name: 'SES 8 / NNS 6 (Dish TV)', long: 95.0 },
            { name: 'GSAT 15 (DD Free Dish)', long: 93.5 },
            { name: 'GSAT 10 / 17 (Tata Play)', long: 83.0 },
            { name: 'ST 2 (Videocon d2h)', long: 88.0 },
            { name: 'Intelsat 20 (Airtel Digital TV)', long: 68.5 },
            { name: 'Paksat 1R', long: 38.0 },
            { name: 'Badr 4/5/6/7', long: 26.0 },
            { name: 'Hotbird 13B/13C', long: 13.0 }
        ];

        let state = {
            lat: 28.6139,
            lon: 77.2090,
            selectedSat: SATELLITES[0],
            targetAzimuth: 0,
            targetElevation: 0,
            phoneAzimuth: 0,
            phoneElevation: 0,
            isLocked: false
        };

        const video = document.getElementById('cameraVideo');
        const startScreen = document.getElementById('startScreen');
        const startBtn = document.getElementById('startBtn');
        const satMarker = document.getElementById('satMarker');
        const crosshair = document.getElementById('crosshair');
        const statusPill = document.getElementById('statusPill');
        const statusText = document.getElementById('statusText');

        // Calculate Azimuth & Elevation
        function calculateAngles() {
            const latRad = state.lat * Math.PI / 180;
            const lonRad = state.lon * Math.PI / 180;
            const satLonRad = state.selectedSat.long * Math.PI / 180;

            const dLon = satLonRad - lonRad;

            // Azimuth Calculation
            const y = Math.sin(dLon);
            const x = Math.cos(latRad) * Math.tan(0) - Math.sin(latRad) * Math.cos(dLon); 
            let az = Math.atan2(y, -x) * 180 / Math.PI;
            if (az < 0) az += 360;

            // Elevation Calculation
            const R = 6378; // Earth Radius (km)
            const H = 35786; // Geostationary Orbit Height (km)
            const r = R + H;
            const cosG = Math.cos(latRad) * Math.cos(dLon);
            const el = Math.atan((Math.cos(cosG) - (R / r)) / Math.sin(Math.acos(cosG))) * 180 / Math.PI;

            state.targetAzimuth = az;
            state.targetElevation = el;

            document.getElementById('hudTargetAz').textContent = `Target: ${az.toFixed(1)}°`;
            document.getElementById('hudTargetEl').textContent = `Target: ${el.toFixed(1)}°`;
            document.getElementById('satTag').textContent = `${state.selectedSat.name}`;
        }

        // Start Camera Feed
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "environment" } },
                    audio: false
                });
                video.srcObject = stream;
            } catch (e) {
                // Fallback to default user camera if environment fails
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                video.srcObject = stream;
            }
        }

        // Fetch Live Location (GPS)
        function initGPS() {
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition(pos => {
                    state.lat = pos.coords.latitude;
                    state.lon = pos.coords.longitude;
                    document.getElementById('hudGps').textContent = `${state.lat.toFixed(2)}°, ${state.lon.toFixed(2)}°`;
                    calculateAngles();
                }, err => {
                    document.getElementById('hudGps').textContent = "Default GPS";
                }, { enableHighAccuracy: true });
            }
        }

        // Handle Orientation / Motion Sensors
        function handleOrientation(e) {
            let heading = e.alpha;
            if (e.webkitCompassHeading) {
                heading = e.webkitCompassHeading; // iOS Fix
            }

            // Normalize Heading
            state.phoneAzimuth = heading || 0;
            state.phoneElevation = e.beta || 0; // Device Tilt Pitch

            document.getElementById('hudAz').textContent = `${state.phoneAzimuth.toFixed(1)}°`;
            document.getElementById('hudEl').textContent = `${state.phoneElevation.toFixed(1)}°`;

            renderAR();
        }

        // Position Satellite Target in Screen Canvas Space (AR Tracking Projection)
        function renderAR() {
            const azDiff = state.targetAzimuth - state.phoneAzimuth;
            const elDiff = state.targetElevation - state.phoneElevation;

            // Map Angular Difference to Screen Pixels
            const pxPerDeg = window.innerWidth / 60; // 60 degree FOV scale
            const xPos = (window.innerWidth / 2) + (azDiff * pxPerDeg);
            const yPos = (window.innerHeight / 2) - (elDiff * pxPerDeg);

            satMarker.style.left = `${xPos}px`;
            satMarker.style.top = `${yPos}px`;

            // Lock Condition check (Within +-3 degree threshold)
            if (Math.abs(azDiff) < 3.5 && Math.abs(elDiff) < 3.5) {
                if (!state.isLocked) {
                    state.isLocked = true;
                    crosshair.classList.add('is-aligned');
                    satMarker.classList.add('is-aligned');
                    statusPill.classList.add('locked');
                    statusText.textContent = "SATELLITE LOCKED! POINT DISH HERE";
                    if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
                }
            } else {
                if (state.isLocked) {
                    state.isLocked = false;
                    crosshair.classList.remove('is-aligned');
                    satMarker.classList.remove('is-aligned');
                    statusPill.classList.remove('locked');
                    statusText.textContent = "Align Camera with Satellite Target...";
                }
            }
        }

        // Render Satellite Modal Options
        function renderSatList() {
            const container = document.getElementById('satList');
            container.innerHTML = '';
            SATELLITES.forEach(sat => {
                const item = document.createElement('div');
                item.className = 'sat-item';
                item.innerHTML = `<span>${sat.name}</span><strong>${sat.long}°E</strong>`;
                item.onclick = () => {
                    state.selectedSat = sat;
                    calculateAngles();
                    document.getElementById('satModal').classList.remove('open');
                };
                container.appendChild(item);
            });
        }

        // Initialize Launch Button Event
        startBtn.onclick = async () => {
            startScreen.style.display = 'none';
            await initCamera();
            initGPS();
            calculateAngles();

            if (window.DeviceOrientationEvent) {
                if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                    DeviceOrientationEvent.requestPermission().then(permissionState => {
                        if (permissionState === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation);
                        }
                    });
                } else {
                    window.addEventListener('deviceorientation', handleOrientation);
                }
            }
        };

        document.getElementById('satSelectBtn').onclick = () => {
            renderSatList();
            document.getElementById('satModal').classList.toggle('open');
        };

        document.getElementById('reGpsBtn').onclick = () => {
            initGPS();
        };
    </script>
</body>
</html>
