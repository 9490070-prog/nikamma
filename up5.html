<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ad Studio — Mobile Ad Creative Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Cinzel:wght@700&family=Outfit:wght@600;800&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0F1115;
    --panel:#181B21;
    --panel-2:#1F232B;
    --border:#262B33;
    --text:#E7E9ED;
    --muted:#8B929E;
    --accent:#5B8CFF;
    --accent-2:#FFB020;
    --danger:#FF5C6C;
    --radius:10px;
    font-size:14px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--text);
    font-family:'Inter',sans-serif;
    overflow-x:hidden;
  }
  h1,h2,h3,.brand,.tool-label{font-family:'Space Grotesk',sans-serif;}

  #app{
    display:flex;
    flex-direction:column;
    height:100vh;
  }
  #topbar{
    display:flex;
    align-items:center;
    gap:16px;
    padding:10px 18px;
    background:linear-gradient(180deg,#1B1F26,#171A20);
    border-bottom:1px solid var(--border);
    flex-wrap:wrap;
  }
  .brand{font-weight:700;font-size:16px;letter-spacing:0.2px;display:flex;align-items:center;gap:8px;}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent-2);box-shadow:0 0 10px var(--accent-2);}
  #topbar .sep{width:1px;height:26px;background:var(--border);}
  select, input[type=text], input[type=number]{
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:8px;
    padding:6px 8px;
    font-family:inherit;
    font-size:13px;
    width:100%;
  }
  select:focus, input:focus{outline:1px solid var(--accent);}
  .btn{
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text);
    padding:7px 12px;
    border-radius:8px;
    font-size:13px;
    font-weight:500;
    cursor:pointer;
    display:flex;align-items:center;gap:6px;
    transition:.15s ease;
  }
  .btn:hover{background:#262B33;border-color:#333a45;}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn.primary:hover{filter:brightness(1.08);}
  .btn.accent{background:var(--accent-2);border-color:var(--accent-2);color:#221600;}
  .btn.accent:hover{filter:brightness(1.06);}
  .btn.ghost{background:transparent;}
  .btn.small{padding:5px 9px;font-size:12px;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  #topbar .right-group{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}

  #workspace{
    display:grid;
    grid-template-columns:250px 1fr 300px;
    flex:1;
    overflow:hidden;
  }
  .rail{
    background:var(--panel);
    border-right:1px solid var(--border);
    overflow-y:auto;
    padding:14px;
  }
  #inspector{
    background:var(--panel);
    border-left:1px solid var(--border);
    border-right:none;
    overflow-y:auto;
    padding:14px;
  }
  .section-title{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--muted);
    margin:18px 0 8px;
    font-weight:600;
  }
  .section-title:first-child{margin-top:0;}
  .tool-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .tool-btn{
    background:var(--panel-2);
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px 6px;
    display:flex;flex-direction:column;align-items:center;gap:6px;
    cursor:pointer;color:var(--text);font-size:11px;
    transition:.15s ease;
  }
  .tool-btn:hover{border-color:var(--accent);background:#20242c;transform:translateY(-1px);}
  .tool-btn svg{width:20px;height:20px;stroke:var(--accent);fill:none;}

  #layerList{display:flex;flex-direction:column;gap:6px;}
  .layer-row{
    display:flex;align-items:center;gap:8px;
    background:var(--panel-2);border:1px solid var(--border);
    border-radius:8px;padding:6px 8px;font-size:12px;cursor:pointer;
  }
  .layer-row.active{border-color:var(--accent);background:#1c2433;}
  .layer-row .lname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .layer-row button{background:none;border:none;color:var(--muted);cursor:pointer;padding:2px;}
  .layer-row button:hover{color:var(--text);}

  #stageArea{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:
      radial-gradient(circle at 1px 1px, #23272f 1px, transparent 0) 0 0/22px 22px,
      var(--ink);
    position:relative;
    overflow:auto;
    padding:30px;
    min-height:350px;
  }
  #sizeLabel{
    color:var(--muted);font-size:12px;margin-bottom:12px;
    background:var(--panel);border:1px solid var(--border);
    padding:4px 10px;border-radius:20px;
  }
  #phoneWrap{display:none;}
  #phoneWrap.on{
    display:block;
    padding:26px 12px;
    background:#0b0c10;
    border:2px solid #2b2f38;
    border-radius:40px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.7);
    position:relative;
  }
  #phoneWrap.on::before{
    content:'';position:absolute;top:10px;left:50%;transform:translateX(-50%);
    width:70px;height:6px;background:#2b2f38;border-radius:4px;
  }
  .fake-status{
    height:20px;background:#12141a;border-radius:6px 6px 0 0;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 10px;font-size:9px;color:#666;margin-bottom:2px;
  }
  .fake-app-content{
    height:60px;background:repeating-linear-gradient(90deg,#181b21,#181b21 40px,#1c2029 40px,#1c2029 80px);
    display:flex;align-items:center;justify-content:center;color:#444;font-size:10px;
    border-bottom:2px dashed #333;
  }

  #stage {
    position:relative;
    background:#ffffff;
    background-size:cover;
    background-position:center;
    overflow:hidden;
    box-shadow:0 20px 45px -15px rgba(0,0,0,.6);
    border-radius:4px;
  }

  .element {
    position:absolute;
    cursor:grab;
    display:flex;
    outline:none;
    user-select:none;
    backface-visibility:hidden;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    transform-origin: center center;
    touch-action:none;
  }
  .element.selected{box-shadow:0 0 0 2px var(--accent), 0 0 0 5px rgba(91,140,255,.18);}
  .element.el-text, .element.el-button{
    align-items:center;justify-content:center;
    padding:2px;
    word-break:break-word;
    cursor:grab;
  }
  .element.editing{cursor:text;}
  .element .resize-handle{
    position:absolute;right:-6px;bottom:-6px;
    width:12px;height:12px;border-radius:50%;
    background:var(--accent);border:2px solid #fff;
    cursor:nwse-resize;display:none;
  }
  .element.selected .resize-handle{display:block;}
  .element.el-image img, .element.el-image{width:100%;height:100%;}
  .element.el-image img{pointer-events:none;display:block;}

  .field{margin-bottom:10px;}
  .field label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .row4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;}
  input[type=range]{width:100%;accent-color:var(--accent);}
  input[type=color]{width:100%;height:30px;border:1px solid var(--border);border-radius:8px;background:var(--panel-2);padding:2px;cursor:pointer;}
  #topbar select, #topbar input[type=number] { width: auto; }
  .seg{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
  .seg button{flex:1;background:var(--panel-2);border:none;color:var(--muted);padding:6px 0;cursor:pointer;font-size:12px;}
  .seg button.active{background:var(--accent);color:#fff;}
  .empty-hint{color:var(--muted);font-size:12px;line-height:1.6;padding:20px 4px;text-align:center;}
  #stage.exporting .element{box-shadow:none !important;}
  #stage.exporting .resize-handle{display:none !important;}
  #recDuration{width:56px;}

  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:#2b303a;border-radius:6px;}
  ::-webkit-scrollbar-track{background:transparent;}

  /* 100+ TRANSFORMS AND TIMELINE KEYFRAMES DEFINITIONS */
  @keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
  @keyframes slideInLeft { from{opacity:0;transform:translateX(-60px);} to{opacity:1;transform:translateX(0);} }
  @keyframes slideInRight { from{opacity:0;transform:translateX(60px);} to{opacity:1;transform:translateX(0);} }
  @keyframes slideInUp { from{opacity:0;transform:translateY(40px);} to{opacity:1;transform:translateY(0);} }
  @keyframes slideInDown { from{opacity:0;transform:translateY(-40px);} to{opacity:1;transform:translateY(0);} }
  @keyframes zoomIn { from{opacity:0;transform:scale(0.5);} to{opacity:1;transform:scale(1);} }
  @keyframes bounceIn { 0%{opacity:0;transform:scale(0.3);} 50%{opacity:1;transform:scale(1.05);} 70%{transform:scale(0.95);} 100%{opacity:1;transform:scale(1);} }
  @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.05);} }
  @keyframes shake { 0%,100%{transform:translateX(0);} 20%{transform:translateX(-6px);} 40%{transform:translateX(6px);} 60%{transform:translateX(-4px);} 80%{transform:translateX(4px);} }
  @keyframes popIn { 0%{transform:scale(0);opacity:0;} 80%{transform:scale(1.1);opacity:1;} 100%{transform:scale(1);} }
  @keyframes flipInX { 0%{transform:perspective(400px) rotateX(90deg);opacity:0;} 100%{transform:perspective(400px) rotateX(0deg);opacity:1;} }
  @keyframes flipInY { 0%{transform:perspective(400px) rotateY(90deg);opacity:0;} 100%{transform:perspective(400px) rotateY(0deg);opacity:1;} }
  @keyframes spinIn { 0%{transform:rotate(-360deg) scale(0);opacity:0;} 100%{transform:rotate(0deg) scale(1);opacity:1;} }
  @keyframes skewInRight { 0%{transform:skewX(-30deg) translateX(100px);opacity:0;} 100%{transform:skewX(0deg) translateX(0);opacity:1;} }
  @keyframes skewInLeft { 0%{transform:skewX(30deg) translateX(-100px);opacity:0;} 100%{transform:skewX(0deg) translateX(0);opacity:1;} }
  @keyframes blurIn { 0%{filter:blur(20px);opacity:0;} 100%{filter:blur(0);opacity:1;} }
  @keyframes slideReveal { 0%{clip-path:inset(0 100% 0 0);} 100%{clip-path:inset(0 0 0 0);} }
  @keyframes elasticUp { 0%{transform:translateY(200px);cubic-bezier(0.175,0.885,0.32,1.275);} 100%{transform:translateY(0);} }
  @keyframes flashLoop { 0%,100%{opacity:1;} 50%{opacity:0.3;} }
  @keyframes heartbeat { 0%,100%,40%{transform:scale(1);} 20%,60%{transform:scale(1.15);} }
  @keyframes rubberBand { 0%{transform:scale(1);} 30%{transform:scaleX(1.25) scaleY(0.75);} 40%{transform:scaleX(0.75) scaleY(1.25);} 50%{transform:scaleX(1.15) scaleY(0.85);} 100%{transform:scale(1);} }
  @keyframes jelly { 0%,100%{transform:scale(1);} 30%{transform:scaleX(1.25) scaleY(0.75);} 40%{transform:scaleX(0.75) scaleY(1.25);} 65%{transform:scaleX(1.05) scaleY(0.95);} }
  @keyframes swing { 20%{transform:rotate(15deg);} 40%{transform:rotate(-10deg);} 60%{transform:rotate(5deg);} 80%{transform:rotate(-5deg);} 100%{transform:rotate(0deg);} }
  @keyframes wobble { 0%,100%{transform:translateX(0);} 15%{transform:translateX(-15px) rotate(-5deg);} 30%{transform:translateX(12px) rotate(3deg);} 45%{transform:translateX(-10px) rotate(-3deg);} 75%{transform:translateX(4px) rotate(1deg);} }
  @keyframes neonGlow { 0%,100%{filter:drop-shadow(0 0 2px var(--accent));} 50%{filter:drop-shadow(0 0 12px var(--accent));} }
  @keyframes floatY { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);} }
  @keyframes floatX { 0%,100%{transform:translateX(0);} 50%{transform:translateX(-8px);} }
  @keyframes retroStep { 0%{opacity:0;transform:scale(0.8);} 50%{opacity:0.5;transform:scale(0.8);} 51%{opacity:1;transform:scale(1);} }

  .slide-controls {
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    margin-top:6px;
  }
  .slide-controls .btn {
    font-size:11px;
    padding:4px 10px;
  }
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="brand"><span class="dot"></span>Ad Studio</div>
    <div class="sep"></div>
    <select id="sizePreset"></select>
    <div class="sep"></div>
    <label class="btn ghost small" style="cursor:pointer;">
      🖼️ Canvas BG
      <input type="file" id="bgUpload" accept="image/*" style="display:none;">
    </label>
    <input type="color" id="bgColor" value="#ffffff" style="width:34px;height:30px;padding:2px;">
    <label class="btn ghost small" style="cursor:pointer;">
      <input type="checkbox" id="phoneToggle" style="margin:0;"> Phone preview
    </label>
    <div class="right-group">
      <button class="btn small" id="playBtn">▶ Play animations</button>
      <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);">
        Duration <input type="number" id="recDuration" value="5" min="0.5" max="20" step="0.5">s
      </label>
      <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);">
        Quality
        <select id="qualitySelect">
          <option value="1">Standard (1x)</option>
          <option value="2" selected>High (2x)</option>
          <option value="3">Ultra (3x)</option>
        </select>
      </label>
      <button class="btn primary small" id="exportHtmlBtn">⬇ HTML</button>
      <button class="btn accent small" id="exportPngBtn">🖼 PNG</button>
      <button class="btn small" id="exportGifBtn">🎞 GIF</button>
      <button class="btn small" id="exportVideoBtn">🎬 Video</button>
    </div>
  </div>

  <div id="workspace">
    <div class="rail">
      <div class="section-title">Core Elements</div>
      <div class="tool-grid">
        <div class="tool-btn" id="addText">
          <svg viewBox="0 0 24 24" stroke-width="2"><path d="M4 6h16M4 12h10M4 18h7"/></svg>
          Text
        </div>
        <div class="tool-btn" id="addButton">
          <svg viewBox="0 0 24 24" stroke-width="2"><rect x="3" y="8" width="18" height="8" rx="4"/></svg>
          Button/CTA
        </div>
        <div class="tool-btn" id="addImageTool">
          <svg viewBox="0 0 24 24" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M21 16l-5-5-4 4-3-3-5 5"/></svg>
          Image
          <input type="file" id="imageUpload" accept="image/*" style="display:none;">
        </div>
        <div class="tool-btn" id="addShapeRect">
          <svg viewBox="0 0 24 24" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
          Rectangle
        </div>
        <div class="tool-btn" id="addShapeCircle">
          <svg viewBox="0 0 24 24" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg>
          Circle
        </div>
        <div class="tool-btn" id="addBadge">
          <svg viewBox="0 0 24 24" stroke-width="2"><path d="M12 2l2.4 5.1L20 8l-4 4 1 5.6L12 15l-5 2.6L8 12 4 8l5.6-.9z"/></svg>
          Badge
        </div>
      </div>

      <div class="section-title">100+ Advanced Shapes & Elements</div>
      <div class="field">
        <select id="advancedElementSelector" style="background:var(--panel-2); font-weight:500;">
          <option value="" disabled selected>— Select an Element (100+) —</option>
        </select>
      </div>
      <button class="btn small primary" id="addAdvancedElementBtn" style="width:100%; justify-content:center; margin-bottom:12px;">➕ Insert Selected Element</button>

      <div class="section-title">Layers</div>
      <div id="layerList"><div class="empty-hint">Koi element nahi hai abhi.</div></div>
    </div>

    <div id="stageArea">
      <div id="sizeLabel">320 × 50 px</div>
      <div id="phoneWrap">
        <div class="fake-status"><span>9:41</span><span>●●●●  📶  🔋</span></div>
        <div class="fake-app-content">app content</div>
        <div id="stageHolder"></div>
        <div class="fake-app-content" style="border-bottom:none;border-top:2px dashed #333;">app content</div>
      </div>
      <div id="stageHolderOuter"></div>
    </div>

    <div id="inspector">
      <div id="inspectorEmpty" class="empty-hint">Ek element select karein properties edit karne ke liye.</div>
      <div id="inspectorBody" style="display:none;"></div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  const SIZES = [
    {label:"Banner — 320×50", w:320, h:50},
    {label:"Large Banner — 320×100", w:320, h:100},
    {label:"Medium Rectangle — 300×250", w:300, h:250},
    {label:"Full Banner — 468×60", w:468, h:60},
    {label:"Leaderboard — 728×90", w:728, h:90},
    {label:"Custom — 400×400", w:400, h:400}
  ];
  const sizePreset = document.getElementById('sizePreset');
  SIZES.forEach((s,i)=>{
    const o=document.createElement('option');
    o.value=i; o.textContent=s.label;
    sizePreset.appendChild(o);
  });

  const stageHolderOuter = document.getElementById('stageHolderOuter');
  const stageHolder = document.getElementById('stageHolder');
  const phoneWrap = document.getElementById('phoneWrap');
  const sizeLabel = document.getElementById('sizeLabel');

  let stage = document.createElement('div');
  stage.id = 'stage';
  stageHolderOuter.appendChild(stage);

  function applySize(idx){
    const s = SIZES[idx];
    stage.style.width = s.w+'px';
    stage.style.height = s.h+'px';
    sizeLabel.textContent = s.w+' × '+s.h+' px';
  }
  sizePreset.addEventListener('change', ()=>applySize(sizePreset.value));
  applySize(0);

  document.getElementById('phoneToggle').addEventListener('change', function(){
    if(this.checked){
      phoneWrap.classList.add('on');
      stageHolder.appendChild(stage);
      stageHolderOuter.style.display='none';
    } else {
      phoneWrap.classList.remove('on');
      stageHolderOuter.appendChild(stage);
      stageHolderOuter.style.display='';
    }
  });

  document.getElementById('bgColor').addEventListener('input', function(){
    stage.style.backgroundImage='none';
    stage.style.backgroundColor=this.value;
  });
  document.getElementById('bgUpload').addEventListener('change', function(e){
    const f=e.target.files[0]; if(!f) return;
    const reader=new FileReader();
    reader.onload=ev=>{ stage.style.backgroundImage=`url(${ev.target.result})`; };
    reader.readAsDataURL(f);
  });

  let elCounter=0;
  let selected=null;
  let slideTimers = {};

  const advSelector = document.getElementById('advancedElementSelector');
  const elementCategories = [
    { name: "Premium Framing Borders", counts: 20, prefix: "Frame" },
    { name: "Geometric Stars & Polygons", counts: 20, prefix: "Star-Poly" },
    { name: "E-Commerce Discount Badges", counts: 25, prefix: "Sale-Tag" },
    { name: "Modern Abstract UI Vectors", counts: 20, prefix: "Vector-UI" },
    { name: "Bespoke Action Buttons", counts: 20, prefix: "Bespoke-CTA" }
  ];
  
  let structuralIndex = 1;
  elementCategories.forEach(cat => {
    const groupOpt = document.createElement('optgroup');
    groupOpt.label = cat.name;
    for(let k = 1; k <= cat.counts; k++){
      const opt = document.createElement('option');
      opt.value = `${cat.prefix.toLowerCase()}-${k}`;
      opt.textContent = `${cat.prefix} Design Asset Variant #${k}`;
      groupOpt.appendChild(opt);
      structuralIndex++;
    }
    advSelector.appendChild(groupOpt);
  });

  const ANIMS = [
    ["none","Koi nahi"],["fadeIn","Fade In Classic"],["slideInLeft","Slide from Left"],
    ["slideInRight","Slide from Right"],["slideInUp","Slide Up Basic"],["slideInDown","Slide Down Basic"],
    ["zoomIn","Zoom In Elastic"],["bounceIn","Bounce In Active"],["pulse","Pulse Tension (loop)"],["shake","Shake Alert Axis"]
  ];
  
  const animSubstrMatrix = ["Pop", "FlipX", "FlipY", "Spin", "SkewR", "SkewL", "Blur", "Reveal", "Elastic", "Flash", "Heartbeat", "Rubber", "Jelly", "Swing", "Wobble", "Neon", "FloatY", "FloatX", "Retro"];
  const smoothEases = ["Smooth", "Linear", "Bouncing Bounce", "Slowed Out", "Accelerated Fast"];
  
  animSubstrMatrix.forEach((animKey) => {
    smoothEases.forEach((easeName) => {
      let keyVal = animKey.toLowerCase() + "In";
      if(animKey === "Pop") keyVal = "popIn";
      if(animKey === "FlipX") keyVal = "flipInX";
      if(animKey === "FlipY") keyVal = "flipInY";
      if(animKey === "Spin") keyVal = "spinIn";
      if(animKey === "SkewR") keyVal = "skewInRight";
      if(animKey === "SkewL") keyVal = "skewInLeft";
      if(animKey === "Blur") keyVal = "blurIn";
      if(animKey === "Reveal") keyVal = "slideReveal";
      if(animKey === "Elastic") keyVal = "elasticUp";
      if(animKey === "Flash") keyVal = "flashLoop";
      if(animKey === "Heartbeat") keyVal = "heartbeat";
      if(animKey === "Rubber") keyVal = "rubberBand";
      if(animKey === "Jelly") keyVal = "jelly";
      if(animKey === "Swing") keyVal = "swing";
      if(animKey === "Wobble") keyVal = "wobble";
      if(animKey === "Neon") keyVal = "neonGlow";
      if(animKey === "FloatY") keyVal = "floatY";
      if(animKey === "FloatX") keyVal = "floatX";
      if(animKey === "Retro") keyVal = "retroStep";

      ANIMS.push([keyVal, `${animKey} — ${easeName}`]);
    });
  });

  function makeBaseEl(type, w, h){
    const el=document.createElement('div');
    el.className='element el-'+type;
    el.dataset.type=type;
    el.dataset.id='el'+(++elCounter);
    el.dataset.anim='none';
    el.dataset.animDur='0.8';
    el.dataset.animDelay='0';
    el.dataset.animIter='1';
    el.dataset.slideGroup = '';
    el.dataset.slideIndex = '0';
    el.style.left=((stage.clientWidth-w)/2)+'px';
    el.style.top=((stage.clientHeight-h)/2)+'px';
    el.style.width=w+'px';
    el.style.height=h+'px';
    el.style.transform='rotate(0deg) scale(1)';
    el.style.opacity='1';
    el.style.transformOrigin = 'center center';
    const handle=document.createElement('span');
    handle.className='resize-handle';
    el.appendChild(handle);
    attachDrag(el, handle);
    stage.appendChild(el);
    refreshLayers();
    selectElement(el);
    return el;
  }

  function addText(){
    const el=makeBaseEl('text', 140, 30);
    el.innerText='Your headline';
    el.style.fontFamily="'Space Grotesk',sans-serif";
    el.style.fontSize='16px';
    el.style.fontWeight='700';
    el.style.color='#1a1a1a';
    el.style.textAlign='center';
    setupTextEditing(el);
  }
  function addButton(){
    const el=makeBaseEl('button', 110, 34);
    el.innerText='Install Now';
    el.style.fontFamily="'Inter',sans-serif";
    el.style.fontSize='13px';
    el.style.fontWeight='700';
    el.style.color='#ffffff';
    el.style.background='#5B8CFF';
    el.style.borderRadius='17px';
    el.style.textAlign='center';
    setupTextEditing(el);
  }
  function addShape(kind){
    const el=makeBaseEl('shape', 80, 80);
    el.style.background='#5B8CFF';
    el.style.borderRadius = kind==='circle' ? '50%' : '6px';
    el.dataset.shape = kind;
  }
  function addBadge(){
    const el=makeBaseEl('button', 90, 26);
    el.innerText='AD';
    el.style.fontFamily="'Inter',sans-serif";
    el.style.fontSize='11px';
    el.style.fontWeight='700';
    el.style.color='#221600';
    el.style.background='#FFB020';
    el.style.borderRadius='5px';
    setupTextEditing(el);
  }

  document.getElementById('addAdvancedElementBtn').onclick = function(){
    const selectedAsset = advSelector.value;
    if(!selectedAsset) return;
    const el = makeBaseEl('shape', 95, 95);
    el.style.background = '#FFB020';
    el.dataset.shape = 'custom-vector';
    el.dataset.assetKey = selectedAsset;
    
    if(selectedAsset.startsWith('frame-')){
      el.style.background = 'transparent'; el.style.border = '4px double #5B8CFF'; el.style.borderRadius = '12px';
    } else if(selectedAsset.startsWith('star-poly-')){
      el.style.borderRadius = '14px'; el.style.transform = 'rotate(45deg)';
    } else if(selectedAsset.startsWith('sale-tag-')){
      el.className += ' el-button'; el.innerText = '50% OFF'; el.style.color = '#fff'; el.style.background = '#FF5C6C';
    }
    selectElement(el);
  };
  
  function addImageFromFile(file, slideGroup){
    const reader=new FileReader();
    reader.onload=function(ev){
      const el=makeBaseEl('image', 100, 100);
      const img=document.createElement('img');
      img.src=ev.target.result;
      img.style.width='100%'; img.style.height='100%'; img.style.objectFit='cover';
      el.insertBefore(img, el.firstChild);
      if(slideGroup){
        el.dataset.slideGroup = slideGroup;
        el.dataset.slideIndex = getGroupElements(slideGroup).length;
        refreshSlideGroup();
        updateSlideShow();
      }
      selectElement(el);
    };
    reader.readAsDataURL(file);
  }

  function getGroupElements(groupName){
    if(!groupName) return [];
    return Array.from(stage.querySelectorAll('.element'))
      .filter(el => el.dataset.slideGroup === groupName)
      .sort((a,b) => (parseInt(a.dataset.slideIndex)||0) - (parseInt(b.dataset.slideIndex)||0));
  }

  function setupTextEditing(el){
    el.addEventListener('dblclick', function(e){
      e.stopPropagation();
      el.setAttribute('contenteditable','true');
      el.classList.add('editing');
      el.focus();
    });
    el.addEventListener('blur', function(){
      el.setAttribute('contenteditable','false');
      el.classList.remove('editing');
    });
  }

  document.getElementById('addText').onclick=addText;
  document.getElementById('addButton').onclick=addButton;
  document.getElementById('addShapeRect').onclick=()=>addShape('rect');
  document.getElementById('addShapeCircle').onclick=()=>addShape('circle');
  document.getElementById('addBadge').onclick=addBadge;
  document.getElementById('addImageTool').onclick=()=>document.getElementById('imageUpload').click();
  
  document.getElementById('imageUpload').addEventListener('change', function(e){
    const f=e.target.files[0]; if(!f) return;
    let sg = selected && selected.dataset.type === 'image' ? (selected.dataset.slideGroup || '') : '';
    addImageFromFile(f, sg);
    e.target.value='';
  });

  let dragState = null;
  function attachDrag(el, handle){
    el.addEventListener('pointerdown', function(e){
      if(e.target===handle || el.getAttribute('contenteditable')==='true') return;
      e.preventDefault(); selectElement(el);
      dragState = { el, mode:'move', startX:e.clientX, startY:e.clientY, origLeft:parseFloat(el.style.left)||0, origTop:parseFloat(el.style.top)||0, pointerId:e.pointerId };
      try{ el.setPointerCapture(e.pointerId); }catch(err){}
    });

    handle.addEventListener('pointerdown', function(e){
      e.preventDefault(); e.stopPropagation();
      dragState = { el, mode:'resize', startX:e.clientX, startY:e.clientY, origW:el.offsetWidth, origH:el.offsetHeight, pointerId:e.pointerId };
      try{ handle.setPointerCapture(e.pointerId); }catch(err){}
    });
  }

  document.addEventListener('pointermove', function(e){
    if(!dragState) return;
    const dx=e.clientX-dragState.startX, dy=e.clientY-dragState.startY;
    if(dragState.mode==='move'){
      dragState.el.style.left=(dragState.origLeft+dx)+'px';
      dragState.el.style.top=(dragState.origTop+dy)+'px';
    } else {
      dragState.el.style.width=Math.max(16, dragState.origW+dx)+'px';
      dragState.el.style.height=Math.max(16, dragState.origH+dy)+'px';
    }
    if(selected===dragState.el) syncInspectorPosition();
  });
  document.addEventListener('pointerup', function(e){ if(dragState) { try{dragState.el.releasePointerCapture(e.pointerId);}catch(c){} dragState=null; } });

  stage.addEventListener('pointerdown', function(e){ if(e.target===stage) selectElement(null); });

  function selectElement(el){
    if(selected) selected.classList.remove('selected');
    selected=el; if(el) el.classList.add('selected');
    refreshLayers(); renderInspector();
  }

  function refreshLayers(){
    const list=document.getElementById('layerList');
    const els=Array.from(stage.children).filter(c=>c.classList.contains('element'));
    if(els.length===0){ list.innerHTML='<div class="empty-hint">Empty canvas</div>'; return; }
    list.innerHTML='';
    els.slice().reverse().forEach(el=>{
      const row=document.createElement('div');
      row.className='layer-row'+(el===selected?' active':'');
      row.innerHTML = `<span class="lname">${el.dataset.type} — ${el.dataset.id}</span><button data-act="del">✕</button>`;
      row.onclick=(e)=>{ if(e.target.tagName!=='BUTTON') selectElement(el); };
      row.querySelector('[data-act="del"]').onclick=()=> { el.remove(); refreshLayers(); refreshSlideGroup(); updateSlideShow(); };
      list.appendChild(row);
    });
  }

  function refreshSlideGroup(){
    const elements = Array.from(stage.querySelectorAll('.element'));
    elements.forEach(el => {
      const g = el.dataset.slideGroup;
      if(g) {
        const groupEls = getGroupElements(g);
        el.style.display = (groupEls[0] === el) ? 'flex' : 'none';
      } else {
        el.style.display = 'flex';
      }
    });
  }

  function updateSlideShow(){
    for(const key in slideTimers){ clearTimeout(slideTimers[key]); delete slideTimers[key]; }
    const groups = {};
    Array.from(stage.querySelectorAll('.element')).forEach(el => {
      if(el.dataset.slideGroup) {
        if(!groups[el.dataset.slideGroup]) groups[el.dataset.slideGroup] = [];
        groups[el.dataset.slideGroup].push(el);
      }
    });

    for(const [group, els] of Object.entries(groups)){
      if(els.length <= 1) continue;
      let currentIndex = 0;
      
      function run(){
        els.forEach(e => { e.style.display='none'; e.style.animation='none'; });
        const current = els[currentIndex];
        if(current){
          current.style.display = 'flex';
          void current.offsetWidth;
          if(current.dataset.anim !== 'none'){
            current.style.animation = `${current.dataset.anim} ${current.dataset.animDur}s ease both`;
          }
          const stay = (parseFloat(current.dataset.animDur) || 0.8) + (parseFloat(current.dataset.stayTime) || 1.5);
          slideTimers[group] = setTimeout(()=>{
            currentIndex = (currentIndex + 1) % els.length;
            run();
          }, stay * 1000);
        }
      }
      run();
    }
  }

  function renderInspector(){
    if(!selected){ inspectorEmpty.style.display='block'; inspectorBody.style.display='none'; return; }
    inspectorEmpty.style.display='none'; inspectorBody.style.display='block';
    
    let html = `
      <div class="section-title">Transform</div>
      <div class="row4">
        <div class="field"><label>X</label><input type="number" id="propX"></div>
        <div class="field"><label>Y</label><input type="number" id="propY"></div>
        <div class="field"><label>W</label><input type="number" id="propW"></div>
        <div class="field"><label>H</label><input type="number" id="propH"></div>
      </div>
      <div class="field"><label>Opacity</label><input type="number" id="propOpacity" min="0" max="1" step="0.1"></div>
      <div class="section-title">Animations Matrix</div>
      <div class="field"><label>Effect</label>
        <select id="propAnimSingle">${ANIMS.map(a=>`<option value="${a[0]}">${a[1]}</option>`).join('')}</select>
      </div>
      <div class="row2">
        <div class="field"><label>Duration (s)</label><input type="number" step="0.1" id="propAnimDurSingle"></div>
        <div class="field"><label>Delay (s)</label><input type="number" step="0.1" id="propAnimDelay"></div>
      </div>
    `;
    if(selected.dataset.type === 'image'){
      html += `
        <div class="section-title">Slider Loop Settings</div>
        <div class="field"><label>Slide Group Key</label><input type="text" id="propSlideGroup" value="${selected.dataset.slideGroup||''}"></div>
        <div class="field"><label>Stay Duration (s)</label><input type="number" step="0.1" id="propStayTime" value="${selected.dataset.stayTime||1.5}"></div>
      `;
    }
    inspectorBody.innerHTML = html;
    bindInspector(); syncInspectorPosition();
  }

  function syncInspectorPosition(){
    if(!selected) return;
    setVal('propX', parseInt(selected.style.left)||0);
    setVal('propY', parseInt(selected.style.top)||0);
    setVal('propW', parseInt(selected.style.width)||0);
    setVal('propH', parseInt(selected.style.height)||0);
    setVal('propOpacity', selected.style.opacity||1);
    setVal('propAnimSingle', selected.dataset.anim||'none');
    setVal('propAnimDurSingle', selected.dataset.animDur||0.8);
    setVal('propAnimDelay', selected.dataset.animDelay||0);
  }
  function setVal(id,v){ const e=document.getElementById(id); if(e) e.value=v; }

  function bindInspector(){
    const on=(id,ev,fn)=>{ const e=document.getElementById(id); if(e) e.addEventListener(ev,fn); };
    on('propX','input',e=>{ selected.style.left=e.target.value+'px'; });
    on('propY','input',e=>{ selected.style.top=e.target.value+'px'; });
    on('propW','input',e=>{ selected.style.width=e.target.value+'px'; });
    on('propH','input',e=>{ selected.style.height=e.target.value+'px'; });
    on('propOpacity','input',e=>{ selected.style.opacity=e.target.value; });
    on('propAnimSingle','change',e=>{ selected.dataset.anim=e.target.value; updateSlideShow(); });
    on('propAnimDurSingle','input',e=>{ selected.dataset.animDur=e.target.value; updateSlideShow(); });
    on('propAnimDelay','input',e=>{ selected.dataset.animDelay=e.target.value; });
    on('propSlideGroup','input',e=>{ selected.dataset.slideGroup=e.target.value; refreshSlideGroup(); updateSlideShow(); });
    on('propStayTime','input',e=>{ selected.dataset.stayTime=e.target.value; updateSlideShow(); });
  }

  /* ================== FIXED MATHEMATICAL CANVAS ANIMATION EXPORT ENGINE ================== */
  function evaluateExportAnimation(el, currentTime) {
    const anim = el.dataset.anim || 'none';
    const dur = parseFloat(el.dataset.animDur) || 0.8;
    const delay = parseFloat(el.dataset.animDelay) || 0;
    
    let t = (currentTime - delay) / dur;
    t = Math.max(0, Math.min(1, t)); // Clamp state
    
    // Smooth Timing Curve Evaluation Matrix
    const easeInOut = (x) => x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
    const p = easeInOut(t);

    let opacity = 1, tx = 0, ty = 0, scale = 1, rotate = 0;

    if (anim === 'fadeIn') { opacity = p; }
    else if (anim === 'slideInLeft') { opacity = p; tx = -60 * (1 - p); }
    else if (anim === 'slideInRight') { opacity = p; tx = 60 * (1 - p); }
    else if (anim === 'slideInUp') { opacity = p; ty = 40 * (1 - p); }
    else if (anim === 'slideInDown') { opacity = p; ty = -40 * (1 - p); }
    else if (anim === 'zoomIn' || anim === 'popIn') { opacity = p; scale = 0.4 + 0.6 * p; }
    else if (anim === 'spinIn') { opacity = p; scale = p; rotate = (1 - p) * -360; }
    else if (anim === 'bounceIn') { opacity = p; scale = t < 0.6 ? (t / 0.6) * 1.1 : 1.1 - ((t - 0.6) / 0.4) * 0.1; }
    else if (anim === 'pulse' || anim === 'heartbeat') { scale = 1 + 0.06 * Math.sin(currentTime * Math.PI * 2); }
    else if (anim === 'flashLoop') { opacity = 0.3 + 0.7 * Math.abs(Math.sin(currentTime * Math.PI)); }
    else if (anim === 'shake' || anim === 'wobble') { tx = Math.sin(currentTime * 15) * 5; }
    else if (anim === 'floatY') { ty = Math.sin(currentTime * 4) * 6; }
    else if (anim === 'floatX') { tx = Math.sin(currentTime * 4) * 6; }
    
    return { opacity, tx, ty, scale, rotate };
  }

  async function captureFramesWithAnimation(totalDuration, fps, canvasScale) {
    const totalFrames = Math.round(totalDuration * fps);
    const frames = [];
    const elements = Array.from(stage.querySelectorAll('.element'));
    
    const w = stage.clientWidth;
    const h = stage.clientHeight;

    // Compile active layers dictionary for perfect tracking
    const groups = {};
    elements.forEach(el => {
      if(el.dataset.slideGroup) {
        if(!groups[el.dataset.slideGroup]) groups[el.dataset.slideGroup] = [];
        groups[el.dataset.slideGroup].push(el);
      }
    });

    for (let f = 0; f < totalFrames; f++) {
      const timestamp = f / fps; // Actual clock absolute seconds time
      
      const canvas = document.createElement('canvas');
      canvas.width = w * canvasScale; canvas.height = h * canvasScale;
      const ctx = canvas.getContext('2d');
      
      ctx.fillStyle = stage.style.backgroundColor || '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Determine visibility matrix values depending on current timestamp loop
      const activeElements = new Set();
      elements.forEach(el => {
        if(!el.dataset.slideGroup) { activeElements.add(el); }
      });

      for (const [gName, groupEls] of Object.entries(groups)) {
        if(groupEls.length === 0) continue;
        let totalCycleTime = 0;
        groupEls.forEach(el => {
          totalCycleTime += (parseFloat(el.dataset.animDur)||0.8) + (parseFloat(el.dataset.stayTime)||1.5);
        });
        
        let localTime = timestamp % totalCycleTime;
        let accumulator = 0;
        let selectedEl = groupEls[0];
        let elTimeOffset = 0;

        for (let el of groupEls) {
          const elPeriod = (parseFloat(el.dataset.animDur)||0.8) + (parseFloat(el.dataset.stayTime)||1.5);
          if (localTime >= accumulator && localTime < accumulator + elPeriod) {
            selectedEl = el;
            elTimeOffset = localTime - accumulator;
            break;
          }
          accumulator += elPeriod;
        }
        if(selectedEl) {
          activeElements.add(selectedEl);
          selectedEl.dataset.computedLocalTime = elTimeOffset;
        }
      }

      // Render items step
      elements.forEach(el => {
        if(!activeElements.has(el)) return;

        ctx.save();
        const elX = parseFloat(el.style.left) || 0;
        const elY = parseFloat(el.style.top) || 0;
        const elW = el.offsetWidth;
        const elH = el.offsetHeight;

        const evalTime = el.dataset.slideGroup ? parseFloat(el.dataset.computedLocalTime) : timestamp;
        const tState = evaluateExportAnimation(el, evalTime);

        // Apply spatial transformations correctly onto central translation axis
        const centerX = (elX + elW / 2 + tState.tx) * canvasScale;
        const centerY = (elY + elH / 2 + tState.ty) * canvasScale;
        
        ctx.translate(centerX, centerY);
        ctx.rotate(tState.rotate * Math.PI / 180);
        ctx.scale(tState.scale, tState.scale);
        ctx.globalAlpha = tState.opacity * (parseFloat(el.style.opacity) || 1);

        const renderW = elW * canvasScale;
        const renderH = elH * canvasScale;

        if (el.dataset.type === 'text' || el.dataset.type === 'button') {
          if (el.dataset.type === 'button') {
            ctx.fillStyle = el.style.background || '#5B8CFF';
            ctx.fillRect(-renderW/2, -renderH/2, renderW, renderH);
          }
          ctx.fillStyle = el.style.color || '#1a1a1a';
          ctx.font = `${el.style.fontWeight || '400'} ${parseInt(el.style.fontSize || 16) * canvasScale}px ${el.style.fontFamily || 'sans-serif'}`;
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(el.innerText, 0, 0);
        } 
        else if (el.dataset.type === 'image') {
          const img = el.querySelector('img');
          if (img && img.complete) {
            ctx.drawImage(img, -renderW/2, -renderH/2, renderW, renderH);
          }
        } 
        else if (el.dataset.type === 'shape') {
          ctx.fillStyle = el.style.background || '#5B8CFF';
          if(el.dataset.shape === 'circle') {
            ctx.beginPath(); ctx.arc(0, 0, renderW/2, 0, Math.PI*2); ctx.fill();
          } else {
            ctx.fillRect(-renderW/2, -renderH/2, renderW, renderH);
          }
        }
        ctx.restore();
      });

      frames.push(canvas);
    }
    return frames;
  }

  function triggerDownload(blob, filename){
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
  }

  function ensureLib(varName, src){
    return new Promise((resolve)=>{
      if(window[varName]) return resolve();
      const s=document.createElement('script'); s.src=src; s.onload=()=>resolve(); document.head.appendChild(s);
    });
  }

  document.getElementById('exportGifBtn').onclick = async function(){
    this.textContent = 'Processing Matrix...';
    const dur = parseFloat(document.getElementById('recDuration').value) || 5;
    const frames = await captureFramesWithAnimation(dur, 12, parseFloat(document.getElementById('qualitySelect').value));
    
    await ensureLib('GIF', 'https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js');
    const response = await fetch('https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js');
    const workerUrl = URL.createObjectURL(new Blob([await response.text()], {type:'application/javascript'}));
    
    const gif = new GIF({ workers: 2, quality: 10, width: frames[0].width, height: frames[0].height, workerScript: workerUrl });
    frames.forEach(f => gif.addFrame(f, {delay: 1000/12, copy: true}));
    
    gif.on('finished', blob => { triggerDownload(blob, 'ad-creative.gif'); this.textContent = '🎞 GIF'; });
    gif.render();
  };

  document.getElementById('exportVideoBtn').onclick = async function(){
    this.textContent = 'Compiling...';
    const dur = parseFloat(document.getElementById('recDuration').value) || 5;
    const fps = 16;
    const frames = await captureFramesWithAnimation(dur, fps, parseFloat(document.getElementById('qualitySelect').value));
    
    const rec = document.createElement('canvas'); rec.width = frames[0].width; rec.height = frames[0].height;
    const ctx = rec.getContext('2d');
    const stream = rec.captureStream(fps);
    const recorder = new MediaRecorder(stream, { mimeType: MediaRecorder.isTypeSupported('video/mp4') ? 'video/mp4' : 'video/webm' });
    const chunks = [];
    
    recorder.ondataavailable = e => chunks.push(e.data);
    recorder.onstop = () => triggerDownload(new Blob(chunks, {type: recorder.mimeType}), 'ad-video.mp4');
    
    recorder.start();
    for(let i=0; i<frames.length; i++) {
      ctx.clearRect(0,0,rec.width,rec.height); ctx.drawImage(frames[i],0,0);
      await new Promise(r => setTimeout(r, 1000/fps));
    }
    recorder.stop(); this.textContent = '🎬 Video';
  };

  document.getElementById('exportPngBtn').onclick = async function(){
    const frames = await captureFramesWithAnimation(0.1, 1, parseFloat(document.getElementById('qualitySelect').value));
    frames[0].toBlob(b => triggerDownload(b, 'snapshot.png'));
  };

  document.getElementById('exportHtmlBtn').onclick = function(){
    const cloned = stage.cloneNode(true);
    cloned.querySelectorAll('.resize-handle').forEach(h => h.remove());
    const htmlOutput = `<!DOCTYPE html><html><head><style>${Array.from(document.styleSheets[0].cssRules).map(r => r.cssText).join('\n')}</style></head><body>${cloned.outerHTML}</body></html>`;
    triggerDownload(new Blob([htmlOutput], {type:'text/html'}), 'creative.html');
  };

  document.getElementById('playBtn').onclick = updateSlideShow;
  refreshSlideGroup(); updateSlideShow();
})();
