<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ad Studio — Mobile Ad Creative Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0F1115;
    --panel:#181B21;
    --panel-2:#1F232B;
    --border:#262B33;
    --text:#E7E9ED;
    --muted:#8B929E;
    --accent:#5B8CFF;
    --accent-2:#FFB020;
    --danger:#FF5C6C;
    --radius:10px;
    font-size:14px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--text);
    font-family:'Inter',sans-serif;
    overflow-x:hidden;
  }
  h1,h2,h3,.brand,.tool-label{font-family:'Space Grotesk',sans-serif;}

  #app{
    display:flex;
    flex-direction:column;
    height:100vh;
  }
  #topbar{
    display:flex;
    align-items:center;
    gap:16px;
    padding:10px 18px;
    background:linear-gradient(180deg,#1B1F26,#171A20);
    border-bottom:1px solid var(--border);
    flex-wrap:wrap;
  }
  .brand{font-weight:700;font-size:16px;letter-spacing:0.2px;display:flex;align-items:center;gap:8px;}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent-2);box-shadow:0 0 10px var(--accent-2);}
  #topbar .sep{width:1px;height:26px;background:var(--border);}
  select, input[type=text], input[type=number]{
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:8px;
    padding:6px 8px;
    font-family:inherit;
    font-size:13px;
    width:100%;
  }
  select:focus, input:focus{outline:1px solid var(--accent);}
  .btn{
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text);
    padding:7px 12px;
    border-radius:8px;
    font-size:13px;
    font-weight:500;
    cursor:pointer;
    display:flex;align-items:center;gap:6px;
    transition:.15s ease;
  }
  .btn:hover{background:#262B33;border-color:#333a45;}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn.primary:hover{filter:brightness(1.08);}
  .btn.accent{background:var(--accent-2);border-color:var(--accent-2);color:#221600;}
  .btn.accent:hover{filter:brightness(1.06);}
  .btn.ghost{background:transparent;}
  .btn.small{padding:5px 9px;font-size:12px;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  #topbar .right-group{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}

  #workspace{
    display:grid;
    grid-template-columns:220px 1fr 280px;
    flex:1;
    overflow:hidden;
  }
  .rail{
    background:var(--panel);
    border-right:1px solid var(--border);
    overflow-y:auto;
    padding:14px;
  }
  #inspector{
    background:var(--panel);
    border-left:1px solid var(--border);
    border-right:none;
    overflow-y:auto;
    padding:14px;
  }
  .section-title{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--muted);
    margin:18px 0 8px;
    font-weight:600;
  }
  .section-title:first-child{margin-top:0;}
  .tool-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .tool-btn{
    background:var(--panel-2);
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px 6px;
    display:flex;flex-direction:column;align-items:center;gap:6px;
    cursor:pointer;color:var(--text);font-size:11px;
    transition:.15s ease;
  }
  .tool-btn:hover{border-color:var(--accent);background:#20242c;transform:translateY(-1px);}
  .tool-btn svg{width:20px;height:20px;stroke:var(--accent);}

  #layerList{display:flex;flex-direction:column;gap:6px;}
  .layer-row{
    display:flex;align-items:center;gap:8px;
    background:var(--panel-2);border:1px solid var(--border);
    border-radius:8px;padding:6px 8px;font-size:12px;cursor:pointer;
  }
  .layer-row.active{border-color:var(--accent);background:#1c2433;}
  .layer-row .lname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .layer-row button{background:none;border:none;color:var(--muted);cursor:pointer;padding:2px;}
  .layer-row button:hover{color:var(--text);}

  #stageArea{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:
      radial-gradient(circle at 1px 1px, #23272f 1px, transparent 0) 0 0/22px 22px,
      var(--ink);
    position:relative;
    overflow:auto;
    padding:30px;
    min-height:350px;
  }
  #sizeLabel{
    color:var(--muted);font-size:12px;margin-bottom:12px;
    background:var(--panel);border:1px solid var(--border);
    padding:4px 10px;border-radius:20px;
  }
  #phoneWrap{display:none;}
  #phoneWrap.on{
    display:block;
    padding:26px 12px;
    background:#0b0c10;
    border:2px solid #2b2f38;
    border-radius:40px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.7);
    position:relative;
  }
  #phoneWrap.on::before{
    content:'';position:absolute;top:10px;left:50%;transform:translateX(-50%);
    width:70px;height:6px;background:#2b2f38;border-radius:4px;
  }
  .fake-status{
    height:20px;background:#12141a;border-radius:6px 6px 0 0;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 10px;font-size:9px;color:#666;margin-bottom:2px;
  }
  .fake-app-content{
    height:60px;background:repeating-linear-gradient(90deg,#181b21,#181b21 40px,#1c2029 40px,#1c2029 80px);
    display:flex;align-items:center;justify-content:center;color:#444;font-size:10px;
    border-bottom:2px dashed #333;
  }

  #stage {
    position:relative;
    background:#ffffff;
    background-size:cover;
    background-position:center;
    overflow:hidden;
    box-shadow:0 20px 45px -15px rgba(0,0,0,.6);
    border-radius:4px;
  }

  .element {
    position:absolute;
    cursor:grab;
    display:flex;
    outline:none;
    user-select:none;
    backface-visibility:hidden;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    transform-origin: center center;
    touch-action:none;
  }
  .element.el-image img {
    image-rendering:auto;
  }
  .element.selected{box-shadow:0 0 0 2px var(--accent), 0 0 0 5px rgba(91,140,255,.18);}
  .element.el-text, .element.el-button{
    align-items:center;justify-content:center;
    padding:2px;
    word-break:break-word;
    cursor:grab;
  }
  .element.editing{cursor:text;}
  .element .resize-handle{
    position:absolute;right:-6px;bottom:-6px;
    width:12px;height:12px;border-radius:50%;
    background:var(--accent);border:2px solid #fff;
    cursor:nwse-resize;display:none;
  }
  .element.selected .resize-handle{display:block;}
  .element.el-image img, .element.el-image{width:100%;height:100%;}
  .element.el-image img{pointer-events:none;display:block;}
  .element.el-shape{pointer-events:auto;}

  .field{margin-bottom:10px;}
  .field label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;}
  .row4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;}
  input[type=range]{width:100%;accent-color:var(--accent);}
  input[type=color]{width:100%;height:30px;border:1px solid var(--border);border-radius:8px;background:var(--panel-2);padding:2px;cursor:pointer;}
  #topbar select, #topbar input[type=number] { width: auto; }
  .seg{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
  .seg button{flex:1;background:var(--panel-2);border:none;color:var(--muted);padding:6px 0;cursor:pointer;font-size:12px;}
  .seg button.active{background:var(--accent);color:#fff;}
  .empty-hint{color:var(--muted);font-size:12px;line-height:1.6;padding:20px 4px;text-align:center;}
  #stage:empty::after{content:'';}
  #stage.exporting .element{box-shadow:none !important;}
  #stage.exporting .resize-handle{display:none !important;}
  #recDuration{width:56px;}

  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:#2b303a;border-radius:6px;}
  ::-webkit-scrollbar-track{background:transparent;}

  /* ANIMATION KEYFRAMES MATCHED PERFECTLY FOR PREVIEW AND EXPORT */
  @keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
  @keyframes slideInLeft { from{opacity:0;transform:translateX(-60px);} to{opacity:1;transform:translateX(0);} }
  @keyframes slideInRight { from{opacity:0;transform:translateX(60px);} to{opacity:1;transform:translateX(0);} }
  @keyframes slideInUp { from{opacity:0;transform:translateY(40px);} to{opacity:1;transform:translateY(0);} }
  @keyframes slideInDown { from{opacity:0;transform:translateY(-40px);} to{opacity:1;transform:translateY(0);} }
  @keyframes zoomIn { from{opacity:0;transform:scale(0.5);} to{opacity:1;transform:scale(1);} }
  @keyframes bounceIn {
    0%{opacity:0;transform:scale(0.3);}
    50%{opacity:1;transform:scale(1.05);}
    70%{transform:scale(0.95);}
    100%{opacity:1;transform:scale(1);}
  }
  @keyframes pulse {
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.05);}
  }
  @keyframes shake {
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-6px);}
    40%{transform:translateX(6px);}
    60%{transform:translateX(-4px);}
    80%{transform:translateX(4px);}
  }

  .slide-controls {
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    margin-top:6px;
  }
  .slide-controls .btn {
    font-size:11px;
    padding:4px 10px;
  }

  /* Custom Style for Custom Canvas Input Box */
  .custom-size-group {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--muted);
  }
  .custom-size-group input {
    width: 60px !important;
  }

  /* Compression level indicator */
  .compression-indicator {
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    color:var(--muted);
  }
  .compression-indicator select {
    width:auto;
    padding:4px 8px;
    font-size:12px;
  }
  .compression-indicator .badge {
    font-size:10px;
    padding:2px 8px;
    border-radius:12px;
    background:var(--panel-2);
    border:1px solid var(--border);
  }
  .badge.low { border-color:#4CAF50; color:#4CAF50; }
  .badge.normal { border-color:#FFB020; color:#FFB020; }
  .badge.high { border-color:#FF5C6C; color:#FF5C6C; }

  @media(max-width:900px){
    body{overflow:auto;}
    #app{height:auto;min-height:100vh;}
    #topbar{gap:10px;justify-content:center;}
    #topbar .right-group{margin-left:0;justify-content:center;width:100%;margin-top:5px;}
    #workspace{
      grid-template-columns:1fr;
      height:auto;
      overflow:visible;
    }
    .rail{border-right:none;border-bottom:1px solid var(--border);}
    #inspector{border-left:none;border-top:1px solid var(--border);}
  }
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="brand"><span class="dot"></span>Ad Studio</div>
    <div class="sep"></div>
    <select id="sizePreset"></select>
    
    <div class="custom-size-group">
      <span>W:</span>
      <input type="number" id="canvasCustomWidth" value="320" min="10" max="3000">
      <span>H:</span>
      <input type="number" id="canvasCustomHeight" value="50" min="10" max="3000">
    </div>

    <div class="sep"></div>
    <label class="btn ghost small" style="cursor:pointer;">
      🖼️ Canvas BG
      <input type="file" id="bgUpload" accept="image/*" style="display:none;">
    </label>
    <input type="color" id="bgColor" value="#ffffff" style="width:34px;height:30px;padding:2px;">
    <label class="btn ghost small" style="cursor:pointer;">
      <input type="checkbox" id="phoneToggle" style="margin:0;"> Phone preview
    </label>
    <div class="right-group">
      <button class="btn small" id="playBtn">▶ Play animations</button>
      <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);">
        Duration <input type="number" id="recDuration" value="5" min="0.5" max="20" step="0.5">s
      </label>
      <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);">
        Quality
        <select id="qualitySelect">
          <option value="1">Standard (1x)</option>
          <option value="2" selected>High (2x)</option>
          <option value="3">Ultra (3x)</option>
        </select>
      </label>
      <div class="compression-indicator">
        <span>📦</span>
        <select id="compressionLevel">
          <option value="low">Low</option>
          <option value="normal" selected>Normal</option>
          <option value="high">High</option>
        </select>
        <span class="badge normal" id="compressionBadge">Normal</span>
      </div>
      <button class="btn primary small" id="exportHtmlBtn">⬇ HTML</button>
      <button class="btn accent small" id="exportPngBtn">🖼 PNG</button>
      <button class="btn small" id="exportGifBtn">🎞 GIF</button>
      <button class="btn small" id="exportVideoBtn">🎬 Video</button>
    </div>
  </div>

  <div id="workspace">
    <div class="rail">
      <div class="section-title">Add element</div>
      <div class="tool-grid">
        <div class="tool-btn" id="addText">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M4 6h16M4 12h10M4 18h7"/></svg>
          Text
        </div>
        <div class="tool-btn" id="addButton">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="3" y="8" width="18" height="8" rx="4"/></svg>
          Button/CTA
        </div>
        <div class="tool-btn" id="addImageTool">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M21 16l-5-5-4 4-3-3-5 5"/></svg>
          Image
          <input type="file" id="imageUpload" accept="image/*" style="display:none;">
        </div>
        <div class="tool-btn" id="addShapeRect">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
          Rectangle
        </div>
        <div class="tool-btn" id="addShapeCircle">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg>
          Circle
        </div>
        <div class="tool-btn" id="addBadge">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M12 2l2.4 5.1L20 8l-4 4 1 5.6L12 15l-5 2.6L8 12 4 8l5.6-.9z"/></svg>
          Badge
        </div>
      </div>

      <div class="section-title">Layers</div>
      <div id="layerList"><div class="empty-hint">Koi element nahi hai abhi.<br>Upar se element add karein.</div></div>
    </div>

    <div id="stageArea">
      <div id="sizeLabel">320 × 50 px</div>
      <div id="phoneWrap">
        <div class="fake-status"><span>9:41</span><span>●●●●  📶  🔋</span></div>
        <div class="fake-app-content">app content</div>
        <div id="stageHolder"></div>
        <div class="fake-app-content" style="border-bottom:none;border-top:2px dashed #333;">app content</div>
      </div>
      <div id="stageHolderOuter"></div>
    </div>

    <div id="inspector">
      <div id="inspectorEmpty" class="empty-hint">Ek element select karein<br>properties edit karne ke liye.</div>
      <div id="inspectorBody" style="display:none;"></div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  const SIZES = [
    {label:"Banner — 320×50", w:320, h:50},
    {label:"Large Banner — 320×100", w:320, h:100},
    {label:"Medium Rectangle — 300×250", w:300, h:250},
    {label:"Full Banner — 468×60", w:468, h:60},
    {label:"Leaderboard — 728×90", w:728, h:90},
    {label:"Square — 250×250", w:250, h:250},
    {label:"Interstitial — 320×480", w:320, h:480},
    {label:"Skyscraper — 160×600", w:160, h:600},
    {label:"Custom — 400×400", w:400, h:400},
  ];
  const sizePreset = document.getElementById('sizePreset');
  SIZES.forEach((s,i)=>{
    const o=document.createElement('option');
    o.value=i; o.textContent=s.label;
    sizePreset.appendChild(o);
  });

  const stageHolderOuter = document.getElementById('stageHolderOuter');
  const stageHolder = document.getElementById('stageHolder');
  const phoneWrap = document.getElementById('phoneWrap');
  const sizeLabel = document.getElementById('sizeLabel');
  const canvasCustomWidth = document.getElementById('canvasCustomWidth');
  const canvasCustomHeight = document.getElementById('canvasCustomHeight');

  let stage = document.createElement('div');
  stage.id = 'stage';
  stageHolderOuter.appendChild(stage);

  function applySize(w, h){
    stage.style.width = w+'px';
    stage.style.height = h+'px';
    sizeLabel.textContent = w+' × '+h+' px';
    canvasCustomWidth.value = w;
    canvasCustomHeight.value = h;
  }

  sizePreset.addEventListener('change', ()=>{
    const s = SIZES[sizePreset.value];
    applySize(s.w, s.h);
  });

  // Manual input events for custom size textboxes
  function handleCustomSizeInput() {
    let w = parseInt(canvasCustomWidth.value) || 320;
    let h = parseInt(canvasCustomHeight.value) || 50;
    stage.style.width = w+'px';
    stage.style.height = h+'px';
    sizeLabel.textContent = w+' × '+h+' px';
    sizePreset.value = 8; // Switch preset selection dropdown automatically to "Custom"
  }

  canvasCustomWidth.addEventListener('input', handleCustomSizeInput);
  canvasCustomHeight.addEventListener('input', handleCustomSizeInput);

  applySize(320, 50);

  document.getElementById('phoneToggle').addEventListener('change', function(){
    if(this.checked){
      phoneWrap.classList.add('on');
      stageHolder.appendChild(stage);
      stageHolderOuter.style.display='none';
    } else {
      phoneWrap.classList.remove('on');
      stageHolderOuter.appendChild(stage);
      stageHolderOuter.style.display='';
    }
  });

  document.getElementById('bgColor').addEventListener('input', function(){
    stage.style.backgroundImage='none';
    stage.style.backgroundColor=this.value;
  });
  document.getElementById('bgUpload').addEventListener('change', function(e){
    const f=e.target.files[0]; if(!f) return;
    const reader=new FileReader();
    reader.onload=ev=>{ stage.style.backgroundImage=`url(${ev.target.result})`; };
    reader.readAsDataURL(f);
  });

  // Compression level management
  const compressionSelect = document.getElementById('compressionLevel');
  const compressionBadge = document.getElementById('compressionBadge');
  
  compressionSelect.addEventListener('change', function() {
    const level = this.value;
    compressionBadge.textContent = level.charAt(0).toUpperCase() + level.slice(1);
    compressionBadge.className = 'badge ' + level;
  });

  function getCompressionLevel() {
    return compressionSelect.value; // 'low', 'normal', 'high'
  }

  function getCompressionSettings(level) {
    switch(level) {
      case 'low':
        return { quality: 0.95, gifQuality: 10, videoBitrate: 12000000, pngCompression: 0 };
      case 'normal':
        return { quality: 0.85, gifQuality: 8, videoBitrate: 6000000, pngCompression: 6 };
      case 'high':
        return { quality: 0.70, gifQuality: 4, videoBitrate: 2000000, pngCompression: 9 };
      default:
        return { quality: 0.85, gifQuality: 8, videoBitrate: 6000000, pngCompression: 6 };
    }
  }

  let elCounter=0;
  let selected=null;
  let slideTimers = {};
  let groupStayTime = {};

  function getCustomSizeFromInspector(){
    const wInput = document.getElementById('newElWidth');
    const hInput = document.getElementById('newElHeight');
    if(wInput && hInput){
      const w = parseFloat(wInput.value) || 80;
      const h = parseFloat(hInput.value) || 80;
      return {w, h};
    }
    return {w:80, h:80};
  }

  function makeBaseEl(type, w, h){
    if(!w || !h){
      const c = getCustomSizeFromInspector();
      w = c.w;
      h = c.h;
    }
    const el=document.createElement('div');
    el.className='element el-'+type;
    el.dataset.type=type;
    el.dataset.id='el'+(++elCounter);
    el.dataset.anim='none';
    el.dataset.animDur='0.8';
    el.dataset.animDelay='0';
    el.dataset.animIter='1';
    el.dataset.slideGroup = '';
    el.dataset.slideIndex = '0';
    el.style.left=((stage.clientWidth-w)/2)+'px';
    el.style.top=((stage.clientHeight-h)/2)+'px';
    el.style.width=w+'px';
    el.style.height=h+'px';
    el.style.transform='rotate(0deg) scale(1)';
    el.style.opacity='1';
    el.style.transformOrigin = 'center center';
    const handle=document.createElement('span');
    handle.className='resize-handle';
    el.appendChild(handle);
    attachDrag(el, handle);
    stage.appendChild(el);
    refreshLayers();
    selectElement(el);
    return el;
  }

  function addText(){
    const el=makeBaseEl('text', 140, 30);
    el.innerText='Your headline';
    el.style.fontFamily="'Space Grotesk',sans-serif";
    el.style.fontSize='16px';
    el.style.fontWeight='700';
    el.style.color='#1a1a1a';
    el.style.textAlign='center';
    el.style.lineHeight='1.2';
    setupTextEditing(el);
  }
  function addButton(){
    const el=makeBaseEl('button', 110, 34);
    el.innerText='Install Now';
    el.style.fontFamily="'Inter',sans-serif";
    el.style.fontSize='13px';
    el.style.fontWeight='700';
    el.style.color='#ffffff';
    el.style.background='#5B8CFF';
    el.style.borderRadius='17px';
    el.style.textAlign='center';
    setupTextEditing(el);
  }
  function addShape(kind){
    const el=makeBaseEl('shape', 80, 80);
    el.style.background='#5B8CFF';
    el.style.borderRadius = kind==='circle' ? '50%' : '6px';
    el.dataset.shape = kind;
  }
  function addBadge(){
    const el=makeBaseEl('button', 90, 26);
    el.innerText='AD';
    el.style.fontFamily="'Inter',sans-serif";
    el.style.fontSize='11px';
    el.style.fontWeight='700';
    el.style.color='#221600';
    el.style.background='#FFB020';
    el.style.borderRadius='5px';
    el.style.textAlign='center';
    setupTextEditing(el);
  }
  
  function addImageFromFile(file, slideGroup){
    const reader=new FileReader();
    reader.onload=function(ev){
      const el=makeBaseEl('image', 100, 100);
      el.style.opacity = '1';
      const img=document.createElement('img');
      img.src=ev.target.result;
      img.style.objectFit='cover';
      img.style.width='100%';
      img.style.height='100%';
      el.insertBefore(img, el.firstChild);
      if(slideGroup){
        el.dataset.slideGroup = slideGroup;
        const groupEls = getGroupElements(slideGroup);
        el.dataset.slideIndex = groupEls.length;
        refreshSlideGroup();
        updateSlideShow();
      }
      selectElement(el);
      renderInspector();
    };
    reader.readAsDataURL(file);
  }

  function getGroupElements(groupName){
    if(!groupName) return [];
    return Array.from(stage.querySelectorAll('.element'))
      .filter(el => el.dataset.slideGroup === groupName)
      .sort((a,b) => {
        const idxA = parseInt(a.dataset.slideIndex) || 0;
        const idxB = parseInt(b.dataset.slideIndex) || 0;
        return idxA - idxB;
      });
  }

  function setupTextEditing(el){
    el.setAttribute('contenteditable','false');
    el.addEventListener('dblclick', function(e){
      e.stopPropagation();
      el.dataset.editing='1';
      el.setAttribute('contenteditable','true');
      el.classList.add('editing');
      el.focus();
      const range=document.createRange();
      range.selectNodeContents(el);
      const sel=window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    });
    el.addEventListener('blur', function(){
      el.dataset.editing='0';
      el.setAttribute('contenteditable','false');
      el.classList.remove('editing');
    });
    el.addEventListener('keydown', function(e) {
      if (e.key === 'Backspace' || e.key === 'Delete') {
        e.stopPropagation();
      }
    });
  }

  document.getElementById('addText').onclick=addText;
  document.getElementById('addButton').onclick=addButton;
  document.getElementById('addShapeRect').onclick=()=>addShape('rect');
  document.getElementById('addShapeCircle').onclick=()=>addShape('circle');
  document.getElementById('addBadge').onclick=addBadge;
  document.getElementById('addImageTool').onclick=()=>document.getElementById('imageUpload').click();
  
  document.getElementById('imageUpload').addEventListener('change', function(e){
    const f=e.target.files[0]; if(!f) return;
    let slideGroup = '';
    if(selected && selected.dataset.type === 'image'){
      slideGroup = selected.dataset.slideGroup || '';
    }
    addImageFromFile(f, slideGroup);
    e.target.value='';
  });

  let dragState = null;

  function attachDrag(el, handle){
    el.addEventListener('pointerdown', function(e){
      if(e.target===handle) return;
      if(el.getAttribute('contenteditable')==='true') return;
      e.preventDefault();
      selectElement(el);
      dragState = {
        el, mode:'move',
        startX:e.clientX, startY:e.clientY,
        origLeft:parseFloat(el.style.left)||0,
        origTop:parseFloat(el.style.top)||0,
        pointerId:e.pointerId
      };
      el.style.cursor='grabbing';
      try{ el.setPointerCapture(e.pointerId); }catch(err){}
    });
    el.addEventListener('pointerup', function(e){
      if(dragState && dragState.el===el){
        try{ el.releasePointerCapture(dragState.pointerId); }catch(err){}
      }
      el.style.cursor='grab';
    });

    handle.addEventListener('pointerdown', function(e){
      e.preventDefault(); e.stopPropagation();
      selectElement(el);
      dragState = {
        el, mode:'resize',
        startX:e.clientX, startY:e.clientY,
        origW:parseFloat(el.style.width)||el.offsetWidth,
        origH:parseFloat(el.style.height)||el.offsetHeight,
        pointerId:e.pointerId
      };
      try{ handle.setPointerCapture(e.pointerId); }catch(err){}
    });
    handle.addEventListener('pointerup', function(e){
      if(dragState){ try{ handle.releasePointerCapture(dragState.pointerId); }catch(err){} }
    });
  }

  document.addEventListener('pointermove', function(e){
    if(!dragState) return;
    const dx=e.clientX-dragState.startX, dy=e.clientY-dragState.startY;
    if(dragState.mode==='move'){
      dragState.el.style.left=(dragState.origLeft+dx)+'px';
      dragState.el.style.top=(dragState.origTop+dy)+'px';
    } else {
      dragState.el.style.width=Math.max(16, dragState.origW+dx)+'px';
      dragState.el.style.height=Math.max(16, dragState.origH+dy)+'px';
    }
    if(selected===dragState.el) syncInspectorPosition();
  });
  document.addEventListener('pointerup', function(){ dragState=null; });
  document.addEventListener('pointercancel', function(){ dragState=null; });

  stage.addEventListener('pointerdown', function(e){
    if(e.target===stage) selectElement(null);
  });

  function selectElement(el){
    if(selected) selected.classList.remove('selected');
    selected=el;
    if(el) el.classList.add('selected');
    refreshLayers();
    renderInspector();
  }

  function refreshLayers(){
    const list=document.getElementById('layerList');
    const els=Array.from(stage.children).filter(c=>c.classList.contains('element'));
    if(els.length===0){
      list.innerHTML='<div class="empty-hint">Koi element nahi hai abhi.<br>Upar se element add karein.</div>';
      return;
    }
    list.innerHTML='';
    els.slice().reverse().forEach(el=>{
      const row=document.createElement('div');
      row.className='layer-row'+(el===selected?' active':'');
      const label = el.dataset.type.charAt(0).toUpperCase()+el.dataset.type.slice(1);
      const groupInfo = el.dataset.slideGroup ? ` [${el.dataset.slideGroup}]` : '';
      row.innerHTML = `<span class="lname">${label} — ${el.dataset.id}${groupInfo}</span>
        <button data-act="up" title="Forward">⬆</button>
        <button data-act="down" title="Backward">⬇</button>
        <button data-act="dup" title="Duplicate">⧉</button>
        <button data-act="del" title="Delete">✕</button>`;
      row.addEventListener('click', (e)=>{
        if(e.target.tagName==='BUTTON') return;
        selectElement(el);
      });
      row.querySelector('[data-act="up"]').onclick=()=>{ moveLayer(el,1); };
      row.querySelector('[data-act="down"]').onclick=()=>{ moveLayer(el,-1); };
      row.querySelector('[data-act="dup"]').onclick=()=>{ duplicateEl(el); };
      row.querySelector('[data-act="del"]').onclick=()=>{ deleteEl(el); };
      list.appendChild(row);
    });
  }

  function moveLayer(el, dir){
    if(dir>0 && el.nextElementSibling && el.nextElementSibling.classList.contains('element')){
      stage.insertBefore(el.nextElementSibling, el);
    } else if(dir<0 && el.previousElementSibling && el.previousElementSibling.classList.contains('element')){
      stage.insertBefore(el, el.previousElementSibling);
    }
    refreshLayers();
    refreshSlideGroup();
    updateSlideShow();
  }
  
  function duplicateEl(el){
    const clone=el.cloneNode(true);
    clone.dataset.id='el'+(++elCounter);
    clone.style.left=(parseFloat(el.style.left)+14)+'px';
    clone.style.top=(parseFloat(el.style.top)+14)+'px';
    const handle=clone.querySelector('.resize-handle');
    attachDrag(clone, handle);
    if(clone.dataset.type==='text' || clone.dataset.type==='button') setupTextEditing(clone);
    if(el.dataset.slideGroup){
      clone.dataset.slideGroup = el.dataset.slideGroup;
      const groupEls = getGroupElements(el.dataset.slideGroup);
      clone.dataset.slideIndex = groupEls.length;
    }
    stage.appendChild(clone);
    refreshLayers();
    refreshSlideGroup();
    updateSlideShow();
    selectElement(clone);
  }
  
  function deleteEl(el){
    if(selected===el) selectElement(null);
    const group = el.dataset.slideGroup;
    el.remove();
    refreshLayers();
    refreshSlideGroup();
    if(group) updateSlideShow();
  }

  document.addEventListener('keydown', function(e){
    if(!selected) return;
    if (document.activeElement && document.activeElement.isContentEditable) {
      return;
    }
    const step = e.shiftKey ? 10 : 1;
    if(e.key==='Delete' || e.key==='Backspace'){ 
      e.preventDefault(); 
      deleteEl(selected); 
    }
    if(e.key==='ArrowLeft'){ selected.style.left=(parseFloat(selected.style.left)-step)+'px'; syncInspectorPosition(); }
    if(e.key==='ArrowRight'){ selected.style.left=(parseFloat(selected.style.left)+step)+'px'; syncInspectorPosition(); }
    if(e.key==='ArrowUp'){ selected.style.top=(parseFloat(selected.style.top)-step)+'px'; syncInspectorPosition(); }
    if(e.key==='ArrowDown'){ selected.style.top=(parseFloat(selected.style.top)+step)+'px'; syncInspectorPosition(); }
  });

  const inspectorEmpty=document.getElementById('inspectorEmpty');
  const inspectorBody=document.getElementById('inspectorBody');

  const ANIMS = [
    ["none","Koi nahi"],["fadeIn","Fade In"],["slideInLeft","Slide from Left"],
    ["slideInRight","Slide from Right"],["slideInUp","Slide Up"],["slideInDown","Slide Down"],
    ["zoomIn","Zoom In"],["bounceIn","Bounce In"],["pulse","Pulse (loop)"],["shake","Shake"]
  ];

  function refreshSlideGroup(){
    const groups = {};
    const elements = Array.from(stage.querySelectorAll('.element'));
    elements.forEach(el => {
      const g = el.dataset.slideGroup;
      if(g) {
        if(!groups[g]) groups[g] = [];
        groups[g].push(el);
      }
    });
    for(const [group, els] of Object.entries(groups)){
      els.sort((a,b) => (parseInt(a.dataset.slideIndex) || 0) - (parseInt(b.dataset.slideIndex) || 0));
      els.forEach((el, idx) => { el.dataset.slideIndex = idx; });
    }
    elements.forEach(el => {
      const g = el.dataset.slideGroup;
      if(g) {
        const groupEls = getGroupElements(g);
        if(groupEls.length > 0 && groupEls[0] === el) {
          el.style.display = 'flex'; 
          if(!el.style.opacity || el.style.opacity === '0') el.style.opacity = '1';
        } else {
          el.style.display = 'none';
        }
      } else {
        el.style.display = 'flex';
      }
    });
  }

  function getAnimDuration(el){
    const globalDurationInput = document.getElementById('recDuration');
    const baseDuration = globalDurationInput ? parseFloat(globalDurationInput.value) : 5;
    return parseFloat(el.dataset.animDur) || (baseDuration / 4) || 0.8;
  }

  function getGroupStayTime(groupName){
    if(groupStayTime[groupName] !== undefined) {
      return groupStayTime[groupName];
    }
    const els = getGroupElements(groupName);
    if(els.length > 0 && els[0].dataset.stayTime) {
      return parseFloat(els[0].dataset.stayTime);
    }
    return 0.8;
  }

  function updateSlideShow(){
    for(const key in slideTimers){
      clearTimeout(slideTimers[key]);
      clearInterval(slideTimers[key]);
      delete slideTimers[key];
    }

    const groups = {};
    const elements = Array.from(stage.querySelectorAll('.element'));
    elements.forEach(el => {
      const g = el.dataset.slideGroup;
      if(g) {
        if(!groups[g]) groups[g] = [];
        groups[g].push(el);
      }
    });

    for(const [group, els] of Object.entries(groups)){
      els.sort((a,b) => (parseInt(a.dataset.slideIndex) || 0) - (parseInt(b.dataset.slideIndex) || 0));
      if(els.length <= 1) continue;

      const stayTime = getGroupStayTime(group);
      els.forEach(el => {
        el.dataset.stayTime = stayTime;
      });

      let timeoutId = null;
      
      function showSlide(index, animate = true){
        els.forEach(el => {
          el.style.display = 'none';
          el.style.animation = 'none';
        });
        if(els[index]){
          els[index].style.display = 'flex';
          const targetOpacity = els[index].dataset.savedOpacity || els[index].style.opacity || '1';
          els[index].style.opacity = targetOpacity;
          const anim = els[index].dataset.anim;
          const dur = getAnimDuration(els[index]);
          if(anim && anim !== 'none' && animate){
            els[index].style.animation = 'none';
            void els[index].offsetWidth;
            els[index].style.animation = `${anim} ${dur}s ease both`;
          }
        }
      }

      showSlide(0, true);

      function scheduleNextSlide(index) {
        const el = els[index];
        const animDur = getAnimDuration(el);
        const totalTime = (animDur + stayTime) * 1000;
        
        if (timeoutId) clearTimeout(timeoutId);
        timeoutId = setTimeout(() => {
          const nextIndex = (index + 1) % els.length;
          showSlide(nextIndex, true);
          scheduleNextSlide(nextIndex);
        }, totalTime);
      }

      setTimeout(() => {
        scheduleNextSlide(0);
      }, 50);

      slideTimers[group] = {
        clear: () => {
          if (timeoutId) clearTimeout(timeoutId);
        }
      };
    }
  }

  document.getElementById('recDuration').addEventListener('input', function() {
    updateSlideShow();
  });

            <button data-a="right">Right</button>
          </div>

        <label class="btn small" style="cursor:pointer;display:inline-flex;">Replace image
          <input type="file" id="propReplaceImg" accept="image/*" style="display:none;">

        <div class="section-title">Slide Show / Slider</div>
        <div class="field"><label>Slide group (same name = auto loop show)</label>
          <input type="text" id="propSlideGroup" placeholder="e.g. main-slider" value="${currentGroup}">
        </div>
        <div class="field"><label>Stay time (s) — time each slide stays visible</label>
          <input type="number" id="propStayTime" step="0.1" min="0.1" value="${currentStay}">
          <div style="font-size:10px;color:var(--muted);margin-top:2px;">⚠️ Same stay time applies to all slides in this group</div>
        </div>
        <div class="slide-controls">
          <button class="btn small" id="slideAddNext">➕ Add next slide image</button>
          <button class="btn small" id="slideRemove">❌ Remove from group</button>
          <button class="btn small" id="slideReset">🔄 Reset index order</button>

      `;
    }

    html += `

    inspectorBody.innerHTML = html;

    syncInspectorPosition();

    if(type==='image'){
      const groupInput = document.getElementById('propSlideGroup');
      if(groupInput){
        const handleGroupUpdate = function(){
          const oldGroup = selected.dataset.slideGroup || '';

          if(oldGroup !== newGroup){
            if(newGroup){

  function syncInspectorPosition(){
    if(!selected) return;
    setVal('propX', parseFloat(selected.style.left)||0);
    setVal('propY', parseFloat(selected.style.top)||0);
    setVal('propW', parseFloat(selected.style.width)||0);
    setVal('propH', parseFloat(selected.style.height)||0);
    const rotMatch = /rotate\((-?\d+(\.\d+)?)deg\)/.exec(selected.style.transform||'');
    setVal('propRot', rotMatch?rotMatch[1]:0);
    
    const currentOpacity = selected.dataset.savedOpacity || selected.style.opacity;
    setVal('propOpacity', (currentOpacity === '' || currentOpacity === undefined) ? 1 : currentOpacity);
    
    if(document.getElementById('propFontSize')){
      setVal('propFontSize', parseFloat(selected.style.fontSize)||16);
      setVal('propColor', rgbToHex(selected.style.color) || '#1a1a1a');
      setVal('propFont', selected.style.fontFamily || "'Inter',sans-serif");
      highlightSeg('[data-w]', selected.style.fontWeight==='700'?'700':'400', 'w');
      highlightSeg('[data-a]', selected.style.textAlign||'center', 'a');
    }
    if(document.getElementById('propBg')){
      setVal('propBg', rgbToHex(selected.style.background||selected.style.backgroundColor) || '#5B8CFF');
      const br=selected.style.borderRadius||'0px';
      setVal('propRadius', br.includes('%')?50:parseFloat(br)||0);
    }
    if(document.getElementById('propImgRadius')){
      setVal('propImgRadius', parseFloat(selected.style.borderRadius)||0);
    }
    setVal('propAnimSingle', selected.dataset.anim||'none');
    setVal('propAnimDurSingle', selected.dataset.animDur||0.8);
    setVal('propAnimDelay', selected.dataset.animDelay||0);
    highlightSeg('[data-iter]', selected.dataset.animIter||'1', 'iter');

    const sg = document.getElementById('propSlideGroup');
    if(sg) sg.value = selected.dataset.slideGroup || '';
    
    const stay = document.getElementById('propStayTime');
    if(stay) {
      const group = selected.dataset.slideGroup;
      if(group && groupStayTime[group] !== undefined) {
        stay.value = groupStayTime[group];
      } else {
        stay.value = selected.dataset.stayTime || 0.8;
      }
    }
  }

  function setVal(id,val){ const e=document.getElementById(id); if(e) e.value=val; }
  function highlightSeg(sel, val, attr){
    document.querySelectorAll(sel).forEach(b=>{
      b.classList.toggle('active', b.dataset[attr]===String(val));
    });
  }
  function rgbToHex(rgb){
    if(!rgb) return null;
    if(rgb.startsWith('#')) return rgb;
    const m = rgb.match(/\d+/g);
    if(!m) return null;
    return '#'+m.slice(0,3).map(n=>(+n).toString(16).padStart(2,'0')).join('');
  }

  function bindInspector(type, isText){
    const on=(id,evt,fn)=>{ const e=document.getElementById(id); if(e) e.addEventListener(evt,fn); };
    on('propX','input',e=>{ selected.style.left=e.target.value+'px'; });
    on('propY','input',e=>{ selected.style.top=e.target.value+'px'; });
    on('propW','input',e=>{ selected.style.width=e.target.value+'px'; });
    on('propH','input',e=>{ selected.style.height=e.target.value+'px'; });

  // ================ EXPORT CANVAS TIMELINE ================
  function getSlideShowState(time, totalDuration) {
    const result = {};
    const elements = Array.from(stage.querySelectorAll('.element'));
    const groups = {};
    
    elements.forEach(el => {
      const g = el.dataset.slideGroup;
      if(g) {
        if(!groups[g]) groups[g] = [];
        groups[g].push(el);
      }
    });
    
    for(const [group, els] of Object.entries(groups)){
      els.sort((a,b) => (parseInt(a.dataset.slideIndex) || 0) - (parseInt(b.dataset.slideIndex) || 0));
      
      if(els.length <= 1) {
        result[group] = { element: els[0] || null, progress: 0 };
        continue;
      }
      
      const stayTime = getGroupStayTime(group);
      const totalTimePerSlide = els.reduce((sum, el) => {
        const animDur = getAnimDuration(el);
        return sum + animDur + stayTime;
      }, 0);
      
      let accumulatedTime = 0;
      let found = false;
      
      for(let i = 0; i < els.length; i++) {
        const el = els[i];
        const animDur = getAnimDuration(el);
        const segmentTime = animDur + stayTime;
        
        if(time < accumulatedTime + segmentTime || i === els.length - 1) {
          const localTime = time - accumulatedTime;
          let progress = localTime / animDur;
          if(progress > 1) progress = 1;
          result[group] = { element: el, progress: Math.max(0, progress) };
          found = true;
          break;
        }
        accumulatedTime += segmentTime;
      }
      
      if(!found && els.length > 0) {
        result[group] = { element: els[els.length - 1], progress: 1 };
      }
    }
    return result;
  }

  function evaluateExportAnimation(el, progress) {
    const anim = el.dataset.anim;
    if(!anim || anim === 'none') {
      return { opacity: parseFloat(el.style.opacity) || 1, tx: 0, ty: 0, scale: 1 };
    }
    
    const duration = parseFloat(el.dataset.animDur) || 0.8;
    const delay = parseFloat(el.dataset.animDelay) || 0;
    const iter = el.dataset.animIter || '1';
    
    let rawP = (progress - delay) / duration;
    
    let p;
    if(iter === 'infinite') {
      if(rawP < 0) p = 0;
      else p = rawP % 1;
    } else {
      p = Math.max(0, Math.min(1, rawP));
    }
    
    const ease = (t) => t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2;
    const ep = ease(p);
    
    let opacity = 1;
    let tx = 0, ty = 0, scale = 1;
    
    if(rawP < 0) {
      if(anim.startsWith('slide') || anim==='fadeIn' || anim==='zoomIn' || anim==='bounceIn') opacity = 0;
    } else {
      switch(anim) {
        case 'fadeIn':
          opacity = ep;
          break;
        case 'slideInLeft':
          opacity = ep; tx = -60 * (1 - ep);
          break;
        case 'slideInRight':
          opacity = ep; tx = 60 * (1 - ep);
          break;
        case 'slideInUp':
          opacity = ep; ty = 40 * (1 - ep);
          break;
        case 'slideInDown':
          opacity = ep; ty = -40 * (1 - ep);
          break;
        case 'zoomIn':
          opacity = ep; scale = 0.5 + 0.5 * ep;
          break;
        case 'bounceIn':
          if(p < 0.5) {
            const bp = p / 0.5; scale = 0.3 + 0.75 * bp; opacity = 0.3 + 0.7 * bp;
          } else if(p < 0.7) {
            const bp = (p - 0.5) / 0.2; scale = 1.05 - 0.1 * bp; opacity = 1;
          } else if(p < 0.9) {
            const bp = (p - 0.7) / 0.2; scale = 0.95 + 0.05 * bp; opacity = 1;
          } else {
            scale = 1; opacity = 1;
          }
          break;
        case 'pulse':
          scale = 1 + 0.05 * Math.sin(p * Math.PI * 2);
          opacity = 1;
          break;
        case 'shake':
          const shakeAmt = 6 * (1 - ep);
          tx = Math.sin(p * 50) * shakeAmt;
          opacity = 1;
          break;
        default:
          opacity = 1;
      }
    }
    return { opacity, tx, ty, scale };
  }

  // Helper: Compress image data URL
  function compressImageDataURL(dataURL, quality, maxWidth, maxHeight) {
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = function() {
        let w = img.width;
        let h = img.height;
        
        // Resize if too large
        if (maxWidth && w > maxWidth) {
          const ratio = maxWidth / w;
          w = maxWidth;
          h = h * ratio;
        }
        if (maxHeight && h > maxHeight) {
          const ratio = maxHeight / h;
          h = maxHeight;
          w = w * ratio;
        }
        
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = function() {
        resolve(dataURL);
      };
      img.src = dataURL;
    });
  }

  // Helper: Compress HTML with images
  function compressHTML(htmlString, compressionLevel) {
    const settings = getCompressionSettings(compressionLevel);
    const quality = settings.quality;
    
    // Find all data URLs in the HTML
    const dataUrlRegex = /src=["'](data:image\/[^"']+)["']/g;
    let match;
    let compressedHTML = htmlString;
    const promises = [];
    
    // Collect all data URLs to compress
    const dataUrls = [];
    while ((match = dataUrlRegex.exec(htmlString)) !== null) {
      dataUrls.push(match[1]);
    }
    
    // Compress each data URL
    return new Promise((resolve) => {
      if (dataUrls.length === 0) {
        resolve(htmlString);
        return;
      }
      
      let completed = 0;
      dataUrls.forEach((dataUrl, index) => {
        compressImageDataURL(dataUrl, quality, 800, 800).then(compressedUrl => {
          compressedHTML = compressedHTML.replace(dataUrl, compressedUrl);
          completed++;
          if (completed === dataUrls.length) {
            resolve(compressedHTML);
          }
        });
      });
    });
  }

  function renderElementToCanvas(ctx, el, scale, time, slideState) {
    let x = parseFloat(el.style.left) || 0;
    let y = parseFloat(el.style.top) || 0;
    let w = parseFloat(el.style.width) || 50;
    let h = parseFloat(el.style.height) || 50;
    
    const group = el.dataset.slideGroup;
    let progress = time;
    let shouldRender = true;
    
    if(group && slideState && slideState[group]) {
      const state = slideState[group];
      if(state.element !== el) {
        shouldRender = false;
      } else {
        progress = state.progress * (parseFloat(el.dataset.animDur) || 0.8);
      }
    } else if(group) {
      const groupEls = getGroupElements(group);
      if(groupEls.length > 0 && groupEls[0] !== el) shouldRender = false;
    }
    
    if(!shouldRender) return;
    
    const animState = evaluateExportAnimation(el, progress);
    const elementBaseOpacity = parseFloat(el.dataset.savedOpacity || el.style.opacity) || 1;
    const opacity = animState.opacity * elementBaseOpacity;
    const tx = animState.tx || 0;
    const ty = animState.ty || 0;
    const scaleVal = animState.scale || 1;
    
    const rotMatch = /rotate\((-?\d+(\.\d+)?)deg\)/.exec(el.style.transform || '');
    const rotation = rotMatch ? parseFloat(rotMatch[1]) : 0;
    
    const scaledX = (x + tx) * scale;
    const scaledY = (y + ty) * scale;
    const scaledW = w * scale * scaleVal;
    const scaledH = h * scale * scaleVal;
    
    ctx.save();
    ctx.translate(scaledX + (w * scale) / 2, scaledY + (h * scale) / 2);
    ctx.rotate(rotation * Math.PI / 180);
    ctx.globalAlpha = Math.max(0, Math.min(1, opacity));
    
    const hw = (w * scale * scaleVal) / 2;
    const hh = (h * scale * scaleVal) / 2;
    const type = el.dataset.type;
    
    if(type === 'text' || type === 'button') {
      if(type === 'button') {
        ctx.fillStyle = el.style.background || '#5B8CFF';
        const radius = parseFloat(el.style.borderRadius) || 8;
        const rx = Math.min(radius * scale * scaleVal, Math.min(hw, hh) * 0.8);
        ctx.beginPath();
        ctx.moveTo(-hw + rx, -hh); ctx.lineTo(hw - rx, -hh);
        ctx.quadraticCurveTo(hw, -hh, hw, -hh + rx); ctx.lineTo(hw, hh - rx);
        ctx.quadraticCurveTo(hw, hh, hw - rx, hh); ctx.lineTo(-hw + rx, hh);
        ctx.quadraticCurveTo(-hw, hh, -hw, hh - rx); ctx.lineTo(-hw, -hh + rx);
        ctx.quadraticCurveTo(-hw, -hh, -hw + rx, -hh); ctx.closePath(); ctx.fill();
      }
      
      const fontSize = parseFloat(el.style.fontSize) || 16;
      const fontWeight = el.style.fontWeight || '400';
      const fontFamily = el.style.fontFamily || 'Inter, sans-serif';
      ctx.font = `${fontWeight} ${fontSize * scale * scaleVal}px ${fontFamily}`;
      ctx.fillStyle = el.style.color || '#1a1a1a';
      ctx.textAlign = el.style.textAlign || 'center';
      ctx.textBaseline = 'middle';
      
      let text = el.innerText || '';
      const maxWidth = Math.max(10, (w * scale * scaleVal) - (8 * scale * scaleVal));
      
      if(ctx.measureText(text).width > maxWidth && maxWidth > 10) {
        let words = text.split(' '), lines = [], currentLine = '';
        for(let word of words) {
          let testLine = currentLine + (currentLine ? ' ' : '') + word;
          if(ctx.measureText(testLine).width > maxWidth && currentLine) {
            lines.push(currentLine); currentLine = word;
          } else { currentLine = testLine; }
        }
        if(currentLine) lines.push(currentLine);
        
        const lineHeight = fontSize * 1.2 * scale * scaleVal;
        let startY = -((lines.length * lineHeight) / 2) + lineHeight / 2;
        for(let line of lines) {
          if(line) ctx.fillText(line, 0, startY);
          startY += lineHeight;
        }
      } else {
        ctx.fillText(text, 0, 0);
      }
    }
    else if(type === 'image') {
      const img = el.querySelector('img');
      if(img && img.complete && img.naturalWidth > 0) {
        const radius = parseFloat(el.style.borderRadius) || 0;
        if(radius > 0) {
          const rx = Math.min(radius * scale * scaleVal, Math.min(hw, hh) * 0.8);
          ctx.beginPath();
          ctx.moveTo(-hw + rx, -hh); ctx.lineTo(hw - rx, -hh);
          ctx.quadraticCurveTo(hw, -hh, hw, -hh + rx); ctx.lineTo(hw, hh - rx);
          ctx.quadraticCurveTo(hw, hh, hw - rx, hh); ctx.lineTo(-hw + rx, hh);
          ctx.quadraticCurveTo(-hw, hh, -hw, hh - rx); ctx.lineTo(-hw, -hh + rx);
          ctx.quadraticCurveTo(-hw, -hh, -hw + rx, -hh); ctx.closePath(); ctx.clip();
        }
        ctx.drawImage(img, -hw, -hh, w * scale * scaleVal, h * scale * scaleVal);
      }
    }
    else if(type === 'shape') {
      ctx.fillStyle = el.style.background || '#5B8CFF';
      const radius = el.style.borderRadius || '6px';
      if(radius === '50%') {
        ctx.beginPath(); ctx.arc(0, 0, Math.min(hw, hh), 0, Math.PI * 2); ctx.fill();
      } else {
        const r = Math.min(parseFloat(radius) * scale * scaleVal || 6 * scale * scaleVal, Math.min(hw, hh) * 0.8);
        ctx.beginPath();
        ctx.moveTo(-hw + r, -hh); ctx.lineTo(hw - r, -hh);
        ctx.quadraticCurveTo(hw, -hh, hw, -hh + r); ctx.lineTo(hw, hh - r);
        ctx.quadraticCurveTo(hw, hh, hw - r, hh); ctx.lineTo(-hw + r, hh);
        ctx.quadraticCurveTo(-hw, hh, -hw, hh - r); ctx.lineTo(-hw, -hh + r);
        ctx.quadraticCurveTo(-hw, -hh, -hw + r, -hh); ctx.closePath(); ctx.fill();
      }
    }
    ctx.restore();
  }

  async function captureFramesWithAnimation(durationSec, fps, scale) {
    await document.fonts?.ready;
    const totalFrames = Math.max(2, Math.round(durationSec * fps));
    const frames = [];
    const frameDelay = 1000 / fps;
    
    const stageW = stage.clientWidth || 320;
    const stageH = stage.clientHeight || 50;
    const canvasW = Math.round(stageW * scale);
    const canvasH = Math.round(stageH * scale);
    const bgColor = stage.style.backgroundColor || '#ffffff';
    const elements = Array.from(stage.querySelectorAll('.element'));
    
    let bgImage = null;
    const bgImageStyle = stage.style.backgroundImage;
    if(bgImageStyle && bgImageStyle !== 'none' && bgImageStyle !== '') {
      try {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        const urlMatch = bgImageStyle.match(/url\(['"]?([^'"]*)['"]?\)/);
        if(urlMatch && urlMatch[1]) {
          img.src = urlMatch[1];
          await new Promise((resolve) => {
            if(img.complete && img.naturalWidth > 0) resolve();
            else { img.onload = resolve; img.onerror = resolve; setTimeout(resolve, 1000); }
          });
          if(img.complete && img.naturalWidth > 0) bgImage = img;
        }
      } catch(e) {}
    }
    
    for(let i = 0; i < totalFrames; i++) {
      const canvas = document.createElement('canvas');
      canvas.width = canvasW; canvas.height = canvasH;
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      
      ctx.fillStyle = bgColor; ctx.fillRect(0, 0, canvasW, canvasH);
      if(bgImage) ctx.drawImage(bgImage, 0, 0, canvasW, canvasH);
      
      const time = (i / (totalFrames - 1)) * durationSec;
      const slideState = getSlideShowState(time, durationSec);
      
      for(const el of elements) {
        if(parseFloat(el.dataset.savedOpacity || el.style.opacity) === 0) continue;
        renderElementToCanvas(ctx, el, scale, time, slideState);
      }
      frames.push(canvas);
      if(i < totalFrames - 1) {
        await new Promise(r => setTimeout(r, frameDelay));
      }
    }
    return frames;
  }

  function triggerDownload(blob, filename){
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.rel = 'noopener'; a.style.display = 'none';
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ a.remove(); URL.revokeObjectURL(url); }, 4000);
  }

  document.getElementById('exportPngBtn').addEventListener('click', async function(){
    const btn=this; const origText=btn.textContent;
    btn.disabled=true; btn.textContent='Rendering…';
    try{
      const scale = getQualityScale();
      const compressionLevel = getCompressionLevel();
      const settings = getCompressionSettings(compressionLevel);
      
      const stageW = stage.clientWidth || 320;
      const stageH = stage.clientHeight || 50;
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(stageW * scale); 
      canvas.height = Math.round(stageH * scale);
      const ctx = canvas.getContext('2d');
      
      ctx.fillStyle = stage.style.backgroundColor || '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      const elements = Array.from(stage.querySelectorAll('.element'));
      const slideState = getSlideShowState(0, 1);
      for(const el of elements) {
        if(parseFloat(el.dataset.savedOpacity || el.style.opacity) === 0) continue;
        renderElementToCanvas(ctx, el, scale, 0, slideState);
      }
      
      // PNG compression using canvas toDataURL with quality
      const dataUrl = canvas.toDataURL('image/jpeg', settings.quality);
      
      // Convert base64 to blob
      const response = await fetch(dataUrl);
      const blob = await response.blob();
      triggerDownload(blob, `ad-${stageW}x${stageH}.jpg`);
    }catch(err){
      console.error(err);
    }finally{ btn.disabled=false; btn.textContent=origText; }
  });

  document.getElementById('exportVideoBtn').addEventListener('click', async function(){
    const btn=this; const origText=btn.textContent;
    btn.disabled=true;
    try{
      if(!window.MediaRecorder){ alert('MediaRecorder missing.'); return; }
      const dur = parseFloat(document.getElementById('recDuration').value) || 5;
      const fps = 15;
      const scale = getQualityScale();
      const compressionLevel = getCompressionLevel();
      const settings = getCompressionSettings(compressionLevel);
      
      btn.textContent='Rendering frames...';
      const frames = await captureFramesWithAnimation(dur, fps, scale);
      
      btn.textContent='Encoding video...';
      const w=frames[0].width, h=frames[0].height;
      const rec=document.createElement('canvas'); rec.width=w; rec.height=h;
      const ctx=rec.getContext('2d', {willReadFrequently:true});
      const stream = rec.captureStream(fps);

      // Use compression bitrate
      let mimeType='video/webm;codecs=vp9', ext='webm';
      if(MediaRecorder.isTypeSupported('video/mp4')){ mimeType='video/mp4'; ext='mp4'; }
      const recorder=new MediaRecorder(stream, {
        mimeType, 
        videoBitsPerSecond: settings.videoBitrate
      });
      const chunks=[];
      recorder.ondataavailable=e=>{ if(e.data && e.data.size) chunks.push(e.data); };
      const stopped = new Promise(resolve=>{ recorder.onstop=resolve; });

      recorder.start();
      const frameDelay = 1000/fps;
      for(let i=0;i<frames.length;i++){
        ctx.clearRect(0,0,w,h);
        ctx.drawImage(frames[i],0,0,w,h);
        if(i < frames.length - 1) await new Promise(r=>setTimeout(r, frameDelay));
      }
      recorder.stop(); await stopped;
      triggerDownload(new Blob(chunks, {type:mimeType}), `ad-${w}x${h}.${ext}`);
    }catch(err){ console.error(err); }finally{ btn.disabled=false; btn.textContent=origText; }
  });

  document.getElementById('exportHtmlBtn').addEventListener('click', function() {
    const btn=this;

    });
    const exportStyles = Array.from(document.styleSheets[0].cssRules).map(rule => rule.cssText).join('\n');
    let htmlOutput = `<!DOCTYPE html><html><head><meta charset="UTF-8"><style>${exportStyles}body{background:transparent;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;}#stage{box-shadow:none;}</style></head><body>${clonedStage.outerHTML}<script>(function(){const stage=document.getElementById('stage');const slideTimers={};const groupStayTime={};function getAnimDuration(el){return parseFloat(el.dataset.animDur)||1.2;}function getGroupStayTime(groupName){if(groupStayTime[groupName]!==undefined)return groupStayTime[groupName];const els=Array.from(stage.querySelectorAll('.element')).filter(e=>e.dataset.slideGroup===groupName);if(els.length>0&&els[0].dataset.stayTime)return parseFloat(els[0].dataset.stayTime);return 0.8;}function updateSlideShow(){for(const key in slideTimers){clearTimeout(slideTimers[key]);clearInterval(slideTimers[key]);delete slideTimers[key];}const groups={};const elements=Array.from(stage.querySelectorAll('.element'));elements.forEach(el=>{const g=el.dataset.slideGroup;if(g){if(!groups[g])groups[g]=[];groups[g].push(el);}});for(const[group,els]of Object.entries(groups)){els.sort((a,b)=>(parseInt(a.dataset.slideIndex)||0)-(parseInt(b.dataset.slideIndex)||0));if(els.length<=1)continue;const stayTime=getGroupStayTime(group);els.forEach(el=>{el.dataset.stayTime=stayTime;});let timeoutId=null;function showSlide(index,animate=true){els.forEach(el=>{el.style.display='none';el.style.animation='none';});if(els[index]){els[index].style.display='flex';const targetOpacity=els[index].dataset.savedOpacity||els[index].style.opacity||'1';els[index].style.opacity=targetOpacity;const anim=els[index].dataset.anim;const dur=getAnimDuration(els[index]);if(anim&&anim!=='none'&&animate){els[index].style.animation='none';void els[index].offsetWidth;els[index].style.animation=\`\${anim} \${dur}s ease both\`;}}}showSlide(0,true);function scheduleNextSlide(index){const el=els[index];const animDur=getAnimDuration(el);const totalTime=(animDur+stayTime)*1000;if(timeoutId)clearTimeout(timeoutId);timeoutId=setTimeout(()=>{const nextIndex=(index+1)%els.length;showSlide(nextIndex,true);scheduleNextSlide(nextIndex);},totalTime);}setTimeout(()=>{scheduleNextSlide(0);},50);slideTimers[group]={clear:()=>{if(timeoutId)clearTimeout(timeoutId);}};}}updateSlideShow();})();<\/script></body></html>`;
    
    // Apply compression
    const compressionLevel = getCompressionLevel();
    compressHTML(htmlOutput, compressionLevel).then(compressedHtml => {
      triggerDownload(new Blob([compressedHtml], { type: 'text/html' }), `ad-creative-${stage.clientWidth}x${stage.clientHeight}.html`);
      btn.disabled=false; 
      btn.textContent='⬇ HTML';
    }).catch(() => {
      triggerDownload(new Blob([htmlOutput], { type: 'text/html' }), `ad-creative-${stage.clientWidth}x${stage.clientHeight}.html`);
      btn.disabled=false; 
      btn.textContent='⬇ HTML';
    });
  });

  function getQualityScale(){ return parseFloat(document.getElementById('qualitySelect').value) || 1; }
  let gifWorkerBlobUrl = null;
  async function getGifWorkerBlobURL(){
    if(gifWorkerBlobUrl) return gifWorkerBlobUrl;
    try {
      const resp = await fetch('https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js');
      const text = await resp.text();
      gifWorkerBlobUrl = URL.createObjectURL(new Blob([text], {type:'application/javascript'}));
      return gifWorkerBlobUrl;
    } catch(e) {
      gifWorkerBlobUrl = URL.createObjectURL(new Blob([`self.onmessage=function(e){if(e.data.type==='render'){self.postMessage({type:'finished',result:e.data.frames});}};`], {type:'application/javascript'}));
      return gifWorkerBlobUrl;
    }
  }

  function ensureLib(varName, src){
    return new Promise((resolve, reject)=>{
      if(window[varName]){ resolve(); return; }
      const s=document.createElement('script'); s.src=src;
      s.onload=()=>resolve(); s.onerror=()=>reject(); document.head.appendChild(s);
    });
  }

  renderInspector(); refreshSlideGroup(); setTimeout(updateSlideShow, 200);
})();
</script>
